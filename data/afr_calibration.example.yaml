schema_version: 1
# Copy this file to the active vehicle profile's scoped data directory.
# Both sections are operator-exported facts; no vehicle-specific curve or ROM
# target is hard-coded in shared code.
active_revision: example-rom-revision
# The AFR this ECM states at lambda = 1: the constant its tables and display
# use (14.7 on most gasoline ECMs), NOT the fuel's stoichiometric ratio. Every
# AFR in this file is in this scale; voltage-route AFR divides back to lambda
# by it. Required.
afr_scale: 14.7
# How this ECM reports Mode-01 PID 0x44: phi (fuel/air) | lambda (air/fuel).
# They are reciprocals and BOTH read 1.0 at stoich, so the convention is
# invisible in closed loop — it can only be settled under enrichment. Log PID
# 0x44 at wide-open throttle and check which of 14.7/value or 14.7*value lands
# on a plausible power target (~11.5-13.5), then record it here. Until then
# the derived commanded-AFR channel refuses rather than guessing.
commanded_equiv_ratio_convention: unverified
voltage_transfer:
  censored_floor_afr: 10.0
  points:
    - {voltage: 0.5, afr: 10.0}
    - {voltage: 2.15, afr: 14.7}
    - {voltage: 5.0, afr: 20.0}
target_maps:
  - revision: example-rom-revision
    rpm_breakpoints: [1000, 3000, 5000]
    load_breakpoints: [20, 60, 100]
    afr:
      - [14.7, 14.7, 13.0]
      - [14.7, 13.5, 12.8]
      - [14.7, 13.0, 12.5]
