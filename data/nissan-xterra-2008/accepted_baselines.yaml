# Directional, provenanced accepted-fault overrides for this vehicle profile
# (Task 1.3, docs/roadmap/online-training-strategy.md — see that doc's
# "Directional overrides — the schema gap" section for the full rationale).
#
# Profile-scoped: this file lives under this vehicle's data tree
# (`data/nissan-xterra-2008/`, resolved via `src.vehicle.profiles.scope_config`) —
# a second vehicle profile must never inherit these declarations.
#
# ZERO ACTIVE OVERRIDES SHIP HERE. Declaring "this engine state is known and
# accepted" is an operator judgment call, not something an unattended
# overnight run may author — see this repo's standing rules and the Phase 1
# acceptance for this task. The example below is commented out; uncomment
# and edit it (or add a new entry) only as a deliberate, reviewed operator
# action, with a real `review_by` date.
schema_version: 1
overrides: []

