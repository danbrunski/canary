schema_version: 1
# Flash history, oldest first. A session belongs to the newest revision
# flashed at or before it started, so "delivery error by tune revision"
# becomes a groupby instead of cross-checking a prose timeline.
#
# Times are UTC. The 2026-07-26 boundary is pinned by capture metadata rather
# than recollection: stock ZS04C/1ZS04C through 16:21 MDT, Osiris ZS44A from
# the 16:31 session (see engine-tuning-support.md 3.5).
revisions:
  - revision: ZS04C-stock
    calibration_id: 1ZS04C00000
    flashed_at: 2000-01-01T00:00:00Z
    flashed_at_precision: floor
    rom_file: 1ZS04C
    notes: >
      Factory calibration. The flashed_at is a floor, not a measurement -- it
      predates any recorded session, which is all this entry needs to do:
      claim everything before the first Osiris flash.
  - revision: ZS44A-osiris-initial
    calibration_id: 1ZS44A00000
    flashed_at: 2026-07-26T22:31:00Z
    k: 1.07
    rom_file: 1ZS44A
    notes: >
      First Osiris flash. K 1.07 ran badly rich -- the 7-29 11AM log has the
      factory A/F sensors pegged at their 10.0 floor for ~100% of samples at
      5000-5750 rpm, so AFR readings from that window are censored, not
      measurements.
  - revision: ZS44A-k105
    calibration_id: 1ZS44A00000
    flashed_at: 2026-07-31T00:00:00Z
    flashed_at_precision: approximate
    k: 1.05
    notes: >
      K reduced to 1.05, fuel-comp rpm axis rescaled 800-12750 -> 800-7200,
      max-load cells cut. Overcorrected: 11-13% lean of target across
      4000-6000 WOT on the 7-31 9AM log. Exact flash time not recorded, so
      this boundary is approximate -- sessions near it may be mislabelled.
  - revision: ZS44A-k106
    calibration_id: 1ZS44A00000
    # Exact flash time was not recorded. The operator confirmed this was
    # edited and flashed on 2026-08-03; use the ROM file's 12:45:21 MDT mtime
    # as the earliest defensible boundary. The next stored session,
    # 2026-08-03T163440, is NAMED 16:34:40Z -- before this boundary -- because
    # the clock stepped after its directory was made; its first stored sample
    # is 23:11:54Z, hours after. Sessions are dated by first sample (E01.6),
    # so it resolves to this revision; by name it fell to k105.
    flashed_at: 2026-08-03T18:45:21Z
    flashed_at_precision: approximate
    k: 1.06
    rom_file: ZS44A-Tuned.OsirisROM
    rom_sha256: c5325776b08c3084edd49d8f68587dad4668e02b0e77c7686f7548fb6f7c8fa9
    # W08.2: sha256 of the decoded plain image (ROMData), what an ECU read returns.
    image_sha256: e01cc0cb45d5beb879f82931be3054c79b7be3955220b3d93045deaabd23f18e
    notes: >
      K 1.05 -> 1.06 plus smoothed AFR targets and added spark at 3000-4500
      high load, all in one flash. That combination is why the spark edit was
      not measurable: the K change walks the BFS axis, which moves every
      BFS-indexed lookup including the timing table. Exact flash time not
      recorded; operator confirmed the August 3 date on 2026-08-05.
  - revision: ZS44A-20260920
    calibration_id: 1ZS44A00000
    flashed_at: 2026-09-21T03:08:45.954035Z
    flashed_at_precision: exact
    k: 1.06
    rom_file: ZS44A-Tuned-20260920.OsirisROM
    rom_sha256: 03d00051a59b86251ac0d5d9cf2ac9651682cfcba978edce81f07371f1c128a2
    # Equal to the 2026-10-04 ECU read (docs/skunkworks/uprev-backup-20261004.md).
    image_sha256: a46baa248f16db8d5ed9854913e614dd7d77b7579bb6c36bddb792741531be50
    notes: >
      Single Fuel Targets Map 1 edit at 5200 RPM / BFS 18.20:
      raw A2 -> A3, AFR 11.6148148 -> 11.5435583. K and all other
      calibration bytes unchanged. Boundary is capture frame 42353,
      final successful post-program range CRC response; ECU identification
      resumes at 03:09:12.604378Z. Capture SHA256
      99fbd62b7e07938e8ce0fdb87400352bd3756bee8fe1c3b063dc17b80ff06e56.
      Sessions spanning the flash require splitting before tune comparison;
      the session resolver assigns by session start, not per-sample time.
      See docs/skunkworks/uprev-flash-20260920.md.
  - revision: ZS44A-20261004
    calibration_id: 1ZS44A00000
    flashed_at: 2026-10-04T23:02:33.183902Z
    flashed_at_precision: exact
    k: 1.06
    rom_file: ZS44A-Tuned-20261004.OsirisROM
    rom_sha256: 33d5d7a5e33ccddc4747821984973716e8902bd0d5c5f26f79c109cfbe26b858
    image_sha256: 5587f7e1e6dbd0fcb9ffe0c857cc0cafebbe11bf306636c0f3265b903254d253
    notes: >
      Fuel Comp restored to UpRev base: the load axis 0xCB29 back to 16..255 (UpRev
      labels it "RPM", 800-12,750; verified from code to be load) and slot-1 Fuel
      Comp cells +0x660..+0x75F back to base. Built by CANary from 20260920; K,
      Load Point Scaler, Target AFR, timing trims and slots 2-5 unchanged. The
      flash capture (/data/canary/re/uprev-flash-20261004, candump sha256 b6dc201ed71b90a84755ad78839d874dd5ab51bcb8482f78a0b66c329699e991)
      shows only sectors 0x8000-0x1FFFF and 0xE0000-0xFFFFF erased and written,
      all 8 uploaded pages equal to the image, and 16/16 post-program range CRCs
      matching it over 0x000000-0x0FFFFF. Boundary = the last post-program
      range CRC response. Prediction recorded before the flash:
      data/analyses/2026-10-04-fuel-comp-restore-prediction.md.
  - revision: ZS44A-20261110
    calibration_id: 1ZS44A00000
    flashed_at: 2026-11-10T23:40:00Z
    flashed_at_precision: approximate
    k: 1.06
    rom_file: ZS44A-Tuned-20261110.OsirisROM
    rom_sha256: 28d0ff291e5812d30f6c2203bc68322aad53742c21ba3970c86e49826dc7560a
    image_sha256: dfe09508c9a3291794a31d4a24549b39798c19a32c67dccd1b513251855bf06a
    notes: >
      WOT Fuel Comp cut: slot-1 Fuel Comp rows 9-15 (4,000-6,400 rpm) x columns
      11-15 (load byte 192-255) lowered 2.2-5.1 % (35 cells). Built by CANary
      from 20261004; K, Load Point Scaler, Target AFR, timing trims, the axes
      and slots 2-5 unchanged. The flash was not captured: the Pi was unplugged
      from the OBD port for it. The time is bounded, not measured: no tester
      traffic through 18:16Z, and the engine was running on the Pi's next
      frames at 23:45:36Z, with the operator reporting the flash at 23:50Z. No
      engine-running data exists inside that window, so the boundary assigns
      every session correctly. Confirmed from the first drive after it
      (_capture-tuning-2026-11-10T235310, first four pulls, 14 open-loop reads):
      at full pedal BFS x rpm / MAF fell 2.8-3.8 % at 4,400-5,600 rpm against
      that morning's capture, and the commanded phi was unchanged. Evidence and
      the predictions frozen before the flash:
      data/analyses/2026-11-10-fuel-comp-wot-cut-prediction.md.
