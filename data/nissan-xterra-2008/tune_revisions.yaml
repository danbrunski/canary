    image_sha256: 108bb32b0156e52c7c4ae6c2fe551bdc995a44302ce1a091a7a27ba8e4e2f1ba
    notes: >
      First-gear torque cap switched off: main-calibration word 0x9308 (the
      gear-ratio threshold that arms the cap) 3,584 -> 32,767, above the
      ratio estimate's clamp, so the ratio test can no longer set the flag.
      The cap value (0x8EBC) and the output-shaft constant (0x91F8) are
      unchanged. Built by CANary from 20261111; every map slot, K, timing and
      the axes unchanged. The first edit to the main calibration (sector 8,
      the page that also holds the checksum words). Named for its build date
      (the second file built on 2026-11-11 local); the flash boundary is
      2026-11-12 UTC. The flash capture
      (/data/canary/flash-captures/flash-20261112T010129Z.candump.log, sha256
      916066c684f6fc5a6bc868303ad846371fac0c3888697f22f6555360ad3cf462) shows
