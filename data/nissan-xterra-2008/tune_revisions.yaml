      data/analyses/2026-11-11-wot-target-lean-prediction.md.
  - revision: ZS44A-20261111-2
    calibration_id: 1ZS44A00000
    flashed_at: 2026-11-12T01:02:19.999390Z
    flashed_at_precision: exact
    k: 1.06
