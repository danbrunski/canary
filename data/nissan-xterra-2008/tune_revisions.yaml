      and 8 erased, all 8 uploaded pages equal to this image (only page
      0x8000 differs from the old one), and 16/16 range CRCs after
      programming matching it. Boundary = the last post-program range CRC
      response. Predictions frozen before the flash:
      data/analyses/2026-11-11-first-gear-cap-off-prediction.md.
