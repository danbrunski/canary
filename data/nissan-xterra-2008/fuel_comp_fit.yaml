# N02 -- Fuel Comp corrections from logged fuelling error, as data.
#
# Schema: src/analysis/fuel_comp_inputs.py (FuelCompDeclaration). The load
# byte's arithmetic is src/decode/fuel_comp_load.py; the image is read and
# hash-checked by src/analysis/fuel_comp_rom.py; the per-sample assembly is
# src/analysis/fuel_comp_samples.py. Sources: docs/ecu-firmware-analysis.md
# ("Fuel Comp load input 0xFFFF118A, and how BFS is formed"),
# docs/roadmap/tasks/N02-fuel-comp-fit.md.
#
# Every number here is a declared constraint with its evidence. None is chosen
# from the size of a fuelling residual. `status: proposed` marks a value set
# from engine behaviour before any fit, frozen until a held-out judgement.
schema_version: 1

program:
  calibration_id: 1ZS44A00000
  # UpRev's committed map is 0xFFFFB008; it read 0 (slot 1 loaded at init, no
  # switch committed) on 196/196 reads of 2026-10-04, and the map switch has
  # never been used. History is assumed to be slot 1 throughout.
  map_slot: 1
  map_slot_evidence: >-
    mem:ECM_ACTIVE_MAP 0 and mem:ECM_UPREV_MAP_SELECTOR 0 on every read of
    _capture-ram-study-2026-10-04T204557 (target_phi_twin.yaml default_slot);
    no map-switch input has been wired or used on this vehicle.

rom:
  fuel_comp_kind: fuel_compensation
  rpm_axis_compare_multiplier: 4
  k_table: k_constant
  area_curve: throttle_area_curve
  fill_low: fill_curve_low
  fill_high: fill_curve_high
  rpm_multiplier: fill_rpm_multiplier
  idle_air_cap: idle_air_cap
  limp_home_area: etc_limp_home_area
  purge_gain: evap_purge_area_gain
  reciprocal_numerator: fill_reciprocal_numerator
  evidence: >-
    rom_map.yaml ids; each entry carries its code evidence. The Fuel Comp
    wrapper 0x026A24 searches the rpm axis with the word 0xFFFF1210 against
    axis byte x 4 (0x027194) and the load axis byte for byte (0x027114).

inputs:
  rpm:
    channel: 'obd:RPM'
    rpm_per_count: 12.5
    evidence: >-
      PID 0x0C reads the engine-speed word 0xFFFF1210, 12.5 rpm per count, the
      word the chain multiplies by 158 (0x03C3C4). Every stored PID 0x0C value
      on the ram-study capture is a whole multiple of 12.5 (1,494/1,494), so
      the word is recovered exactly.
  throttle_pid:
    channel: 'obd:THROTTLE_POS'
    # A = clamp_u8(max(0, w2CCE) x 100 / 321), truncating (handler 0xD41E0).
    numerator: 100
    denominator: 321
    full_scale: 255
    # A 10-bit A/D count above closed cannot exceed this.
    counts_max: 1023
    evidence: >-
      The PID 0x11 handler at 0xD41E0 divides max(0, w2CCE) x 100 by 321
      (0x021C48) and clamps to a byte; percent = A x 100/255. A is recovered
      exactly from the stored percent (round(percent x 2.55), never more than
      1e-12 from a whole byte on the ram-study capture), and the counts are
      the interval ceil(321 A/100) .. ceil(321 (A+1)/100) - 1: 3 or 4 counts,
      never a single value. w2CC8 is w2CCE unless only sensor A has failed
      (0xFFFF28B5 bits 7:6); no TPS code has been set on this vehicle.
  throttle_did:
    channel: 'did:0x120F'
    counts_max: 1023
    raw_counts_evidence: >-
      DID 0x120F is the word 0xFFFF2B0C, throttle sensor A's 10-bit A/D count
      before the learned closed position w4C72 is subtracted (CAN pointer
      table 0x24B84 entry 15; data/dids.yaml). The catalog stores it as volts
      at raw x scale; dividing the stored value by the catalog's own scale
      and offset returns the payload integer exactly (refused when it does
      not land on a whole count), whatever the volts per count really are.
    closed_position:
      method: warm_idle_mode_minus_idle_opening
      # Warm idle: paired PID 0x0C rpm and coolant as of each DID read.
      idle_rpm_min: 550.0
      idle_rpm_max: 900.0
      rpm_max_age_s: 0.6
      min_coolant_c: 80.0
      coolant_max_age_s: 10.0
      min_samples: 20
      # Counts above closed at warm idle, from PID 0x11 bytes 7-9 (23..32
      # counts), which hold 3,308 of 3,354 warm-idle reads on
      # 2026-09-20T152758, 134 of 141 on 2026-10-04T194342 and 266 of 279
      # on the ram-study capture (rpm 550-900 and coolant >= 80 C as of each
      # read, the ages above).
      idle_opening_counts: [23, 32]
      status: proposed
      evidence: >-
        Nissan's electronic throttle learns its closed position at key-on,
        so w4C72 is a per-key-cycle value; it is never logged. On sessions
        with both inputs, steady brackets (PID 0x11 reads before and after a
        DID read, within 2.5 s, equal) put it at 98-104 counts on
        2026-09-20T152758 (93 brackets, 74 inside 99-102), 98-100 on
        2026-09-23T003917 (26 of 26) and 93-100 on the ram-study capture (46
        of 51; the other 5 at transients). The mode of the DID count at warm
        idle minus the warm-idle opening is the estimate; its interval is the
        opening interval's width (on _capture-tuning-2026-09-23T142926: mode
        125 over 423 warm-idle reads, 93..102).
    # No session checked has PID 0x11 and DID 0x120F read within the pairing
    # separation: the DID is polled in its own Mode 22 cycle (0 pairs within
    # 250 ms on six plain sessions with both, 2026-08-03..10-04). So the DID
    # route is not validated at acquisition time.
    validated: false
    closing_capture: >-
      A capture that reads PID 0x11 and DID 0x120F back to back in one cycle
      (within 250 ms) through warm idle and a slow throttle sweep, or a
      memory window over 0xFFFF2B0C, 0xFFFF2CCE and 0xFFFF4C72 (the raw count,
      the corrected count and the learned closed position in one read).
  purge:
    # First present source wins.
    sources: ['obd:EVAPORATIVE_PURGE', 'did:0x1110']
    # PID 0x2E reports A = min(255, byte x 1275 / 1000) (handler 0xD461C).
    pid_numerator: 1275
    pid_denominator: 1000
    # w139E = purge_raw x gain >> 7 (helper 0x022584).
    gain_shift: 7
    evidence: >-
      The purge byte 0xFFFF272E (a copy of 0xFFFF27BA) is purge_raw + 1, or 0
      while purge is off, when w139E is 0 too (FUN_0006a52c, zero-command
      branch at 0x06E224). PID 0x2E reports it scaled by 1275/1000 and DID
      0x1110 as the byte itself (0.5 % per count), so both recover it
      exactly. Purge commands change by tens of percent between 15 s polls
      on the ram-study capture (0, 39, 52, 80, 70, 36 % ...), so a purge read
      is used only when it pairs within the pairing separation; otherwise
      purge is unknown and enters as every value the code can produce.
  idle_air:
    # w63FC, area units, subtracted from the throttle area. Never logged.
    low: 70
    high: 250
    nominal: 115
    conditions: >-
      Warm engine, running. Pinned on the 38 warm-idle steady points of the
      ram-study capture (2026-10-04, ZS44A-20260920, 79-83 kPa); off idle it
      moves the byte little and the same points' median ratio does not move
      it (canary-60's single-constant fit, 115, gave 1.027 off idle).
    informed_by: ['_capture-ram-study-2026-10-04T204557']
    status: proposed
    evidence: >-
      The firmware bounds it to -1,296..1,185 (w3CB2 -80..1,184 plus the
      learned w5EA6 -1,216..1,024, capped by 0x8ED2). With purge unknown,
      every one of the 38 warm-idle points is reproduced by an idle-air
      value inside 110..175, and the union of the values that reproduce
      each point is 70..250. The learned part (w5EA6) is relearned after a
      flash or battery disconnect, so the interval is a measured constraint
      of October 2026, applied to August-September history as an assumption;
      a sample whose Fuel Comp column depends on it is flagged, not placed.

pairing:
  # Per route: a separation is a property of how the route's inputs are
  # polled, and is sound only together with the steadiness gate, whose window
  # runs from the dwell before the sample forward to its latest paired read
  # (src/analysis/fuel_comp_samples.py): every read a sample is built from
  # lies inside the span judged steady.
  closed_loop:
    max_separation_s: 0.5
    evidence: >-
      Operator decision 2026-10-04 (N02 fix-up, option b; the default profile
      stays as it is). Default-profile rounds read Mode 01 PIDs one at a time
      about 125 ms apart in a 1 s round, and the trims sit a median 375 ms
      from rpm and throttle (2026-09-20T152758: 11 % of STFT B1 reads have an
      rpm read within 250 ms, 13 % a throttle read). 500 ms admits the same
      round's reads and no other round's. It is not a claim that the reads are
      simultaneous: the closed-loop steadiness gate requires rpm within 150
      and throttle within 8 counts across every read from 2 s before the
      sample to the latest paired read, so a read up to 0.5 s away describes
      the same operating point within those spans. A trim is an integrator
      over seconds, which is why closed loop tolerates it.
  open_loop:
    max_separation_s: 0.25
    evidence: >-
      Mode 01 PIDs in one poll batch (PID 0x44, lambda, rpm, throttle) are
      acquired within tens of milliseconds on stored acquisition clocks;
      lambda_delivery.yaml's acquisition evidence measures target-to-lambda
      separation at median 0.093-0.104 s, p95 0.130-0.142 s. 250 ms admits
      one batch's skew and no more. rpm and throttle are placed as intervals
      over the B06 delay bracket (samples.open_loop.delay_bracket), whose
      bounding reads use this separation.

known_answer:
  session: '_capture-ram-study-2026-10-04T204557'
  byte_channel: 'mem:ECM_FUEL_COMP_X_INPUT'
  # The byte is read in its own memory window, at least ~0.4 s from any
  # Mode 01 read (0 of 192 bytes pair with PID 0x11 within 250 ms), so a
  # steady point is a byte bracketed by a throttle read and an rpm read on
  # each side, each within max_gap_s, that agree within the step limits.
  # These are canary-60's listing-pass criteria, fixed before this code ran.
  max_gap_s: 2.5
  max_throttle_step_bytes: 2
  max_rpm_step: 75.0
  # Below this PID 0x11 byte (5.9 %) a point is idle (canary-60's split).
  idle_max_pid_byte: 15
  # The point estimate's purge: the latest purge read at or before the byte
  # (canary-60's choice, kept so the numbers compare). The interval uses
  # purge unknown.
  nominal_purge: prior_read
  # Pass: |median ratio - 1| within this, on at least min_points per subset.
  # 0.05 is what this capture can resolve, not a claim about the chain: it is
  # the smallest whole percent that holds the decoded chain's 95 % bootstrap
  # interval for both medians (idle 0.980-1.009, off idle 0.974-1.049; 5,000
  # resamples). An idle byte is about 50, so one count is 2 % and the idle
  # median moves in 2 % steps. Chosen after seeing the decoded result, so it
  # is a coarse screen: the 0xDC1D00 numerator scaled by 0.98-1.04 still
  # passes (x0.97 and x1.05 fail), and only 11 of 22 off-idle bytes fall
  # inside their interval. The exact arithmetic is established by the
  # disassembly line-check (src/decode/fuel_comp_load.py names each address),
  # not by this data.
  median_ratio_tolerance: 0.05
  min_points_idle: 20
  min_points_off_idle: 15
  evidence: >-
    canary-60's listing pass on this capture: 60 steady points, median ratio
    1.000 at idle (n = 38) and 1.027 off idle (n = 22); wrong x-scalings and
    rpm powers missed by 17-202 %. Reproduced here at 1.000 and 1.026 with the
    same 60 points.

samples:
  closed_loop:
    trims:
      stft_b1: 'obd:SHORT_FUEL_TRIM_1'
      ltft_b1: 'obd:LONG_FUEL_TRIM_1'
      stft_b2: 'obd:SHORT_FUEL_TRIM_2'
      ltft_b2: 'obd:LONG_FUEL_TRIM_2'
    # SAE J1979 PID 0x03 codes meaning healthy closed loop.
    closed_loop_codes: [2]
    # The bracketing status reads (one at or before, one after) must both be
    # closed loop, each within this of the sample.
    fuel_status_max_age_s: 5.0
    # No non-closed-loop status read in this trailing window: an enrichment
    # or cut the trims are still settling from.
    open_loop_lookback_s: 10.0
    # rpm and throttle reads in [t - dwell_s, t]: at least min_samples of
    # each, spans within the limits (throttle in w2CCE counts, 8.19 per %, on
    # each read's interval midpoint). Fewer reads than min_samples is
    # `*_steadiness_unobserved`, not a transient.
    steady:
      dwell_s: 2.0
      min_samples: 2
      rpm_max_span: 150.0
      throttle_max_span_counts: 8
    status: proposed
    evidence: >-
      Steadiness: the same rpm span as target_phi_twin.yaml's gate; the
      throttle span is about one PID 0x11 step either side of its 3.2-count
      quantisation (1 %). A trim integrates over seconds, so the dwell is
      seconds. The trims are the closed-loop error (positive = the ECM added fuel =
      lean), summed STFT + LTFT per bank as derived:TOTAL_TRIM_B1/B2. The
      post-fuel-cut holdoff is lambda_delivery.yaml's closed-loop rule (15 s,
      the pooled p90 of measured settling), read from that file, not
      restated. The lookback covers a settling STFT after an enrichment
      event; the LTFT is slow by design and is not gated.
  open_loop:
    # lambda_delivery.yaml commanded sources, in preference order; a session
    # uses the first one it captured. The RAM final target first (orchestrator,
    # 2026-10-05): it is the commanded phi word itself. PID 0x44 is that word
    # scaled by the A/F feedback target (below), and is used only where the
    # session has no RAM target, with its caveat carried into the report.
    commanded_preference: [ram_final_target, mode01_pid_0x44]
    # Required for every preferred source that is not the commanded word
    # itself; the report prints each beside its sample count.
    source_caveats:
      mode01_pid_0x44: >-
        PID 0x44 = phi word 0xFFFF26BE x 0xFFFF46AC / 3675, where 46AC copies
        the A/F feedback target 0xFFFF46B2 (orchestrator firmware finding,
        2026-10-05). It equals the commanded phi only while 46B2 = 7350 (14.7
        AFR); 46B2 is not logged in history, so a PID 0x44 sample's target is
        phi only under that assumption. On logged data 2,437 idle reads of
        PID 0x44 = 0.871 have injector pulses that match phi = 1.0. The earlier
        equality with the RAM target (7/7, 10/10, 3/3 steady enrichment pairs,
        lambda_delivery.yaml) may hold only where 46B2 = 7350.
    measured_source: ecm_lambda_pid_0x24
    # Bank 2 (PID 0x28, declared in lambda_delivery.yaml 2026-10-04): judged
    # against the same B06 target rows; the error is the bank mean where both
    # banks carry a residual, else bank 1's. Logged only from 2026-10-04.
    bank2_measured_source: ecm_lambda_pid_0x28
    open_loop_codes: [4]
    fuel_status_max_age_s: 5.0
    # N02.5 redesign (orchestrator-approved 2026-10-05): no steadiness gate.
    # The fuel a lambda read measures was set somewhere in the B06 enrichment
    # transport-delay bracket before it, so rpm and throttle are intervals
    # over that span and the cell is ambiguous when they read more than one
    # pair of rows or columns (src/analysis/fuel_comp_samples.py). The old
    # 0.5 s / 100 rpm gate rejected most of every WOT pull, which climbs
    # hundreds of rpm per second; the interval places what it can and marks
    # the rest ambiguous instead of tightening or relaxing a threshold.
    delay_bracket:
      # lambda_delivery.yaml enrichment transport_delays[ram_final_target]:
      # frozen 0.10 s, bracket 0.0-0.5 s (per-pair sign test). The PID 0x44
      # route pairs at 0 s (its batch shares PID 0x24), but exhaust transport
      # is the same physics whichever target is read, so its bracket bounds
      # when the fuel was set.
      delay_source: ram_final_target
      # One DID 0x120F poll period plus its jitter: on the tuning captures
      # PID 0x0C is read every 0.25 s (p10-p90 0.23-0.28) and DID 0x120F
      # every 0.5 s (p10-p90 0.48-0.53 and 0.48-0.59; 2026-09-21T223734,
      # 2026-09-23T142926). Set from the cadence, not from any residual.
      max_read_gap_s: 0.6
      assumption: >-
        rpm and throttle move monotonically between two consecutive reads
        at most 0.6 s apart, so the hull of the reads from the last one at
        or before the bracket's start to the first at or after its end holds
        every value inside it. A lift and re-apply inside one poll gap would
        escape it; B06's fuel-cut and target-transient states catch a lift
        that cuts fuel or moves the target.
      status: proposed
      evidence: >-
        The lambda read at t measures fuel injected d before it, d in the
        bracket [0.0, 0.5] s no candidate inside which the data can tell
        apart (lambda_delivery.yaml note). A hull with a longer gap, or with
        no read on one side of the span, is unpaired, named "(delay
        bracket)". The first version bounded the span with reads within the
        0.25 s pairing separation of each end instead; at a 0.25 s and 0.5 s
        cadence a bracket end falls between reads, so the nearest read is up
        to one poll gap away, and that rule refused, by construction and
        whatever their steadiness, all 78 of the enrichment samples the old
        steadiness gate had placed on the four tuning captures it was run on.
    status: proposed
    evidence: >-
      Open-loop error is B06's residual 100 x (lambda_measured /
      lambda_target - 1) from delivery_samples, with its states, its
      per-regime dwell, holdoff and frozen delay. Only enrichment rows count:
      in closed loop the residual is near zero by construction, and the
      trims carry the error.
  gates:
    coolant:
      sources: ['obd:COOLANT_TEMP', 'did:ECM_COOLANT_TEMP']
      min_c: 80.0
      max_age_s: 10.0
      status: proposed
    baro:
      channel: 'obd:BAROMETRIC_PRESSURE'
      min_kpa: 76.0
      max_kpa: 84.0
      max_age_s: 60.0
      evidence: >-
        The load byte has no baro input, so the same cell at altitude is a
        different air charge. Home is about 80 kPa; trips reach 63 kPa.
        Baro is polled every 4-16 s and moves only with altitude.
  # Carried per sample for N02.4-N02.6, never gated on: paired one-to-one like
  # rpm within the route's separation, NaN when no read is that close.
  context:
    maf: 'obd:MAF'
    # BFS, raw counts (DID 0x1208 = 0xFFFF103A, ECM_AIR_CHARGE in the catalog).
    bfs: 'did:0x1208'
    evidence: >-
      PID 0x10 is the ECM's MAF airflow in g/s, the quantity the droop model
      (N02.4) is fitted against and the MAF-bin diagnostic (N02.5) bins on.
      DID 0x1208 is the BFS word (data/dids.yaml, P02.14), which a Fuel Comp
      edit scales (docs/ecu-firmware-analysis.md, "how BFS is formed"); the
      knock-on prediction (N02.6) starts from it.

# N02.4 -- fuel-supply droop, separated from the air-model error.
droop:
  pressure_channel: 'sensor:FUEL_PRESSURE'
  fault_channel: 'sensor:FUEL_PRESSURE_FAULT'
  maf_channel: 'obd:MAF'
  rpm_channel: 'obd:RPM'
  running_rpm_min: 400.0
  rpm_max_age_s: 0.6
  # The 100 Hz trace carries aliased rail pulsation (0.12-0.38 psi rms
  # running), so a per-sample pressure is a mean over >= 0.5 s: +-0.25 s with
  # at least 30 of the ~50 reads, and no FUEL_PRESSURE_FAULT row inside it,
  # centred on the sample's acquisition time. Sensor rows carry the stored
  # clock (wall clock at arrival, millisecond-order latency; no floor in
  # src/signals/pairing.py), which a 0.5 s window does not resolve.
  window_half_width_s: 0.25
  min_window_reads: 30
  kpa_per_psi: 6.894757
  flow_law: sqrt_gauge_pressure
  reference:
    method: drive_low_flow_median
    maf_max_gs: 5.0
    min_reads: 30
    # One reference per drive, drives as fit.drive_unit declares them.
    evidence: >-
      The first-drive analysis's low-flow band (MAF 0-5 g/s, engine running):
      pressure there moved only 51.0 -> 50.7 psi cold to warm over a drive,
      so each drive is its own reference and a pump or gauge offset between
      drives cancels. The drive is fit.drive_unit's: a Pi reboot split the
      first pressure drive into 2026-10-04T190056 (no low-flow read of its
      own) and 194342, 1.2 min apart, and the pooled drive gives both one
      reference.
  model:
    form: quadratic_through_origin
    min_pairs: 200
    min_drives: 2
    evidence: >-
      The first drive's droop steepens with airflow (-0.015 psi per g/s
      overall, about -0.022 above 50 g/s), so a straight line would
      understate it at high flow; the quadratic is the smallest form that can
      steepen and is zero at the reference by construction. Fitted on every
      engine-running MAF read of every drive that logged pressure and formed
      a reference, one pair per read; applied only inside the MAF range it
      was fitted on (outside it the droop is none, named).
  known_answer:
    sessions: ['2026-10-04T190056', '2026-10-04T194342']
    maf_band_gs: [100.0, 118.0]
    expected_psi: -1.9
    # About three standard errors of a median of 7-8 window means at the
    # 0.15-0.18 psi per-window residual the first-drive analysis measured.
    tolerance_psi: 0.25
    # The recorded figure rests on 8 reads in the band; fewer than 5 is not a
    # reproduction.
    min_pairs: 5
    source: >-
      data/analyses/2026-10-04-fuel-pressure-first-drive.md, finding 1:
      median 48.87 psi at 100-118 g/s (8 pairs) against 50.79 psi at 0-5 g/s,
      -1.9 psi "at 107 g/s".
  limitations:
    - >-
      Rail-to-manifold pressure difference is not modelled. Injector flow
      follows the square root of the pressure across the injector, which is
      rail minus manifold; this vehicle has no MAP sensor, so the droop is
      computed on rail gauge pressure alone. Manifold vacuum raises the
      pressure across the injector at idle and cruise and falls toward zero
      at full throttle; whatever part of that the ECM does not compensate is
      left in the remainder.
    - >-
      The analog output reads a constant +1.8 psi above the gauge face, which
      of the two is right is unresolved (usb_adc_sensors.yaml offset 0). On a
      ratio of two readings 51 psi apart from zero it moves the flow factor
      by under 0.1 % at the drops seen.
    - >-
      Rail pressure was logged only from 2026-10-04 (six sessions and the
      ram-study capture, all ZS44A-20260920). Every earlier sample's droop is
      modelled from those drives: it assumes the pump of August and
      September drooped as it did on October 4.
  status: proposed
  evidence: >-
    The fuel pump is being replaced (supercharger build), so the part of the
    fuelling error that a falling rail explains belongs to the pump, and the
    remainder is what a Fuel Comp edit should own. Decomposition is
    multiplicative: (1 + error) = (1 + droop error) x (1 + remainder), with
    droop error = sqrt(P_ref / P) - 1 (positive = lean, as the error is).

# N02.5 -- per-cell proposal on the target revision's table and axes.
fit:
  target_revision: ZS44A-20261004
  include_unvalidated_throttle_route: false
  min_weighted_pairs: 10.0
  min_drives: 2
  min_drive_weight: 1.0
  prior_pairs: 1.0
  bootstrap:
    resamples: 500
    seed: 20261005
    interval_pct: [2.5, 97.5]
  validation_folds: leave_one_drive_out
  verdict_rule: rms_and_drive_majority
  maf_bins_gs: [0.0, 5.0, 10.0, 15.0, 20.0, 30.0, 40.0, 60.0, 80.0, 100.0, 130.0, 250.0]
  # Used by the cell refusals (min_drives, min_drive_weight), the bootstrap
  # and the held-out folds alike, and by droop's per-drive reference.
  drive_unit:
    method: session_gap
    max_gap_minutes: 5.0
    evidence: >-
      Sessions split one outing whenever a capture starts or stops or the Pi
      reboots. Over the 112 sessions from 2026-08-03 (spans from the parquet
      footers' timestamp statistics, 2026-10-07) the gaps between consecutive
      sessions are <= 2.7 min (Pi reboots 1.2 and 1.7 min; capture splits 0
      to 0.6 min, often overlapping) or >= 11.6 min (11.6, 12.3, 13.2, 39.8,
      55.1 min, then hours), with nothing between. 5 min sits in that empty
      band, so a cell's "two drives" are never two halves of one outing (the
      first fit counted 2026-09-20T223745, 225007 and 225927 as three).
  # Every model pair in the held-out comparison (current table, global
  # factor, MAF bins, cells) is judged this way; a difference the drives
  # cannot resolve is a tie, and a tie is never awarded to either side.
  model_comparison:
    method: paired_drive_bootstrap
    resamples: 2000
    confidence: 0.95
    seed: 20261007
    evidence: >-
      The held-out residuals are correlated within a drive (one trim read per
      second of one outing), so the unit of evidence is the drive: resample
      held-out drives with replacement and recompute each model's pooled
      held-out MSE; one model beats another only when it is lower in at least
      95 % of resamples. The first diagnostic compared bare RMS with ">=",
      which awarded ties and a 0.15-point difference to the MAF bins without
      asking whether the drives resolved it, and never asked whether a single
      global factor did as well (it did better).
  status: proposed
  evidence: >-
    Set before any fit was run. A closed-loop sample is one trim read per
    second, so 10 weighted pairs is about ten seconds of steady operation on
    a cell, and two drives is the least that can show a cell's correction is
    not one drive's condition; a drive counts toward a cell only with at
    least one whole weighted pair on it. The prior of one weighted pair at
    the current value keeps a cell that two samples always share determined
    and is about a tenth of the minimum evidence. The MAF bins are the
    first-drive analysis's bands, extended to the corpus's range. Required
    factor per sample: FC_applied x (1 + remainder) x K_logged / K_now, with
    FC_applied the firmware lookup (src/decode/ecm_lookup.py) on the table
    and axes in force when it was logged.

# N02.6 -- what a proposed change moves besides fuel. Target AFR is read
# through target_phi_twin.yaml and the shared kernel; nothing here restates it.
knock_on:
  timing_trim_load_axis: timing_trim_load_axis
  timing_trim_rpm_axis: timing_trim_rpm_axis
  pedal_flag_assumed: 0
  bfs_model:
    method: per_sample_ratio_median
    min_pairs: 20
    # Warm idle on this engine is 700-800 rpm; the eligible pairs are mostly
    # idle DID-route samples, so the split shows whether c holds off idle.
    idle_rpm_max: 1000.0
    evidence: >-
      Tp = K x Qa / Ne and BFS = Tp x FC / 128 at steady state (firmware doc,
      "how BFS is formed"), so BFS / (K x FC/128 x MAF/rpm) is one constant
      wherever the sample is steady. It is estimated as the median of that
      per-sample ratio over every eligible sample where DID 0x1208 was read
      (never a ratio of aggregates; FC at the sample's nominal byte, so a
      sample refused from the cell fit still counts) and reported with its
      spread; BFS read at the sample is always preferred, and every
      prediction says which it used.
  limitations:
    - >-
      BFS's rpm ceiling (table D8B3) is not read: a sample near it would gain
      less BFS than the Fuel Comp ratio says.
    - >-
      Steady state only: the manifold-filling filter and the transient term
      w105A are ignored, as the gates intend.
    - >-
      Target AFR's rpm input is the word 0xFFFF11D8 and timing's is too; the
      prediction uses PID 0x0C's 0xFFFF1210 (both engine speed at 12.5 rpm
      per count), which agree at steady rpm.
    - >-
      Timing trim A and B share their axes, so the column shift is the same
      for both; B is in force while the HI DET latch (0xFFFF283F bit 6) is
      set and A otherwise (rom_map.yaml timing_trim_a), and that latch is not
      logged in history, so which table's cells the shift moves between is
      not predicted.
    - >-
      The pedal-enrichment flag is taken as clear: with it set, Target AFR
      reads its last column whatever X is, and no X shift moves the command.
  evidence: >-
    Fuel Comp is inside BFS, so a cell change moves BFS by the Fuel Comp
    ratio, the Target AFR X byte (X = min(255, BFS x 128 / Load Point
    Scaler)), and the timing-trim BFS-X column (axis 0xCC83), exactly as K
    does (docs/ecu-firmware-analysis.md; restore prediction addendum).
