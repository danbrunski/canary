# Driving-dyno facts for the 2008 Nissan Xterra — H07.
#
# Loaded by src/analysis/dyno.py (strict schema). Mass, tire and gear ratios
# are NOT here: they are vehicle parameters in profiles.yaml, with their own
# evidence (H07.1, H07.10, H07.11). This file holds what the dyno adds:
#
#   motion_sources  which channels a dyno window is built from, best first,
#                with each speed channel's measured ratio to GPS (H07.3)
#   inertia      stated estimates until measured (H07.6); results computed
#                with them carry `inertia: estimated`
#   squat        body pitch per g, fitted on flat ground (H07.4)
#   road_load    A + B*v + C*v^2 from a neutral coast-down pair (H07.5)
#   noise_floors same-day, same-ROM spread per rpm band (H07.8)
#
# squat, road_load and noise_floors are owed by the H07.12 NA baseline drive.
# Each is written from a fit's `to_record(conditions)`, which will not build
# a record without its conditions.

schema_version: 1

# Absolute speed = channel / ratio_to_gps. GPS speed is the reference (ratio 1)
# and the last resort; it is never listed. A channel the committee file also
# states must carry the same ratio (tests/test_dyno_inputs.py checks).
motion_sources:
  speed:
    - channel: decoded:VEHICLE_SPEED_2D1
      ratio_to_gps: 0.932
      evidence: >-
        Measured 2026-09-26 (H07.3) by the H04.3 committee method: GPS epochs
        with satellites >= 7, HDOP <= 2, speed >= 20 km/h, paired with the
        0x2D1 frame nearest in acquisition time (within 20 ms), steady only
        (|slope of 0x2D1 speed over +/-2 s| < 0.05 g). Per-session median
        0x2D1/GPS: 0.9314 (2026-09-20T152758, n=1145), 0.9320
        (2026-09-20T175050, n=7521), 0.9348 (2026-09-21T143331, n=910),
        0.9324 (_capture-tuning-2026-09-22T235224, n=1010); 10th-90th
        percentile per epoch about +/-2.5 %. Control on the same epochs:
        0x6F7_A reads 0.9236 / 0.9214 / 0.9241 / 0.9233, reproducing the
        committee's 0.921-0.924, so 0x2D1 reads ~1 % higher than the other
        ECU copies and does NOT share their 0.9203. The 2026-09-23T150658 HAT
        drive gave n=119 with a 0.10-1.53 per-epoch spread and is excluded
        (GNSS integration day). Pre-HAT USB receiver.
    - channel: decoded:WHEEL_SPEED_6F7_A
      ratio_to_gps: 0.9203
      evidence: >-
        The committee relation in committees.yaml (SPEED_SOURCE_DIVERGENCE),
        which carries the measurements; kept equal to it.
    - channel: obd:SPEED
      ratio_to_gps: 0.9203
      evidence: >-
        The committee relation in committees.yaml (SPEED_SOURCE_DIVERGENCE):
        per-row median obd/gps over 2185 paired seconds of 2026-08-06T162657,
        re-measured 0.915-0.924 on six drives (2026-07-28 to 2026-09-21) by
        the committee evaluator on 2026-09-25. Every one of those drives was
        on the pre-HAT USB GNSS receiver, before the 2026-09-23 HAT install,
        and on the tires as they were then. At ~0.7 Hz in 1 km/h steps it is
        too coarse to differentiate at the default smoothing and is refused
        as such by the dyno; listed for completeness of the order. ALSO the
        trip path's speed correction (M01.2, 2026-11-12): trip distance,
        average and maximum speed, instant economy and the gear estimate use
        obd:SPEED / this ratio (src.vehicle.speed_correction). It is a
        profile constant, deliberately: it drifts as the tires wear (full
        tread is about 2 % of the rolling radius, so the ECM's reading of
        true speed moves by up to ~2 % over the tires' life) and the
        per-drive rolling-circumference estimate (/control/tires) tracks that
        drift, but the trip path does not follow it yet (M01.2 follow-up).
        Re-measure after a tire change and record the new value here.
  rpm:
    - decoded:ECM_RPM
    - obd:RPM

inertia:
  road_wheels: 4
  wheel_shape_factor: 0.7
  driveline_output_kg_m2: 1.0
  engine_side_kg_m2: 0.25
  evidence: >-
    ESTIMATES, 2026-09-26, none measured. Wheel side: four road wheels at the
    profile's measured 40.3 kg per wheel and tire (wheel_tire_assembly_kg) and
    the 2.559 m rolling circumference (r = 0.407 m; 2.609 m until 2026-10-03, H07.11), with a shape factor of 0.7
    of m*r^2 (an LT tire's mass sits near the rim; a solid disc is 0.5, a thin
    ring 1.0) -- about 19.4 kg m^2. driveline_output_kg_m2 (propshaft,
    differentials, axle shafts, hubs and rotors, referred to the wheels) is an
    order-of-magnitude figure, not a part weight. engine_side_kg_m2 (crank,
    flywheel, clutch, gearbox input) is the PHYSICAL crank-side inertia, a
    typical 4 L V6 manual figure within a plausible 0.15-0.35 kg m^2. It sits
    upstream of the driveline losses, so the wheels see eta times it, with
    eta = 1 - drivetrain_loss_fraction from profiles.yaml (0.85). The one
    convention is dyno.INERTIA_CONVENTION. H07.6's two-gear pulls measure
    eta*I_e and replace the estimate (measured_engine). In 3rd (overall 7.11)
    the estimates add ~119 kg (wheel side) + ~65 kg (0.85 x 0.25 kg m^2
    through the ratio) to a ~2,311 kg test mass. A 40 % error in the
    engine-side estimate therefore moves 3rd-gear wheel force during a pull by
    ~1.0 %.

squat: null
road_load: null
noise_floors: []
