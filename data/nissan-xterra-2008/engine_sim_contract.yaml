# E07.1 — the controller / plant / scenario contract for this vehicle.
#
# Schema: src/analysis/sim_contract.py (SimContract). What the engine
# simulator's ECU twin and plant exchange, on which clocks, with which units,
# limits, sampling and delays, and -- per simulation mode -- who owns every
# quantity: a measured input, a prescribed boundary, an inferred state or a
# predicted output. The loader refuses a hidden same-step cycle, a computed
# quantity whose observation channel feeds the same mode (predicted-as-
# measured), an undeclared input, an ECU quantity reading the plant except
# through a sensor, and a measured input to a ROM comparison or a rollout.
#
# E07.5 adds `subsystems`: the plant's stages, each with what it computes, its
# bounded applicability, its numerical checks and the independent measurement
# that could validate it (src/analysis/engine_dynamics.py derives each
# subsystem's standing; nothing here states that one is validated). Vehicle
# facts (RAM words, channels, task order, actuator limits) live here;
# src/analysis/sim_contract.py is generic. Where a fact is not decoded
# or measured it says so (`delay_s` absent, a parameter `requires_measurement`),
# never a guess.
schema_version: 1
contract_version: 2
name: engine_sim_contract
# The plant implementation a scenario's results come from: E07.3's mean-value
# fuel plant (src/analysis/fuel_plant.py, fuel_plant.yaml plant_version; the
# two are cross-checked by check_against_contract).
plant_version: fuel-mv-1

units:
  - {id: rpm, dimension: angular_speed, meaning: 'revolutions per minute'}
  - {id: g_per_s, dimension: mass_flow, meaning: 'grams per second'}
  - {id: kPa, dimension: pressure, meaning: 'kilopascal, absolute unless the quantity says gauge'}
  - {id: degC, dimension: temperature, meaning: 'degrees Celsius'}
  - {id: V, dimension: voltage, meaning: 'volt'}
  - {id: lambda, dimension: ratio, meaning: 'air-fuel equivalence (stoichiometric = 1)'}
  - {id: ms, dimension: time, meaning: 'millisecond'}
  - {id: s, dimension: time, meaning: 'second'}
  - {id: percent, dimension: ratio, meaning: 'percent of full scale'}
  - {id: N_m, dimension: torque, meaning: 'newton metre'}
  - {id: L, dimension: volume, meaning: 'litre'}
  - {id: raw_counts, dimension: ecu_integer, meaning: 'the ECU word as stored; scale on the quantity'}
  - {id: q14_phi, dimension: ecu_integer, meaning: 'equivalence ratio x 16384'}
  - {id: flags, dimension: ecu_integer, meaning: 'bit field'}

clocks:
  - id: ecu_task_10ms
    kind: ecu_time_task
    period_s: 0.01024
    period_status: unverified
    evidence: >-
      The order is verified (docs/ecu-firmware-analysis.md "Injector pulse
      chain": phi, dead time, the fuel-pressure correction and transients are
      entries 37, 41, 42 and 44 of the task table 0x0219D0 that 0x020EF2
      walks, 134 entries, full.asm 0x2129C-0x212A6). The 10.24 ms period is a
      stated figure no decode or measurement has confirmed: the application
      model lists the 0x020EF2 cycle period as undecoded (uncovered:
      enrichment_tick_rate). Results timed on this clock inherit that.
  - id: ecu_crank_segment
    kind: ecu_crank_event
    evidence: >-
      The ignition chain (0x04E6AE per-segment chain, timing rate limit per
      segment) and the injector one-shots run on crank segments, not on a
      fixed period (ecu_application_model.yaml timing nodes).
  - id: solver_1280us
    kind: solver
    period_s: 0.00128
    period_status: chosen
    evidence: >-
      Eight plant steps per ECU tick, so values cross only at ECU task
      boundaries. Kept by E07.5's step-refinement study
      (engine_dynamics.convergence_study, tools.manifold_check study): with
      rk4 every applicability corner converges at fourth order and the
      worst case (6500 rpm, 2 L, VE 1.0, tau 9.3 ms) is 2.9e-6 of a tip-in in
      cylinder flow, 3.2e-5 of the temperature excursion.
  - id: obd_acquisition
    kind: acquisition
    evidence: >-
      Logged channels arrive at their own irregular acquisition times; pair on
      acquisition time (compare_channels), never on a resampled grid.

ecu_schedule:
  clock: ecu_task_10ms
  task_table: 0x0219D0
  tasks:
    - {entry: 37, function: 0x0575EC, name: 'phi (the fuel-command task)'}
    - {entry: 41, function: 0x057144, name: 'dead time Ts'}
    - {entry: 42, function: 0x053B8C, name: 'fuel-pressure correction'}
    - {entry: 44, function: 0x0527CC, name: 'transients'}
  application_model_task: 0x0575EC
  cycle_start: 0x020EF2
  event_clock: ecu_crank_segment
  evidence: >-
    Entries of the table 0x0219D0 that the main loop 0x020EF2 walks (134
    entries; 0x21A30, quoted earlier as a separate table, is the address of
    its entry 24). The per-cylinder stages follow and are not indexed here
    yet. The internal call order of 0x0575EC is the application model's
    `schedule`, after the cycle-start copy 0x020EF2, and is checked against
    it (check_against_application_model). The tick period is unverified (the
    clock says so), so tick-counted enrichment timing stays in ticks.

solver:
  clock: solver_1280us
  method: rk4
  exchange: ecu_task_boundary
  evidence: >-
    ECU integer arithmetic runs on the ECU clock with the decoded widths; the
    plant integrates on the solver clock. A sample-and-hold sensor value
    reaches the ECU at a tick; an actuator command holds until the next tick,
    and every boundary is held constant inside a solver step (all four rk4
    stages see the same input). Changed from fixed_step_euler by E07.5
    (2026-10-05): at 1.28 ms Euler failed the declared 1 % bound in 8 of 18
    corners (worst: 6.6 % of the tip-in in cylinder flow, 11.8 % of the
    temperature excursion at 6500 rpm, 2 L, VE 1.0); its observed order was
    1.00-1.07, so it was converging, just too coarse. Halving the step four
    times would cost 16x; rk4 costs 4x and passes everywhere.

events:
  - id: ecu_power_on
    meaning: 'ECU reset: volatile RAM (closed-loop trim, filters) restarts; UpRev init runs.'
    evidence: 'ecu_application_model.yaml uprev_init; E05.3 state models'
  - id: ecu_reflash
    meaning: 'A calibration flash: the learned long-term trim is reset.'
    evidence: 'LTFT read 0.00 after the 2026-09-20 flash until relearned (project notes; tune_revisions.yaml)'
  - id: battery_disconnect
    meaning: 'Non-volatile learned values (idle air, throttle closed position) may be lost.'
    evidence: 'Learned idle air has an inverted backup copy (docs/ecu-firmware-analysis.md); the loss condition is not decoded.'

hardware_configurations:
  - id: na_stock_injectors_2026_10
    meaning: 'Naturally aspirated VQ40DE, stock injectors and pump, returnless regulator as delivered; AEM rail pressure gauge fitted 2026-10-04.'
    parameters:
      - {id: displacement, units: L, status: known,
         evidence: 'VQ40DE 3.954 L (vehicle profile fact)'}
      - {id: injector_static_flow, units: g_per_s, status: requires_measurement,
         evidence: 'The ROM gives K and the 0x9254 scaler, which are the ECU''s belief, not the injector; a flow bench or an independent fuel measurement is needed. MAF bias must not be absorbed into it.'}
      - {id: injector_dead_time, units: ms, status: requires_measurement,
         evidence: 'The ECU''s Ts = max(0, 47 + ((175 - Vb) x 92) >> 7) is its compensation, not the injector''s measured latency.'}
      - {id: rail_pressure_behaviour, units: kPa, status: identifiable,
         evidence: 'sensor:FUEL_PRESSURE at 100 Hz since 2026-10-04 (anti-alias firmware 2026-10-04 21:52:33Z); droops with airflow.'}
      - {id: maf_transfer_bias, units: percent, status: requires_measurement,
         evidence: 'No independent airflow reference; a MAF error and an injector-flow error are not separable from lambda alone.'}
      - {id: lambda_observation_delay, units: s, status: requires_measurement,
         evidence: 'B06.3: transport delay not estimated (status not_estimated); never fitted on a test pull.'}

quantities:
  # -- environment and driver
  - {id: barometric_pressure, kind: environment, units: kPa, meaning: 'Ambient pressure.'}
  - {id: intake_air_temperature, kind: environment, units: degC, meaning: 'Intake air temperature.'}
  - {id: battery_voltage, kind: environment, units: V, meaning: 'System voltage at the ECU.'}
  - {id: road_load, kind: environment, units: N_m, meaning: 'Load torque at the crank from road, grade and driveline.'}
  - {id: pedal_demand, kind: driver, units: percent, meaning: 'Accelerator pedal position the driver applies.'}

  # -- plant (continuous)
  - id: engine_speed
    kind: plant
    units: rpm
    meaning: 'Crankshaft speed.'
    depends_on:
      - {quantity: engine_speed, timing: previous_step}
      - {quantity: engine_torque, timing: previous_step}
      - {quantity: road_load, timing: previous_step}
  - id: coolant_temperature
    kind: plant
    units: degC
    meaning: 'Engine coolant temperature.'
    depends_on:
      - {quantity: coolant_temperature, timing: previous_step}
  - id: manifold_pressure
    kind: plant
    units: kPa
    meaning: 'Intake manifold absolute pressure (no MAP sensor on this engine).'
    # Not logged on this truck (PID 0x0B is unsupported, data/bindings.yaml):
    # the channel a fitted MAP sensor would record, named so it is scored
    # against and can never feed a mode that computes manifold pressure.
    observed_as: ['sensor:MANIFOLD_PRESSURE']
    # E07.5 mass and energy balance: the manifold's air mass and temperature
    # change by what entered past the throttle minus what the cylinders drew
    # last step.
    depends_on:
      - {quantity: manifold_pressure, timing: previous_step}
      - {quantity: manifold_temperature, timing: previous_step}
      - {quantity: mass_air_flow, timing: previous_step}
      - {quantity: cylinder_air_flow, timing: previous_step}
      - {quantity: intake_air_temperature, timing: same_step}
  - id: manifold_temperature
    kind: plant
    units: degC
    meaning: 'Bulk manifold air temperature (energy balance; no sensor downstream of the throttle).'
    depends_on:
      - {quantity: manifold_temperature, timing: previous_step}
      - {quantity: manifold_pressure, timing: previous_step}
      - {quantity: mass_air_flow, timing: previous_step}
      - {quantity: cylinder_air_flow, timing: previous_step}
      - {quantity: intake_air_temperature, timing: same_step}
  - id: cylinder_air_flow
    kind: plant
    units: g_per_s
    meaning: 'Air mass the cylinders draw from the manifold (breathing); equals mass_air_flow only when the manifold is steady.'
    depends_on:
      - {quantity: manifold_pressure, timing: same_step}
      - {quantity: manifold_temperature, timing: same_step}
      - {quantity: engine_speed, timing: same_step}
  - id: mass_air_flow
    kind: plant
    units: g_per_s
    meaning: 'Air mass flow into the engine.'
    depends_on:
      - {quantity: throttle_position_actual, timing: same_step}
      - {quantity: engine_speed, timing: same_step}
      - {quantity: manifold_pressure, timing: previous_step}
      - {quantity: barometric_pressure, timing: same_step}
      - {quantity: intake_air_temperature, timing: same_step}
  - id: fuel_rail_pressure
    kind: plant
    units: kPa
    meaning: 'Fuel rail gauge pressure.'
    observed_as: ['sensor:FUEL_PRESSURE']
    depends_on:
      - {quantity: fuel_mass_flow, timing: previous_step}
      - {quantity: manifold_pressure, timing: same_step}
  - id: fuel_mass_flow
    kind: plant
    units: g_per_s
    meaning: 'Fuel mass delivered by the injectors.'
    depends_on:
      - {quantity: injector_open_time_b1, timing: same_step}
      - {quantity: engine_speed, timing: same_step}
      - {quantity: fuel_rail_pressure, timing: same_step}
      - {quantity: manifold_pressure, timing: same_step}
  - id: delivered_lambda
    kind: plant
    units: lambda
    meaning: 'Delivered mixture from air and fuel mass: never the target copied.'
    depends_on:
      - {quantity: mass_air_flow, timing: same_step}
      - {quantity: fuel_mass_flow, timing: same_step}
  - id: engine_torque
    kind: plant
    units: N_m
    meaning: 'Brake torque at the crank.'
    # From the charge the cylinders drew (not the throttle flow), the mixture,
    # speed and manifold pressure (pumping); spark is the ECU's and has no
    # actuator quantity yet, which is why a spark claim is refused (E07.5).
    depends_on:
      - {quantity: cylinder_air_flow, timing: same_step}
      - {quantity: delivered_lambda, timing: same_step}
      - {quantity: engine_speed, timing: same_step}
      - {quantity: manifold_pressure, timing: same_step}

  # -- actuators (ECU command -> physical actuation)
  - id: injector_open_time_b1
    kind: actuator
    units: ms
    meaning: 'Effective injector open time for the index-0 (bank 1) pulse.'
    depends_on:
      - {quantity: injector_pulse_index0, timing: same_step}
      - {quantity: battery_voltage, timing: same_step}
    actuator:
      commanded_by: injector_pulse_index0
      minimum: 0.0
      maximum: 655.35
      evidence: >-
        The pulse is a u16 at 10 us per count (0..655.35 ms); the min-pulse
        floor 0x2770 and short-pulse correction (cal 0x9120-0x9126) act after
        the observed word. The injection window per cycle is the physical
        bound and is not declared yet.
  - id: throttle_position_actual
    kind: actuator
    units: percent
    meaning: 'Throttle plate opening.'
    depends_on:
      - {quantity: requested_throttle_position, timing: same_step}
      - {quantity: throttle_position_actual, timing: previous_step}
    actuator:
      commanded_by: requested_throttle_position
      minimum: 0.0
      maximum: 100.0
      evidence: >-
        0xFFFF2D28 is 0..819 counts above closed (819 = 100 %); the plate's
        response rate is not measured, so no rate limit is declared.

  # -- sensors (physical quantity -> ECU integer)
  - id: rpm_word
    kind: sensor
    units: raw_counts
    meaning: 'Engine speed word, cycle-start copy.'
    integer: {width: 16, signed: false, ram: 0xFFFF11D8, scale: '12.5 rpm', confidence: observed}
    observed_as: ['mem:ECM_ENGINE_SPEED_RAM']
    # PID 0x0C reads the source word 0xFFFF1210, one cycle ahead of this copy.
    leak_aliases: ['obd:RPM']
    depends_on: [{quantity: engine_speed, timing: same_step}]
    sensor:
      measures: engine_speed
      sample_clock: ecu_task_10ms
      quantization: 12.5
      evidence: 'Copied at cycle start from 0xFFFF1210 (PID 0x0C); the crank-measurement latency is not decoded.'
  - id: maf_reading
    kind: sensor
    units: raw_counts
    meaning: 'The ECU''s airflow reading.'
    integer: {width: 16, signed: false, scale: 'not decoded (PID 0x10 reports 0.01 g/s)', confidence: inferred}
    observed_as: ['obd:MAF']
    depends_on: [{quantity: mass_air_flow, timing: same_step}]
    sensor:
      measures: mass_air_flow
      sample_clock: ecu_task_10ms
      evidence: 'Sensor response and the ECU''s filtering are not measured.'
  - id: throttle_sensor_a
    kind: sensor
    units: raw_counts
    meaning: 'Throttle sensor A, raw A/D.'
    integer: {width: 16, signed: false, scale: '4.883 mV', confidence: code}
    observed_as: ['did:ECM_THROTTLE_POS_SENSOR_1']
    depends_on: [{quantity: throttle_position_actual, timing: same_step}]
    sensor:
      measures: throttle_position_actual
      sample_clock: ecu_task_10ms
      quantization: 0.1221
      evidence: 'A/D channel 6 (10-bit), DID 0x120F; 819 counts span 0..100 % above closed. Sensor B substitutes on a sensor-A fault (not modelled).'
  - id: pedal_sensor
    kind: sensor
    units: raw_counts
    meaning: 'Accelerator pedal sensor.'
    integer: {width: 16, signed: false, scale: 'not decoded', confidence: inferred}
    depends_on: [{quantity: pedal_demand, timing: same_step}]
    sensor:
      measures: pedal_demand
      sample_clock: ecu_task_10ms
      evidence: 'Pedal channel, word and scale not decoded (pedal_flag_inputs, application model uncovered).'
  - id: coolant_byte
    kind: sensor
    units: raw_counts
    meaning: 'Coolant temperature byte (degC = raw - 50).'
    integer: {width: 8, signed: false, ram: 0xFFFF1083, scale: '1 degC, offset -50', confidence: inferred}
    observed_as: ['did:ECM_COOLANT_TEMP']
    # PID 0x05's source byte is not traced.
    leak_aliases: ['obd:COOLANT_TEMP']
    depends_on: [{quantity: coolant_temperature, timing: same_step}]
    sensor:
      measures: coolant_temperature
      sample_clock: ecu_task_10ms
      quantization: 1.0
      evidence: 'CAN DID 0x1101 reads it (inferred, application model coolant_source); sensor lag not measured.'
  - id: battery_voltage_counts
    kind: sensor
    units: raw_counts
    meaning: 'Battery voltage Vb as the dead-time formula reads it.'
    integer: {width: 8, signed: false, scale: '0.08 V', confidence: code}
    observed_as: ['obd:CONTROL_MODULE_VOLTAGE']
    depends_on: [{quantity: battery_voltage, timing: same_step}]
    sensor:
      measures: battery_voltage
      sample_clock: ecu_task_10ms
      quantization: 0.08
      evidence: 'Vb = PID 0x42 / 0.08 V (docs/ecu-firmware-analysis.md, dead time).'
  - id: barometric_counts
    kind: sensor
    units: raw_counts
    meaning: 'Barometric pressure as the vacuum estimate reads it.'
    integer: {width: 8, signed: false, scale: 'not decoded (PID 0x33 reports 1 kPa)', confidence: inferred}
    observed_as: ['obd:BAROMETRIC_PRESSURE']
    depends_on: [{quantity: barometric_pressure, timing: same_step}]
    sensor:
      measures: barometric_pressure
      sample_clock: ecu_task_10ms
      evidence: 'The internal word is not decoded; read per session, never assumed.'
  - id: lambda_sensor_b1
    kind: sensor
    units: raw_counts
    meaning: 'Bank 1 wideband reading.'
    integer: {width: 16, signed: false, scale: 'not decoded (PID 0x24 reports lambda x 32768)', confidence: inferred}
    observed_as: ['obd:O2_WR_LAMBDA_S1']
    depends_on: [{quantity: delivered_lambda, timing: same_step}]
    sensor:
      measures: delivered_lambda
      sample_clock: ecu_task_10ms
      evidence: 'Exhaust transport and sensor delay not estimated (B06.3); declared absent rather than fitted.'

  # -- ECU (integer, decoded widths)
  - id: throttle_closed_learned
    kind: ecu
    units: raw_counts
    meaning: 'Learned closed throttle position (non-volatile).'
    integer: {width: 16, signed: false, ram: 0xFFFF4C72, scale: '4.883 mV', confidence: code}
    depends_on:
      - {quantity: throttle_closed_learned, timing: previous_step}
      - {quantity: throttle_sensor_a, timing: previous_step}
  - id: throttle_counts_above_closed
    kind: ecu
    units: raw_counts
    meaning: 'Throttle sensor A minus its learned closed position.'
    integer: {width: 16, signed: false, ram: 0xFFFF2CC8, scale: '819 counts = 100 %', confidence: code}
    depends_on:
      - {quantity: throttle_sensor_a, timing: same_step}
      - {quantity: throttle_closed_learned, timing: same_step}
  - id: idle_air_learned
    kind: ecu
    units: raw_counts
    meaning: 'Idle-speed integrator plus non-volatile learned idle air.'
    integer: {width: 16, signed: false, ram: 0xFFFF63FC, scale: 'relative area units', confidence: inferred}
    depends_on:
      - {quantity: idle_air_learned, timing: previous_step}
      - {quantity: rpm_word, timing: previous_step}
  - id: evap_purge_area
    kind: ecu
    units: raw_counts
    meaning: 'EVAP purge term added to the fill.'
    integer: {width: 16, signed: false, ram: 0xFFFF139E, scale: 'relative area units', confidence: code}
  - id: fuel_comp_load_byte
    kind: ecu
    units: raw_counts
    meaning: 'Throttle-model (alpha-N) fill byte, the Fuel Comp load input.'
    integer: {width: 8, signed: false, ram: 0xFFFF118A, scale: 'relative fill, 0..224', confidence: code}
    manifest_node: fuel_comp_load_byte
    observed_as: ['mem:ECM_FUEL_COMP_X_INPUT']
    depends_on:
      - {quantity: throttle_counts_above_closed, timing: same_step}
      - {quantity: idle_air_learned, timing: same_step}
      - {quantity: evap_purge_area, timing: same_step}
      - {quantity: rpm_word, timing: same_step}
  - id: base_fuel_schedule
    kind: ecu
    units: raw_counts
    meaning: 'BFS: K x airflow / rpm, through Fuel Comp, the filling filter, transients and the ceiling.'
    integer: {width: 16, signed: false, ram: 0xFFFF103A, scale: '1/2040 ms of base pulse', confidence: observed}
    manifest_node: base_fuel_schedule
    observed_as: ['mem:ECM_AIR_CHARGE_SLOT_103A', 'did:ECM_AIR_CHARGE']
    depends_on:
      - {quantity: base_fuel_schedule, timing: previous_step}
      - {quantity: fuel_comp_load_byte, timing: same_step}
      - {quantity: maf_reading, timing: same_step}
      - {quantity: rpm_word, timing: same_step}
      - {quantity: coolant_byte, timing: same_step}
  - id: target_afr_x
    kind: ecu
    units: raw_counts
    meaning: 'Load input X = min(255, BFS x 128 / Load Point Scaler), the Target AFR and timing-trim column input.'
    integer:
      width: 8
      signed: false
      ram: 0xFFFF104E
      scale: 'BFS / Load Point Scaler x 128'
      confidence: observed
      note: 'Observed through the cycle-start copy 0xFFFF103E, one cycle after the write.'
    manifest_node: load_input_x
    observed_as: ['mem:ECM_FUEL_TARGET_MAP_X_TRACE']
    depends_on: [{quantity: base_fuel_schedule, timing: same_step}]
  - id: throttle_target_area
    kind: ecu
    units: raw_counts
    meaning: 'Target throttle area (driver demand, inferred); writer not traced.'
    integer: {width: 16, signed: false, ram: 0xFFFF1A64, scale: 'relative area units', confidence: inferred}
    depends_on:
      - {quantity: pedal_sensor, timing: same_step}
      - {quantity: idle_air_learned, timing: same_step}
      - {quantity: evap_purge_area, timing: same_step}
  - id: requested_throttle_position
    kind: ecu
    units: raw_counts
    meaning: 'Throttle position for the target area, through the inverted area curve.'
    integer: {width: 16, signed: false, ram: 0xFFFF2D28, scale: '819 counts = 100 %', confidence: code}
    manifest_node: requested_throttle_position
    depends_on: [{quantity: throttle_target_area, timing: same_step}]
  - id: pedal_flag
    kind: ecu
    units: flags
    meaning: 'Pedal enrichment flag byte (bit 0 forces the last load column).'
    integer: {width: 8, signed: false, ram: 0xFFFF2841, scale: 'bit field', confidence: observed}
    manifest_node: pedal_enrichment_flag
    observed_as: ['mem:ECM_PEDAL_ENRICH_FLAGS']
    depends_on:
      - {quantity: requested_throttle_position, timing: same_step}
      - {quantity: rpm_word, timing: same_step}
  - id: target_phi_word
    kind: ecu
    units: q14_phi
    meaning: 'Final commanded equivalence ratio, a controller objective.'
    integer: {width: 16, signed: false, ram: 0xFFFF26BE, scale: 'phi x 16384', confidence: observed}
    manifest_node: final_command_word
    observed_as: ['mem:ECM_TARGET_EQUIV_RATIO']
    # PID 0x44 = 0x26BE x 0x46AC / 3675: phi only while the A/F feedback
    # target is 14.7. Never scored against; never fed to a mode computing phi.
    leak_aliases: ['obd:COMMANDED_EQUIV_RATIO']
    depends_on:
      - {quantity: target_phi_word, timing: previous_step}
      - {quantity: target_afr_x, timing: previous_step}
      - {quantity: rpm_word, timing: same_step}
      - {quantity: pedal_flag, timing: same_step}
      - {quantity: coolant_byte, timing: same_step}
  - id: dead_time
    kind: ecu
    units: raw_counts
    meaning: 'Ts = max(0, 47 + ((175 - Vb) x 92) >> 7), 10 us per count.'
    integer: {width: 16, signed: false, scale: '10 us (inferred)', confidence: inferred}
    depends_on: [{quantity: battery_voltage_counts, timing: same_step}]
  - id: fuel_pressure_correction
    kind: ecu
    units: raw_counts
    meaning: 'w1800 = b1772 x 10601 (0x9254) >> 8, on estimated vacuum.'
    integer: {width: 16, signed: false, ram: 0xFFFF1800, scale: '0x4000 = 1.0', confidence: code}
    depends_on:
      - {quantity: barometric_counts, timing: same_step}
      - {quantity: rpm_word, timing: same_step}
      - {quantity: base_fuel_schedule, timing: previous_step}
  - id: stft_b1
    kind: ecu
    units: raw_counts
    meaning: 'Short-term trim, bank 1 (0x6400 = 1.0; trims add).'
    integer: {width: 16, signed: false, ram: 0xFFFF26B4, scale: '0x6400 = 1.0', confidence: code}
    observed_as: ['obd:SHORT_FUEL_TRIM_1']
    depends_on:
      - {quantity: stft_b1, timing: previous_step}
      - {quantity: lambda_sensor_b1, timing: previous_step}
  - id: ltft_b1
    kind: ecu
    units: raw_counts
    meaning: 'Long-term (learned) trim, bank 1.'
    integer: {width: 16, signed: false, ram: 0xFFFF26DE, scale: '0x6400 = 1.0', confidence: code}
    observed_as: ['obd:LONG_FUEL_TRIM_1']
    depends_on:
      - {quantity: ltft_b1, timing: previous_step}
      - {quantity: stft_b1, timing: previous_step}
  - id: injector_pulse_index0
    kind: ecu
    units: raw_counts
    meaning: 'Per-cylinder pulse, injector index 0 (bank 1), before the short-pulse correction and min-pulse floor.'
    integer:
      width: 16
      signed: false
      ram: 0xFFFF279C
      scale: '10 us (inferred: timer clock and UpRev''s x0.01 ms agree)'
      confidence: inferred
      note: >-
        0xFFFF279C[0]. DID 0x1206 reads 0xFFFF2710, its cycle-start copy, so
        the observation lags the computed word by one cycle. That index 0 is
        bank 1 (cylinder 1) is inferred; the 10 us scale is inferred.
    observed_as: ['did:ECM_INJECTOR_PULSE_1']
    depends_on:
      - {quantity: base_fuel_schedule, timing: previous_step}
      - {quantity: target_phi_word, timing: same_step}
      - {quantity: dead_time, timing: same_step}
      - {quantity: fuel_pressure_correction, timing: same_step}
      - {quantity: stft_b1, timing: same_step}
      - {quantity: ltft_b1, timing: same_step}

modes:
  # ---------------------------------------------------------------- ECU replay
  - id: ecu_replay
    kind: ecu_replay
    claim: >-
      Reproduction of decoded controller logic: recorded sensor readings and
      declared state checkpoints in, ECU intermediates and commands out,
      scored against their own RAM/DID observations. BFS is fed observed (its
      upstream is E05.2), so this mode cannot claim to predict BFS.
    roles:
      barometric_pressure: {role: unused}
      intake_air_temperature: {role: unused}
      battery_voltage: {role: unused}
      road_load: {role: unused}
      pedal_demand: {role: unused}
      engine_speed: {role: unused}
      coolant_temperature: {role: unused}
      manifold_pressure: {role: unused}
      manifold_temperature: {role: unused}
      cylinder_air_flow: {role: unused}
      mass_air_flow: {role: unused}
      fuel_rail_pressure: {role: unused}
      fuel_mass_flow: {role: unused}
      delivered_lambda: {role: unused}
      engine_torque: {role: unused}
      injector_open_time_b1: {role: unused}
      throttle_position_actual: {role: unused}
      rpm_word: {role: measured_input, source: 'mem:ECM_ENGINE_SPEED_RAM'}
      maf_reading: {role: measured_input, source: 'obd:MAF'}
      throttle_sensor_a: {role: measured_input, source: 'did:ECM_THROTTLE_POS_SENSOR_1'}
      pedal_sensor: {role: unused}
      coolant_byte: {role: measured_input, source: 'did:ECM_COOLANT_TEMP'}
      battery_voltage_counts: {role: measured_input, source: 'obd:CONTROL_MODULE_VOLTAGE'}
      barometric_counts: {role: measured_input, source: 'obd:BAROMETRIC_PRESSURE'}
      lambda_sensor_b1: {role: unused}
      throttle_closed_learned:
        role: prescribed_boundary
        source: scenario
        assumption: 'Read from a key-on checkpoint; it relearns only at closed throttle and is held for the replay.'
      throttle_counts_above_closed: {role: predicted_output}
      idle_air_learned:
        role: prescribed_boundary
        source: scenario
        assumption: 'Stated or read in the same window; not captured on 2026-10-04, so the fill byte stays unscored until it is.'
      evap_purge_area: {role: measured_input, source: 'obd:EVAPORATIVE_PURGE'}
      fuel_comp_load_byte: {role: predicted_output}
      base_fuel_schedule: {role: measured_input, source: 'mem:ECM_AIR_CHARGE_SLOT_103A'}
      target_afr_x:
        role: predicted_output
        init: {method: observed_checkpoint, note: 'The first same-read X observation; the command reads last tick''s X.'}
      throttle_target_area: {role: unused}
      requested_throttle_position: {role: unused}
      pedal_flag: {role: measured_input, source: 'mem:ECM_PEDAL_ENRICH_FLAGS'}
      target_phi_word:
        role: predicted_output
        init: {method: observed_checkpoint, reset_on: [ecu_power_on], note: 'Last tick''s command for the slew and cap.'}
      dead_time: {role: predicted_output}
      fuel_pressure_correction: {role: predicted_output}
      stft_b1: {role: measured_input, source: 'obd:SHORT_FUEL_TRIM_1'}
      ltft_b1: {role: measured_input, source: 'obd:LONG_FUEL_TRIM_1'}
      injector_pulse_index0: {role: predicted_output}

  # -------------------------------------------------------------- plant replay
  - id: plant_replay
    kind: plant_replay
    claim: >-
      Plant fidelity under the observed command history: the recorded
      injector command, rail pressure and environment in, delivered fuel,
      lambda and the lambda observation out. Prescribed rpm and airflow are
      boundaries, never predictions of acceleration.
    roles:
      barometric_pressure: {role: prescribed_boundary, source: 'obd:BAROMETRIC_PRESSURE'}
      intake_air_temperature: {role: prescribed_boundary, source: 'obd:INTAKE_TEMP'}
      battery_voltage: {role: prescribed_boundary, source: 'obd:CONTROL_MODULE_VOLTAGE'}
      road_load: {role: unused}
      pedal_demand: {role: unused}
      engine_speed:
        role: prescribed_boundary
        source: 'obd:RPM'
        assumption: 'Imposed rpm: the slice predicts mixture at the recorded speed, not speed.'
      coolant_temperature:
        role: prescribed_boundary
        source: 'obd:COOLANT_TEMP'
        assumption: 'Warm engine; cold-start and wall-wetting states are excluded until modelled.'
      manifold_pressure:
        role: predicted_output
        init: {method: steady_state, note: 'Settled at the first boundary values (E07.5 manifold_breathing). fuel-mv-1 reads its steady value: speed density at the working VE.'}
      manifold_temperature:
        role: predicted_output
        init: {method: steady_state, note: 'Settled: equal to the intake air temperature.'}
      cylinder_air_flow:
        role: predicted_output
        init: {method: steady_state, note: 'Settled: equal to the first airflow read.'}
      mass_air_flow:
        role: prescribed_boundary
        source: 'obd:MAF'
        assumption: 'Recorded airflow is the air boundary; its bias stays in the boundary and is never absorbed into injector flow.'
      fuel_rail_pressure: {role: measured_input, source: 'sensor:FUEL_PRESSURE'}
      fuel_mass_flow: {role: predicted_output}
      delivered_lambda: {role: predicted_output}
      engine_torque: {role: unused}
      injector_open_time_b1: {role: predicted_output}
      throttle_position_actual: {role: unused}
      rpm_word: {role: unused}
      maf_reading: {role: unused}
      throttle_sensor_a: {role: unused}
      pedal_sensor: {role: unused}
      coolant_byte: {role: unused}
      battery_voltage_counts: {role: unused}
      barometric_counts: {role: unused}
      lambda_sensor_b1: {role: predicted_output}
      throttle_closed_learned: {role: unused}
      throttle_counts_above_closed: {role: unused}
      idle_air_learned: {role: unused}
      evap_purge_area: {role: unused}
      fuel_comp_load_byte: {role: unused}
      base_fuel_schedule: {role: unused}
      target_afr_x: {role: unused}
      throttle_target_area: {role: unused}
      requested_throttle_position: {role: unused}
      pedal_flag: {role: unused}
      target_phi_word: {role: unused}
      dead_time: {role: unused}
      fuel_pressure_correction: {role: unused}
      stft_b1: {role: unused}
      ltft_b1: {role: unused}
      injector_pulse_index0: {role: measured_input, source: 'did:ECM_INJECTOR_PULSE_1'}

  # ------------------------------------------- conditional ROM comparison (first slice)
  - id: conditional_rom_comparison
    kind: conditional_rom_comparison
    claim: >-
      Tuning effect conditional on fixed operating conditions: the same
      prescribed rpm, airflow, throttle, thermal state and initial state for
      each ROM; the qualified ECU command chain, delivered fuel and steady
      lambda out. Nothing recorded under one calibration feeds either side.
      Holds only for warm, steady, open-loop operation in the NA hardware.
    roles:
      barometric_pressure: {role: prescribed_boundary, source: scenario}
      intake_air_temperature: {role: prescribed_boundary, source: scenario}
      battery_voltage: {role: prescribed_boundary, source: scenario}
      road_load: {role: unused}
      pedal_demand: {role: unused}
      engine_speed:
        role: prescribed_boundary
        source: scenario
        assumption: 'Imposed rpm, equal for both ROMs; not a prediction of speed or acceleration.'
      coolant_temperature:
        role: prescribed_boundary
        source: scenario
        assumption: 'Warm, equal for both ROMs.'
      manifold_pressure:
        role: prescribed_boundary
        source: scenario
        assumption: 'Equal for both ROMs at the prescribed airflow (no MAP sensor).'
      manifold_temperature: {role: unused}
      cylinder_air_flow: {role: unused}
      mass_air_flow:
        role: prescribed_boundary
        source: scenario
        assumption: 'Imposed airflow, equal for both ROMs: a ROM change does not move airflow in this slice.'
      fuel_rail_pressure:
        role: prescribed_boundary
        source: scenario
        assumption: 'Rail pressure at its measured baseline for this airflow, equal for both ROMs.'
      fuel_mass_flow: {role: predicted_output}
      delivered_lambda: {role: predicted_output}
      engine_torque: {role: unused}
      injector_open_time_b1: {role: predicted_output}
      throttle_position_actual:
        role: prescribed_boundary
        source: scenario
        assumption: 'Same plate opening for both ROMs: the alpha-N fill input is held, so a Fuel Comp edit is evaluated at equal throttle.'
      rpm_word: {role: predicted_output}
      maf_reading: {role: predicted_output}
      throttle_sensor_a: {role: predicted_output}
      pedal_sensor: {role: unused}
      coolant_byte: {role: predicted_output}
      battery_voltage_counts: {role: predicted_output}
      barometric_counts: {role: predicted_output}
      lambda_sensor_b1: {role: predicted_output}
      throttle_closed_learned:
        role: prescribed_boundary
        source: scenario
        assumption: 'Same learned closed position under both ROMs.'
      throttle_counts_above_closed: {role: predicted_output}
      idle_air_learned:
        role: prescribed_boundary
        source: scenario
        assumption: 'Same learned idle air under both ROMs; a flash or battery disconnect that resets it is a separate, declared state.'
      evap_purge_area:
        role: prescribed_boundary
        source: scenario
        assumption: 'Purge off: purge scheduling is not modelled.'
      fuel_comp_load_byte: {role: predicted_output}
      base_fuel_schedule:
        role: predicted_output
        # E07.6 (2026-10-13): BFS is computed per ROM at the steady fixed point
        # (src.analysis.air_charge_twin.predict_steady_bfs, the manifest's
        # implementation of base_fuel_schedule). The airflow pipeline and the
        # fill dynamics settle into that fixed point, so at a steady point
        # their unmodelled arithmetic is absorbed -- unless the change under
        # study edits one of them (paired_scenarios keeps that unresolved).
        init:
          method: steady_state
          note: 'Steady operating point: the manifold-filling filter, transient term and airflow filters have settled (BFS = min(0xFFFF, 4 x w105C, ceiling << 8)).'
          absorbs: [airflow_qa, fill_coefficient, manifold_fill_filter, near_wot_flag, fill_transient, fill_blend]
      target_afr_x:
        role: predicted_output
        init: {method: steady_state, note: 'Steady operating point.'}
      throttle_target_area: {role: unused}
      requested_throttle_position: {role: unused}
      pedal_flag:
        role: prescribed_boundary
        source: scenario
        assumption: 'Stated for the operating point; its inputs are not traced (application model uncovered: pedal_flag_inputs).'
      target_phi_word:
        role: predicted_output
        init: {method: steady_state, note: 'Steady: the slew and cap are not binding.'}
      dead_time: {role: predicted_output}
      fuel_pressure_correction: {role: predicted_output}
      stft_b1:
        role: prescribed_boundary
        source: scenario
        assumption: 'Open loop: the slice is warm steady open-loop fuel, where the short-term trim is neutral.'
      ltft_b1:
        role: prescribed_boundary
        source: scenario
        assumption: 'Stated per ROM run; a flash resets it (ecu_reflash) and relearning is not modelled.'
      injector_pulse_index0: {role: predicted_output}

  # --------------------------------------------------------- coupled rollout (later)
  - id: coupled_rollout
    kind: coupled_rollout
    claim: >-
      Dynamic tuning effects within the validated envelope: driver demand,
      environment, road load and declared initial states in; ECU commands and
      the evolving engine and sensor state out. No recorded BFS, trim,
      airflow or rpm is fed back. Needs E07.5's dynamic plant before any claim.
    roles:
      barometric_pressure: {role: prescribed_boundary, source: scenario}
      intake_air_temperature: {role: prescribed_boundary, source: scenario}
      battery_voltage: {role: prescribed_boundary, source: scenario}
      road_load: {role: prescribed_boundary, source: scenario}
      pedal_demand: {role: prescribed_boundary, source: scenario}
      engine_speed:
        role: predicted_output
        init: {method: observed_checkpoint, note: 'Speed at the start of the scenario.'}
      coolant_temperature:
        role: predicted_output
        init: {method: observed_checkpoint, note: 'Coolant at the start of the scenario.'}
      manifold_pressure:
        role: predicted_output
        init: {method: steady_state, note: 'Settled at the initial operating point.'}
      manifold_temperature:
        role: predicted_output
        init: {method: steady_state, note: 'Settled at the initial operating point.'}
      cylinder_air_flow:
        role: predicted_output
        init: {method: steady_state, note: 'Settled at the initial operating point (read last step by the manifold).'}
      mass_air_flow:
        role: predicted_output
        init: {method: steady_state, note: 'Read last step by the manifold model.'}
      fuel_rail_pressure:
        role: predicted_output
        init: {method: steady_state, note: 'Settled at the initial operating point.'}
      fuel_mass_flow:
        role: predicted_output
        init: {method: steady_state, note: 'Settled at the initial operating point (read last step by the rail model).'}
      delivered_lambda: {role: predicted_output}
      engine_torque:
        role: predicted_output
        init: {method: steady_state, note: 'Settled at the initial operating point.'}
      injector_open_time_b1: {role: predicted_output}
      throttle_position_actual:
        role: predicted_output
        init: {method: observed_checkpoint, note: 'Plate position at the start.'}
      rpm_word:
        role: predicted_output
        init: {method: steady_state, note: 'Read last tick by the idle-air integrator.'}
      maf_reading: {role: predicted_output}
      throttle_sensor_a:
        role: predicted_output
        init: {method: steady_state, note: 'Read last tick by the closed-position learning.'}
      pedal_sensor: {role: predicted_output}
      coolant_byte: {role: predicted_output}
      battery_voltage_counts: {role: predicted_output}
      barometric_counts: {role: predicted_output}
      lambda_sensor_b1:
        role: predicted_output
        init: {method: steady_state, note: 'Read last tick by the short-term trim.'}
      throttle_closed_learned:
        role: inferred_state
        init: {method: observed_checkpoint, reset_on: [battery_disconnect], note: 'Non-volatile; read at key-on.'}
      throttle_counts_above_closed: {role: predicted_output}
      idle_air_learned:
        role: inferred_state
        init: {method: observed_checkpoint, reset_on: [battery_disconnect], note: 'Non-volatile learned part plus the integrator.'}
      evap_purge_area:
        role: prescribed_boundary
        source: scenario
        assumption: 'Purge off: purge scheduling is not modelled.'
      fuel_comp_load_byte: {role: predicted_output}
      base_fuel_schedule:
        role: predicted_output
        init: {method: steady_state, note: 'Filter settled at the initial point.'}
      target_afr_x:
        role: predicted_output
        init: {method: steady_state, note: 'Settled at the initial point.'}
      throttle_target_area: {role: predicted_output}
      requested_throttle_position: {role: predicted_output}
      pedal_flag: {role: predicted_output}
      target_phi_word:
        role: predicted_output
        init: {method: steady_state, reset_on: [ecu_power_on], note: 'Settled at the initial point.'}
      dead_time: {role: predicted_output}
      fuel_pressure_correction: {role: predicted_output}
      stft_b1:
        role: inferred_state
        init: {method: observed_checkpoint, reset_on: [ecu_power_on], note: 'Closed-loop trim at the start; volatile.'}
      ltft_b1:
        role: inferred_state
        init: {method: observed_checkpoint, reset_on: [ecu_reflash], note: 'Learned trim at the start; a flash resets it and relearning is part of the rollout.'}
      injector_pulse_index0: {role: predicted_output}

# ------------------------------------------------------------------ subsystems (E07.5)
# The plant's stages. Every plant and actuator quantity belongs to exactly one.
# A built stage declares its module, its bounded applicability and (when it
# integrates a state) its numerical checks; every stage names the independent
# reference that could validate it and the measurements still missing.
# Standing (built / numerically verified / validated) is DERIVED by
# src/analysis/engine_dynamics.py: subsystem_standing runs the convergence
# study, refuses a reference computed from the stage's own inputs
# (reference_not_independent) and counts only a recorded passing scoring.
subsystems:
  - id: fuel_delivery
    stage: 0
    meaning: 'Injector command to delivered fuel and mixture: the E07.3 mean-value fuel plant.'
    computes: [injector_open_time_b1, fuel_mass_flow, delivered_lambda]
    status: built
    # Scenarios run fuel-mv-1 (fuel_plant.yaml). fuel-mv-2 (fuel_plant_mv2.yaml,
    # E07.3 remaining 1 / E07.5, 2026-10-08) and fuel-mv-3 (fuel_plant_mv3.yaml,
    # the load-dependent VE, 2026-10-13, not yet identified) are declared beside
    # it; their standing is derived on request (engine_dynamics.standings(versions=...)).
    implementation:
      module: src.analysis.fuel_plant
      profile_file: fuel_plant.yaml
      plant_version: fuel-mv-1
      other_plant_versions: [fuel-mv-2, fuel-mv-3]
    # fuel-mv-1 is E07.3's frozen baseline: its numerics are not changed to
    # read the manifold stage, so in plant replay it keeps its own MAP.
    internal_models:
      - quantity: manifold_pressure
        owner: manifold_breathing
        plant_versions: [fuel-mv-1]
        modes: [plant_replay]
        model: >-
          fuel_plant.manifold_pressure_speed_density: steady speed density from
          MAF, rpm and IAT at fuel_plant.yaml's working VE (0.7, bracket
          0.4-1.0), capped at baro, per sample with no filling dynamics.
        differs: >-
          Where the steady manifold at that VE would exceed ambient, this model
          caps MAP at baro; manifold_breathing returns NaN and refuses the
          sample (manifold_above_ambient). The corpus has that on 10.6 % of
          warm in-envelope reads (charge fraction > 0.7, mostly above 3000
          rpm). In transients this model has no filling lag; the stage does.
        owed_by: >-
          The next fuel-plant plant_version (E07.3 remaining 1): read MAP from
          manifold_breathing, and revisit the VE working value against the
          charge-fraction bound (peak VE at least ~0.9). fuel-mv-1 itself is
          frozen and stays owed; fuel-mv-2 (below) is that version.
      - quantity: manifold_pressure
        owner: manifold_breathing
        plant_versions: [fuel-mv-2]
        modes: [plant_replay]
        model: >-
          fuel_plant.manifold_pressure_ve_curve: steady speed density from MAF,
          rpm and IAT at VE(rpm), the frozen baseline's ve_curve run at
          max(envelope, 0.7) per band; a read whose MAP would exceed baro is
          NaN and named manifold_above_ambient, a read outside the fit's rpm,
          baro or IAT range outside_ve_fit. Never capped.
        differs: >-
          Steady only: no filling lag, so it is scored on the fuel plant's steady
          regions (2 s rpm/MAF/pulse spans), where the stage's settled manifold
          and speed density agree at the same VE (E07.5,
          test_the_steady_manifold_is_the_fuel_plants_speed_density_at_the_same_ve).
          Its VE is VE(rpm); the stage (manifold-mv-1) still runs the shared
          constant working VE of the fuel plant it is loaded with (load_kit:
          fuel-mv-1, 0.7).
        reconciled_by: >-
          fuel-mv-2 (2026-10-08, operator-approved): MAP above ambient is refused
          per sample as manifold_breathing refuses it (the invariant below,
          checked against the plant's code by check_internal_models), and VE
          depends on rpm instead of the 0.7 the corpus contradicts at high load.
          Reading the stage's integrated trace was not chosen: in steady regions
          it equals this model at the same VE, and its replay needs the convergence
          study and a 1.28 ms grid the 2 s-steady scoring does not use.
        invariants: [manifold_at_or_below_ambient]
        parameter_fits:
          - parameter: volumetric_efficiency
            kind: log_fit
            form: >-
              VE(rpm), per band of 500/1000/2000/3000/4000/5000/6500 rpm: the
              largest steady warm charge fraction (MAF over the ideal-gas fill of
              the displacement at baro and IAT) on the identification drives, run
              at max(that, 0.7). Load-independent: part-load VE is assumed equal
              to full-breathing VE at the same rpm.
            identified_from: [mass_air_flow, engine_speed, barometric_pressure, intake_air_temperature]
            inherits: [maf_transfer_bias]
            hardware_configurations: [na_stock_injectors_2026_10]
            bounds:
              - {quantity: engine_speed, minimum: 500.0, maximum: 6500.0,
                 evidence: 'The fitted bands. Reads reached 5163 rpm; the top band (5000-6500) rests on 5 steady reads. Outside: outside_ve_fit.'}
              - {quantity: barometric_pressure, minimum: 79.0, maximum: 82.0,
                 evidence: 'The baro range of the 3,067 reads the fit used (home altitude). VE referenced to ambient includes intake pressure losses, which scale with the pressure ratio; trips reach 63 kPa, which this fit has not seen. Outside: outside_ve_fit.'}
              - {quantity: intake_air_temperature, minimum: 23.0, maximum: 50.0,
                 evidence: 'The IAT range of the reads the fit used. Bounded like baro: on this truck INTAKE_TEMP tracks airflow (stagnation, not the charge temperature), so the ideal-gas fill does not divide the charge density out. Outside: outside_ve_fit (117 reads of the 20-22 C morning drive 09-23T142926).'}
            fitted_on:
              - _capture-tuning-2026-09-21T223734
              - _capture-tuning-2026-09-21T232153
              - _capture-tuning-2026-09-23T164007
            evidence: >-
              Not an independent VE measurement. The truck has no MAP sensor, so
              VE is identified from MAF, rpm, baro and IAT: charge fraction = VE x
              MAP / baro <= VE on every read of a naturally aspirated engine, and
              the envelope equals VE only where the drives reached full breathing
              (above 2000 rpm: 0.888-0.906, peak 4000-5000 rpm; below 2000 rpm the
              drives never exceeded 0.7, so those bands run at the 0.7 floor). A
              MAF transfer error is a VE error of the same size (inherits
              maf_transfer_bias). Coolant >= 70 C (the steady rule).
              Known limitation, owed a load-dependent VE: steady warm idle has
              charge fraction p50 0.151 (1,875 reads, 762 rpm, 3.46 g/s, baro
              81 kPa), so the 0.7 floor gives MAP 17.5 kPa where a warm NA idle
              is ~28-35 kPa (idle VE ~0.35-0.45). The floor and the
              load-independence assumption understate part-load MAP and
              overstate injector dP by ~3 % at idle (~1.5 % flow), on 614 of the
              841 spent-drive reads.
              Frozen in fuel_plant_mv2.yaml baseline na-stock-2026-10-08.mv2.
      # fuel-mv-3 (fuel_plant_mv3.yaml, E07.3 remaining 1, 2026-10-13): the
      # load-dependent VE. Identified 2026-10-15 (baseline na-stock-2026-10-15.mv3);
      # its parameter_fits are the frozen fit's bounds (check_internal_models
      # compares them).
      - quantity: manifold_pressure
        owner: manifold_breathing
        plant_versions: [fuel-mv-3]
        modes: [plant_replay]
        model: >-
          fuel_plant.manifold_pressure_load_dependent: steady speed density from
          MAF, rpm and IAT at VE(rpm, MAP) = VE(rpm) x the ideal-cycle
          residual-gas factor (compression ratio 9.7, exponent 1.3, exhaust at
          1.0-1.1 x baro), solved for MAP; a read above baro is NaN and
          manifold_above_ambient, outside the VE fit outside_ve_fit. Never capped.
        differs: >-
          Steady only (no filling lag), as fuel-mv-2. Its VE falls with manifold
          pressure; the stage (manifold-mv-1) runs the fuel plant's constant
          working VE, so at part load the two give different MAP at the same
          airflow (idle ~22 kPa here against ~17.5 kPa at VE 0.7).
        reconciled_by: >-
          fuel-mv-3 (2026-10-13): MAP above ambient is refused per sample as
          manifold_breathing refuses it (the invariant below, checked against
          the plant's code), and part-load VE follows the residual-gas factor
          instead of the full-breathing value.
        invariants: [manifold_at_or_below_ambient]
        parameter_fits:
          - parameter: volumetric_efficiency
            kind: log_fit
            form: >-
              Full-breathing VE(rpm), fuel-mv-2's rule unchanged: per band of
              500/1000/2000/3000/4000/5000/6500 rpm, the largest steady warm
              charge fraction on the identification drives, run at max(that,
              0.7). Part load is the residual-gas factor (declared physics, not
              fitted): only VE x MAP is identifiable without a MAP sensor.
            identified_from: [mass_air_flow, engine_speed, barometric_pressure, intake_air_temperature]
            inherits: [maf_transfer_bias]
            hardware_configurations: [na_stock_injectors_2026_10]
            bounds:
              - {quantity: engine_speed, minimum: 500.0, maximum: 6500.0,
                 evidence: 'The fitted bands, as fuel-mv-2. The top band (5000-6500) rests on 5 steady reads. Outside: outside_ve_fit.'}
              - {quantity: barometric_pressure, minimum: 79.0, maximum: 82.0,
                 evidence: 'The baro range of the 3,067 reads the fit used, as fuel-mv-2. Outside: outside_ve_fit.'}
              - {quantity: intake_air_temperature, minimum: 23.0, maximum: 50.0,
                 evidence: 'The IAT range of the reads the fit used, as fuel-mv-2 (INTAKE_TEMP tracks airflow on this truck). Outside: outside_ve_fit.'}
            fitted_on:
              - _capture-tuning-2026-09-21T223734
              - _capture-tuning-2026-09-21T232153
              - _capture-tuning-2026-09-23T164007
            evidence: >-
              Not an independent VE measurement (no MAP sensor; inherits
              maf_transfer_bias). The envelope is fuel-mv-2's to 1e-6 on the
              same drives. Frozen in fuel_plant_mv3.yaml baseline
              na-stock-2026-10-15.mv3 (s = 0.050994 g/ms); in-sample |err| p90
              11.69 %, no better than fuel-mv-2.
    applicability:
      hardware_configurations: [na_stock_injectors_2026_10]
      bounds:
        - {quantity: coolant_temperature, minimum: 70.0, maximum: 130.0,
           evidence: 'fuel_plant.yaml steady.min_coolant_c: warm only, wall wetting and cold enrichment are not modelled.'}
      time_resolution: engine_cycle
      evidence: >-
        Warm, steady, naturally aspirated, effective pulse >= 1 ms (the
        short-pulse correction is undecoded); scored by fuel_plant_eval, whose
        held-out verdicts are this stage's validation record.
    references:
      - id: lambda_pid
        channel: 'obd:O2_WR_LAMBDA_S1'
        measures: delivered_lambda
        kind: instrument
        status: available
        evidence: 'The bank-1 A/F sensor as the ECM reports it (B06); never the target.'
    required_measurements:
      - id: rail_pressure_drive
        what: 'A tuning-profile drive logging sensor:FUEL_PRESSURE with the pulse DID and PID 0x42.'
        identifies: [rail_pressure, injector_dead_time]
        status: partial
        evidence: 'AEM gauge logged since 2026-10-04 (ram-study only, pulse DID at 7 s); E07.3 remaining 2.'
      - id: injector_flow
        what: 'A flow bench, or an independent fuel-mass measurement, of the fitted injectors.'
        identifies: [injector_static_flow, injector_dead_time]
        status: missing
        evidence: 'E07.3: only the lumped stoich_air_per_open_ms is identifiable.'
      - id: evap_purge_drive
        what: 'A tuning-profile drive logging DID 0x1110 (ECM_EVAP_PURGE_CMD) with the pulse DID, MAF and lambda.'
        identifies: [evap_purge_area]
        status: planned
        plan:
          decided_on: '2026-10-15'
          decided_by: operator
          arrives_with: >-
            The next tuning drive: the tuning capture profile polls 0x1110 from
            2026-10-15 (data/capture_profiles.yaml).
          recorded_in: docs/roadmap/tasks/E07-engine-plant-simulator.md (E07.3, STFT residual)
          consequence: >-
            Tests whether purge explains the per-sample plant error, which
            tracks STFT one for one (err = -0.92 STFT on 1,601 steady reads,
            2026-10-15). Purge enters downstream of the MAF, so its fuel is
            unmetered by both MAF and the pulse. It separates purge from MAF
            transfer error only where purge is on and off at the same operating
            point; it does not measure the purge mass flow.
        evidence: >-
          No tuning capture before 2026-10-15 polled PID 0x2E or DID 0x1110 (the
          six fuel-plant drives have zero purge reads). E07.3, STFT residual.
      - id: map_sensor
        what: 'Manifold absolute pressure logged with the pulse (see manifold_breathing).'
        identifies: [manifold_pressure]
        status: planned
        # Operator decision 2026-10-08 (E07.5 remaining 1): no MAP sensor can be
        # fitted until the supercharger build, whose kit brings one.
        plan: &map_sensor_plan
          decided_on: '2026-10-08'
          decided_by: operator
          arrives_with: >-
            The supercharger build: the kit's Bosch 0 261 230 416 TMAP behind
            the intercooler, read through a Pi ADC
            (docs/roadmap/supercharger-build.md, Phase 2 P2). No MAP sensor can
            be installed before it.
          recorded_in: docs/roadmap/tasks/E07-engine-plant-simulator.md (E07.5 remaining 1)
          consequence: >-
            No MAP on the NA intake, ever (operator, 2026-10-08): the kit's TMAP
            mounts after the intercooler and no temporary NA port will be
            fitted. The NA manifold_breathing stage (na_stock_injectors_2026_10)
            stays a best-effort fit from MAF, rpm, baro and IAT and is never
            validated against measured MAP; every MAP-dependent NA quantity stays
            unmeasured. Only the boosted plant (a new hardware configuration)
            gets MAP validation.
        evidence: >-
          The injector differential pressure needs MAP; fuel-mv-1 runs it at
          speed density (VE 0.7 [0.4, 1.0]), fuel-mv-2 at VE(rpm) fitted from MAF.

  - id: fuel_rail
    stage: 0
    meaning: 'Rail pressure response to fuel demand (returnless; droops with airflow).'
    computes: [fuel_rail_pressure]
    status: unbuilt
    references:
      - id: aem_rail
        channel: 'sensor:FUEL_PRESSURE'
        measures: fuel_rail_pressure
        kind: instrument
        status: available
        evidence: 'AEM 30-0301 at 100 Hz (anti-alias firmware from 2026-10-04 21:52:33Z); +1.8 psi offset vs the face unresolved.'
    required_measurements:
      - id: rail_pressure_drive
        what: 'Drives logging the rail with MAF, rpm and the pulse DID across the load range.'
        identifies: [rail_pressure_behaviour]
        status: partial
        evidence: 'One recording (ram-study 2026-10-04) has the rail; it is spent held-out evidence for fuel-mv-1.'

  - id: manifold_breathing
    stage: 1
    meaning: >-
      One lumped intake manifold: mass and energy balance between the air
      entering past the throttle and the air the cylinders draw, with
      four-stroke speed-density breathing at a volumetric efficiency.
    computes: [manifold_pressure, manifold_temperature, cylinder_air_flow]
    components: [manifold_mass_balance, manifold_energy_balance, cylinder_breathing]
    status: built
    implementation: {module: src.analysis.engine_dynamics, profile_file: manifold_plant.yaml, plant_version: manifold-mv-1}
    applicability:
      hardware_configurations: [na_stock_injectors_2026_10]
      bounds:
        - {quantity: engine_speed, minimum: 500.0, maximum: 6500.0,
           evidence: 'Below 500 rpm the engine is cranking or stalling (no steady breathing); 6500 rpm is the VQ40DE redline (tuning_providers.yaml).'}
        - {quantity: mass_air_flow, minimum: 0.5, maximum: 300.0,
           evidence: 'Positive inflow (idle reads ~2-4 g/s); 300 g/s is above what 3.954 L can breathe at sea level and 6500 rpm (~210 g/s at VE 1), so the bound never binds before the ambient invariant does.'}
        - {quantity: barometric_pressure, minimum: 60.0, maximum: 105.0,
           evidence: 'Sessions read 63-101 kPa (home ~80 kPa, trips to 63); ideal gas throughout.'}
        - {quantity: intake_air_temperature, minimum: -30.0, maximum: 70.0,
           evidence: 'Inflow enthalpy is taken at the IAT reading (upstream of the throttle); ideal-gas air, cp and cv constant within 0.5 % over this range.'}
      invariants: [manifold_at_or_below_ambient]
      time_resolution: engine_cycle
      evidence: >-
        Mean-value: tau / cycle = V / (VE Vd), about one to four cycles at
        every rpm, so structure finer than one engine cycle (120/rpm s) is
        solver output, not a prediction. Naturally aspirated only: a manifold
        above ambient is refused per sample (the supercharger is a new hardware
        configuration and a new plant). One manifold for both banks; no
        runner wave dynamics, no EGR, and no purge: EVAP
        purge enters the manifold downstream of the MAF, so its air and fuel
        are unmetered and outside this stage (E07.3, 2026-10-15).
    numerical:
      refinement: [1, 2, 4, 8]
      order_tolerance: 0.15
      max_relative_error: 0.01
      equation_residual_relative: 1.0e-9
      evidence: >-
        The ladder, the 1 % bound and the order tolerance were declared
        before the study ran (2026-10-05), when the method was E07.1's
        starting choice, fixed-step explicit Euler (first order). 1 % of a
        tip-in's amplitude is a quarter of the fuel plant's 4 % region bound,
        so solver error cannot be what decides a fuel result. Euler failed 8
        of 18 corners at 1.28 ms; the study moved the solver to rk4 (see
        `solver`), whose observed order is checked against 4. The
        equation-residual check (engine_dynamics.consistency) re-steps every
        stored state with independent code under the declared equations and
        holds the reported cylinder flow to the breathing law at the method's
        quadrature bound; it is not a ledger the integrator closes by
        construction. The residual bound was added with that check on
        2026-10-05, after the first study, and is rounding (1e-9).
    references:
      - id: map_sensor
        channel: 'sensor:MANIFOLD_PRESSURE'
        measures: manifold_pressure
        kind: instrument
        status: requires_measurement
        requires: map_sensor
        evidence: 'No MAP sensor on this engine; PID 0x0B is unsupported (data/bindings.yaml, retraction 2026-08-08).'
      - id: bfs_air_charge
        channel: 'mem:ECM_AIR_CHARGE_SLOT_103A'
        measures: cylinder_air_flow
        kind: ecu_computed
        status: available
        evidence: >-
          BFS (0x1208/0xFFFF103A) is K x MAF / rpm through Fuel Comp, the
          ECU's own manifold-filling filter (0x9B99/0x9BD9) and the rpm
          ceiling: the ECU's model of the same filling, computed from the same
          MAF and rpm. Declared so the refusal is on record, never to score.
      - id: ve_ambient
        channel: 'derived:VE_AMBIENT_PERCENT'
        measures: cylinder_air_flow
        kind: derived
        status: available
        evidence: 'MAF over the ambient fill (B04.5): the charge fraction, from the same MAF, baro and IAT.'
    required_measurements:
      - id: map_sensor
        what: >-
          A manifold absolute pressure sensor teed into a manifold vacuum
          port, logged at >= 100 Hz with MAF and rpm (a spare input of the USB
          ADC that already logs the AEM rail gauge, data/usb_adc_sensors.yaml),
          over idle, cruise, tip-ins and tip-outs and WOT pulls.
        identifies: [manifold_pressure, volumetric_efficiency, manifold_volume]
        excites: [throttle]
        status: planned
        plan: *map_sensor_plan
        evidence: >-
          VE and MAP enter steady breathing only as their product (the charge
          fraction MAF identifies); the filling time constant needs a
          pressure step response. 100 Hz resolves a 5-cycle tau at 6500 rpm.
      - id: manifold_volume_measurement
        what: 'The plenum, runner and MAF-to-throttle duct volume (water fill or CAD).'
        identifies: [manifold_volume]
        status: missing
        evidence: 'manifold_plant.yaml runs 4.0 L, bracket 2-8 L.'

  - id: throttle_flow
    stage: 1
    meaning: 'Air flow past the throttle plate (compressible orifice), for a rollout that computes airflow.'
    computes: [mass_air_flow]
    status: unbuilt
    references:
      - id: maf
        channel: 'obd:MAF'
        measures: mass_air_flow
        kind: instrument
        status: available
        evidence: 'The hot-wire meter upstream of the throttle; its own bias (maf_transfer_bias) is unmeasured.'
    required_measurements:
      - id: map_sensor
        what: 'MAP with MAF and both throttle sensors at rate: the throttle effective area needs the pressure ratio across the plate outside choked flow.'
        identifies: [throttle_effective_area]
        excites: [throttle]
        status: planned
        plan: *map_sensor_plan
        evidence: 'Below a 0.528 pressure ratio flow is choked and independent of MAP; above it the area is not identifiable without MAP.'

  - id: actuator_response
    stage: 1
    meaning: 'Physical throttle plate (and later cam phaser) response to the ECU command, separate from the command.'
    computes: [throttle_position_actual]
    components: [throttle_plate, cam_phaser]
    status: unbuilt
    references:
      - id: throttle_sensor_a
        channel: 'did:ECM_THROTTLE_POS_SENSOR_1'
        measures: throttle_position_actual
        kind: instrument
        status: available
        evidence: 'A/D channel 6 (DID 0x120F), polled; the commanded word 0xFFFF2D28 is not in the memory catalog.'
    required_measurements:
      - id: throttle_command_vs_actual
        what: 'The requested throttle word 0xFFFF2D28 and throttle sensor A logged together at >= 50 Hz through tip-ins.'
        identifies: [throttle_rate_limit, throttle_delay]
        excites: [throttle]
        status: missing
        evidence: 'The contract declares no throttle rate limit because none is measured.'
      - id: cam_command_vs_actual
        what: 'Intake valve timing commanded and actual (VTC) logged together; the channels are not catalogued.'
        identifies: [cam_phase_response]
        excites: [cam]
        status: missing
        evidence: 'No cam quantity exists in the contract yet.'

  - id: torque_production
    stage: 2
    meaning: 'Brake torque from the cylinder charge, mixture, spark and speed, less friction and pumping.'
    computes: [engine_torque]
    components: [spark_efficiency, lambda_efficiency, friction, pumping]
    status: unbuilt
    shared_inputs:
      - quantity: engine_speed
        justification: >-
          The operating-point index: a road-dyno reference is reported against
          rpm, which is checked against GPS through the measured gearing
          (H07.1, H07.11); sharing it does not make torque agree with itself.
    references:
      - id: h07_wheel_torque
        channel: 'dyno:WHEEL_TORQUE'
        measures: engine_torque
        kind: external
        derived_from: ['decoded:VEHICLE_SPEED_2D1', 'imu:SF_LON', 'gps:altitude', 'obd:RPM', road_load]
        status: not_validated
        requires: h07_na_baseline
        evidence: >-
          H07's road-load power: F = m f + (m_eff - m) a + F_rl(v), from
          speed, specific force and coast-down road load; engine torque only
          as wheel / stated driveline efficiency. Not validated: H07.12 (NA
          baseline) and H07.8 (repeatability) are owed, inertia is estimated.
      - id: fuel_energy_torque
        channel: 'derived:ESTIMATED_TORQUE_NM'
        measures: engine_torque
        kind: derived
        status: available
        evidence: >-
          A fuel-energy estimate (fuel rate x LHV x an assumed efficiency /
          omega) built from MAF, lambda and rpm: the same signals the torque
          stage reads. Declared so calibrating against it is refused by name.
    required_measurements:
      - id: h07_na_baseline
        what: 'H07.12: coast-downs both ways and WOT pulls in two gears on one flat road, plus H07.8 repeatability and H07.10 weighing.'
        identifies: [engine_torque, friction, rotational_inertia]
        status: missing
        evidence: 'H07.5/H07.6/H07.7 are desk-done only; no real road-load coefficients, inertia or noise floor exist.'
      - id: controlled_spark_sweep
        what: >-
          Steady pulls or cruise holds at fixed rpm and load with stepped
          ignition offsets (a calibration edit per run), on the validated
          torque reference, with the knock flags (RAM 479D b7, 1254, 28AA b2)
          logged.
        identifies: [spark_efficiency]
        excites: [spark]
        status: missing
        evidence: 'Natural closed-loop driving never varies spark at fixed conditions.'
      - id: lambda_sweep
        what: 'Steady holds at fixed rpm and load with stepped commanded lambda on the torque reference.'
        identifies: [lambda_efficiency]
        excites: [lambda]
        status: missing
        evidence: 'Enrichment only occurs where load changes too; it does not separate lambda from load.'
      - id: cam_sweep
        what: 'Controlled intake cam phase variation at fixed rpm and load on the torque reference.'
        identifies: [cam_effect_on_breathing_and_torque]
        excites: [cam]
        status: missing
        evidence: 'VTC is scheduled by the ECU with rpm and load; never varied independently.'
      - id: map_sensor
        what: 'Manifold pressure for the pumping loss.'
        identifies: [pumping]
        status: planned
        plan: *map_sensor_plan
        evidence: 'See manifold_breathing.'

  - id: rotational_dynamics
    stage: 3
    meaning: 'Crank speed from torque, rotating inertia, driveline and road load: the only stage that predicts acceleration.'
    computes: [engine_speed]
    components: [rotational_inertia, driveline, road_load]
    status: unbuilt
    references:
      - id: rpm
        channel: 'obd:RPM'
        measures: engine_speed
        kind: instrument
        status: available
        evidence: 'PID 0x0C, agreeing with GPS through the gearing (H07.1).'
    required_measurements:
      - id: h07_road_load
        what: 'H07.5 coast-down coefficients on the truck (both directions).'
        identifies: [road_load]
        status: missing
        evidence: 'Desk-done; real coefficients owed by H07.12.'
      - id: h07_inertia
        what: 'H07.6 two-gear pulls over one rpm band.'
        identifies: [rotational_inertia]
        status: missing
        evidence: 'dyno.yaml inertia values are labelled estimates.'
      - id: vehicle_mass
        what: 'H07.10: a public-scale weight with driver and fuel recorded.'
        identifies: [vehicle_mass]
        status: missing
        evidence: 'H07.10 is partial.'

  - id: engine_thermal
    stage: 4
    meaning: 'Coolant temperature from heat rejection and the thermostat.'
    computes: [coolant_temperature]
    status: unbuilt
    references:
      - id: coolant
        channel: 'did:ECM_COOLANT_TEMP'
        measures: coolant_temperature
        kind: instrument
        status: available
        evidence: 'CAN DID 0x1101, 1 degC steps; sensor lag unmeasured.'
    required_measurements:
      - id: warmup_runs
        what: 'Cold-start warm-ups at stated ambient and load, logged from key-on.'
        identifies: [heat_rejection, thermostat_opening]
        status: missing
        evidence: 'Every plant result so far is warm-only.'
