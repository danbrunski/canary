# K-line facts for the 2008 Nissan Xterra's ECM (VQ40DE), OBD pin 7.
# Model: src/collection/kline/profile.py. Every value here was measured on this
# truck; nothing is a protocol default. Evidence: the CANary-HAT's passive
# sniff of UpRev's session and its own session, KOEO, 2026-09-23
# (docs/uprev-usb-kline-research.md "On-wire view";
# tests/fixtures/kline/uprev_session_frames.json).
schema_version: 1
evidence: >-
  CANary-HAT rev 2.0 on the Xterra, 2026-09-23 KOEO: 93 s of UpRev's session
  sniffed (1,462 frames, every checksum good), then StartCommunication, a DID
  read and StopCommunication from the HAT alone.
baud: 10400
ecm_address: 0x10
# Not the ISO 14230-4 default 0xF1: a StartCommunication from 0xF1 gets silence.
tester_address: 0xFC
wakeups:
  # The only wake-up this ECM answered, from UpRev's cable and from the HAT.
  - name: long-low
    low_ms: 518.9
    high_ms: 18.1
    evidence: >-
      UpRev's cable: six instances, 518.87-518.89 ms low then 18.04-18.13 ms
      high; every StartCommunication the ECM answered followed one. The HAT:
      answered first time.
  # ISO 14230 fast init. Kept second: UpRev tries it, the ECM never answers
  # it, and a future ECM on another truck may need it.
  - name: iso14230-fast
    low_ms: 25.0
    high_ms: 25.0
    evidence: >-
      UpRev's cable alternates it with long-low (25.00-25.01 ms low,
      25.05-25.13 ms high); no reply in six tries, nor to the HAT's.
key_bytes: [0x5D, 0x8F]
frame_format: length_byte
# UpRev appends 04 01 to its 21 and 22 requests and the ECM answers them; what
# it means is unresolved (H05.9: try without it).
request_trailer: [0x04, 0x01]
timing:
  # ISO 14230-2 values; the ECM answered 22 11 03 within ~10 ms of the request
  # ending, well inside p2_max.
  p2_max_ms: 50.0
  p3_min_ms: 55.0
  p3_max_ms: 5000.0
  p4_ms: 0.0
known_answers:
  - request: "22 11 03 04 01"
    reply_prefix: "62 11 03"
    reply_length: 4
    evidence: >-
      UpRev's ECU check, repeated ~3.6 Hz (replies 62 11 03 9A), and the HAT's
      own read (62 11 03 99), 2026-09-23 KOEO.
