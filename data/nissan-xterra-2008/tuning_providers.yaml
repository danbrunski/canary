schema_version: 1
providers:
  - {role: rpm, spec: 'did:ECM_RPM'}
  - {role: operator_demand, spec: 'did:ECM_THROTTLE_POS_SENSOR_1'}
  - {role: measured_afr_b1, spec: 'did:ECM_AF_SENSOR_V_B1', transform: voltage_afr}
  - {role: measured_afr_b2, spec: 'did:ECM_AF_SENSOR_V_B2', transform: voltage_afr}
  # UpRev's operator-selected Bank 1/Bank 2 streams directly identify
  # 0x1206/0x1207, and the overlapping ROM Editor export pins both scales to
  # raw * 0.01 ms (2026-09-20). They are therefore safe for automatic use.
  # 0x1208, which this role pointed at until 2026-09-18, is AIR CHARGE, not
  # injected fuel (data/dids.yaml).
  - {role: injector_pw_b1, spec: 'did:ECM_INJECTOR_PULSE_1'}
  - {role: injector_pw_b2, spec: 'did:ECM_INJECTOR_PULSE_2'}
  - {role: coolant_temp, spec: 'did:ECM_COOLANT_TEMP'}
  # Base Fuel Schedule (UpRev "B-FUEL SCHDL", ms) — the load axis of the
  # fuel-target map. 0x1208 (ECM_AIR_CHARGE) behaves as air per event x K,
  # i.e. Nissan Tp/BFS: its counts per g air stepped +7.5 % at the 07-27
  # reflash exactly as UpRev BFS/air did (28.7 -> 30.8 ms per g). Scale is
  # raw/2040 (+-1.5 %; 2048 within error), derived TRANSITIVELY through
  # per-era ratios, never same-instant paired with UpRev BFS — so it stays
  # `candidate` and only runs under build_tuning_frame(allow_candidates=True).
  # Promote after one same-instant compare_channels window (slope 1 +- 2 %).
  - role: base_fuel_schedule
    spec: 'did:ECM_AIR_CHARGE'
    transform: scale
    factor: 0.000490196  # 1/2040
    unit: ms
    confidence: candidate
    conditions: >-
      Steady state only: BFS trails MAF by ~0.15 s, so transients read -6..-7 %
      (p5). Steady error +-2..3 % — fine between most fuel-target load
      breakpoints but ambiguous at adjacent ones (18.20/18.54, 21.40/21.57 ms).
      Validated to ~17 ms on July K 1.07 logs; the current tune only to
      13.9 ms. Baro untested away from home altitude (~80 kPa). Not for
      transient or WOT-edge cell placement.
    evidence: >-
      data/analyses/2026-09-18-eve-drive-log.md;
      ~/canary-data/scripts-0918b/out/bfs1208.md
  # The 2026-08-05 all-DID capture confirms a command plus two distinct
  # measured positions. Their exact physical bank mapping remains unknown, and
  # the 2026-08-06 drive weakened the evidence that had suggested one: the
  # A-vs-B offset was +0.16 degCA under load against +0.514 degCA measured
  # static, both stable fits. Treat the mapping as open.
  - {role: cam_command, spec: 'did:ECM_INTAKE_CAM_ANGLE_COMMANDED'}
  - {role: cam_measured, spec: 'did:ECM_INTAKE_CAM_ANGLE_MEASURED'}
  - {role: cam_measured_b, spec: 'did:ECM_INTAKE_CAM_ANGLE_MEASURED_B'}
  # Commanded AFR was the single biggest gap in the all-DID workflow, and it
  # is closed. It never had a Mode 22 provider because it is not a DID at all:
  # the ECM's FINAL commanded equivalence ratio is a Q14 word at RAM address
  # 0xFFFF26BE, read with service 0x23 (data/dids.yaml `memory:`). Mode 01
  # could not supply it on a tuning capture — Mode 01 and Mode 22 are mutually
  # exclusive on this ECM — which is why this role sat declared-but-absent.
  #
  # Two properties this provider has that PID 0x44 did not:
  #   * Direction is pinned by its own known-answer chain, so it does not
  #     consult `commanded_equiv_ratio_convention` (still `unverified`, and
  #     invisible in closed loop by construction).
  #   * Fuel cut is a separate `_SENTINEL` channel rather than a number, so
  #     cut samples cannot dilute a delivery-error mean.
  #
  # DID 0x1134 is NOT a substitute: it is the floor-clamped, low-resolution
  # rich-side view and holds at raw 64 during fuel cut, so it cannot tell cut
  # from stoich. The channel is withheld automatically on any calibration
  # other than the one the address was verified against.
  - {role: commanded_afr, spec: 'mem:ECM_TARGET_EQUIV_RATIO', transform: equiv_ratio_afr}

# How to recognise wide-open throttle from the operator_demand role alone,
# for captures that carry no Mode 01 load PID and no physical pull tags.
#
# Evidence, from the two all-DID captures that reach the stop
# (_capture-tuning-did-2026-08-06T145004, n=18386, and -2026-08-07T005351,
# n=18523):
#
#   * The plate hits a mechanical stop and the sensor DWELLS there: above
#     3.5 V the modal value is 4.125 V (397 samples) and 4.120 V (259) on the
#     two drives, falling away sharply either side. Session maxima agree to
#     +-2.5 mV (4.175 / 4.170) across independent drives.
#   * Air charge (0x1208) corroborates from a channel that needs no pinned
#     scale: at rpm > 2500 the raw median rises 4530 -> 16304 -> 32585
#     across the part-throttle bands, then only 34146 -> 35032 (+2.6 %) from
#     [3,4) V to [4,4.2) V. Airflow is saturated, so this really is WOT.
#   * Closed-throttle floor (p1) is 0.615 / 0.635 V on the same two drives.
#
# `threshold_value` sits below the stop so the approach counts, but above the
# highest part-throttle dwell: the [3.0,4.0) V band holds only 78 samples
# against 364 in [4.0,4.2), so 4.0 V separates cleanly.
wot_criterion:
  role: operator_demand
  unit: V
  closed_value: 0.62
  wide_open_value: 4.12
  threshold_value: 4.00
  # A drive whose demand never gets within this much of the stop never opened
  # the throttle. That is a real answer about the drive, and it must not be
  # reported the same way as "this capture carried no demand channel at all".
  reached_stop_tolerance: 0.25
  rpm_floor: 2500.0
