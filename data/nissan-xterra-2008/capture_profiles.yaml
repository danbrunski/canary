- name: fuel-did-research
  description: Narrow all-DID capture to identify raw 0x1209 as the Base Fuel Schedule candidate
  experimental: true
  mode01: {}
  mode22:
  - ECM_RPM
  - ECM_AF_SENSOR_V_B1
  - ECM_AF_SENSOR_V_B2
  - ECM_INJECTOR_PW_B1
  - ECM_THROTTLE_POS_SENSOR_1
  - ECM_INTAKE_AIR_TEMP
  - ECM_MAF_GPS
  mode01_enabled: false
  mode22_enabled: true
  did_interval_seconds: null
  round_timestamps: true
  target_rate_hz: 20.0
  did_continuous: true
  bus_budget_override: 160.0
  expected_total_demand_hz: 140.0
  capacity_evidence: '2026-08-04 bench: 658 DID reads/s; 7 DIDs x 20 Hz = 140 reads/s. Raw 0x1209 remains a candidate, not a decoded provider.'
  broadcast_decode: true
  corpus_eligible: false
  behavior_model_recipes:
  - injector_pw_vs_rpm_throttle_did
  storage_prefix: _capture-fuel-did-research
- name: tuning-hybrid-research
  description: Experimental 4 Hz Mode 01 plus Mode 22 capture using the confirmed fast session exit
  experimental: true
  mode01:
    RPM: 1.0
    ENGINE_LOAD: 1.0
    MAF: 1.0
    TIMING_ADVANCE: 1.0
    INTAKE_TEMP: 1.0
    COMMANDED_EQUIV_RATIO: 1.0
    FUEL_STATUS: 1.0
    # The ECM's own measured lambda, alongside the A/F sensor *voltage* DIDs
    # below. These are two readings of one physical sensor by two different
    # conversions, and they disagree by ~3.8 % — the disagreement the whole
    # "engine runs lean of command" question rests on, because
    # afr_calibration.yaml's voltage transfer was fitted against UpRev's AFR
    # column and therefore reproduces UpRev's conversion rather than checking
    # it. Capturing both on the same samples is the resolution the campaign
    # has been waiting for. S2 is omitted: PID 0x25 never answers on this ECM
    # (0/3 on 2026-08-07), while 0x24 answers 91 % of the time.
    O2_WR_LAMBDA_S1: 1.0
  mode22:
  - ECM_RPM
  - ECM_AF_SENSOR_V_B1
  - ECM_AF_SENSOR_V_B2
  - ECM_INJECTOR_PW_B1
  - ECM_INTAKE_CAM_ANGLE_MEASURED
  - ECM_INTAKE_CAM_ANGLE_COMMANDED
  - ECM_INTAKE_CAM_ANGLE_MEASURED_B
  - ECM_THROTTLE_POS_SENSOR_1
  - ECM_MAF_GPS
  mode01_enabled: true
  mode22_enabled: true
  did_interval_seconds: 0.25
  round_timestamps: true
  target_rate_hz: 4.0
  did_continuous: false
  bus_budget_override: 90.0
  expected_total_demand_hz: 68.0
  capacity_evidence: '2026-08-07 drive (25 min, _capture-tuning-hybrid-research-2026-08-07T170918): the fast exit works and Mode 01 survives a full drive, but delivered rate is far below target - Mode 01 1.46 Hz, DIDs 0.90 Hz, 18.25 aggregate channel reads/s against the 68 expected from 17 selected channels x 4 Hz. Treat target_rate_hz as aspirational and check achieved_hz_capture before trusting any rate-dependent conclusion. Mode 01 and Mode 22 alternate rather than sample together (0.341 s median separation), so restrict to steady state for cross-mode pairings.'
  broadcast_decode: true
  corpus_eligible: false
  behavior_model_recipes:
  - injector_pw_vs_rpm_throttle_did
  - cam_primary_vs_command_rpm_did
  - cam_secondary_vs_command_rpm_did
  storage_prefix: _capture-tuning-hybrid-research
