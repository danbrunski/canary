- name: fuel-map
  description: High-rate fueling and timing capture
  notes: 'O2_WR_LAMBDA_S2 (PID 0x25) is deliberately absent: it never answers on this
    ECM. It sat in this profile until 2026-08-10 consuming a schedule slot every round
    and returning nothing, while the fact was recorded in a comment on the tuning-did
    profile 90 lines below. Bank-2 mixture comes from the A/F voltage DIDs (0x1225/0x1226),
    not Mode 01.


    Diverged from the seed on purpose (bank-2 lambda removed above), so the seed must
    not overwrite it. The generic profile keeps PID 0x25 because it answers on other
    ECMs; that this one refuses it is a vehicle fact and belongs here, not in shared
    code.


    Carries air-density and thermal context (CAPTURE_CONTEXT_MODE01 in src/collection/capture_profiles.py)
    as of 2026-09-21: BAROMETRIC_PRESSURE added at ~1 Hz. The 2026-09-21 drive on
    this catalog had none of them, and its VE rested on a GPS-altitude baro estimate
    and an assumed intake temperature.'
  experimental: false
  mode01:
    RPM: 1.0
    ENGINE_LOAD: 1.0
    MAF: 1.0
    TIMING_ADVANCE: 1.0
    THROTTLE_POS: 1.0
    O2_WR_LAMBDA_S1: 1.0
    COMMANDED_EQUIV_RATIO: 1.0
    FUEL_STATUS: 1.0
    INTAKE_TEMP: 0.25
    SPEED: 0.25
    COOLANT_TEMP: 0.25
    SHORT_FUEL_TRIM_1: 0.25
    SHORT_FUEL_TRIM_2: 0.25
    LONG_FUEL_TRIM_1: 0.25
    LONG_FUEL_TRIM_2: 0.25
    EVAPORATIVE_PURGE: 0.25
    BAROMETRIC_PRESSURE: 0.25
  mode01_batch_groups: []
  mode22: []
  mode22_rate_weights: {}
  memory: []
  mode01_enabled: true
  mode22_enabled: true
  did_interval_seconds: null
  did_cycle_seconds: null
  round_timestamps: true
  target_rate_hz: 4.0
  did_continuous: false
  bus_budget_override: 20.0
  priority_channels: null
  expected_total_demand_hz: 41.0
  capacity_evidence: '8 fast x 4 Hz + 8 context x 1 Hz = 40 channel-reads/s (one below
    the generic seed, which keeps bank-2 lambda), against 478/s measured batched on
    this ECM (2026-08-04). Budget held at 20 req/s, under the 24 req/s storage-sink
    line: batching packs 6 PIDs per request, so 40 reads/s needs ~7 req/s batched
    and 40 unbatched. If batching is off the contract reports a shortfall rather than
    silently exceeding the sink''s known-safe rate.'
  required_tuple:
  - RPM
  - ENGINE_LOAD
  - FUEL_STATUS
  - COMMANDED_EQUIV_RATIO
  - O2_WR_LAMBDA_S1
  min_achieved_rate_hz: 3.0
  max_tuple_skew_s: null
  requires_tune_revision: true
  builtin_revision: 1
  operator_modified: true
  broadcast_decode: true
  corpus_eligible: false
  behavior_model_recipes: []
  storage_prefix: _capture-fuel-map
