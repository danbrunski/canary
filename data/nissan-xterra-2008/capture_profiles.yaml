  expected_total_demand_hz: 57.0
  capacity_evidence: 'Demand (preview_polling_plan, the live plan asked early): 5
    Mode 01 PIDs at 4 Hz, 5 at 2 Hz (fuel status, four trims) and 5 at 1 Hz, 3
    DIDs and 6 memory windows at 2 Hz: 53 channel reads/s, plus entry and exit
    every 0.5 s cycle (4 req/s): 57 req/s unbatched, 29 batched six PIDs to a
    request, against the 90 req/s budget. Cycle (hybrid_cycle.plan_cycle, the plan
    the loop reports as /status.obd_scheduler.did_profile.cycle.plan): 18 Mode
    01-side requests (15 PIDs and the three DTC polls) in 3 batches, 9 in-window
    requests and 2 session requests at 90 req/s plus the 0.05 s exit grace:
    required_seconds 0.2056 of the 0.5 s cycle; 0.3722 with batching refused.
    worst_case_seconds 1.2056 (1.3722 unbatched) is that plus one request
    timeout (1.0 s): one unanswered request makes a cycle of about 1.2 s and the
    boundaries it overruns are skipped, not burst. On the fake clock the loop
    reports that plan, every channel runs at its planned rate, a window takes
    0.11 s entry to exit, and the three cycles that held an unanswered DTC poll
    ran 1.18-1.21 s. Parent evidence: the tuning profile ran 62 req/s at the same
    budget and cycle on six drives (2026-09-21..23; DID 0x1208 to 0x1209 p50
    0.011 s on 09-23T142926). No capture of this profile exists yet; replace this
    text with the first one, and watch storage queue_depth (the 2026-07-29
    overload was the writer, not the bus).'
