  expected_total_demand_hz: 182.0
  capacity_evidence: '2026-08-04 bench: 658 DID reads/s. 12 DIDs x 15 Hz + ECM_COOLANT_TEMP
    and ECM_INTAKE_AIR_TEMP_1106 x 1 Hz = 182 reads/s. The 2026-09-10 H8 drive sustained
    116.8 req/s with 11 DIDs at 10.4 Hz each, 41 timeouts in 167,885 requests and
    0 bus errors, so the ECM is not the binding constraint; coolant''s 15 Hz share
    was simply wasted (0.2 % of its samples changed while it took 1/11 of the budget).
    The 184 req/s budget leaves two slots/s for session refresh and jitter.'
  required_tuple: []
  min_achieved_rate_hz: 12.0
  max_tuple_skew_s: null
