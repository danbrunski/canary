- name: tuning
  description: 'Engine tuning: fuelling (commanded vs measured, trims, injected pulse),
    spark, airflow and air-density context'
  notes: 'The one engine-tuning capture for this truck (2026-09-21). It replaces eight
    research profiles, each built to answer one question, whose answers are now in:
    fuel-target-research, fuel-pw-research, fuel-pw-research-2, injector-deadtime-idle,
    afr-delay-research, tuning-hybrid-research, fuel-did-research and rom-trace. Their
    definitions are kept verbatim in capture_profiles.archive.yaml, which nothing
    loads. Every capture also keeps its profile snapshot in its own manifest.


    Base: fuel-target-research, the configuration that ran cleanly on the 2026-09-21
    drive (data/analyses/2026-09-21-drive-fuel-target-research.md). Changes from it:

    - Adds STFT and LTFT for both banks at 2 Hz. Their absence on that drive left
    closed-loop health unassessable.

    - Adds bank-2 A/F voltage and injected pulse 0x1206/0x1207. 0x1206 passed as the
    injected-pulse instrument on 2026-09-18.

    - Drops DID 0x1134. It is not commanded phi, and the commanded target is now read
    directly from RAM (mem:ECM_TARGET_EQUIV_RATIO).


    Memory windows: fuel_target (commanded phi and engine period) and spark (ignition
    timing and engine speed). Each window is a single service-0x23 read, so the two
    values in it come from the same instant.


    Not included: rom-trace''s map-cell trace channels. That profile''s continuous
    session stalled on 2026-09-21 with zero requests sent, and the cause is not known
    yet. The trace channels come back once it is found.


    Mode 01 and Mode 22 alternate on this ECM, so each DID is read once per 0.5 s
    cycle, which gives 2 Hz.


    2026-10-04: adds throttle position (PID 0x11) at the commanded-phi rate. It is
    read in the same Mode 01 round as PID 0x44 and lambda, so every pull gives
    same-instant throttle for the Fuel Comp fit (N02): the ECM''s load byte
    0xFFFF118A is reconstructed from it. Without it the fit''s open-loop route had
    zero samples, because DID 0x120F is read on the Mode 22 cycle.'
  experimental: false
  mode01:
    RPM: 1.0
    THROTTLE_POS: 1.0
    MAF: 1.0
    COMMANDED_EQUIV_RATIO: 1.0
    O2_WR_LAMBDA_S1: 1.0
    FUEL_STATUS: 1.0
    ENGINE_LOAD: 1.0
    TIMING_ADVANCE: 1.0
    BAROMETRIC_PRESSURE: 0.25
    INTAKE_TEMP: 0.25
    COOLANT_TEMP: 0.25
    SHORT_FUEL_TRIM_1: 0.5
    SHORT_FUEL_TRIM_2: 0.5
    LONG_FUEL_TRIM_1: 0.5
    LONG_FUEL_TRIM_2: 0.5
  mode01_batch_groups: []
  mode22:
  - ECM_RPM
  - ECM_AF_SENSOR_V_B1
  - ECM_AF_SENSOR_V_B2
  - ECM_AIR_CHARGE
  - ECM_MAF_GPS
  - ECM_INJECTOR_PULSE_1
  - ECM_INJECTOR_PULSE_2
  - ECM_THROTTLE_POS_SENSOR_1
  mode22_rate_weights:
    ECM_RPM: 0.5
    ECM_AF_SENSOR_V_B1: 0.5
    ECM_AF_SENSOR_V_B2: 0.5
    ECM_AIR_CHARGE: 0.5
    ECM_MAF_GPS: 0.5
    ECM_INJECTOR_PULSE_1: 0.5
    ECM_INJECTOR_PULSE_2: 0.5
    ECM_THROTTLE_POS_SENSOR_1: 0.5
  memory:
