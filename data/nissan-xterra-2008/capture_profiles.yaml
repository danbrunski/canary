- name: fuel-map
  description: High-rate fueling and timing capture
  experimental: false
  mode01:
    RPM: 1.0
    ENGINE_LOAD: 1.0
    MAF: 1.0
    TIMING_ADVANCE: 1.0
    THROTTLE_POS: 1.0
    O2_WR_LAMBDA_S1: 1.0
    # O2_WR_LAMBDA_S2 (PID 0x25) is deliberately absent: it never answers on
    # this ECM. It sat in this profile until 2026-08-10 consuming a schedule
    # slot every round and returning nothing, while the fact was recorded in a
    # comment on the tuning-did profile 90 lines below. Bank-2 mixture comes
    # from the A/F voltage DIDs (0x1225/0x1226), not Mode 01.
    COMMANDED_EQUIV_RATIO: 1.0
    FUEL_STATUS: 1.0
    INTAKE_TEMP: 0.25
    SPEED: 0.25
    COOLANT_TEMP: 0.25
    SHORT_FUEL_TRIM_1: 0.25
    SHORT_FUEL_TRIM_2: 0.25
    LONG_FUEL_TRIM_1: 0.25
    LONG_FUEL_TRIM_2: 0.25
    EVAPORATIVE_PURGE: 0.25
  mode22: []
  mode01_enabled: true
  mode22_enabled: true
  did_interval_seconds: null
  round_timestamps: true
  target_rate_hz: 4.0
  did_continuous: false
  bus_budget_override: 20.0
  expected_total_demand_hz: 40.0
  capacity_evidence: '8 fast x 4 Hz + 8 context x 1 Hz = 40 channel-reads/s (one below
    the generic seed, which keeps bank-2 lambda), against 478/s measured batched on
    this ECM (2026-08-04). Budget held at 20 req/s, under the 24 req/s storage-sink
    line: batching packs 6 PIDs per request, so 40 reads/s needs ~7 req/s batched and
    40 unbatched. If batching is off the contract reports a shortfall rather than silently
    exceeding the sink''s known-safe rate.'
  required_tuple:
  - RPM
  - ENGINE_LOAD
  - FUEL_STATUS
  - COMMANDED_EQUIV_RATIO
  - O2_WR_LAMBDA_S1
  min_achieved_rate_hz: 3.0
  requires_tune_revision: true
  builtin_revision: 1
  # Diverged from the seed on purpose (bank-2 lambda removed above), so the
  # seed must not overwrite it. The generic profile keeps PID 0x25 because it
  # answers on other ECMs; that this one refuses it is a vehicle fact and
  # belongs here, not in shared code.
  operator_modified: true
  broadcast_decode: true
  corpus_eligible: false
  behavior_model_recipes: []
  storage_prefix: _capture-fuel-map
- name: tuning-did
  description: All-DID tuning capture (session held open)
  experimental: false
  mode01: {}
  mode22:
  - ECM_RPM
  - ECM_AF_SENSOR_V_B1
  - ECM_AF_SENSOR_V_B2
  - ECM_INJECTOR_PW_B1
  - ECM_INTAKE_CAM_ANGLE_MEASURED
  - ECM_INTAKE_CAM_ANGLE_COMMANDED
  - ECM_INTAKE_CAM_ANGLE_MEASURED_B
  - ECM_INTAKE_VVT_SOLENOID_DUTY
  - ECM_INTAKE_VVT_SOLENOID_DUTY_CANDIDATE_B2
  - ECM_THROTTLE_POS_SENSOR_1
  - ECM_COOLANT_TEMP
  mode01_enabled: false
  mode22_enabled: true
  did_interval_seconds: null
  round_timestamps: true
  target_rate_hz: 15.0
  did_continuous: true
  bus_budget_override: 180.0
  expected_total_demand_hz: 165.0
  capacity_evidence: 'Active transport is single-DID (`obd_did_batch_max_dids: 1`):
    11 DIDs x 15 Hz = 165 diagnostic requests/s fallback demand. 2026-08-04
    KOEO bench: a four-DID single-request rotation ran 8 s at 658 reads/s,
    zero failures, p50 1.09 ms. The 2026-08-07 25-minute drive achieved 14.93
    Hz/channel; its exact request/frame accounting predates C09 and remains
    unverified until C10.'
  required_tuple: []
  min_achieved_rate_hz: 12.0
  requires_tune_revision: true
  builtin_revision: 1
  operator_modified: false
  broadcast_decode: true
  corpus_eligible: false
  behavior_model_recipes:
  - injector_pw_vs_rpm_throttle_did
  - cam_primary_vs_command_rpm_did
  - cam_secondary_vs_command_rpm_did
  storage_prefix: _capture-tuning-did
- name: fuel-did-research
  # Purpose rewritten 2026-08-10. The original — "identify raw 0x1209 as the
  # Base Fuel Schedule candidate" — was retracted on 2026-08-08 when 0x1209
  # was identified as MAF against simultaneous UpRev rungs. BFS has now
  # survived a full passive-CAN sweep and an all-DID sweep, so the question is
  # no longer which field *is* BFS but whether it can be computed, and whether
  # injector PW can do BFS's job without reproducing its value.
  description: 'All-DID fuelling capture: derive Base Fuel Schedule from airflow
    and validate injector PW as the fuel-edit instrument'
  experimental: true
  mode01: {}
  mode22:
  - ECM_RPM
  - ECM_AF_SENSOR_V_B1
  - ECM_AF_SENSOR_V_B2
  - ECM_INJECTOR_PW_B1
  - ECM_THROTTLE_POS_SENSOR_1
  - ECM_INTAKE_AIR_TEMP
  - ECM_MAF_GPS
  mode01_enabled: false
  mode22_enabled: true
  did_interval_seconds: null
  round_timestamps: true
  target_rate_hz: 20.0
  did_continuous: true
  bus_budget_override: 160.0
  expected_total_demand_hz: 140.0
  capacity_evidence: 'Active transport is single-DID (`obd_did_batch_max_dids: 1`):
    7 DIDs x 20 Hz = 140 diagnostic requests/s fallback demand. Best-case three-DID
    batching would be 47 requests/s, but is not active or sustained-verified. 2026-08-04
    KOEO bench: a four-DID single-request rotation ran 8 s at 658 reads/s, zero failures,
    p50 1.09 ms. The old 2026-07-29 storage-loss incident (2491 dropped records at
    25 requests/s) is retained as history, not treated as a universal ceiling; C10 must
    reconcile persisted rows before this profile earns a non-experimental rate claim.'
  required_tuple:
  # BFS is a per-injection fuel time, so testing whether it can be derived needs
  # airflow and rpm co-observed (air mass per intake event = MAF x 20 / rpm on a
  # V6), IAT for the density correction that the g/s-only fit was missing, and
  # injector PW as the candidate substitute. Any one of them absent and the
  # capture cannot answer either question — which is what this tuple enforces.
  - ECM_RPM
  - ECM_MAF_GPS
  - ECM_INTAKE_AIR_TEMP
  - ECM_INJECTOR_PW_B1
  # 20 Hz requested; a floor of 15 leaves room for scheduling jitter while still
  # refusing the failure this exists to catch. Rungs are held ~10 s, so 15 Hz is
  # 150 samples per rung — far more than the fit needs. Range, not rate, is the
  # binding constraint on this experiment.
  min_achieved_rate_hz: 15.0
  # Injector PW and BFS both move with a fuel edit, so a capture whose
  # calibration is unrecorded cannot be compared with any other.
  requires_tune_revision: true
  builtin_revision: 0
  # Vehicle-specific research profile naming this ECM's DIDs; the generic seed
  # must never overwrite it.
  operator_modified: true
  broadcast_decode: true
  corpus_eligible: false
  behavior_model_recipes:
  - injector_pw_vs_rpm_throttle_did
  storage_prefix: _capture-fuel-did-research
- name: tuning-hybrid-research
  description: Experimental 4 Hz Mode 01 plus Mode 22 capture using the confirmed
    fast session exit
  experimental: true
  mode01:
    RPM: 1.0
    ENGINE_LOAD: 1.0
    MAF: 1.0
    TIMING_ADVANCE: 1.0
    INTAKE_TEMP: 1.0
    COMMANDED_EQUIV_RATIO: 1.0
    FUEL_STATUS: 1.0
    O2_WR_LAMBDA_S1: 1.0
  mode22:
  - ECM_RPM
  - ECM_AF_SENSOR_V_B1
  - ECM_AF_SENSOR_V_B2
  - ECM_INJECTOR_PW_B1
  - ECM_INTAKE_CAM_ANGLE_MEASURED
  - ECM_INTAKE_CAM_ANGLE_COMMANDED
  - ECM_INTAKE_CAM_ANGLE_MEASURED_B
  - ECM_THROTTLE_POS_SENSOR_1
  - ECM_MAF_GPS
  mode01_enabled: true
  mode22_enabled: true
  did_interval_seconds: 0.25
  # C04.3: the 4 Hz intent as a start-to-start cycle. did_interval_seconds is
  # an end-to-start gap and measured as a ~0.95 s cycle on the fake bus; it is
  # kept unchanged for readers of older sidecars and ignored while this is set.
  did_cycle_seconds: 0.25
  round_timestamps: true
  target_rate_hz: 4.0
  did_continuous: false
  bus_budget_override: 90.0
  expected_total_demand_hz: 68.0
  capacity_evidence: '2026-08-07 drive (25 min, _capture-tuning-hybrid-research-2026-08-07T170918):
    the fast exit works and Mode 01 survives a full drive, but delivered rate is far
    below target - Mode 01 1.46 Hz, DIDs 0.90 Hz, 18.25 aggregate channel reads/s
    against the 68 expected from 17 selected channels x 4 Hz. Treat target_rate_hz
    as aspirational and check achieved_hz_capture before trusting any rate-dependent
    conclusion. Mode 01 and Mode 22 alternate rather than sample together (0.341 s
    median separation), so restrict to steady state for cross-mode pairings.'
  required_tuple: []
  min_achieved_rate_hz: null
  requires_tune_revision: false
  builtin_revision: 0
  operator_modified: false
  broadcast_decode: true
  corpus_eligible: false
  behavior_model_recipes:
  - injector_pw_vs_rpm_throttle_did
  - cam_primary_vs_command_rpm_did
  - cam_secondary_vs_command_rpm_did
  storage_prefix: _capture-tuning-hybrid-research
