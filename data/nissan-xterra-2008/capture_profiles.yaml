  capacity_evidence: 'Demand: 7 Mode 01 PIDs x 4 Hz + 6 DIDs x 2 Hz = 40 channel reads/s,
    plus 2 session requests per 0.5 s cycle (~44 req/s unbatched) against the 90 req/s
    budget. Parent evidence, not yet this revision: tuning-hybrid-research on 2026-09-17
