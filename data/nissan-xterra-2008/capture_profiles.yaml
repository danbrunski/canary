- name: twin
  description: 'Engine twin scoring: every channel the twin runner pairs, in the round
    or 0x23 window it pairs them in'
  notes: 'E09.1 (2026-10-16). The channel list is not chosen here: it is
    ecu_application.twin_observation_channels over ecu_application_model.yaml plus
    the pairings the twin runner declares (twin_runner.BFS_CHANNEL_SETS, the
    target-phi definition''s gates and X relation, every fuel plant''s specs, the
    E07.4 case''s load_input). tests/test_twin_profile.py fails when the model
    gains an observation this profile lacks.


    Grouping. Every DID and memory window the twin pairs is read in every 0.5 s
    Mode 22 window, so the DIDs and windows one output needs always share one.
    Mode 01 values the kernels pair (rpm, MAF, throttle, lambda, PID 0x44) share
    one weight, so one round; fuel status, trims, baro, IAT, coolant, battery and
    purge are context, read as of a declared age.


    The fill byte and the pulse DID (E07.4, 0.1 s; operator 2026-10-13: do not
    widen it). A window reads its DIDs first and its memory reads last, back to
    back (B08.4), in the catalog''s window order: fuel_target, spark, fuel_axis,
    uprev_state, fuel_comp_x (the fill byte), flags_2841. So the gap is the reads
    in between: on the fake clock (tests/test_twin_profile.py, 10 ms answers)
    0.083 s on every pulse read, inside 0.1 s by more than one request slot
    (1/90 s). Each DID added to the window moves it a slot later: DID 0x1101
    (the coolant byte the timing trim lookup reads, a derived input since
    E09.1''s ignition timing, 2026-10-17) took it from 0.069 s to 0.083 s, and
    0x120F and 0x1110 as well would put it past the margin (0.102 s with all
    three before 0x1101 was derived). So 0x120F and 0x1110 are not in this
    profile: throttle is PID 0x11 and purge PID 0x2E (the Fuel Comp fit''s first
    purge source). The tuning profile still reads both.


    Mode 01 and Mode 22 are exclusive on this ECM: no Mode 01 read lands inside
    a session window, so a memory read is at least its distance to the window''s
    edges from any MAF read. The steady-BFS RAM channel set pairs obd:MAF within
    0.1 s of the 0x103A read (SteadyGates.max_maf_skew_s, frozen); on the fake
    clock, with 0x103A added, that read is 0.100 s from the nearest MAF, within a
    request slot of the limit, which decides nothing either way. On
    _capture-tuning-2026-09-23T142926 DID 0x1208 had obd:MAF within 0.1 s on 372
    of 3,089 reads. The set cannot be in this profile anyway: 0x103A is
    hypothesized.


    Awaited, though the derivation names them: ECM_AIR_CHARGE_SLOT_103A and
    ECM_UPREV_MAP_SELECTOR (hypothesized: 0x103A is one of three air-charge slots
    not yet told apart, and the selector read a constant 0 on all 196 reads of
    _capture-ram-study-2026-10-04T204557) and ECM_FUEL_TRANSIENT_FLAGS
    (hypothesized, never read). A memory channel enters a profile only once it
    is not hypothesized and carries live-read evidence
    (tests/test_memory_catalog_knock_lambda.py). Neither adds a window when it
    lands (0x103A widens the fuel_axis read, the selector the uprev_state read),
    so the fill byte stays at 0.083 s. Without 0x103A the X relation stage has
    no BFS word; target phi''s lookup has its X input (the X trace) and E07.4
    its fill byte.


    Ignition timing (E05.4 (b)/(c), 2026-10-17). The seven chain nodes are the
    twin of ignition_timing and the trim lookup of ignition_trim_selected, so
    the derivation names PID 0x0E, the timing byte''s cycle copy (spark
    window), DID 0x1101, the HI DET byte and the knock retard target (knock
    target window), all polled here, and sixteen chain words in eight new
    windows plus knock_chain, all hypothesized until a live read
    (tests/test_twin_profile.py AWAITING_LIVE_READ). They do not fit beside the
    fuel pairings: with all of them the session window is 0.25 s, the 4 Hz
    Mode 01 group runs at 1.96 Hz, DID 0x1208 to PID 0x0C reaches 0.298 s
    (limit 0.25) and the fill byte 0.093 s (inside 0.1 s by less than a slot),
    on the fake clock (test_the_awaited_timing_windows_do_not_fit_beside_the_fuel_pairings).
    When their live reads land they need a second, timing-only profile (E09.1
    Remaining).


    2026-11-11: the enrichment retard 0xFFFF174A was read on the truck (KOEO, an
    engine start, three full-pedal stabs in neutral: 0 on every read, its input
    byte 0xFFFF174B reproducing the Fuel Targets column in the same reply), so it
    left the awaited set and the accept test asks for it here: one 1-byte read of
    the timing_trim window, after the fill byte in window order, so the fill byte
    stays at 0.083 s. The window grows a request slot: BFS DID to Mode 01 rpm
    0.195 s (limit 0.25), pulse to rpm and MAF 0.184 s (0.3). The other fifteen
    chain words still wait, the two trim bytes of that window included (read that
    day, not checked against their tables).'
  experimental: true
