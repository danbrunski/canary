- name: ltft-gate
  description: 'LTFT learning-gate study: the tuning capture plus read-only RAM reads of the
    learn-gate bits, their inputs, the EVAP purge controller state and the learned-trim maps'
  notes: 'Built 2026-10-27 from the Ghidra trace of why long-term fuel trim reads 0.00 (D03
    trim relation). Everything in `tuning`, unchanged, plus service-0x23 reads of the gate:
    per-bank learn bits 0xFFFF1518/151A, the held condition 0xFFFF179C, the path inputs (idle
    flag 2834, tick 2881, A/F-diagnostic flags 28B6/28B8, accumulated-purge flag 28B9, purge
    state 2792, purge flow 38AA, purge accumulator 5224, rear-O2 sub-feedback 358B-358E, leak-test
    flag 4857, closed-loop bytes 26BA, after-start enrichment 1726) and the counters 1435,
    138A and 1686. Added for the purge question: EVAP vapor pressure (PID 0x32; on this ECM
    baro minus the sensor, so vacuum reads positive), fuel level (PID 0x2F) and the faster-filtered
    EVAP sensor word (DID 0x1116). The visit counts (0xFFFF52F5..5374) and learned maps (0xFFFF5460..555F)
    ride as 57-byte windows at the slowest weight. Their anchor channels decode one byte each;
    read the window from the stored payload. Reads only: no service here writes anything.
    A copy of `tuning`, so `tuning` itself is not edited.'
  experimental: false
  mode01:
    RPM: 1.0
    THROTTLE_POS: 1.0
    MAF: 1.0
    COMMANDED_EQUIV_RATIO: 1.0
    O2_WR_LAMBDA_S1: 1.0
    FUEL_STATUS: 1.0
