  capacity_evidence: 'Demand (preview_polling_plan, the live plan asked early): 6
    Mode 01 PIDs at 4 Hz (PID 0x0E since 2026-10-17), 5 at 2 Hz (fuel status,
    four trims) and 5 at 1 Hz, 4 DIDs and 8 memory windows at 2 Hz (timing_trim,
    the enrichment retard''s byte, since 2026-11-11): 63 channel reads/s, plus
    entry and exit every 0.5 s cycle (4 req/s): 67 req/s unbatched, 35 batched
    six PIDs to a request, against the 90 req/s budget.
    Cycle (hybrid_cycle.plan_cycle, the plan the loop reports as
    /status.obd_scheduler.did_profile.cycle.plan): 19 Mode 01-side requests (16
    PIDs and the three DTC polls) in 4 batches, 12 in-window requests and 2
    session requests at 90 req/s plus the 0.05 s exit grace: required_seconds
    0.25 of the 0.5 s cycle (0.2389 before timing_trim, 0.2056 before the timing
    channels); 0.4167 with batching refused (0.4056, 0.3722 before).
    worst_case_seconds 1.25 (1.4167
    unbatched) is that plus one request timeout (1.0 s): one unanswered request
    makes a cycle of about 1.2 s and the boundaries it overruns are skipped, not
    burst. On the fake clock the loop reports that plan, every channel runs at
    its planned rate, and a window takes 0.144-0.145 s entry to exit (0.133-0.135 s
    before timing_trim, 0.11 s before the timing channels). Before the timing channels the three cycles that held an
    unanswered DTC poll ran 1.18-1.21 s. Parent evidence: the tuning profile ran
    62 req/s at the same budget and cycle on six drives (2026-09-21..23; DID
    0x1208 to 0x1209 p50 0.011 s on 09-23T142926). 67 req/s is under the
    116.8 req/s the event loop sustained on the truck (2026-09-10), so the
    request rate is not the risk; the storage writer is: the 2026-07-29
    overload (records dropped at 25 req/s) was the writer, not the bus, and
    predates that measurement. No capture of this profile exists yet; replace
    this text with the first one and its storage queue_depth.'
