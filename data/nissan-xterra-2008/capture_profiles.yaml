- name: fuel-did-research
  description: 'All-DID fuelling capture: derive Base Fuel Schedule from airflow and
    validate injector PW as the fuel-edit instrument'
  notes: "Purpose rewritten 2026-08-10. The original \u2014 \"identify raw 0x1209\
    \ as the Base Fuel Schedule candidate\" \u2014 was retracted on 2026-08-08 when\
    \ 0x1209 was identified as MAF against simultaneous UpRev rungs. BFS has now survived\
    \ a full passive-CAN sweep and an all-DID sweep, so the question is no longer\
    \ which field *is* BFS but whether it can be computed, and whether injector PW\
    \ can do BFS's job without reproducing its value.\n\nBFS is a per-injection fuel\
    \ time, so testing whether it can be derived needs airflow and rpm co-observed\
    \ (air mass per intake event = MAF x 20 / rpm on a V6), IAT for the density correction\
    \ that the g/s-only fit was missing, and injector PW as the candidate substitute.\
    \ Any one of them absent and the capture cannot answer either question \u2014\
    \ which is what this tuple enforces.\n\n20 Hz requested; a floor of 15 leaves\
    \ room for scheduling jitter while still refusing the failure this exists to catch.\
    \ Rungs are held ~10 s, so 15 Hz is 150 samples per rung \u2014 far more than\
    \ the fit needs. Range, not rate, is the binding constraint on this experiment.\n\
    \nInjector PW and BFS both move with a fuel edit, so a capture whose calibration\
    \ is unrecorded cannot be compared with any other.\n\nVehicle-specific research\
    \ profile naming this ECM's DIDs; the generic seed must never overwrite it."
  experimental: true
  mode01: {}
  mode01_batch_groups: []
  mode22:
  - ECM_RPM
  - ECM_AF_SENSOR_V_B1
  - ECM_AF_SENSOR_V_B2
  - ECM_AIR_CHARGE
  - ECM_THROTTLE_POS_SENSOR_1
  - ECM_INTAKE_AIR_TEMP
  - ECM_MAF_GPS
  mode22_rate_weights: {}
  memory: []
  mode01_enabled: false
  mode22_enabled: true
  did_interval_seconds: null
  did_cycle_seconds: null
  round_timestamps: true
  target_rate_hz: 20.0
  did_continuous: true
  bus_budget_override: 160.0
  priority_channels: null
  expected_total_demand_hz: 140.0
  capacity_evidence: 'Active transport is single-DID (`obd_did_batch_max_dids: 1`):
    7 DIDs x 20 Hz = 140 diagnostic requests/s fallback demand. Best-case three-DID
    batching would be 47 requests/s, but is not active or sustained-verified. 2026-08-04
    KOEO bench: a four-DID single-request rotation ran 8 s at 658 reads/s, zero failures,
