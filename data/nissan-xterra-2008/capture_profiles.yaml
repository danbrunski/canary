  mode01_enabled: true
  mode22_enabled: true
  did_interval_seconds: null
  did_cycle_seconds: 0.5
  round_timestamps: true
  target_rate_hz: 4.0
  did_continuous: false
  bus_budget_override: 90.0
  priority_channels: null
  expected_total_demand_hz: 59.0
  capacity_evidence: 'Demand: 7 Mode 01 PIDs x 4 Hz + 4 trims x 2 Hz + 3 context PIDs
    x 1 Hz + 8 DIDs x 2 Hz = 55 channel reads/s, plus 2 session requests per 0.5 s
    cycle, about 59 req/s unbatched, against the 90 req/s budget. Worst-case cycle
    with batching off: (14 Mode 01 + 8 DID + 2 session) / 90 + 0.05 s grace = 0.32
    s of a 0.5 s cycle. Parent evidence: fuel-target-research on 2026-09-21 ran 20
    min at 4 Hz Mode 01 / 2 Hz per DID with memory windows. No capture of this exact
    revision exists yet; replace this text with the first one.'
  required_tuple: []
  min_achieved_rate_hz: null
  max_tuple_skew_s: null
  requires_tune_revision: true
