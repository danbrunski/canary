  capacity_evidence: 'Demand (preview_polling_plan, 2026-10-16): 8 Mode 01 PIDs planned
    at 4 Hz, fuel status and four trims at 2 Hz, 4 context PIDs at 1 Hz, 9 DIDs and
    the memory windows at 2 Hz: 75.5 channel reads/s, 79.5 req/s unbatched (44.5
    batched) against the 90 req/s budget. Cycle (hybrid_cycle.plan_cycle): 18
    in-window requests + 2 session requests + 0.05 s exit grace leave about 0.23 s
    of each 0.5 s cycle for Mode 01, so the 0.25 s round grid fits one full round
    per cycle: the 4 Hz PIDs are NOT held at 4 Hz. On the fake clock (90 req/s,
    10 ms answers) the core batch reads about 3.5 Hz and 0x44 / FUEL_STATUS 2.0 Hz;
    trims, context PIDs, DIDs and memory channels read their plan. Read achieved
    rates per channel off the capture, never the planned 4 Hz. Parent evidence:
    fuel-target-research on 2026-09-21 ran 20 min with memory windows. First
    capture of this revision: _capture-tuning-2026-10-26T010515 (2026-10-26, 512 s,
    warm idle and light load on the truck, median interarrival per channel): DIDs,
    memory windows, trims at 2.0 Hz (p95 0.54 s; trims to 0.98 s); context PIDs
    1.0 Hz; knock status 0.5 Hz; the 4 Hz batch 2.1-2.5 Hz (FUEL_STATUS, load,
    throttle 2.5; RPM, MAF, timing, lambda, 0x44 2.1; p95 0.6-0.65 s). 58 reads/s
    in all, 17 timeouts, no negative responses. capture_quality reports
    rate_shortfall for the 4 Hz batch: that is this plan, not a fault. 2026-11-11:
    the timing_trim window (3 bytes) joins every cycle, one more in-window request:
    77.5 channel reads/s, 81.5 req/s unbatched (46.5 batched) by preview_polling_plan.
    No capture with it yet; expect the 4 Hz batch a request slot (1/90 s) slower per
    cycle, and read the achieved rates off the first one.'
