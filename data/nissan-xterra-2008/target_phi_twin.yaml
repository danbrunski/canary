# E02 — the deterministic target-equivalence-ratio twin, as data.
#
# Schema: src/analysis/target_phi.py (TwinDefinition). The arithmetic is the
# shared kernel src/decode/ecm_lookup.py; nothing below is in code. Sources:
# docs/ecu-firmware-analysis.md ("Target AFR lookup, decoded", "Live
# verification: the 2026-10-04 drive", "Target AFR lookup to final command");
# docs/roadmap/ecu-second-brain.md ("First ECM twin slice").
#
# Every gate is derived from inputs and mode evidence, never from agreement
# with the command being tested. Thresholds marked `proposed` were set from
# engine behaviour before any scoring and are frozen for the October 4
# known-answer fixture (tests/fixtures/ground_truth/target_phi.yaml).
schema_version: 1
name: target_equiv_ratio

# Which ECM program this decode belongs to. A different calibration ID is a
# different program and refuses (wrong_program); an image of this program
# the decode was not checked on still resolves, by its own hash.
program:
  calibration_id: 1ZS44A00000
  verified_images:
    - sha256: a46baa248f16db8d5ed9854913e614dd7d77b7579bb6c36bddb792741531be50
      revision: ZS44A-20260920
  evidence: >-
    The lookup (0x0269AC), its axis searches (0x027114, 0x027194) and the
    bilinear interpolation (0x026F40/0x026F10) were decoded from the
    2026-10-04 flash read, sha256 a46baa24...be50, equal to the decoded
    ZS44A-Tuned-20260920.OsirisROM.

table:
  # rom_map.yaml `kind` of the slot table the ECM reads from its RAM copy
  # (0xFFFFB260 = slot copy 0xFFFFB040 + 0x220).
  rom_map_kind: fuel_targets
  rows:
    rom_map_axis: fuel_targets_rpm_axis
    input: rpm
    # The rpm search 0x027194 compares the word with axis byte x 4.
    compare_multiplier: 4
  columns:
    rom_map_axis: fuel_targets_bfs_axis
    input: load
    # The load search 0x027114 compares the byte with the axis byte directly.
    compare_multiplier: 1
  # The command word is Q14 phi; a cell is phi x 128 (AFR = 14.7 x 128 / raw,
  # rom_map.yaml), so the word is the cell shifted left by 7. The two
  # 2026-10-04 enrichment commands read 0x4A80 = 0x95 << 7.
  cell_to_word_shift: 7
  evidence: >-
    0x055DB2 passes the RAM copy 0xFFFFB260 with axes 0xCAA5 (rpm) and 0xC894
    (BFS) as constants to 0x0269AC; both searches clamp past either end with
    no fraction (docs/ecu-firmware-analysis.md, "Target AFR lookup, decoded").

inputs:
  load:
    channel: 'mem:ECM_FUEL_TARGET_MAP_X_TRACE'
    units: raw_counts
    bits: 8
    evidence: >-
      0xFFFF103E, the byte 0x055DB2 passes as the load input; stored as
      raw x 0.250859, so its catalog decode is undone before the lookup. The
      display scale is never compared with the raw BFS axis.
  rpm:
    channel: 'mem:ECM_ENGINE_SPEED_RAM'
    units: raw_counts
    bits: 16
    evidence: >-
      0xFFFF11D8 (base 0xFFFF11C4 + 0x14), 12.5 rpm per count; stored as rpm,
      so the catalog decode is undone to the word the search compares.
  forced_column_flag:
    channel: 'mem:ECM_PEDAL_ENRICH_FLAGS'
    units: raw_counts
    bits: 8
    bit: 0
    forces: last_column
    evidence: >-
      0x055DB2 replaces the load input with 0xFF while bit 0 of 0xFFFF2841 is
      set. The flag's own threshold and hysteresis (curve 0xCEDB) are not
      reconstructed: the measured bit is consumed as an input.

map_identity:
  magic:
    channel: 'mem:ECM_UPREV_MAGIC'
    valid: 0xAA5555AA
  active_map:
    channel: 'mem:ECM_ACTIVE_MAP'
    committed_min: 1
    committed_max: 5
  selector:
    channel: 'mem:ECM_UPREV_MAP_SELECTOR'
  # Active map 0 with selector 0 and valid magic: no slot has been committed
  # since UpRev's init copied slot 1, so slot 1 is the RAM copy's source.
  default_slot:
    active_map: 0
    selector: 0
    slot: 1
    evidence: >-
      UpRev init 0x0DE1A4 copies slot 1 without writing 0xFFFFB008; only the
      slot copy 0x0DE3E4 writes it, after a selector step. 0/0 on 196/196
      reads of the 2026-10-04 drive.
  # Identity reads must bracket a sample, both within this age, and agree.
  max_age_s: 10.0
  # E02.2's byte comparison of the live RAM table (0xFFFFB260, 64 bytes: two
  # 0x23 reads, the ECM caps one at 63) with the selected library slot.
  # Until it is recorded, no residual is qualified.
  ram_copy:
    status: unverified
    evidence: >-
      Not yet read. A battery-backed RAM copy could predate a reflash, so the
      default-slot rule alone does not prove the RAM table equals the
      image's slot 1. Vehicle required (E02.2).

reference:
  channel: 'mem:ECM_TARGET_EQUIV_RATIO'
  sentinel_channel: 'mem:ECM_TARGET_EQUIV_RATIO_SENTINEL'
  q_bits: 14

# What lies between the lookup and the commanded word, from the code. A
# prediction is of the lookup's command; until the path is verified it is not
# a final-command prediction and no residual is qualified.
final_command:
  status: unverified
  # 0x055E5C..0x055E9C: the lookup result reaches 0xFFFF174B only when it is
  # >= threshold (threshold - hysteresis while 0xFFFF2886 bit 3 is already
  # set); otherwise 0x80 is written. That bit is not captured, so a lookup
  # value inside the hysteresis band is ambiguous and refuses.
  enrichment_gate:
    floor_cell: 128
    threshold_cell: 130
    hysteresis_cells: 1
    rom_threshold_offset: 0x8B39
    rom_release_offset: 0x8B3D
  # 0x055E26..0x055E5A: while bit 6 of 0xFFFF283F is set the lookup's excess
  # over 128 is scaled by the 8-entry curve at 0xD247 (x/128). All 128 in
  # ZS44A-20260920, so the scaling is identity there; an image with any other
  # value refuses (unmodelled_logic).
  enrichment_scale_curve:
    rom_offset: 0xD247
    entries: 8
    identity_value: 128
  evidence: >-
    The final writer FUN_00055B5E forms the word from min(0xFFFF, w26F6 +
    w27DC) x w26C0 >> 14, then (on most paths) caps it at 0xFE00 and limits
    its step against w26CC, and writes 0 while 0xFFFF26B8 = 0x3F (fuel cut).
    w26C0 is the enrichment multiplier: FUN_00055DB2 writes it at 0x0568B4,
    choosing by the state byte 0xFFFF14C4 between 0x4000 (phi 1.0), a ramp
    against w26CE, and 0xFFFF174B << 7 (the gated lookup), capped at the
    latter. w26F6 = clamp(0x4000 + L[0xFFFF175C] + w26E8 + w1736) (0x05591C)
    and w27DC = a curve term clamped to 0..3768 (0x0559FA) are additive
    corrections that are not identified. So the final word equals the lookup
    word only when the state byte selects 0xFFFF174B and those corrections
    sum to zero; neither is captured, so the path stays unverified
    (docs/ecu-firmware-analysis.md, "Target AFR lookup to final command").
gates:
  # Acquisition-time pairing: every lookup input within this of the command
  # sample, and the whole tuple's spread within it too. Never carried forward.
  max_acquisition_skew_s: 0.25
  # Pairing needs per-reading acquisition stamps; a round stamp cannot carry
  # 250 ms.
  clock: acquired
  coolant:
    # First present source wins.
    sources: ['did:ECM_COOLANT_TEMP', 'obd:COOLANT_TEMP']
    min_c: 80.0
    max_age_s: 10.0
    status: proposed
  mode:
    channel: 'obd:FUEL_STATUS'
    # SAE J1979 PID 0x03 bank-1 states.
    states:
      1: open_loop_not_ready
      2: closed_loop
      4: open_loop_driving
      8: open_loop_fault
      16: closed_loop_fault
    eligible: [open_loop_driving]
    # Readings on both sides of a sample, each within this age, must agree.
    max_age_s: 5.0
    status: proposed
  steadiness:
    # Readings in [t - dwell_s, t] for each channel; span limits below.
    dwell_s: 2.0
    min_samples: 2
    channels:
      - channel: 'obd:RPM'
        max_span: 150.0
      - channel: 'obd:MAF'
        max_relative_span: 0.10
    status: proposed

# Where each branch may be scored, in raw lookup counts. Inside the table's
# axes only: a clamped edge is verified code, but no steady point has tested
# it. Proposed until E02.7 qualifies cells with evidence.
regions:
  ordinary:
    rpm_raw: [96, 416]    # 1,200-5,200 rpm, the table's rpm axis
    load_raw: [52, 128]   # the raw BFS axis 0x34-0x80
    status: proposed
  override:
    rpm_raw: [96, 416]
    status: proposed

# Independent check of the load input's formula: X = min(cap, floor(BFS x
# 2^shift / scaler)), the scaler read from the image (rom_map.yaml
# load_point_scaler), BFS the word in the same read.
x_formula:
  bfs_channel: 'mem:ECM_AIR_CHARGE_SLOT_103A'
  scaler_rom_map_table: load_point_scaler
  shift: 7
  cap: 255

# The memory windows (data/dids.yaml `window:`) the twin reads, checked
# against the catalog at evaluation (window_mismatch). The command and its
# three lookup inputs sit in four windows -- 0xFFFF26BE, 0xFFFF103E,
# 0xFFFF11D8 and 0xFFFF2841 are too far apart for one 63-byte read -- so a
# tuple exists only when a capture reads those windows consecutively. On
# 2026-10-04 the ram-study profile read them ~125 ms apart in sequence with
# other windows between, and no command sample had all three inputs within
# 250 ms. A 0x23 cycle is ~35 ms (the W08 backup recipe), so four back-to-back
# reads fit inside the skew.
acquisition:
  windows:
    fuel_target: ['mem:ECM_TARGET_EQUIV_RATIO']
    fuel_axis: ['mem:ECM_FUEL_TARGET_MAP_X_TRACE', 'mem:ECM_AIR_CHARGE_SLOT_103A']
    spark: ['mem:ECM_ENGINE_SPEED_RAM']
    flags_2841: ['mem:ECM_PEDAL_ENRICH_FLAGS']
    uprev_state: ['mem:ECM_UPREV_MAGIC', 'mem:ECM_ACTIVE_MAP', 'mem:ECM_UPREV_MAP_SELECTOR']
  back_to_back: [fuel_target, fuel_axis, spark, flags_2841]
  max_span_s: 0.25
  evidence: >-
    Window spacing measured on _capture-ram-study-2026-10-04T204557: per
    lookup input, the median nearest read to a command sample was over a
    second away (accounting.input_pairing in
    tests/fixtures/ground_truth/target_phi.yaml).
