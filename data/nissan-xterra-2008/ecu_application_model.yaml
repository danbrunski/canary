# E05.1 — the ECM application model and coverage manifest, as data.
#
# Schema: src/analysis/ecu_application.py (ApplicationModel). What each ECM
# output is computed from, traced backwards through its writers, the RAM
# state and flags they read, the ROM constants and tables, and the order the
# firmware runs them in; and, for each piece, whether the twin implements it,
# observes it, assumes it or does not model it yet.
#
# Behavioural contracts and citations only. The disassembly and decompiled
# output stay local (~/ecu-re/out, never committed); `function` and `span`
# below are addresses in the program identified under `program`, read from the
# 2026-10-04 listing and decompile text of image a46baa24...be50.
#
# confidence: `observed` = read from the code and agreeing with an independent
# observation; `code` = read from the code, not yet independently observed;
# `inferred` = strong evidence, not read through; `unknown`.
# twin: `implemented` (our code computes it), `observed` (a measured input:
# nothing upstream of it is needed), `assumed` (taken as true without a
# measurement), `not_modelled`, `calibration_dead` (unreachable while the
# node's calibration_conditions hold; checked on every image).
#
# An output with any unresolved dependency is conditional. Its `blockers`
# name every unresolved node on its path, and nothing else (the loader
# refuses a blocker that names a resolved node and an unresolved node that no
# blocker names). target_phi consumes these blockers; it does not restate them.
schema_version: 1
model_version: 5
name: ecm_application_model

program:
  id: nissan-1ZS44A-uprev-osiris
  # Informative only. The calibration ID lives in the reflashed calibration
  # block (0x8204), so it names a calibration family, never the program.
  calibration_id: 1ZS44A00000
  identity:
    # [start, end) spans hashed in order: boot and the application code.
    # UpRev flashes erase and write only 0x8000-0x1FFFF and 0xE0000-0xFFFFF
    # (flash capture uprev-flash-20261004, tune_revisions.yaml), so these
    # spans are the program; the full image hash names the calibration.
    regions:
      - [0x000000, 0x008000]
      - [0x020000, 0x0E0000]
    sha256: 9f35654659e4917dee19ef61378591d82d6640170fc3dfb3cac881bf65b3c9fd
    evidence: >-
      Computed 2026-10-04 over six local images: the ECU read a46baa24...be50,
      the decoded ZS44A-Tuned-20260920, -20261004 (5587f7e1...), k106
      (e01cc0cb...), Map1Change and UpRev's ROM Store base (82012080...). All
      six give this hash, so five distinct calibrations share one program.
  patch:
    name: uprev_map_switching
    markers:
      - offset: 0x055EC4
        bytes: ffffb260
        meaning: >-
          Nissan's Target AFR table pointer, redirected by UpRev to the RAM copy
          of the active map slot (0xFFFFB040 + 0x220). The calibration's own
          table at 0x00A169 is no longer referenced.
    evidence: >-
      docs/ecu-firmware-analysis.md, "UpRev's map switching". The patch code
      (0x0DE1A4, 0x0DE358, 0x0DE3E4) lies inside the hashed program spans.
  # The images sessions can run under: every entry is a tune_revisions.yaml
  # revision or reference image (a test pins this). Map1Change (3dc1f3d9...)
  # also hashes to this program but is excluded: it is a one-cell UpRev edit
  # made for the ROM-container research, never flashed and not in the
  # registry, so no session or library entry names it.
  images:
    - sha256: a46baa248f16db8d5ed9854913e614dd7d77b7579bb6c36bddb792741531be50
      revision: ZS44A-20260920
      role: decoded
    - sha256: 5587f7e1e6dbd0fcb9ffe0c857cc0cafebbe11bf306636c0f3265b903254d253
      revision: ZS44A-20261004
      role: program_checked
    # Checked 2026-11-11 on the decoded ZS44A-Tuned-20261110.OsirisROM: the
    # hashed spans give the program sha256 above (the build changed only 35
    # Fuel Comp cells and the two checksum words, all outside them).
    - sha256: dfe09508c9a3291794a31d4a24549b39798c19a32c67dccd1b513251855bf06a
      revision: ZS44A-20261110
      role: program_checked
    # Checked 2026-11-11 on the decoded ZS44A-Tuned-20261111.OsirisROM: the
    # program sha256 above (the build changed two Fuel Targets cells and the
    # low byte of each checksum word, all outside the hashed spans).
    - sha256: 2b42c6effb795edff69d49284f5a86d78de9340b9d1e7256fc4676f82d9ab412
      revision: ZS44A-20261111
      role: program_checked
    - sha256: e01cc0cb45d5beb879f82931be3054c79b7be3955220b3d93045deaabd23f18e
      revision: ZS44A-k106
      role: program_checked
    - sha256: 8201208033e0926b4f5f5d758f0f4efdfa2cef39e069d0dffae2d950683bc203
      revision: ZS44A-uprev-base
      role: program_checked

# Every RAM word or byte a node reads or writes, or an observation reads, with
# its integer type. One entry per address (the loader refuses a duplicate),
# and a node's arithmetic/branches text may cite only addresses in its own
# reads, writes or observations (tests/test_ecu_application_model.py).
# `confidence` is about the variable's meaning: `unknown` = traced as an
# operand, purpose not identified.
ram:
