outputs:
  - id: target_equiv_ratio
    ram: 0xFFFF26BE
    written_by: final_command_word
    units: q14_phi
    observed_as:
      - {spec: 'mem:ECM_TARGET_EQUIV_RATIO', address: 0xFFFF26BE, relation: identity}
      - spec: 'obd:COMMANDED_EQUIV_RATIO'
        address: 0xFFFF26BE
        relation: alias
        note: 'PID 0x44 reads the same word; agreement verifies the mapping, not the algorithm.'
    twin:
      definition: target_phi_twin.yaml
      # The node whose value the twin computes: the gated lookup, as a word.
      predicts: enrichment_gate
    # What must hold, per sample, for the gated lookup word to be the final
    # command. None is captured today.
    equals_output_when:
      - id: multiplier_is_lookup
        statement: '0xFFFF26C0 = 0xFFFF174B << 7 (states 4/5, or 2/3/6 after the ramp reached it; 0xFFFF2947 = 0)'
        settled_by: '0xFFFF26C0 in the 58-byte read from 0xFFFF26BE'
      - id: corrections_neutral
        statement: '0xFFFF26F6 = 0x4000 and 0xFFFF27DC = 0 (0xFFFF27DC is 0 whenever the multiplier is not 0x4000)'
        settled_by: '0xFFFF26F6 in the same read; 0xFFFF27DC in a second read'
      - id: cap_and_slew_not_binding
        statement: 'no cap at 0xFE00 and no 0x3FC0 slew step (both skipped while the pedal flag is set)'
        settled_by: 'last cycle''s word 0xFFFF26CC in the same read'
    blockers:
      - name: final_command_path_unverified
        nodes: [cycle_snapshot, enrichment_state_request, enrichment_state, enrichment_multiplier,
                correction_1736, correction_175c, correction_26e8, correction_sum, curve_term,
                final_command_word]
        closes_with: >-
          Implement the multiplier state machine and final writer, then verify
          per sample against a same-read 0xFFFF26BE..0xFFFF26F7 window plus
          0xFFFF27DC (E02.4 remaining 2), or observe those words directly and
          restrict the claim to samples where equals_output_when holds.
      - name: ram_copy_unverified
        nodes: [target_afr_ram_copy]
        closes_with: 'E02.2: read 0xFFFFB260 (63 + 1 bytes) and compare with the resolved slot.'
    regions:
      - id: enrichment_gate_band
        status: unevaluable
        when: 'gated lookup result 129 with the latch 0xFFFF2886 bit 3 not captured'
        nodes: [enrichment_gate]
      - id: multiplier_indeterminate
        status: unevaluable
        when: 'state 2, 3 or 6 with 0xFFFF2867 bit 7 clear and last multiplier below 0x4000 (the firmware reads an uninitialised stack word); unreachable while alternate_multiplier_writer is calibration-dead'
        nodes: [enrichment_multiplier]
      - id: cold_state_5
        status: conditional
        when: 'coolant byte below 115 (65 degC): state 5 takes the lookup word directly, but the corrections are not modelled'
        nodes: [enrichment_state_request, correction_sum]
        overrides: [cold_request_direct_enrichment]
      - id: fuel_cut_recovery
        status: conditional
        when: 'first cycles after fuel cut on the guarded path: slew-limited from 0 by 0x3FC0 per cycle'
        nodes: [final_command_word]
        overrides: [fuel_cut_recovery_slew]
      # E05.3 (d): each command override that has not qualified on the vehicle
      # holds its samples out here (the schema refuses one that no region names).
      - id: fuel_cut
        status: unevaluable
        when: '0xFFFF26B8 = 0x3F: the word is written 0, the twin''s sentinel; no lookup prediction applies'
        nodes: [final_command_word]
        overrides: [fuel_cut_zero_command]
      - id: closed_loop_hold
        status: conditional
        when: 'gated lookup 0x80 (cell below the gate): multiplier 0x4000, so the command is the correction sum plus the curve term, which applies only here and is not modelled'
        nodes: [enrichment_gate, enrichment_multiplier, curve_term]
        overrides: [closed_loop_phi_one, closed_loop_curve_term]
      - id: enrichment_ramp
        status: conditional
        when: 'states 2, 3 or 6 before 0xFFFF2867 bit 7 records the ramp reaching the lookup: the multiplier is the ramp, not the lookup'
        nodes: [enrichment_multiplier]
        overrides: [enrichment_ramp]
      - id: command_cap_and_slew
        status: conditional
        when: 'guarded path with a step above 0x3FC0 from last cycle''s word, or a word above 0xFE00: the output is the limiter''s'
        nodes: [final_command_word]
        overrides: [command_cap_and_slew]
      - id: coolant_correction
        status: conditional
        when: '0xFFFF26E8 non-zero (not read): the correction sum is not 0x4000'
        nodes: [correction_26e8]
        overrides: [coolant_correction_26e8]

  - id: ignition_timing
    ram: 0xFFFF11FF
    written_by: timing_final_byte
    units: deg_btdc_110_minus
    observed_as:
      - {spec: 'obd:TIMING_ADVANCE', address: 0xFFFF11FF, relation: identity}
      - spec: 'mem:ECM_IGNITION_TIMING_RAM'
        address: 0xFFFF11C7
        relation: alias
        note: 'The cycle-start copy of the same byte: agreement checks the mapping, not the chain.'
    # E09.1: the seven chain nodes (E09.7, each implemented_by its function in
    # src.analysis.ecu_state_models) are the twin; the final byte is what it
    # predicts. Evaluable, so twin_observation_channels derives the capture.
    twin:
      definition: src.analysis.ecu_state_models.timing_final_byte
      predicts: timing_final_byte
    blockers:
      - name: trim_ram_copy_unverified
        nodes: [timing_trim_ram_copy]
        closes_with: 'Read 0xFFFFB060 and 0xFFFFB160 (2 x 256 bytes, 0x23 windows) and compare with the resolved slot.'
      - name: high_det_latch_unobserved
        nodes: [high_det_latch]
        closes_with: 'Read 0xFFFF283F with the trim bytes (flags window from 0xFFFF283F).'
      - name: ignition_chain_unmodelled
        nodes: [knock_trim_difference]
        closes_with: >-
          The seven chain nodes are implemented (E09.7), each taking every
          unidentified word as a required argument, so the absolute needs those
          words (uncovered timing_final_chain) and the knock controller's
          0x04A8B6 branch. Then verify per segment against same-window reads of
          0xFFFF2793, 0xFFFF1A58, 0xFFFF27DA, 0xFFFF2332, 0xFFFF1346, 0xFFFF232E
          and 0xFFFF11FF (E05.4 (c)).
      # E09.7 part B: 0xFFFF27C6 and 0xFFFF279A are on the path; their
      # nodes read snapshot copies. (0xFFFF1B24 is observed: node timing_charge_word.)
      - name: timing_snapshot_steady
        nodes: [cycle_snapshot]
        closes_with: >-
          The 27C6 and 279A nodes read snapshot copies (0xFFFF10EB, 0xFFFF11CA,
          0xFFFF11CE, 0xFFFF1038); the simulator takes a steady state, where each
          copy equals its source (timing_term_27c6_steady, rpm_byte_11ce).
          Off steady state, read the copies.
    regions:
      - id: rate_limited
        status: conditional
        when: 'a step larger than +4 / -15 degrees per segment: the output is the limiter''s, not the sum''s'
        nodes: [timing_rate_limit]

  - id: ignition_trim_selected
    ram: 0xFFFF1777
    written_by: timing_trim_lookup
    units: trim_counts_7bit_plus_flag
    role: intermediate
    feeds: ignition_timing
    observed_as:
      - {spec: 'mem:ECM_TIMING_TRIM_SELECTED', address: 0xFFFF1777, relation: identity, confidence: code}
    twin:
      definition: src.analysis.ecu_state_models.selected_timing_trim
      predicts: timing_trim_lookup
    blockers:
      - name: trim_ram_copy_unverified
        nodes: [timing_trim_ram_copy]
        closes_with: 'Read 0xFFFFB060 and 0xFFFFB160 and compare with the resolved slot.'
      - name: high_det_latch_unobserved
        nodes: [high_det_latch]
        closes_with: 'Read 0xFFFF283F with 0xFFFF1777 and 0xFFFF177A.'
    regions:
      - id: coolant_blend_band
        status: unevaluable
        when: 'coolant byte 107..110 (57-60 degC): the blend''s divide rounding is unverified'
        nodes: [timing_trim_lookup]
      - id: high_det_unknown_warm
        status: unevaluable
        when: 'coolant byte above 110 with 0xFFFF283F bit 6 not read'
        nodes: [timing_trim_lookup, high_det_latch]

  # E05.2: BFS itself, predicted at steady state from the reported MAF word,
  # the rpm word, K and Fuel Comp (never from observed BFS or X). Conditional:
  # the airflow pipeline and the dynamic fill terms are references only.
  - id: base_fuel_schedule_word
    ram: 0xFFFF103A
    written_by: base_fuel_schedule
    units: raw_counts
    observed_as:
      - {spec: 'mem:ECM_AIR_CHARGE_SLOT_103A', address: 0xFFFF103A, relation: identity}
      - spec: 'did:ECM_AIR_CHARGE'
        address: 0xFFFF103A
        relation: alias
        note: 'DID 0x1208 reads the same word; agreement verifies the mapping, not the chain.'
    twin:
      definition: src.analysis.air_charge_twin.predict_steady_bfs
      predicts: base_fuel_schedule
    blockers:
      - name: air_charge_ram_copy_unverified
        nodes: [air_charge_ram_copy]
        closes_with: >-
          Read 0xFFFFB6A0-0xFFFFB7A3 (260 bytes, five 0x23 windows) and
          compare with the resolved slot's +0x660-+0x763 bytes.
      - name: airflow_unmodelled
        nodes: [airflow_qa]
        closes_with: >-
          The pipeline is decoded (airflow_qa) but stateful: read 0xFFFF2100 (4
          bytes) in the BFS window per sample, or carry 0xFFFF20A8, 0xFFFF20AC
          and the lead-path state with 0xFFFF273E. Until then BFS is predicted
          only where the steady-state equality holds (SteadyGates).
      - name: fill_byte_not_computed
        nodes: [fuel_comp_load_byte]
        closes_with: >-
          Feed 0xFFFF118A from src.decode.fuel_comp_load with idle air and
          purge known, or observe mem:ECM_FUEL_COMP_X_INPUT in the BFS window;
          until then Fuel Comp is the rpm row band's range.
      - name: fill_dynamics_reference_only
        nodes: [fill_coefficient, manifold_fill_filter, near_wot_flag, fill_transient, fill_blend]
        closes_with: >-
          Score the per-run references (fill_coefficient, fill_filter_step,
          near_wot_next, fill_transient, fill_blend, bfs_word) against one
          0x23 window set holding 0xFFFF2100, 0xFFFF2110, 0xFFFF225A,
          0xFFFF105C, 0xFFFF1178, 0xFFFF20A4..0xFFFF20A7, 0xFFFF20B4..0xFFFF20B7,
          0xFFFF105A, 0xFFFF103A, 0xFFFF283C and 0xFFFF289B through throttle
          steps.
    regions:
      - id: not_steady
        status: unevaluable
        when: 'inputs not held within SteadyGates (MAF word +-2 %, rpm word +-1 % over +-1 s): the filter, transient and airflow filter states are not observed'
        nodes: [airflow_qa, manifold_fill_filter, fill_transient]
        overrides: [bfs_fill_transient]
      - id: cranking
        status: unevaluable
        when: '0xFFFF2C91 = 0, or 0xFFFF4786 bit 7 with 0xFFFF4A2D non-zero, or bit 6 with 0xFFFF2C91 < 0x20: Tp from the coolant curve 0xEEBA. No channel reads these flags: the steady-state evaluator assumes a sample is outside this region (and outside maf_fault and fill_subtracting_form) and counts each scored sample under regions_assumed'
        nodes: [air_charge_tp]
        overrides: [cranking_tp]
      - id: maf_fault
        status: unevaluable
        when: '0xFFFF2824 bit 7: BFS from table 0x95E5'
        nodes: [base_fuel_schedule]
      - id: fill_subtracting_form
        status: unevaluable
        when: '0xFFFF289C bit 5 set (writer not traced)'
        nodes: [manifold_fill_filter]
      - id: fuel_comp_band
        status: conditional
        when: '0xFFFF118A not read with the sample: Fuel Comp is the exact range over every load byte at that rpm (interval, not a point)'
        nodes: [fuel_comp_lookup, fuel_comp_load_byte]

# Logic the trace reached and did not resolve, model-wide.
uncovered:
  - id: pedal_flag_inputs
    where: '0xFFFF1A64 (target throttle area), the input of 0xFFFF2D28 -> 0xFFFF3CDC; its writer is not traced'
    blocks: 'predicting 0xFFFF2841 bit 0 from sensors instead of from a read of 0xFFFF3CDC (E05.3)'
    next_evidence: >-
      Trace the writer of 0xFFFF1A64. Capture 0xFFFF3CDC with the flags
      window (0xFFFF2841) in one window set through pedal crossings near
      78 % requested opening, plus 0xFFFF2D28 and 0xFFFF1A64.
  - id: multiplier_hold_counter
    where: '0xFFFF2947 (set to 2 at init and while 0xFFFF2BA9 < 0x20); its decrement was not found'
    blocks: 'knowing when the multiplier is forced to 0x4000'
    next_evidence: 'Find the countdown (likely an indexed timer table); identify 0xFFFF2BA9.'
  - id: enrichment_flags
    where: '0xFFFF26B9 bits 0/1, 0xFFFF1796 bits 0/1, 0xFFFF135F bits 0/1, 0xFFFF2A90, 0xFFFF2833 bit 4, 0xFFFF10C5'
    blocks: 'gating of the three corrections and the curve term'
    next_evidence: 'Trace each writer; read them in the fuel window alongside the corrections.'
  - id: correction_inputs
    where: '0xFFFF1114, 0xFFFF10C6, 0xFFFF2D10/2D14, w1762/w1726/w14DA (0xFFFF1077 is now identified: the rescaled coolant byte, node coolant_rescale)'
    blocks: 'computing 0xFFFF26F6 and 0xFFFF27DC'
    next_evidence: 'Trace writers; until then observe 0xFFFF26F6 and 0xFFFF27DC directly.'
  - id: other_174b_readers
    where: '0x04CAF4 and 0x066028 read 0xFFFF174B'
    blocks: 'nothing in this output; other consumers of the gated lookup'
    next_evidence: 'Follow both readers.'
  - id: fuel_comp_fill_terms
    where: 'History values of 0x03C3A4 inputs w63FC (idle air learning) and w139E (purge); the structure, the sensor-B substitution (0xFFFF28B5 bits 7:6 from 0x072528 on the TPS items) and the limp-home branch (0xFFFF484E bit 2) are traced'
    blocks: 'computing 0xFFFF118A, hence Fuel Comp, without a read of it (base_fuel_schedule_word blocker fill_byte_not_computed)'
    next_evidence: 'Read 0xFFFF63FC and 0xFFFF139E with 0xFFFF118A; N02.2 reconstructs the byte as an interval meanwhile. The absolute area units stay open (desk: no second program or calibration pins them).'
  - id: airflow_pipeline
    where: 'Decoded but stateful (airflow_qa): the lead-path state (w20B8, w20C0, w20C4, w20EC), the hot-wire term (w4054) and the purge controller''s learned vapour limit behind w273E'
    blocks: 'predicting BFS off steady state (base_fuel_schedule_word blocker airflow_unmodelled)'
    next_evidence: 'Not settleable at the desk: the state is per drive. Vehicle: read 0xFFFF2100, 0xFFFF1056, 0xFFFF20A8, 0xFFFF20AC and 0xFFFF273E in one window through throttle steps and purge on/off.'
  - id: air_charge_branch_state
    where: 'Settled: 0xFFFF283B bit 6 (0x03B994), 0xFFFF2C91 (0x03F048), 0xFFFF4786 bits 7 and 6 (0x0398DE, 0x0394D6, 0x039904), the dispatch periods (ISR 0x02040C). Open: 0xFFFF289C bit 5 (no writer found; absence of a computed-pointer write is not provable statically), and Pphi (inferred 20 MHz)'
    blocks: 'evaluating BFS during start and in the subtracting filter form; the absolute tick'
    next_evidence: 'Vehicle: read 0xFFFF289C, 0xFFFF4786, 0xFFFF2C91 and 0xFFFF283B..0xFFFF283C with BFS at key-on and crank, and time 0xFFFF84B9-paced counters against acquisition time to confirm the 1.024 ms tick.'
  - id: timing_final_chain
    where: >-
      Ignition terms the chain reads whose values no node computes (the chain
      nodes take each as a required argument, E09.7). 0xFFFF27C6 and
      0xFFFF279A are no longer among them: 27C6 is computed (nodes
      coolant_rescale .. timing_term_27c6) and 279A's inputs are identified
      (timing_term_279a; 0 on a warm engine). Still unidentified:
      0xFFFF11CB: its source 0xFFFF2BD0 is now known (the cycle copy of the
      intake temperature byte 0xFFFF2CB8, IAT + 50 [inferred]), but no node
      writes 11CB, 0xFFFF27C4 or 0xFFFF1203, the 0x04E5B0 slew (+/-5 per
      segment) is unmodelled, and 0xFFFF1766's gating flags (0xFFFF287A bit 7,
      0xFFFF2887 bit 2, 0xFFFF2876 bit 4, 0xFFFF4806 bit 1, fault item 0x11A)
      are unidentified;
      inside 27C6, 0xFFFF26E8 and the 0xFFFF175C / 0xFFFF1736 corrections in
      0xFFFF26F6, and how 0xFFFF26C0 depends on the Target AFR column (so
      0xFFFF1B24 is read, not predicted, off phi 1); the 279A ramps 0xFFFF1300
      and 0xFFFF15E5 and its 0xFFFF17FA input (w1760/w1762); 0xFFFF174A,
      0xFFFF1D3E, 0xFFFF1344, 0xFFFF2334, 0xFFFF272A, 0xFFFF62B4, 0xFFFF1215,
      0xFFFF9932; the flags 0xFFFF2833 bit 4, 0xFFFF4785 bit 6, 0xFFFF28B4
      bit 1, 0xFFFF28B1 bit 5, 0xFFFF4858 bit 5 and the 0x08E498 fault test;
      the knock control's 0x04A8B6 branch. 0xFFFF134A is settled: 0 on every
      listed image (curves 0xCC63/0xCC73). The 27C6/279A nodes are on
      ignition_timing's path (E09.7 part B): the simulator computes 27C6 per
      ROM with 0xFFFF1B24 swept over a band, and holds 279A only where it is
      not provably 0.
    blocks: 'the absolute ignition_timing (E05.4); a trim edit''s change is computed with these held equal (E09.7); an X change''s base-term part is now computable from the nodes, the rest is not'
    next_evidence: >-
      The firmware part is done. Vehicle: read 0xFFFF15DA..0xFFFF15DE,
      0xFFFF17C6, 0xFFFF19CB, 0xFFFF1B24 and 0xFFFF10EB with 0xFFFF27C6 and
      0xFFFF1A58 in one window set (0x23) at hot idle and at a steady cruise,
      and check timing_term_27c6_chain against each read (E05.4 (c)).
  - id: enrichment_tick_rate
    where: '0xFFFF84C3 bit 7 (the tick every enrichment timer steps on) and the 0x020EF2 cycle period'
    blocks: 'predicting enrichment transition timing (E05.3); a measured requirement, never fitted'
    next_evidence: 'Same-window reads of 0xFFFF1742..0xFFFF1749 and 0xFFFF14C4/0xFFFF14C5 while a request is held.'
  - id: slot_0x260_map
    where: 'slot +0x260 (RAM 0xFFFFB2A0), >= 21 readers through 0x026B14'
    blocks: 'any output it feeds; not identified'
    next_evidence: 'Identify a reader and an independently observed quantity.'
  # E05.3 (d): what the override trace reached and did not resolve.
  - id: closed_loop_enable
    where: >-
      What starts, freezes and resets the STFT controller 0x05E368 (cells,
      coolant, time after start or fuel cut). In the fuel task the gate writes
      phi 1.0 (0x80) for every lookup below cal 0x8B39 (130), lean cells
      included, so UpRev's "closed loop only where the cell is exactly 14.7"
      is not the gate; it would have to be this enable.
    blocks: 'knowing where the feedback trims run (closed_loop_feedback_stft) and so which samples carry feedback'
    next_evidence: >-
      Desk: trace the enable of 0x05E368 and the writer that holds
      0xFFFF26B4/0xFFFF26B6 at 0x6400 (both read exactly 0x6400 on all 21
      fuel-cut reads of the 2026-10-04 slice, against 13 and 12 of 153
      outside cut). Vehicle: read 0xFFFF26B4, 0xFFFF4722 and 0xFFFF46B2 in
      one window at warm cruise in a 14.7 cell and in an enriching cell.
  - id: fuel_cut_paths
    where: >-
      The writer of 0xFFFF26B8 and its place in the cycle; the routines and
      RAM of the stationary cut and the item-0x30 limp cut; what the rev
      limiter 0x04F768 writes; the decel-cut trigger (the BFS decel-cut
      curves are all zero, so the cut while moving is not BFS-based).
    blocks: >-
      predicting fuel cut instead of reading 0xFFFF26B8, and the
      fuel_cut_recovery_slew limit (it holds only if 0xFFFF26B8 is cleared
      after the fuel task in the cycle)
    next_evidence: 'Desk, with the listing (~/ecu-re, not on every machine): find every store to 0xFFFF26B8 and its task-table entry.'
  - id: cold_fuel_comp_table
    where: >-
      UpRev documents a Cold Fuel Comp table used below 70 degC. The traced
      Fuel Comp lookup (0x03CC3C, 0x03D06E-0x03D100) reads only the slot
      table at 0xFFFFB6A0 and has no coolant branch in that span.
    blocks: 'warm-up BFS below 70 degC (base_fuel_schedule_word); a warm-up override may be missing from overrides'
    next_evidence: 'Desk: locate the cold table in the calibration block and find its readers.'

# E05.3 (d): command overrides by regime, each a traced condition -> effect
# with how it was established and how far it has been checked. Consolidated
# 2026-10-13 from the 2026-10-04/05 listing and decompiler passes recorded in
# this file's nodes and docs/ecu-firmware-analysis.md; the listing itself was
# not re-read for this entry (it lives in ~/ecu-re, not on the machine that
# made it). `qualification`: traced = read from the code only; fixture =
# condition and effect read together in a committed real capture
# (`qualified_by` names the test); vehicle = the same on a held-out drive. The
# schema refuses an override above traced without `qualified_by`, an inferred
# trace that claims to qualify, and an override on an output that is not
# vehicle-qualified unless one of that output's regions holds it out.
overrides:
  # -- start
  - id: cranking_tp
    regime: start
    acts_on: [base_fuel_schedule_word]
    nodes: [air_charge_tp]
    routine: 0x03C62C
    span: [0x03C646, 0x03C7AA]
    condition: '0xFFFF2C91 = 0, or 0xFFFF4786 bit 7 with 0xFFFF4A2D non-zero, or 0xFFFF4786 bit 6 with 0xFFFF2C91 < 0x20'
    effect: 'Tp is the coolant curve 0xEEBA instead of K x airflow / N: 0xFFFF2114 = the curve at 0xFFFF1081 << 8, 0xFFFF2110 = it >> 2'
    reads: [0xFFFF2C91, 0xFFFF4786, 0xFFFF4A2D, 0xFFFF1081]
    writes: [0xFFFF2114, 0xFFFF2110]
    established_by: listing
    confidence: code
    evidence:
      - 'listing 0x03C646-0x03C7AA (node air_charge_tp, E05.2)'
      - 'docs/ecu-firmware-analysis.md "BFS formation, traced (E05.2)"'
    qualification: traced
    gaps:
      - 'curve 0xEEBA is not decoded to units and is not a rom_map table'
      - 'the coolant meaning of 0xFFFF1081 is inferred from the curve'
    verify_with: 'E05.2 remaining (d): read 0xFFFF4786, 0xFFFF2C91, 0xFFFF4A2D and 0xFFFF283B with BFS through key-on and crank.'

  # -- warm-up
  - id: cold_request_direct_enrichment
    regime: warm_up
    acts_on: [target_equiv_ratio]
    nodes: [enrichment_state_request, enrichment_state, enrichment_multiplier]
    routine: 0x055DB2
    span: [0x055EF0, 0x0568B4]
    condition: 'coolant snapshot 0xFFFF1079 below cal 0x8C98 (0x73 = 115, 65 degC), +3 while the warm latch 0xFFFF288A bit 6 is set'
    effect: >-
      Request 0xFFFF14C5 = 8, which commits 0xFFFF14C4 = 5. State 5 takes
      the gated lookup word 0xFFFF174B << 7 as the multiplier 0xFFFF26C0
      directly, with no rpm bands, timers or ramp, unless the hold
      (0xFFFF2947 non-zero or 0xFFFF2BA9 < 0x20) forces 0x4000.
    reads: [0xFFFF1079, 0xFFFF288A, 0xFFFF174B, 0xFFFF2947, 0xFFFF2BA9]
    writes: [0xFFFF14C5, 0xFFFF14C4, 0xFFFF26C0, 0xFFFF288A]
    rom:
      - {offset: 0x8C98, width: 8, value: 0x73, role: 'warm latch threshold'}
    established_by: listing
    confidence: code
    evidence:
      - 'listing 0x055EF0-0x056050 (request), 0x056050-0x0566BC (8 -> 5), 0x0566BE-0x0568B4 (states 4 and 5 take the lookup word)'
      - 'reference models src.analysis.ecu_state_models.enrichment_request / enrichment_commit (synthetic only)'
    qualification: traced
    gaps:
      - 'the coolant meaning of 0xFFFF1083 / 0xFFFF1079 is inferred from the DID 0x1101 pointer table'
      - 'the hold counter''s decrement is not found (uncovered multiplier_hold_counter)'
    verify_with: >-
      Cold start: read 0xFFFF1079, 0xFFFF14C4, 0xFFFF14C5 and 0xFFFF174B
      with the catalog's fuel_target window, all four members selected (57
      bytes from 0xFFFF26AE, which carries 0xFFFF26C0) from key-on through 65 degC with an enriching
      cell. Expect state 5 and multiplier = 0xFFFF174B << 7 below 115.

  - id: coolant_correction_26e8
    regime: warm_up
    acts_on: [target_equiv_ratio]
    nodes: [correction_26e8]
    routine: 0x055386
    condition: >-
      The second term runs under the gates that zero correction_175c
      (0xFFFF26B9 bit 0 or 1, 0xFFFF2867 bit 6, or 0xFFFF1796 bits with
      0xFFFF26C0 above 0x4000); when it starts it latches the coolant byte
      0xFFFF1079 into 0xFFFF1794.
    effect: >-
      0xFFFF26E8, added into the correction sum, gains map 0xA0D9 at rpm and
      load scaled by 0xFFFF1770 (the coolant byte relative to its value at
      the start), 0xFFFF1764 and 0xFFFF1E55; its first term is a map of
      0xFFFF11CF by curves of 0xFFFF1077, times 0xFFFF10C6.
    reads: [0xFFFF26B9, 0xFFFF2867, 0xFFFF1796, 0xFFFF26C0, 0xFFFF1079, 0xFFFF1794, 0xFFFF1764,
            0xFFFF1E55, 0xFFFF11CF, 0xFFFF1077, 0xFFFF10C6]
    writes: [0xFFFF26E8, 0xFFFF1770, 0xFFFF1794]
    established_by: decompile_text
    confidence: code
    evidence:
      - 'decompile text FUN_00055386 (node correction_26e8)'
      - 'docs/ecu-firmware-analysis.md "Injector pulse chain": coolant and after-start enrichment live inside phi (the 0xFFFF26F6 terms and the cold state)'
    qualification: traced
    consistent_with:
      - '0xFFFF26B9 read 0x03 (bits 0 and 1 set, so the second term''s gate open) on 173 of 174 command reads of the 2026-10-04 slice, while the command read exactly 0x4000 on 149 of 153: the term was zero or cancelled there. Its factors were not read (tests/test_ecu_overrides.py::test_the_correction_gate_byte_is_set_on_almost_every_october_4_read).'
    gaps:
      - 'that this is the coolant / after-start enrichment is inferred: the firmware notes place that enrichment in the correction terms without assigning it to one'
      - '0xFFFF10C6, 0xFFFF1764 and 0xFFFF1E55 are unidentified (uncovered correction_inputs); 0xFFFF1077 is the rescaled coolant byte (node coolant_rescale, 2026-10-17)'
      - 'decompile text only, not line-checked against the listing'
    verify_with: 'Cold start: read 0xFFFF26E8, 0xFFFF1770, 0xFFFF1794, 0xFFFF1079 and the gate bytes 0xFFFF26B9, 0xFFFF2867, 0xFFFF1796 from key-on through warm-up.'

  # -- closed loop
  - id: closed_loop_phi_one
    regime: closed_loop
    acts_on: [target_equiv_ratio]
    nodes: [enrichment_gate, enrichment_state_request, enrichment_multiplier]
    routine: 0x055DB2
    span: [0x055E5C, 0x0568B4]
