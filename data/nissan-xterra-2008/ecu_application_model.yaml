  - {address: 0xFFFF2849, width: 8, signed: false, name: fuel_flags_2849, units: flags, confidence: unknown,
     meaning: 'Bit 0 compared with 0xFFFF2845 bit 0 by the final writer.'}
  - {address: 0xFFFF283F, width: 8, signed: false, name: fuel_flags_283f, units: flags, confidence: inferred,
     meaning: 'Bit 6: the knock-control latch UpRev logs as "HI DET" (name inferred). Enables the enrichment excess scaling and selects timing trim B. Gate (firmware notes 2026-10-17): 2876 bit 6 is set by the knock task on its first pass, so the gate is effectively 4782 bit 5 clear; 4782 bit 5 is the cycle copy of 4783 bit 5, written only by the engine state machine 0x027CC4 (set in state 1, the run-down after a stop [inferred]; cleared in states 2-4). HI DET is cleared at each engine stop and held clear until the next start, then the KS fault (479D bit 7) sets it again on the first pass.'}
  - {address: 0xFFFF2886, width: 8, signed: false, name: fuel_flags_2886, units: flags, confidence: code,
