  - {address: 0xFFFF174B, width: 8, signed: false, name: gated_lookup_cell, units: phi_x128, confidence: code,
     meaning: 'Target AFR lookup after the enrichment gate: the cell, or 0x80 below the gate.'}
  - {address: 0xFFFF14C4, width: 8, signed: false, name: enrichment_state, units: enum, confidence: code,
