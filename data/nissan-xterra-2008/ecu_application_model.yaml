  - id: correction_1736
    function: 0x0556EC
    kind: computation
    writes: [0xFFFF1736, 0xFFFF1738, 0xFFFF1739, 0xFFFF2875, 0xFFFF2866]
    reads: [0xFFFF11CF, 0xFFFF1114, 0xFFFF2833, 0xFFFF2875, 0xFFFF1077, 0xFFFF103E, 0xFFFF11CA,
