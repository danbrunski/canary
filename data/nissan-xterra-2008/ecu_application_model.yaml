  - {address: 0xFFFF26BE, width: 16, signed: false, name: command_word, units: q14_phi, confidence: observed,
     meaning: 'Final commanded equivalence ratio, phi x 16384. Same word as Mode 01 PID 0x44.'}
  - {address: 0xFFFF1B2E, width: 16, signed: false, name: command_word_before_cut, units: q14_phi, confidence: code,
     meaning: 'Copy of the word before the fuel-cut zero is applied.'}
  - {address: 0xFFFF26C0, width: 16, signed: false, name: enrichment_multiplier, units: q14_phi, confidence: code,
     meaning: 'Multiplier applied to the correction sum; 0x4000 is 1.0.'}
  - {address: 0xFFFF26CC, width: 16, signed: false, name: previous_command_word, units: q14_phi, confidence: code,
     meaning: 'Last cycle''s command word (cycle-start copy).'}
  - {address: 0xFFFF26CE, width: 16, signed: false, name: previous_enrichment_multiplier, units: q14_phi, confidence: code,
     meaning: 'Last cycle''s multiplier (cycle-start copy).'}
  - {address: 0xFFFF26F6, width: 16, signed: false, name: correction_sum, units: q14_phi, confidence: code,
     meaning: 'clamp(0x4000 + the three corrections, 0, 0xFFFF).'}
  - {address: 0xFFFF27DC, width: 16, signed: false, name: curve_term, units: q14_phi, confidence: code,
     meaning: 'Additive term, 0..3768; zero unless the multiplier is exactly 0x4000.'}
  - {address: 0xFFFF175C, width: 32, signed: true, name: correction_175c, units: q14_phi, confidence: unknown,
     meaning: 'Signed additive correction; purpose not identified.'}
  - {address: 0xFFFF26E8, width: 16, signed: false, name: correction_26e8, units: q14_phi, confidence: unknown,
     meaning: 'Non-negative additive correction; purpose not identified.'}
  - {address: 0xFFFF1736, width: 16, signed: false, name: correction_1736, units: q14_phi, confidence: unknown,
     meaning: 'Non-negative additive enrichment; purpose not identified.'}
  - {address: 0xFFFF1724, width: 16, signed: false, name: command_floor, units: q14_phi, confidence: code,
     meaning: 'Lower bound on the command; written 0 every cycle in this calibration.'}
  - {address: 0xFFFF174B, width: 8, signed: false, name: gated_lookup_cell, units: phi_x128, confidence: code,
     meaning: 'Target AFR lookup after the enrichment gate: the cell, or 0x80 below the gate.'}
  - {address: 0xFFFF14C4, width: 8, signed: false, name: enrichment_state, units: enum, confidence: code,
     meaning: 'Committed enrichment state, 1..6.'}
  - {address: 0xFFFF14C5, width: 8, signed: false, name: enrichment_state_request, units: enum, confidence: code,
     meaning: 'Requested enrichment state, 1..8.'}
  - {address: 0xFFFF1742, width: 16, signed: false, name: enrichment_timer_1742, units: raw_counts, confidence: code,
     meaning: 'Enrichment state timer (tick-stepped).'}
  - {address: 0xFFFF1744, width: 16, signed: false, name: enrichment_timer_1744, units: raw_counts, confidence: code,
     meaning: 'Enrichment state timer (tick-stepped).'}
  - {address: 0xFFFF1746, width: 16, signed: false, name: enrichment_timer_1746, units: raw_counts, confidence: code,
     meaning: 'Enrichment state timer (tick-stepped).'}
  - {address: 0xFFFF1748, width: 16, signed: false, name: enrichment_timer_1748, units: raw_counts, confidence: code,
