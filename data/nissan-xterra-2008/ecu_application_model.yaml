# The fuel-command task (FUN_000575EC): its calls in order, each once per
# cycle, after the cycle-start copies of FUN_00020EF2. A node later in the
# list reads what an earlier one wrote in the same cycle.
schedule:
  function: 0x0575EC
  cycle_start: 0x020EF2
  calls:
    - {function: 0x05535C, nodes: [pedal_comparand]}
    - function: 0x055DB2
      nodes: [pedal_enrichment_flag, target_afr_lookup, enrichment_excess_scale, enrichment_gate,
              enrichment_state_request, enrichment_state, enrichment_multiplier]
    - {function: 0x055A04, nodes: [alternate_multiplier_writer]}
    - {function: 0x0556EC, nodes: [correction_1736]}
    - {function: 0x055536, nodes: []}
    - {function: 0x053400, nodes: [correction_175c]}
    - {function: 0x055386, nodes: [correction_26e8]}
    - {function: 0x05591C, nodes: [correction_sum]}
    - {function: 0x055AB8, nodes: [command_floor]}
    - {function: 0x055966, nodes: [curve_term]}
    - {function: 0x055B5E, nodes: [final_command_word]}

nodes:
  - id: cycle_snapshot
    function: 0x020EF2
    kind: copy
    writes: [0xFFFF26CC, 0xFFFF26CE, 0xFFFF26C6, 0xFFFF1079, 0xFFFF11CA, 0xFFFF11CF, 0xFFFF11D8,
             0xFFFF103E, 0xFFFF1038, 0xFFFF84C3, 0xFFFF84C4, 0xFFFF10EB]
    reads: [0xFFFF26BE, 0xFFFF26C0, 0xFFFF26B8, 0xFFFF1083, 0xFFFF1202, 0xFFFF1207, 0xFFFF1210,
            0xFFFF104E, 0xFFFF103A, 0xFFFF84C4, 0xFFFF84BB, 0xFFFF1177]
    arithmetic: >-
      Block copies at the start of each cycle, element by element as used
      here: 0xFFFF26BE -> 0xFFFF26CC, 0xFFFF26C0 -> 0xFFFF26CE and
      0xFFFF26B8 -> 0xFFFF26C6 (one 14-byte copy); 0xFFFF1083 -> 0xFFFF1079
      (10 bytes); 0xFFFF1202 -> 0xFFFF11CA, 0xFFFF1207 -> 0xFFFF11CF and
      0xFFFF1210 -> 0xFFFF11D8 (one 0x38-byte copy); 0xFFFF104E -> 0xFFFF103E;
      0xFFFF103A -> 0xFFFF1038; 0xFFFF84BB -> 0xFFFF84C4 -> 0xFFFF84C3;
      0xFFFF1177 -> 0xFFFF10EB (the 0x8C-byte block 0x53 bytes below each,
      E09.7: the base timing term's charge factor).
    rounding: none
    saturation: none
    outside_schedule: 'Runs before the fuel-command task each cycle (the snapshot routine).'
    confidence: code
    twin: not_modelled
    evidence: ['listing 0x020F14-0x020FCC: copy destination, source and length arguments']

  - id: engine_speed_word
    function: 0x03907A
    kind: computation
    writes: [0xFFFF1210, 0xFFFF1204, 0xFFFF1202, 0xFFFF1207, 0xFFFF233C]
    reads: [0xFFFF11BE, 0xFFFF233C]
    arithmetic: >-
      0xFFFF1210 = 0xFFFF11BE >> 6 (12.5 rpm per count); 0xFFFF1204 =
      0xFFFF11BE >> 3; 0xFFFF1202 = min(255, 0xFFFF1204 >> 5) (50 rpm per
      count). The lookup reads the cycle-start copy 0xFFFF11D8. 0x039048:
      0xFFFF1207 = min(255, 0xFFFF1204 >> 4). 0xFFFF233C = (0xFFFF233C + 255
      x 0xFFFF1204) >> 8, plus one when it stalls below 0xFFFF1204.
    rounding: truncating shifts
    saturation: '0xFFFF1202 min 255'
    outside_schedule: 'Speed processing, copied by the cycle snapshot.'
    confidence: observed
    twin: observed
    observed_as:
      - {spec: 'mem:ECM_ENGINE_SPEED_RAM', address: 0xFFFF11D8, relation: identity}
    evidence: ['docs/ecu-firmware-analysis.md "Target AFR lookup, decoded"; decompile text FUN_0003907A']

  - id: load_input_x
    function: 0x03C62C
    span: [0x03CC22, 0x03CC22]
    kind: computation
    writes: [0xFFFF104E]
    reads: [0xFFFF103A]
    depends_on: [base_fuel_schedule]
    arithmetic: 'min(255, (0xFFFF103A << 7) / Load Point Scaler) to 0xFFFF104E; the lookup reads the cycle-start copy 0xFFFF103E.'
    rounding: truncating unsigned divide
    saturation: 'min 255'
    outside_schedule: 'Air-charge task; copied by the cycle snapshot.'
    confidence: observed
    twin: observed
    observed_as:
      - {spec: 'mem:ECM_FUEL_TARGET_MAP_X_TRACE', address: 0xFFFF103E, relation: identity}
    rom:
      - {rom_map: load_point_scaler, role: divisor}
    evidence:
      - 'tests/fixtures/ground_truth/target_phi.yaml x_relation: 168/194 same-read pairs exact, 26 at 1-4 counts'
      - 'E05.2: both divides read the calibration word 0x9416 (literal at 0x03CCD8, loaded at 0x03CBE4 and 0x03CC00), never the map-slot copy +0x760 (RAM 0xFFFFB7A0 has no reference); the dividend is the BFS just written (0x03CBE6, BFS << 7)'

  # E07.2: the BFS formation upstream of the observed X byte, traced so that a
  # ROM change to Fuel Comp, K or the fill tables reaches X and every reader of
  # it (Target AFR, the timing trims). Not modelled; off every output's path
  # while X is observed, so no blocker changes.
  - id: fuel_comp_load_byte
    function: 0x03C3A4
    kind: computation
    writes: [0xFFFF118A]
    reads: [0xFFFF116A, 0xFFFF1124, 0xFFFF2C32, 0xFFFF2CC8, 0xFFFF63FC, 0xFFFF139E, 0xFFFF484E]
    arithmetic: >-
      0xFFFF2C32 = max(0, area curve 0xDD94 at 4 x 0xFFFF2CC8 - 0xFFFF63FC);
      0xFFFF1124 = 0xFFFF2C32, or the limp-home area (cal 0x90BE) while
      0xFFFF484E bit 2 is set; X = 0xFFFF116A x (0xFFFF1124 / 512 +
      0xFFFF139E / 2048) clamped to 0xFFFF; 0xFFFF118A = curve(X) >> 8,
      curve 0xEAEC below X = 0x3C00 and 0xEACC from it.
    rounding: truncating shifts and divides
    saturation: 'X min 0xFFFF; area floored at 0; idle air capped at cal 0x8ED2'
    branches:
      - {when: '0xFFFF484E bit 2 set', then: 'the limp-home area replaces the throttle area'}
    rom:
      - {rom_map: throttle_area_axis, role: 'area curve breakpoints (4 x counts)'}
      - {rom_map: throttle_area_curve, role: 'effective area'}
      - {rom_map: fill_curve_low, role: 'fill curve below X = 0x3C00'}
      - {rom_map: fill_curve_high, role: 'fill curve from X = 0x3C00'}
      - {rom_map: fill_rpm_multiplier, role: 'rpm multiplier of the reciprocal (158)'}
      - {rom_map: idle_air_cap, role: 'idle air learning cap'}
      - {rom_map: etc_limp_home_area, role: 'limp-home area'}
      - {rom_map: evap_purge_area_gain, role: 'purge area gain'}
    outside_schedule: 'Air-charge task, before 0x03C62C reads the byte.'
    confidence: code
    twin: not_modelled
    evidence:
      - 'docs/ecu-firmware-analysis.md "Fuel Comp load input 0xFFFF118A, and how BFS is formed" (listing and decompiler passes agree)'
      - 'src/decode/fuel_comp_load.py rebuilds the byte from logged throttle and rpm (N02.1); not the twin'

  # E05.2: BFS formation, traced from the listing of a46baa24... (2026-10-05).
  # Two dispatch groups of the tick dispatcher 0x020A3C: group 0x10 (0x02189C)
  # runs 0x03C3A4 (entry 38, the load byte) then 0x03CC3C (entry 40: the fill
  # time constant and coefficient, then the Fuel Comp lookup); group 0x20
  # (table 0x021874) runs 0x03BB40 (entry 4, MAF to airflow) then 0x03C62C
  # (entry 5: Tp, the Fuel Comp product, the filter, the transient, the blend,
  # the ceiling and X), after which the dispatcher copies 0xFFFF20A4..20B3 to
  # 0xFFFF20B4..20C3 (0x020BFC). Periods: the ATU compare ISR (vector 120,
  # 0x02040C) adds 320 to its compare register per tick at phi'/32 (TCR
  # 0xFFFFF4AC = 5) and sets 0xFFFF84B9 bits: 0x80 every tick, 0x40 every 2,
  # 0x20 every 4 (group 0x20: BFS), 0x10 and 0x04 every 10 (group 0x10, and the
  # background cycle 0x020EF2 that runs the fuel task), then runs the groups
  # (0x0208D6 -> 0x020A3C). At the 20 MHz Pphi the SCI baud rates imply, a
  # tick is 1.024 ms: BFS every 4.096 ms, Fuel Comp and the fill coefficient
  # every 10.24 ms. Pphi itself is inferred (no crystal constant in the code).
  - id: airflow_qa
    function: 0x03BB40
    kind: computation
    writes: [0xFFFF1054, 0xFFFF2104, 0xFFFF20A8, 0xFFFF20AC, 0xFFFF20E2, 0xFFFF2100, 0xFFFF1056, 0xFFFF3F70]
    reads: [0xFFFF102C, 0xFFFF2104, 0xFFFF20A8, 0xFFFF20AC, 0xFFFF273E, 0xFFFF283B, 0xFFFF283C, 0xFFFF2824]
    arithmetic: >-
      0x03BEFC: corrected = 0xFFFF102C minus an after-start hot-wire term
      (w4054 x 0x14F / (last corrected + 0x50)); w4054 starts at 0x180000,
      decays by 0xFF3C / 0x10000 per run and is zeroed once warm (0x03BBF2), so
      corrected = 0xFFFF102C in warm running. 0xFFFF1054 = the 16-bit curve
      0xE27E at (corrected & 0xFFF) << 4, copied to 0xFFFF2104 (0x03BB78).
      0x03BB98: 0xFFFF20A8 = (cal 0x86D9 x new + (256 - cal 0x86D9) x old)
      >> 8, nudged one count toward the input when it stalls, while
      0xFFFF283B bit 6 is set, else a copy. 0x03BFC0, with 0xFFFF283C bit 3
      clear, a MAF fault (0xFFFF2824 bit 7), b283A bit 0 or the hold b4A9D
      non-zero: 0xFFFF20AC =
      ((L20BC x (256 - g)) >> 4 + (0xFFFF20A8 x g) >> 4) >> 4, g = cal 0x8A68,
      L20BC last run's value; it stalls one count below a rising input. With
      bit 3 set: a lead w20B0 = w20B8 + (0xFFFF20A8 - w20B8) x cal 0x82C2 / 8
      (toward zero), a pulsation term w20C4 (cal 0x82BB, 0x82BC, 0x82BA) and a
      carried signed residue (w20EC, sign in bit 0 of b289B), exact at a
      fixed point. 0x03C20C: 0xFFFF2100 = max(0, 0xFFFF20AC + 0xFFFF20E2 +
      0xFFFF273E); 0xFFFF20E2 is 0 by calibration (0x03C2EC: cal 0x874D = 0,
      cal 0x86C8 bit 5 clear). 0x03C234, n = cal 0x89B3 (1): 0xFFFF1056 =
      max(0, f - cal word 0x92DC (0)), f = min(0xFFFF, (0xFFFF2104 +
      0xFFFF273E + (2^n - 1) x w20BA) / 2^n) (0x022248 is r0 << r1; divide
      0x021D6C), plus one when f equals last run's w20BA and is below the
      input: with n = 1 a two-point average that settles exactly. PID 0x10 and DID
      0x1209 (0xFFFF3F70, 0x03D2B6) report min(0xFFFF, 0xFFFF1056 x cal 0x83E9
      >> 8). At a fixed point 0xFFFF2100 = 0xFFFF1056, or one count below it
      off the transient model.
    rounding: truncating shifts; the 0x03BB98 and 0x03C234 filters add one count when they stall; the 0x03BFC0 average does not
    saturation: '0xFFFF20AC 24-bit; 0xFFFF2100 floored at 0; 0xFFFF1056 and the report min 0xFFFF'
    branches:
      - {when: '0xFFFF283B bit 6 clear', then: '0xFFFF20A8 copies 0xFFFF2104 (no low-pass)'}
      - {when: '0xFFFF283C bit 3 set, no MAF fault or hold', then: 'the lead path with residue (state words not catalogued)'}
    rom:
      - {offset: 0x83E9, width: 8, value: 149, role: 'PID 0x10 / DID 0x1209 report scale'}
      - {offset: 0x89B3, width: 8, value: 1, role: '0xFFFF1056 filter setting'}
      - {offset: 0x8A68, width: 8, value: 128, role: 'non-transient airflow average weight'}
      - {offset: 0x874D, width: 8, value: 0, role: '0xFFFF20E2 gain (0: the term is 0)'}
    calibration_conditions:
      - {offset: 0x83E9, mask: 0xFF, equals: 149, why: 'the report scale the steady-state reference inverts (maf_word_interval) was validated with'}
      - {offset: 0x89B3, mask: 0xFF, equals: 1, why: 'the 0xFFFF1056 filter setting under which 0xFFFF1056 = 0xFFFF2100 at steady state was checked'}
      - {offset: 0x92DC, mask: 0xFF, equals: 0, count: 2, why: 'the cal word subtracted from 0xFFFF1056; zero makes it the same sum as 0xFFFF2100'}
