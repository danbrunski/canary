  - id: final_command_word
    function: 0x055B5E
    kind: computation
    writes: [0xFFFF26BE, 0xFFFF1B2E, 0xFFFF2845, 0xFFFF2886]
    reads: [0xFFFF26F6, 0xFFFF27DC, 0xFFFF26C0, 0xFFFF4785, 0xFFFF1724, 0xFFFF2845, 0xFFFF26C6,
            0xFFFF26B8, 0xFFFF4787, 0xFFFF2841, 0xFFFF125C, 0xFFFF2849, 0xFFFF2886, 0xFFFF26CC,
            0xFFFF84C3]
    depends_on: [correction_sum, curve_term, enrichment_multiplier, alternate_multiplier_writer,
                 command_floor, cycle_snapshot]
    arithmetic: >-
      v = min(0xFFFF, 0xFFFF26F6 + 0xFFFF27DC) x 0xFFFF26C0 >> 14 (32-bit
      unsigned product). With 0xFFFF4785 bit 6 set: v = min(0xFFFF, v x cal
      0x838A >> 6). Clear: v < 0xFFFF1724 gives 0xFFFF1724 and sets
      0xFFFF2845 bit 0, else min(0xFFFF, v) and clears it. Then, only while
      0xFFFF26C6 and 0xFFFF26B8 are not 0x3F, 0xFFFF4787 and 0xFFFF4785
      bit 6 are clear, 0xFFFF2841 bit 0 is clear and 0xFFFF125C = 0x8000:
      cap at 0xFE00 (cal 0x8B3B); set 0xFFFF2886 bit 2 when 0xFFFF2849 bit 0
      differs from 0xFFFF2845 bit 0; with 0xFFFF2886 bit 2 clear, slew-limit
      to 0x3FC0 per cycle against 0xFFFF26CC, else hold toward 0xFFFF26CC by
      0xFFFF84C3 bit 7 and 0xFFFF2845 bit 0, clearing 0xFFFF2886 bit 2 when
      released. 0xFFFF1B2E keeps the result; 0xFFFF26BE is written 0 while
      0xFFFF26B8 = 0x3F.
    rounding: 'truncating shift'
    saturation: 'min 0xFFFF; cap 0xFE00 and slew +-0x3FC0 on the guarded path only'
    branches:
      - {when: '0xFFFF2841 bit 0 set', then: 'no cap and no slew limit'}
      - {when: '0xFFFF26CC = 0 (fuel cut) on the guarded path', then: 'the first word after cut is at most 0x3FC0'}
    rom:
      - {offset: 0x8B3B, width: 8, value: 254, role: 'cap high byte (0xFE00)'}
      - {offset: 0x838A, width: 8, value: 64, role: 'scale /64 while 0xFFFF4785 bit 6'}
    calibration_conditions:
      - {offset: 0x838A, mask: 0xFF, equals: 64,
         why: '64 makes the 0xFFFF4785 bit 6 scaling the identity'}
    confidence: code
    twin: not_modelled
    evidence: ['listing 0x055B5E-0x055DA4']

outputs:
  - id: target_equiv_ratio
    ram: 0xFFFF26BE
    written_by: final_command_word
    units: q14_phi
    observed_as:
      - {spec: 'mem:ECM_TARGET_EQUIV_RATIO', address: 0xFFFF26BE, relation: identity}
      - spec: 'obd:COMMANDED_EQUIV_RATIO'
        address: 0xFFFF26BE
        relation: alias
        note: 'PID 0x44 reads the same word; agreement verifies the mapping, not the algorithm.'
    twin:
      definition: target_phi_twin.yaml
      # The node whose value the twin computes: the gated lookup, as a word.
      predicts: enrichment_gate
    # What must hold, per sample, for the gated lookup word to be the final
    # command. None is captured today.
    equals_output_when:
      - id: multiplier_is_lookup
        statement: '0xFFFF26C0 = 0xFFFF174B << 7 (states 4/5, or 2/3/6 after the ramp reached it; 0xFFFF2947 = 0)'
        settled_by: '0xFFFF26C0 in the 58-byte read from 0xFFFF26BE'
      - id: corrections_neutral
        statement: '0xFFFF26F6 = 0x4000 and 0xFFFF27DC = 0 (0xFFFF27DC is 0 whenever the multiplier is not 0x4000)'
        settled_by: '0xFFFF26F6 in the same read; 0xFFFF27DC in a second read'
      - id: cap_and_slew_not_binding
        statement: 'no cap at 0xFE00 and no 0x3FC0 slew step (both skipped while the pedal flag is set)'
        settled_by: 'last cycle''s word 0xFFFF26CC in the same read'
    blockers:
      - name: final_command_path_unverified
        nodes: [cycle_snapshot, enrichment_state_request, enrichment_state, enrichment_multiplier,
                correction_1736, correction_175c, correction_26e8, correction_sum, curve_term,
                final_command_word]
