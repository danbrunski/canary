      - {offset: 0x8496, width: 8, value: 48, role: 'ramp-up step / 8'}
      - {offset: 0x8B3A, width: 8, value: 130, role: 'state 6 ramp start'}
      - {offset: 0x91E2, width: 16, value: 0x4500, role: 'state 6 ramp-down threshold'}
      - {offset: 0x879E, width: 8, value: 2, role: 'hold counter preset'}
    calibration_conditions:
