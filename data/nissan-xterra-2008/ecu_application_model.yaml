     meaning: 'Additive term, 0..3768; zero unless the multiplier is exactly 0x4000.'}
  - {address: 0xFFFF175C, width: 32, signed: true, name: correction_175c, units: q14_phi, confidence: unknown,
     meaning: 'Signed additive correction; purpose not identified.'}
  - {address: 0xFFFF26E8, width: 16, signed: false, name: correction_26e8, units: q14_phi, confidence: unknown,
     meaning: 'Non-negative additive correction; purpose not identified.'}
  - {address: 0xFFFF1736, width: 16, signed: false, name: correction_1736, units: q14_phi, confidence: unknown,
     meaning: 'Non-negative additive enrichment; purpose not identified.'}
  - {address: 0xFFFF1724, width: 16, signed: false, name: command_floor, units: q14_phi, confidence: code,
