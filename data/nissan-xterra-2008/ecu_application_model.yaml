      while 0xFFFF84C3 bit 7 is set: down = max(0x4000, p - 0x130), up =
      min(0xFFFF174B << 7, p + 0x180) (cal 0x8495 = 38 and 0x8496 = 48, x 8).
      The value chosen by 0xFFFF14C4 is capped at 0xFFFF174B << 7; bit 7 of
      0xFFFF2867 is set when it equals that cap. Then 0xFFFF26C0 = 0x4000 if
