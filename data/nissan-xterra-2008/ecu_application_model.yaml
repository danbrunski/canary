      else 0; 0xFFFF2793 = max(0, 0xFFFF1350 - 0xFFFF11CB).
    rounding: none
    saturation: 'floors at 0'
    calibration_conditions:
      - {offset: 0x8ADE, mask: 0x02, equals: 0, why: 'bit 1 clear: 0xFFFF1351 is 0'}
    outside_schedule: 'Called by the base-timing task 0x04DE4C (task 74).'
    confidence: code
    twin: not_modelled
    evidence: ['listing 0x04BD24-0x04BD72']

  - id: base_timing_sum
    function: 0x04CB9E
    kind: computation
    writes: [0xFFFF1A58]
    reads: [0xFFFF2833, 0xFFFF27C6, 0xFFFF2793, 0xFFFF279A, 0xFFFF134A, 0xFFFF174A, 0xFFFF1D3E, 0xFFFF1344]
    depends_on: [timing_trim_terms]
    arithmetic: >-
      With bit 4 of 0xFFFF2833 clear: 0xFFFF1D3E + 0xFFFF27C6 + 0xFFFF2793 -
      0xFFFF279A - 0xFFFF134A - 0xFFFF174A - 0x80 + 0xFFFF1344, clamped to a
      signed byte, to 0xFFFF1A58. With it set, a different sum without the
      trim term.
    rounding: none
    saturation: '-128..127'
    outside_schedule: 'Called by the base-timing task 0x04DE4C (task 74).'
    confidence: code
    twin: not_modelled
    evidence: ['decompile text of 0x04CB9E (firmware session, 2026-10-05)']

  - id: base_timing_select
    function: 0x04CF0C
    kind: computation
    writes: [0xFFFF27DA]
    reads: [0xFFFF1A58, 0xFFFF1A59, 0xFFFF4785, 0xFFFF2833]
    depends_on: [base_timing_sum]
    arithmetic: >-
      0xFFFF27DA = 0xFFFF1A58, or 0xFFFF1A59 when bit 6 of 0xFFFF4785 or bit
      4 of 0xFFFF2833 is set (and a mode byte is not 1 or 2).
    rounding: none
    saturation: none
    outside_schedule: 'Base-timing task 0x04DE4C (task 74).'
    confidence: code
    twin: not_modelled
    evidence: ['decompile text of 0x04CF0C (firmware session)']

  - id: timing_cycle_copy
    function: 0x020EF2
    span: [0x0212C4, 0x0212CA]
    kind: copy
    writes: [0xFFFF274E]
    reads: [0xFFFF27DA]
    depends_on: [base_timing_select]
    arithmetic: '0x8C-byte block copy after the task loop: 0xFFFF27DA to 0xFFFF274E.'
    rounding: none
    saturation: none
    outside_schedule: 'End of each 0x020EF2 cycle, after the task loop.'
    confidence: code
    twin: not_modelled
    evidence: ['listing 0x0212C4 (copy 0xFFFF2792.. to 0xFFFF2706.., n = 0x8C)']

  - id: timing_retard_combine
    function: 0x04DF38
    kind: computation
    writes: [0xFFFF2332, 0xFFFF2338, 0xFFFF1346]
    reads: [0xFFFF274E, 0xFFFF1215, 0xFFFF26D2, 0xFFFF2334, 0xFFFF272A]
    depends_on: [timing_cycle_copy, knock_trim_difference]
    arithmetic: >-
      0xFFFF2332 = min(0xFFFF26D2, -0xFFFF1215) while knock control is active
      (flag bits 0x28AD.5 / 0x28B3.1), else -0xFFFF1215; 0xFFFF2338 =
      0xFFFF274E + 0xFFFF2332 on the normal path (a held-step variant
      exists); 0xFFFF1346 = clamp_s8(0xFFFF2338 + 0xFFFF272A - 0xFFFF2334).
      A bypass flag copies 0xFFFF274E (capped 127) instead.
    rounding: none
    saturation: '-128..127'
    outside_schedule: 'Per-segment chain 0x04E6AE (every 120 deg crank, dispatch 0x02092E).'
    confidence: code
    twin: not_modelled
    evidence: ['decompile text of 0x04DF38 (firmware session)']

  - id: timing_rate_limit
    function: 0x04E0E0
    kind: computation
    writes: [0xFFFF232E, 0xFFFF28A8]
    reads: [0xFFFF1346, 0xFFFF62B4, 0xFFFF232E, 0xFFFF4785, 0xFFFF28A8]
    depends_on: [timing_retard_combine]
    arithmetic: >-
      v = 0xFFFF1346 + 0xFFFF62B4 (when a hysteresis flag set on rpm, load
      and coolant is clear) + a retard of -10..0 (one more flag); then from
      last 0xFFFF232E at most +4 per segment (+15 with bit 6 of 0xFFFF4785,
      0 under two other flags) and at least -15; capped at 50; then floor -7
      and cap 70. Before bit 7 of 0xFFFF28A8 is set (first run) the result
      is 0.
    rounding: none
    saturation: 'step +4 / -15; 50 cap; -7 floor'
    outside_schedule: 'Per-segment chain 0x04E6AE.'
    confidence: code
    twin: not_modelled
    evidence: ['decompile text of 0x04E0E0 (firmware session)']

  - id: timing_final_byte
    function: 0x04E4AC
    kind: computation
    writes: [0xFFFF11FF]
    reads: [0xFFFF232E, 0xFFFF28B1, 0xFFFF4858]
    depends_on: [timing_rate_limit]
    arithmetic: >-
      0xFFFF11FF = 110 - 0xFFFF232E normally; with bit 5 of 0xFFFF28B1 it is
      clamp(110 - v - 30, 0, 80); in a fault mode clamp(120 - v, 0, 255); bit
      5 of 0xFFFF4858 forces 0x5A (20 deg). The byte schedules the coil
      (0x02B82E).
    rounding: none
    saturation: 'as stated per branch'
    outside_schedule: 'Per-segment chain 0x04E6AE.'
    confidence: code
    twin: not_modelled
    evidence: ['decompile text of 0x04E4AC (firmware session)', 'PID 0x0E and DID 0x110A read 0xFFFF11FF (Mode 01 handler 0x0D3AFC)']

outputs:
  - id: target_equiv_ratio
    ram: 0xFFFF26BE
    written_by: final_command_word
    units: q14_phi
    observed_as:
      - {spec: 'mem:ECM_TARGET_EQUIV_RATIO', address: 0xFFFF26BE, relation: identity}
      - spec: 'obd:COMMANDED_EQUIV_RATIO'
        address: 0xFFFF26BE
        relation: alias
        note: 'PID 0x44 reads the same word; agreement verifies the mapping, not the algorithm.'
    twin:
      definition: target_phi_twin.yaml
      # The node whose value the twin computes: the gated lookup, as a word.
      predicts: enrichment_gate
    # What must hold, per sample, for the gated lookup word to be the final
    # command. None is captured today.
    equals_output_when:
      - id: multiplier_is_lookup
        statement: '0xFFFF26C0 = 0xFFFF174B << 7 (states 4/5, or 2/3/6 after the ramp reached it; 0xFFFF2947 = 0)'
        settled_by: '0xFFFF26C0 in the 58-byte read from 0xFFFF26BE'
      - id: corrections_neutral
        statement: '0xFFFF26F6 = 0x4000 and 0xFFFF27DC = 0 (0xFFFF27DC is 0 whenever the multiplier is not 0x4000)'
        settled_by: '0xFFFF26F6 in the same read; 0xFFFF27DC in a second read'
      - id: cap_and_slew_not_binding
        statement: 'no cap at 0xFE00 and no 0x3FC0 slew step (both skipped while the pedal flag is set)'
        settled_by: 'last cycle''s word 0xFFFF26CC in the same read'
    blockers:
      - name: final_command_path_unverified
        nodes: [cycle_snapshot, enrichment_state_request, enrichment_state, enrichment_multiplier,
                correction_1736, correction_175c, correction_26e8, correction_sum, curve_term,
                final_command_word]
        closes_with: >-
          Implement the multiplier state machine and final writer, then verify
          per sample against a same-read 0xFFFF26BE..0xFFFF26F7 window plus
          0xFFFF27DC (E02.4 remaining 2), or observe those words directly and
          restrict the claim to samples where equals_output_when holds.
      - name: ram_copy_unverified
        nodes: [target_afr_ram_copy]
        closes_with: 'E02.2: read 0xFFFFB260 (63 + 1 bytes) and compare with the resolved slot.'
    regions:
      - id: enrichment_gate_band
        status: unevaluable
        when: 'gated lookup result 129 with the latch 0xFFFF2886 bit 3 not captured'
        nodes: [enrichment_gate]
      - id: multiplier_indeterminate
        status: unevaluable
        when: 'state 2, 3 or 6 with 0xFFFF2867 bit 7 clear and last multiplier below 0x4000 (the firmware reads an uninitialised stack word); unreachable while alternate_multiplier_writer is calibration-dead'
        nodes: [enrichment_multiplier]
      - id: cold_state_5
        status: conditional
        when: 'coolant byte below 115 (65 degC): state 5 takes the lookup word directly, but the corrections are not modelled'
        nodes: [enrichment_state_request, correction_sum]
      - id: fuel_cut_recovery
        status: conditional
        when: 'first cycles after fuel cut on the guarded path: slew-limited from 0 by 0x3FC0 per cycle'
        nodes: [final_command_word]

  - id: ignition_timing
    ram: 0xFFFF11FF
    written_by: timing_final_byte
    units: deg_btdc_110_minus
    observed_as:
      - {spec: 'obd:TIMING_ADVANCE', address: 0xFFFF11FF, relation: identity}
      - spec: 'mem:ECM_IGNITION_TIMING_RAM'
        address: 0xFFFF11C7
        relation: alias
        note: 'The cycle-start copy of the same byte: agreement checks the mapping, not the chain.'
    blockers:
      - name: trim_ram_copy_unverified
        nodes: [timing_trim_ram_copy]
        closes_with: 'Read 0xFFFFB060 and 0xFFFFB160 (2 x 256 bytes, 0x23 windows) and compare with the resolved slot.'
      - name: high_det_latch_unobserved
        nodes: [high_det_latch]
        closes_with: 'Read 0xFFFF283F with the trim bytes (flags window from 0xFFFF283F).'
      - name: ignition_chain_unmodelled
        nodes: [knock_trim_difference, timing_trim_terms, base_timing_sum, base_timing_select,
                timing_cycle_copy, timing_retard_combine, timing_rate_limit, timing_final_byte]
        closes_with: >-
          Implement each node, then verify per segment against same-window
          reads of 0xFFFF2793, 0xFFFF1A58, 0xFFFF27DA, 0xFFFF2332, 0xFFFF1346,
          0xFFFF232E and 0xFFFF11FF; identify the unnamed terms first.
    regions:
      - id: rate_limited
        status: conditional
        when: 'a step larger than +4 / -15 degrees per segment: the output is the limiter''s, not the sum''s'
        nodes: [timing_rate_limit]

  - id: ignition_trim_selected
    ram: 0xFFFF1777
    written_by: timing_trim_lookup
    units: trim_counts_7bit_plus_flag
    role: intermediate
    feeds: ignition_timing
    twin:
      definition: src.analysis.ecu_state_models.selected_timing_trim
      predicts: timing_trim_lookup
    blockers:
      - name: trim_ram_copy_unverified
        nodes: [timing_trim_ram_copy]
        closes_with: 'Read 0xFFFFB060 and 0xFFFFB160 and compare with the resolved slot.'
      - name: high_det_latch_unobserved
        nodes: [high_det_latch]
        closes_with: 'Read 0xFFFF283F with 0xFFFF1777 and 0xFFFF177A.'
    regions:
      - id: coolant_blend_band
        status: unevaluable
        when: 'coolant byte 107..110 (57-60 degC): the blend''s divide rounding is unverified'
        nodes: [timing_trim_lookup]
      - id: high_det_unknown_warm
        status: unevaluable
        when: 'coolant byte above 110 with 0xFFFF283F bit 6 not read'
        nodes: [timing_trim_lookup, high_det_latch]

