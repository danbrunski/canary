# The fuel-command task (FUN_000575EC): its calls in order, each once per
# cycle, after the cycle-start copies of FUN_00020EF2. A node later in the
# list reads what an earlier one wrote in the same cycle.
schedule:
  function: 0x0575EC
  cycle_start: 0x020EF2
  calls:
    - {function: 0x05535C, nodes: [pedal_comparand]}
    - function: 0x055DB2
      nodes: [pedal_enrichment_flag, target_afr_lookup, enrichment_excess_scale, enrichment_gate,
              enrichment_state_request, enrichment_state, enrichment_multiplier]
    - {function: 0x055A04, nodes: [alternate_multiplier_writer]}
    - {function: 0x0556EC, nodes: [correction_1736]}
    - {function: 0x055536, nodes: []}
    - {function: 0x053400, nodes: [correction_175c]}
    - {function: 0x055386, nodes: [correction_26e8]}
    - {function: 0x05591C, nodes: [correction_sum]}
    - {function: 0x055AB8, nodes: [command_floor]}
    - {function: 0x055966, nodes: [curve_term]}
    - {function: 0x055B5E, nodes: [final_command_word]}

nodes:
  - id: cycle_snapshot
    function: 0x020EF2
    kind: copy
    writes: [0xFFFF26CC, 0xFFFF26CE, 0xFFFF26C6, 0xFFFF1079, 0xFFFF11CA, 0xFFFF11CF, 0xFFFF11D8,
             0xFFFF103E, 0xFFFF1038, 0xFFFF84C3, 0xFFFF84C4]
    reads: [0xFFFF26BE, 0xFFFF26C0, 0xFFFF26B8, 0xFFFF1083, 0xFFFF1202, 0xFFFF1207, 0xFFFF1210,
            0xFFFF104E, 0xFFFF103A, 0xFFFF84C4, 0xFFFF84BB]
    arithmetic: >-
      Block copies at the start of each cycle, element by element as used
      here: 0xFFFF26BE -> 0xFFFF26CC, 0xFFFF26C0 -> 0xFFFF26CE and
      0xFFFF26B8 -> 0xFFFF26C6 (one 14-byte copy); 0xFFFF1083 -> 0xFFFF1079
      (10 bytes); 0xFFFF1202 -> 0xFFFF11CA, 0xFFFF1207 -> 0xFFFF11CF and
      0xFFFF1210 -> 0xFFFF11D8 (one 0x38-byte copy); 0xFFFF104E -> 0xFFFF103E;
      0xFFFF103A -> 0xFFFF1038; 0xFFFF84BB -> 0xFFFF84C4 -> 0xFFFF84C3.
    rounding: none
    saturation: none
    outside_schedule: 'Runs before the fuel-command task each cycle (the snapshot routine).'
    confidence: code
    twin: not_modelled
    evidence: ['listing 0x020F14-0x020FCC: copy destination, source and length arguments']

  - id: engine_speed_word
    function: 0x03907A
    kind: computation
    writes: [0xFFFF1210, 0xFFFF1204, 0xFFFF1202]
    reads: [0xFFFF11BE]
    arithmetic: >-
      0xFFFF1210 = 0xFFFF11BE >> 6 (12.5 rpm per count); 0xFFFF1204 =
      0xFFFF11BE >> 3; 0xFFFF1202 = min(255, 0xFFFF1204 >> 5) (50 rpm per
      count). The lookup reads the cycle-start copy 0xFFFF11D8.
    rounding: truncating shifts
    saturation: '0xFFFF1202 min 255'
    outside_schedule: 'Speed processing, copied by the cycle snapshot.'
    confidence: observed
    twin: observed
    observed_as:
      - {spec: 'mem:ECM_ENGINE_SPEED_RAM', address: 0xFFFF11D8, relation: identity}
    evidence: ['docs/ecu-firmware-analysis.md "Target AFR lookup, decoded"; decompile text FUN_0003907A']

  - id: load_input_x
    function: 0x03C4D0
    span: [0x03CC22, 0x03CC22]
    kind: computation
    writes: [0xFFFF104E]
    reads: [0xFFFF103A]
    arithmetic: 'min(255, (0xFFFF103A << 7) / Load Point Scaler) to 0xFFFF104E; the lookup reads the cycle-start copy 0xFFFF103E.'
    rounding: truncating unsigned divide
    saturation: 'min 255'
    outside_schedule: 'Air-charge task; copied by the cycle snapshot.'
    confidence: observed
    twin: observed
    observed_as:
      - {spec: 'mem:ECM_FUEL_TARGET_MAP_X_TRACE', address: 0xFFFF103E, relation: identity}
    rom:
      - {rom_map: load_point_scaler, role: divisor}
    evidence: ['tests/fixtures/ground_truth/target_phi.yaml x_relation: 168/194 same-read pairs exact, 26 at 1-4 counts']

  - id: uprev_init
    function: 0x0DE1A4
    kind: state
    writes: [0xFFFFB000, 0xFFFFB002, 0xFFFFB003, 0xFFFFB004, 0xFFFFB008, 0xFFFFB00C]
    reads: [0xFFFFB004]
    arithmetic: >-
      Unless the 32-bit word 0xFFFFB004 already holds 0xAA5555AA: write it,
      zero the longs at 0xFFFFB000 (countdown, debounce 0xFFFFB002, selector
      0xFFFFB003), 0xFFFFB008 (the committed map) and 0xFFFFB00C, and copy
      slot 1 (0x200 longs from 0x0E0000). With the magic present it writes
      nothing, so a retained block and RAM copy survive the reset. It also
      writes 0x15/0x55/0x15 to the I/O words at 0xF73A-0xF73E (unidentified).
    rounding: none
    saturation: none
    branches:
      - {when: 'magic present at reset', then: 'no write and no copy (warm start)'}
    outside_schedule: 'Application reset path (0x029094 via the thunk 0x028D72), before the main loop.'
    confidence: code
    twin: not_modelled
    reference_model: src.analysis.ecu_state_models.uprev_power_on
    reference_validation: [synthetic]
    evidence: ['listing 0x0DE1A4-0x0DE1E8 (mov.l zeroes at 0xFFFFB000, +8, +0xC)']

  - id: uprev_slot_state
    function: 0x0DE358
    kind: state
    writes: [0xFFFFB000, 0xFFFFB002, 0xFFFFB003, 0xFFFFB008, 0xFFFFB00C, 0xFFFF4858]
    reads: [0xFFFF2EE0, 0xFFFFB000, 0xFFFFB002, 0xFFFFB003, 0xFFFFB00C]
    depends_on: [uprev_init]
    arithmetic: >-
      Each cycle, in order: while the word 0xFFFFB000 is non-zero it is
      decremented and 0xFFFF4858 bit 0 takes bit 5 of the new value. With
      m = 0xFFFF2EE0 & 0x0A and p = 0xFFFFB002 (last cycle's m): p = 0 sets
      0xFFFFB003 = 0; p = 8 (bit 3 held alone) and m bit 1 set increments
      0xFFFFB003; p = 8 and m = 0 sets 0xFFFFB000 = 0xFFFFB003 x 64 and calls
      the slot copy 0x0DE3E4, which shifts the selector nibble into
      0xFFFFB00C and, only for 1..5, writes 0xFFFFB008 and copies that slot;
      any other p does nothing. Then 0xFFFFB002 = m. A press of bit 1 counts
      only on its rising edge (p is 0x0A while held); releasing both bits in
      one cycle from 0x0A resets the selector without a commit.
    rounding: none
    saturation: 'selector byte wraps at 256; a nibble of 0 or above 5 commits nothing'
    branches:
      - {when: 'p = 8 and m = 0', then: 'commit: 0xFFFFB008 and the RAM copy change only for a selector of 1..5'}
      - {when: 'p = 0', then: 'selector cleared'}
    outside_schedule: >-
      Task 111 of the 0x020EF2 loop (UpRev's hook at the tail of 0x0DA878),
      after the fuel task (37): a commit's copy is first read by the next
      cycle's lookup.
    confidence: code
    twin: observed
    observed_as:
      - {spec: 'mem:ECM_UPREV_MAGIC', address: 0xFFFFB004, relation: identity}
      - {spec: 'mem:ECM_ACTIVE_MAP', address: 0xFFFFB008, relation: identity}
      - {spec: 'mem:ECM_UPREV_MAP_SELECTOR', address: 0xFFFFB003, relation: identity}
    reference_model: src.analysis.ecu_state_models.uprev_step
    reference_validation: [synthetic]
    evidence:
      - 'listing 0x0DE358-0x0DE3BA and 0x0DE3E4-0x0DE428; task table 0x0219D0 entry 111 = 0x0DA878'
      - 'tests/test_ecu_state_models.py: the 2026-10-04 capture (196 reads, magic present, map 0, selector 0) is slot 1 by init on every read (loaded_slot), no transition; uprev_step itself was not exercised (no switch, 0xFFFF2EE0 not read per cycle)'

  - id: target_afr_ram_copy
    function: 0x0DE3E4
    kind: copy
    writes: [0xFFFFB040, 0xFFFFB260]
    reads: [0xFFFFB003, 0xFFFFB004, 0xFFFFB008]
    depends_on: [uprev_slot_state]
    arithmetic: >-
      2 KiB copy of slot n from flash 0x0E0000 + 0x800 x (n - 1) to
      0xFFFFB040; the Target AFR table is 0xFFFFB260 (+0x220). The twin
      assumes those RAM bytes equal the resolved library slot until a 0x23
      read (63 + 1 bytes) compares them.
    rounding: none
    saturation: none
    outside_schedule: 'UpRev init and slot commit only.'
    confidence: code
    twin: assumed
    assumption: >-
      The RAM table equals the image's slot. A battery-backed RAM copy can
      predate a reflash, so the default-slot rule alone does not prove it.
    evidence: ['E02.2: not yet read on the vehicle']

  - id: requested_throttle_position
    function: 0x07248C
    kind: computation
    writes: [0xFFFF2D28]
    reads: [0xFFFF1A64]
    arithmetic: >-
      0xFFFF2D28 = 0x026D58(values 0xEE6A, breakpoints 0xDD94, 0xFFFF1A64) >> 2:
      the area curve searched the other way round (area to 4 x throttle
      counts), so the throttle position the target area 0xFFFF1A64 needs.
    rounding: 'truncating shift; 0x026F10 interpolation'
    saturation: 'curve ends'
    rom:
      - {rom_map: throttle_area_axis, role: 'curve values here (4 x counts)'}
      - {rom_map: throttle_area_curve, role: 'breakpoints here (area)'}
    outside_schedule: 'Task 25 of the 0x020EF2 loop, before the fuel task (37) in the same cycle.'
    confidence: code
    twin: not_modelled
    evidence: ['listing 0x07248C-0x0724AA; task table 0x0219D0 entry 25']

  - id: pedal_comparand
    function: 0x05535C
    kind: computation
    writes: [0xFFFF3CDC]
    reads: [0xFFFF2D28]
    depends_on: [requested_throttle_position]
    arithmetic: '0xFFFF3CDC = min(255, (0xFFFF2D28 x 20571) >> 16); 255 is about 99 % of requested opening.'
    rounding: 'truncating shift'
    saturation: 'min 255'
    confidence: code
    twin: not_modelled
    reference_model: src.analysis.ecu_state_models.pedal_comparand
    reference_validation: [synthetic]
    evidence: ['listing 0x05535C-0x055384 (the fuel task''s first call)']

  - id: pedal_enrichment_flag
    function: 0x055DB2
    span: [0x055DB2, 0x055E00]
    kind: state
    writes: [0xFFFF15F8, 0xFFFF2841]
    reads: [0xFFFF11CF, 0xFFFF3CDC, 0xFFFF2841]
    depends_on: [pedal_comparand, engine_speed_word]
    arithmetic: >-
      0xFFFF15F8 = 0x026BBC(curve 0xCEDB, 0xFFFF11CF): 16 byte entries on the
      implicit axis 0, 16 .. 240 (index x >> 4, Q16 fraction (x & 15) << 12,
      0x026F10), the last entry from 240. 0xFFFF11CF = min(255, rpm word >> 1)
      (25 rpm per count; 400 rpm per entry). Bit 0 of 0xFFFF2841 is set when
      0xFFFF3CDC, plus 8 while already set, reaches 0xFFFF15F8 (unsigned
      compare, no wrap), cleared otherwise. Update order: 0xFFFF3CDC is this
      cycle's (call 0x05535C runs first in the task); the lookup, the
      request and the trim lookup (task 66) read the flag written here.
    rounding: 'curve interpolation truncated toward the indexed entry'
    saturation: none
    branches:
      - {when: 'bit 0 of 0xFFFF2841 set', then: 'the lookup''s load input is 0xFF (last column)'}
      - {when: '0xFFFF3CDC in [threshold - 8, threshold)', then: 'keeps the previous flag (the only history it needs)'}
    rom:
      - {offset: 0xCEDB, width: 8, value: 200, role: 'threshold curve (all 16 entries 200 on every listed image: set at 200, clear below 192)'}
    calibration_conditions:
      - {offset: 0xCEDB, mask: 0xFF, equals: 200, count: 16,
         why: 'the flat threshold curve the fixture accounting and the 78 % reading assume (PedalFlagModel itself takes any curve)'}
    confidence: code
    twin: observed
    observed_as:
      - {spec: 'mem:ECM_PEDAL_ENRICH_FLAGS', address: 0xFFFF2841, relation: bit_0}
    reference_model: src.analysis.ecu_state_models.PedalFlagModel
    reference_validation: [synthetic]
    evidence:
      - 'listing 0x055DC4-0x055DFA; 0x039048 (0xFFFF1207); 0x026BBC / 0x027254'
      - 'tests/test_ecu_state_models.py: the 2026-10-04 capture''s 191 flag reads and 4 transitions are counted unevaluable (0xFFFF3CDC not captured), so none scored the model'

  - id: target_afr_lookup
    function: 0x055DB2
    span: [0x055E00, 0x055E24]
    kind: computation
    writes: []
    reads: [0xFFFFB260, 0xFFFF11D8, 0xFFFF103E, 0xFFFF2841]
    depends_on: [target_afr_ram_copy, engine_speed_word, load_input_x, pedal_enrichment_flag]
    arithmetic: >-
      0x0269AC on the table 0xFFFFB260 with rpm 0xFFFF11D8 and load
      0xFFFF103E (0xFF while 0xFFFF2841 bit 0): top-down raw axis searches
      (rpm word against axis byte x 4 at 0xCAA5, load byte against axis byte
      at 0xC894), Q16 truncating fraction, cell interpolation truncating
      toward the first operand, row-major bilinear over 8 x 8; masked to a
      byte.
    rounding: truncate (both directions toward the first operand)
    saturation: 'axes clamp past either end with fraction 0'
    rom:
      - {rom_map: fuel_targets, role: table (via its RAM copy)}
      - {rom_map: fuel_targets_rpm_axis, role: rows}
      - {rom_map: fuel_targets_bfs_axis, role: columns}
    confidence: observed
    twin: implemented
    implemented_by: src.decode.ecm_lookup.lookup_2d
    evidence:
      - 'tests/test_ecm_lookup.py hand-worked vectors'
      - 'tests/fixtures/ground_truth/target_phi.yaml known_override: both 2026-10-04 enrichment commands 0x4A80'

  - id: enrichment_excess_scale
    function: 0x055DB2
    span: [0x055E26, 0x055E5A]
    kind: computation
    writes: []
    reads: [0xFFFF283F, 0xFFFF11CF]
    depends_on: [target_afr_lookup]
    arithmetic: >-
      While bit 6 of 0xFFFF283F is set, the lookup's excess over 128 is
      scaled by the 8-entry curve 0xD247 at 0xFFFF11CF (/128), clamped 0..255.
    rounding: truncate
    saturation: '0..255'
    calibration_conditions:
      - {offset: 0xD247, mask: 0xFF, equals: 128, count: 8,
         why: 'every entry 128 makes the scaling the identity; checked by target_phi as unmodelled_logic too'}
    confidence: code
    twin: implemented
    implemented_by: src.analysis.target_phi.predict (identity, image-checked)
    evidence: ['docs/ecu-firmware-analysis.md "Target AFR lookup to final command"']

  - id: enrichment_gate
    function: 0x055DB2
    span: [0x055E5C, 0x055EEC]
    kind: computation
    writes: [0xFFFF174B, 0xFFFF2886]
    reads: [0xFFFF2886]
    depends_on: [enrichment_excess_scale]
    arithmetic: >-
      Bit 3 of 0xFFFF2886 latches: set when the result (+1 while latched)
      is >= 130 (cal 0x8B39), cleared otherwise. Latched: 0xFFFF174B = the
      result. Clear: 0xFFFF174B = 0x80.
    rounding: none
    saturation: none
    branches:
      - {when: 'result 129 with 0xFFFF2886 bit 3 unknown', then: 'ambiguous; the twin refuses enrichment_gate_state_unknown'}
    rom:
      - {offset: 0x8B39, width: 8, value: 130, role: gate threshold}
      - {offset: 0x8B3D, width: 8, value: 129, role: release threshold}
    confidence: code
    twin: implemented
    implemented_by: src.analysis.target_phi.predict
    evidence: ['target_phi_twin.yaml final_command.enrichment_gate (image-checked)']

  - id: enrichment_state_request
    function: 0x055DB2
    span: [0x055EF0, 0x056050]
    kind: state
    writes: [0xFFFF14C5, 0xFFFF288A, 0xFFFF2875, 0xFFFF2876, 0xFFFF2866]
    reads: [0xFFFF1079, 0xFFFF11CA, 0xFFFF174B, 0xFFFF2841, 0xFFFF10C5, 0xFFFF288A, 0xFFFF2875,
            0xFFFF2876, 0xFFFF2866]
    depends_on: [cycle_snapshot, enrichment_gate, pedal_enrichment_flag]
    arithmetic: >-
      Latches with hysteresis: 0xFFFF288A bit 6 (warm) when 0xFFFF1079 (+3
      while latched) >= 0x73 (115, 65 degC under DID 0x1101's -50);
      0xFFFF2875 bits 2, 1, 0 and 0xFFFF2876 bit 7 on 0xFFFF11CA (+4 counts,
      200 rpm, while latched) at 0x3E (3,100 rpm), 0x44 (3,400 rpm), 0x44 and
      0x28 (2,000 rpm). The request 0xFFFF14C5 follows from them,
      0xFFFF174B and 0xFFFF2841 bit 0. The thresholds are calibration bytes
      (cal 0x8C98, 0x879C, 0x879B, 0x87A0, 0x879F; the 0xFFFF10C5 compare is
      >= cal 0x879D); the hysteresis amounts are code immediates.
    rounding: none
    saturation: none
    branches:
      - {when: 'not warm', then: 'request 8'}
      - {when: 'warm, 0xFFFF174B = 0x80', then: 'request 1'}
      - {when: 'warm, 0xFFFF174B above 0x80, pedal flag clear', then: 'request 2 / 4 / 6 below 3,100 / below 3,400 / above'}
      - {when: 'warm, 0xFFFF174B above 0x80, pedal flag set', then: 'request 3 / 5 / 7 by the same bands; 0xFFFF2866 bit 0 set when 0xFFFF10C5 > 0xFD, else left as it was'}
      - {when: 'pedal flag clear, warm 0x80, or not warm', then: '0xFFFF2866 bit 0 cleared'}
      - {when: 'a latch input inside its hysteresis band', then: 'the latch keeps its previous value (needs a checkpoint)'}
    confidence: code
    twin: not_modelled
    rom:
      - {offset: 0x8C98, width: 8, value: 0x73, role: 'warm latch threshold (0xFFFF288A bit 6)'}
      - {offset: 0x879C, width: 8, value: 0x3E, role: '0xFFFF2875 bit 2 threshold'}
      - {offset: 0x879B, width: 8, value: 0x44, role: '0xFFFF2875 bit 1 threshold'}
      - {offset: 0x87A0, width: 8, value: 0x44, role: '0xFFFF2875 bit 0 threshold'}
      - {offset: 0x879F, width: 8, value: 0x28, role: '0xFFFF2876 bit 7 threshold'}
      - {offset: 0x879D, width: 8, value: 0xFE, role: '0xFFFF10C5 at or above sets 0xFFFF2866 bit 0'}
    calibration_conditions:
      - {offset: 0x8C98, mask: 0xFF, equals: 0x73, why: 'warm threshold the reference model implements'}
      - {offset: 0x879C, mask: 0xFF, equals: 0x3E, why: '3,100 rpm band threshold the reference model implements'}
      - {offset: 0x879B, mask: 0xFF, equals: 0x44, why: '3,400 rpm band threshold the reference model implements'}
      - {offset: 0x87A0, mask: 0xFF, equals: 0x44, why: 'multiplier band threshold the reference model implements'}
      - {offset: 0x879F, mask: 0xFF, equals: 0x28, why: '2,000 rpm latch threshold the reference model implements'}
      - {offset: 0x879D, mask: 0xFF, equals: 0xFE, why: '0xFFFF10C5 commit threshold the reference model implements'}
    reference_model: src.analysis.ecu_state_models.enrichment_request
    reference_validation: [synthetic]
    evidence: ['listing 0x055EF0-0x056050']

  - id: enrichment_state
    function: 0x055DB2
