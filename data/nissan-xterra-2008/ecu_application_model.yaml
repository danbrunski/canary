  - {address: 0xFFFF26BE, width: 16, signed: false, name: command_word, units: q14_phi, confidence: observed,
     meaning: 'Final commanded equivalence ratio, phi x 16384. Same word as Mode 01 PID 0x44.'}
  - {address: 0xFFFF1B2E, width: 16, signed: false, name: command_word_before_cut, units: q14_phi, confidence: code,
     meaning: 'Copy of the word before the fuel-cut zero is applied.'}
  - {address: 0xFFFF26C0, width: 16, signed: false, name: enrichment_multiplier, units: q14_phi, confidence: code,
     meaning: 'Multiplier applied to the correction sum; 0x4000 is 1.0.'}
  - {address: 0xFFFF26CC, width: 16, signed: false, name: previous_command_word, units: q14_phi, confidence: code,
     meaning: 'Last cycle''s command word (cycle-start copy).'}
  - {address: 0xFFFF26CE, width: 16, signed: false, name: previous_enrichment_multiplier, units: q14_phi, confidence: code,
     meaning: 'Last cycle''s multiplier (cycle-start copy).'}
  - {address: 0xFFFF26F6, width: 16, signed: false, name: correction_sum, units: q14_phi, confidence: code,
     meaning: 'clamp(0x4000 + the three corrections, 0, 0xFFFF).'}
