  - id: enrichment_multiplier
    function: 0x055DB2
    span: [0x0566BE, 0x0568B4]
    kind: computation
    writes: [0xFFFF26C0, 0xFFFF2867, 0xFFFF2947]
    reads: [0xFFFF14C4, 0xFFFF174B, 0xFFFF26CE, 0xFFFF2867, 0xFFFF2875, 0xFFFF2876, 0xFFFF84C3,
