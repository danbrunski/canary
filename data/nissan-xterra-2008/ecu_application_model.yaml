      - {when: 'states 2, 3, 6 otherwise', then: '0xFFFF2867 bit 7 set: the lookup word; p = 0x4000: 0x82 << 7 (cal 0x8B39); p > 0x4000: ramp up; p < 0x4000: an uninitialised stack word (indeterminate)'}
