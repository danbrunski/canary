    arithmetic: >-
      0xFFFF2A90 is cleared while 0xFFFF15B3 is non-zero. 0xFFFF27DC is zero
      unless 0xFFFF135F bits 0 and 1 are set, 0xFFFF26C0 (this cycle's) is
      exactly 0x4000, 0xFFFF26B9 bits 0 and 1 are set and 0xFFFF2A90 is 0.
      Then the 16-bit curve 0xED3A on axis 0xDFD2 at max(0xFFFF2D10,
      0xFFFF2D14) >> 8 (signed, biased by 0x8000, saturated).
