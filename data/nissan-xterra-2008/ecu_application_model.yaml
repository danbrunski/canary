# The fuel-command task (FUN_000575EC): its calls in order, each once per
# cycle, after the cycle-start copies of FUN_00020EF2. A node later in the
# list reads what an earlier one wrote in the same cycle.
schedule:
  function: 0x0575EC
  cycle_start: 0x020EF2
  calls:
    - {function: 0x05535C, nodes: []}
    - function: 0x055DB2
      nodes: [pedal_enrichment_flag, target_afr_lookup, enrichment_excess_scale, enrichment_gate,
              enrichment_state_request, enrichment_state, enrichment_multiplier]
    - {function: 0x055A04, nodes: [alternate_multiplier_writer]}
    - {function: 0x0556EC, nodes: [correction_1736]}
    - {function: 0x055536, nodes: []}
    - {function: 0x053400, nodes: [correction_175c]}
    - {function: 0x055386, nodes: [correction_26e8]}
    - {function: 0x05591C, nodes: [correction_sum]}
    - {function: 0x055AB8, nodes: [command_floor]}
    - {function: 0x055966, nodes: [curve_term]}
    - {function: 0x055B5E, nodes: [final_command_word]}

nodes:
  - id: cycle_snapshot
    function: 0x020EF2
    kind: copy
    writes: [0xFFFF26CC, 0xFFFF26CE, 0xFFFF26C6, 0xFFFF1079, 0xFFFF11CA, 0xFFFF11CF, 0xFFFF11D8,
             0xFFFF103E, 0xFFFF1038, 0xFFFF84C3, 0xFFFF84C4]
    reads: [0xFFFF26BE, 0xFFFF26C0, 0xFFFF26B8, 0xFFFF1083, 0xFFFF1202, 0xFFFF1207, 0xFFFF1210,
            0xFFFF104E, 0xFFFF103A, 0xFFFF84C4, 0xFFFF84BB]
    arithmetic: >-
      Block copies at the start of each cycle, element by element as used
      here: 0xFFFF26BE -> 0xFFFF26CC, 0xFFFF26C0 -> 0xFFFF26CE and
      0xFFFF26B8 -> 0xFFFF26C6 (one 14-byte copy); 0xFFFF1083 -> 0xFFFF1079
      (10 bytes); 0xFFFF1202 -> 0xFFFF11CA, 0xFFFF1207 -> 0xFFFF11CF and
      0xFFFF1210 -> 0xFFFF11D8 (one 0x38-byte copy); 0xFFFF104E -> 0xFFFF103E;
      0xFFFF103A -> 0xFFFF1038; 0xFFFF84BB -> 0xFFFF84C4 -> 0xFFFF84C3.
    rounding: none
    saturation: none
    outside_schedule: 'Runs before the fuel-command task each cycle (the snapshot routine).'
    confidence: code
    twin: not_modelled
    evidence: ['listing 0x020F14-0x020FCC: copy destination, source and length arguments']

  - id: engine_speed_word
    function: 0x03907A
    kind: computation
    writes: [0xFFFF1210, 0xFFFF1204, 0xFFFF1202]
    reads: [0xFFFF11BE]
    arithmetic: >-
      0xFFFF1210 = 0xFFFF11BE >> 6 (12.5 rpm per count); 0xFFFF1204 =
      0xFFFF11BE >> 3; 0xFFFF1202 = min(255, 0xFFFF1204 >> 5) (50 rpm per
      count). The lookup reads the cycle-start copy 0xFFFF11D8.
    rounding: truncating shifts
    saturation: '0xFFFF1202 min 255'
    outside_schedule: 'Speed processing, copied by the cycle snapshot.'
    confidence: observed
    twin: observed
    observed_as:
      - {spec: 'mem:ECM_ENGINE_SPEED_RAM', address: 0xFFFF11D8, relation: identity}
    evidence: ['docs/ecu-firmware-analysis.md "Target AFR lookup, decoded"; decompile text FUN_0003907A']

  - id: load_input_x
    function: 0x03C4D0
    span: [0x03CC22, 0x03CC22]
    kind: computation
    writes: [0xFFFF104E]
