# Retired research capture profiles (archived 2026-09-21). NOT loaded by anything.
# Each one answered a single question and is superseded by the `tuning` profile in
# capture_profiles.yaml. Kept verbatim so analyses that cite these profiles can
# still look up what was polled; each capture's manifest also snapshots its profile.
schema_version: 1
profiles:
- name: fuel-did-research
  description: 'All-DID fuelling capture: derive Base Fuel Schedule from airflow and validate
    injector PW as the fuel-edit instrument'
  notes: "Purpose rewritten 2026-08-10. The original \u2014 \"identify raw 0x1209 as the Base\
    \ Fuel Schedule candidate\" \u2014 was retracted on 2026-08-08 when 0x1209 was identified\
    \ as MAF against simultaneous UpRev rungs. BFS has now survived a full passive-CAN sweep\
    \ and an all-DID sweep, so the question is no longer which field *is* BFS but whether it\
    \ can be computed, and whether injector PW can do BFS's job without reproducing its value.\n\
    \nBFS is a per-injection fuel time, so testing whether it can be derived needs airflow and\
    \ rpm co-observed (air mass per intake event = MAF x 20 / rpm on a V6), IAT for the density\
    \ correction that the g/s-only fit was missing, and injector PW as the candidate substitute.\
    \ Any one of them absent and the capture cannot answer either question \u2014 which is what\
    \ this tuple enforces.\n\n20 Hz requested; a floor of 15 leaves room for scheduling jitter\
    \ while still refusing the failure this exists to catch. Rungs are held ~10 s, so 15 Hz\
    \ is 150 samples per rung \u2014 far more than the fit needs. Range, not rate, is the binding\
    \ constraint on this experiment.\n\nInjector PW and BFS both move with a fuel edit, so a\
    \ capture whose calibration is unrecorded cannot be compared with any other.\n\nVehicle-specific\
    \ research profile naming this ECM's DIDs; the generic seed must never overwrite it.\n\n\
    Carries air-density and thermal context (CAPTURE_CONTEXT_MODE01 in src/collection/capture_profiles.py)\
    \ as of 2026-09-21: ECM_COOLANT_TEMP, ECM_INTAKE_AIR_TEMP_1106 added at ~1 Hz. The 2026-09-21\
    \ drive on this catalog had none of them, and its VE rested on a GPS-altitude baro estimate\
    \ and an assumed intake temperature."
  experimental: true
  mode01: {}
  mode01_batch_groups: []
  mode22:
  - ECM_RPM
  - ECM_AF_SENSOR_V_B1
  - ECM_AF_SENSOR_V_B2
