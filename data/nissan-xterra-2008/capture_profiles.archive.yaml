- name: rom-trace
  description: All-DID tuning drive with ROM map-cell traces (session held open)
  notes: 'First profile to combine the 2026-09-20/21 finds: final ignition timing (0x110A),
    long fuel trims, pedal, and five service-0x23 windows -- commanded phi + engine period,
    timing + rpm + cam-map rpm trace, the fuel-target map X trace, and the throttle-map X/Y
    traces. The traces say which ROM cell the ECM is reading, so cell residency and per-cell
    fuel/spark behaviour can be tabulated without re-deriving axis math. The three ECM_AIR_CHARGE_SLOT_*
    channels ride in the fuel_axis window only to settle, at steady cruise, which slot mirrors
    DID 0x1208; they are not telemetry. All-DID and continuous, so no Mode 01: short-term trim
    is not available here, and closed-loop fuelling is read from the A/F sensors against the
    commanded target plus the learned long-term cells.


    DIDs 0x1134 and 0x1201 ride along at 1 Hz for one reason: they are the cross-check side
    of the memory channels'' known-answer relations, so a capture carries the evidence needed
    to re-verify its own RAM addresses after the fact. The 2026-09-21 drive needed exactly that
    -- the truck had been reflashed the night before and there was no time to run the verifier
    first.'
