- name: fuel-target-research
  description: 'Research: target-AFR candidate DID 0x1134 held in one capture with Mode 01 PID
    0x44 commanded phi and PID 0x24 measured lambda (D03.8)'
  notes: 'D03.8 + D03.4, prepared 2026-09-18. tuning-hybrid-research narrowed to the fuel-target
    question (D03.8/D03.9/D04.3/D04.4) plus the target-AFR candidate 0x1134. Cam angles, bank-2
    A/F voltage and INTAKE_TEMP are dropped to buy cycle headroom; the parent profile is left
    untouched.


    D03.4: Mode 01 and Mode 22 alternate on this ECM, so a DID is read at most once per cycle.
    A 0.5 s cycle with every DID at weight 0.5 asks for exactly what the cycle can give (4.0
    x 0.5 = 2.0 Hz = 1 / 0.5 s), in the scheduler, the resolved plan and the capture contract
    alike.


    Vehicle-specific research profile naming this ECM''s DIDs; the generic seed must never overwrite
    it.


    Polls the final commanded equivalence ratio over service 0x23 (mem:ECM_TARGET_EQUIV_RATIO).
    That quantity is the reason this profile exists and it is not a DID: it lives at a RAM address,
    so DID 0x1134 -- the floor-clamped rich-side view that cannot tell fuel cut from stoich
    -- was the closest this capture could previously get. The channel is withheld automatically
    if the running calibration is not the one the address was verified against.


    Both memory channels name the `fuel_target` window, so one service-0x23 read returns the
    commanded target and the engine-period counter from a single ECU operation. That is the
    only same-instant multi-channel sample available on this ECM: it refuses batched Mode 22,
    so any two DIDs are two requests milliseconds apart. Engine period is not the collection
    route for rpm -- DID 0x1201 is, and is calibration-independent -- it is here so a target
    can be paired with engine speed at zero skew.


    Two memory windows now: `fuel_target` (commanded phi + engine period) and `spark` (ignition
    timing + engine speed). Each is one service-0x23 read, so the pair inside each window shares
    an ECU operation. Spark analysis is a timing-vs-rpm-vs-load question and the skew between
    two separate Mode 22 reads is the noise floor of any such comparison, which is the whole
    reason the windows exist.


    Carries air-density and thermal context (CAPTURE_CONTEXT_MODE01 in src/collection/capture_profiles.py)
    as of 2026-09-21: BAROMETRIC_PRESSURE, INTAKE_TEMP, COOLANT_TEMP added at ~1 Hz. The 2026-09-21
    drive on this catalog had none of them, and its VE rested on a GPS-altitude baro estimate
    and an assumed intake temperature.'
