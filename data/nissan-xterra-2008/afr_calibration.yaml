schema_version: 1
provenance:
  superseded_2026-10-07: >-
    The method, session, validation and do-not-replace notes below describe
    the UpRev-fitted voltage curve, which the operator replaced on 2026-10-07
    with ECM table 0xE644 itself (voltage_transfer.provenance, B06.7). The
    "do not replace this table with a fitted curve" rule still stands: the
    table is the ECM's, not a fit.
  method: synchronous UpRev K-line voltage/AFR cross-reference
  session: data/sessions/_uprev/2026-07-29T172029
  source_log: UpRev_Log7-29-2026_11-20-29_AM.csv
  note: Bank-1 median AFR at each sampled voltage; bank 2 independently agrees.
  pid_0x24_is_lambda_verified_2026-08-07: |
    PID 0x24 (`O2_WR_LAMBDA_S1`) is **λ** on this ECM, while PID 0x44
    (`COMMANDED_EQUIV_RATIO`) is **φ** — reciprocal conventions on the same
    ECM, so neither can be inferred from the other. Verified on
    `_capture-tuning-hybrid-research-2026-08-07T210613` by the one condition
    that separates them: under decel fuel cut 0x24 pegs at 2.000 (lean), where
    φ would go toward zero. Confirmed from the other side too — at an
    enrichment command of φ=1.16 (λ=0.862) the sensor read 0.866.

    Code already treated 0x24 as λ; this is the check that had never been run.
  cross_check_2026-08-07: |
    First capture holding PID 0x24 and the A/F voltage DIDs (0x1225/0x1226)
    on one clock — the resolution the campaign wanted for the −3.84 %
    UpRev-vs-Pi disagreement. On 174 same-cell pairs the two paths agree to
    +0.52 % near stoich. Rich of stoich the raw gap looks large (+17 % at
    12.4 AFR), but it **collapses to +1.38 % once the mixture is stable**
    (|dAFR/dt| < 1 AFR/s, n=7) — most of it is the ~0.34 s Mode-01/Mode-22
    acquisition skew during fast transients, not an instrument bias.

    NOT settled: this drive never sustained deep enrichment, so the richest
    stable comparison sits near 13.5 AFR, not the 12.6 the dispute is about.
    A sustained WOT pull on this profile puts both instruments there and
    closes it in one run.
  validated_2026-08-04: |
    Held-out check against the five OTHER logs carrying both `A/F WB-Bn (V)`
    and `AFR WB-Bn` (7-26 5:41PM, 7-27 9:59AM, 7-27 5:02PM, 7-28 10:42AM,
    7-29 6:10PM) — different days, different tunes, 10,211 uncensored paired
    samples, none of them the log this table was built from.

    Residual by region, worst log to best: MAE 0.0288 overall, and by AFR band
    power 10-13 **0.0049** (max 0.026) / 13-14.5 0.0082 / stoich 0.0399 /
    >20 0.162. In the WOT band the campaign actually uses, the error is below
    UpRev's own 0.01 reporting resolution, so the table is exact to the limit
    of what the reference can show. Per-log MAE spans 0.0040-0.0404 with no
    log an outlier, and the two banks agree (MAE 0.0294 / 0.0283, bias
    -0.021 / -0.021).

    The >20 band is the only weak region and it does not matter: that is
    decel fuel cut, which `censored_ceiling_afr` already excludes.

    Do NOT replace this table with a fitted curve. Parametric forms were
    tried against the same held-out split and are far worse — 1/AFR linear
    0.556 MAE, 1/AFR quadratic 0.211, log-linear 0.991, plain linear 1.833,
    against 0.006 for the monotone table. The sensor's transfer is not any
    of those shapes, and a 1/AFR fit also drifts 3.7% in slope between the
    two eras.
active_revision: ZS44A-20261111-2
# Settled 2026-08-05 (commit 78592f4). At WOT PID 0x44 reads 1.109-1.242:
# as lambda that is a commanded 16.3-18.3 AFR, which no ECU commands under
# power and which produced a -27% phantom delivery error. As phi it gives
# 11.83-13.25, matching the ROM fuel-target curve to -0.4% across four rpm
# bands. Both conventions read 1.0 at stoich, so this could only be settled
# under enrichment.
commanded_equiv_ratio_convention: phi
# D03.34 known answer, 2026-10-04. Mode 01 and Mode 22 alternate on this ECM,
# so PID and DID are never read together: pairs sit 1.25 s apart (median), and
# across the whole range transients and fuel-cut pegs (λ 2.000 on the PID) swamp
# the fit (slope ~2, r² ~0.5 for bank 1 too). Near stoich, where λ barely moves,
# the bank-1 control reproduces the 2026-08-07 answer (PID/DID 1.0041 here vs
# +0.52 % then), and bank 2 agrees at least as tightly. Rich of λ 0.97 is
# untested. Bank 2 at 2.0 s pairing: 0.9998, n=80.
wideband_bank_balance:
  session: _capture-ram-study-2026-10-04T204557
  comparison: >-
    compare_channels obd:O2_WR_LAMBDA_S5 -> did:ECM_AF_SENSOR_V_B2 through
    voltage_transfer / 14.7, PairingPolicy.within(1500ms), per-sample ratio over
    pairs with both sides in λ 0.97-1.03
  n_pairs: 51
  ratio_median: 0.9991
  ratio_spread: 0.0065
  verified_on: 2026-10-04
  basis: >-
    Same method, same session, bank 1 (PID 0x24 vs DID 0x1225): ratio 1.0041,
    IQR 0.9931-1.0164, n=55, reproducing the 2026-08-07 +0.52 % agreement.
    Bank 2: IQR 0.9914-1.0043 (spread is half the IQR). 0x28 answered inside a
    multi-PID Mode 01 response on 517 of 542 reads.
voltage_transfer:
  censored_floor_afr: 10.0
  # B06.7 (operator decision 2026-10-07): the transfer IS the ECM's A/F table
  # 0xE644 (breakpoints 0xF12A), read from the image, not a fit. The voltage
  # axis is the DID word (0x1225/0x1226) at 0.005 V per count and the ECM's
  # table input x2 is twice that word, so V = x2 x 0.0025: the stoich knot
  # x2 = 880 is 2.200 V, DID word 440 -- the nominal reference the ECM
  # re-references the sensor's AN8 sample to (word = AN8 - mean(AN11, clamped
  # 440-460) + 440). It is the ECM's word read through the ECM's table, at
  # barometric gain 1: baro_gain below is applied before it, per sample. The
  # load check refuses points that differ from the table.
  #
  # Replaced: the UpRev-fitted 22-point curve (2026-07-29 K-line log, held-out
  # MAE 0.0049 AFR in 10-13 AFR; provenance notes above). It reproduced this
  # table to 0.26 % over 10-13 AFR (always rich of it there) and 0.84 % at
  # worst, at the 924-count (2.31 V) knot, lean of stoich. Voltage-route values
  # moved by those amounts with the swap.
  provenance:
    method: rom_table
    source: ZS44A-20260920 ECU read (2026-10-04), ~/ecu-re out/lambda_tables.yaml, NOTES.md session 6
    table:
      address: '0xE644'
      axis_address: '0xF12A'
      axis_counts: [0, 502, 643, 808, 844, 880, 902, 924, 1011, 1089, 1156, 1274, 1620, 1791, 1838, 1960]
      values: [5000, 6480, 6782, 7222, 7304, 7387, 7474, 7568, 8105, 8638, 9122, 10000, 15000, 20000, 22000, 30000]
      afr_scale_inverse: 500
    volts_per_count: 0.0025
    # The ECM adds all three before PID 0x24/0x28; the table alone (and UpRev's
    # AFR column) has none. baro_gain is applied per sample (below); the two
    # offsets are voltage_residual_sources with their bounds.
    excludes: [baro_gain, learned_rear_o2_offset, rpm_bfs_offset]
    image_sha256: a46baa248f16db8d5ed9854913e614dd7d77b7579bb6c36bddb792741531be50
    verified_on: 2026-10-05
    notes: >-
      ECM table 0xE644, gain 1. UpRev's AFR lookup skips the gain and both
      offsets too, so UpRev's AFR and the gain-1 table are one uncorrected
      calculation, not two instruments. The ECM's lookup clamps both ends
      (10.0 AFR below x2 0, 60.0 above 1960 = 4.900 V), and so does the route.
  points:
    - {voltage: 0.0000, afr: 10.000}
    - {voltage: 1.2550, afr: 12.960}
    - {voltage: 1.6075, afr: 13.564}
    - {voltage: 2.0200, afr: 14.444}
    - {voltage: 2.1100, afr: 14.608}
    - {voltage: 2.2000, afr: 14.774}
    - {voltage: 2.2550, afr: 14.948}
    - {voltage: 2.3100, afr: 15.136}
    - {voltage: 2.5275, afr: 16.210}
    - {voltage: 2.7225, afr: 17.276}
    - {voltage: 2.8900, afr: 18.244}
    - {voltage: 3.1850, afr: 20.000}
    - {voltage: 4.0500, afr: 30.000}
    - {voltage: 4.4775, afr: 40.000}
    - {voltage: 4.5950, afr: 44.000}
    - {voltage: 4.9000, afr: 60.000}
# B06.7 (2026-10-05) -- the ECM's barometric gain on the A/F voltage word,
# applied by src/signals/afr.py voltage_to_afr to every voltage-route sample.
# Before table 0xE644 the ECM computes x2 = 2 x DID word and rescales it about
# stoich: x2' = 880 + (x2 - 880) x 128 / k, k looked up on its raw baro word
# 0xFFFF4C30 (high byte). k = 128 (gain 1) at sea level, ~113 (gain 1.13) at
# this truck's ~80 kPa, so the curve above without it reads lean of PID 0x24
# rich of stoich: +1.5 % at lambda 0.85-0.90, +2.5 % at 0.80-0.85, +3.9 % at
# 0.70-0.80 at ~81 kPa. A sample with no baro read within max_age_s is refused
# (baro_missing / baro_stale), never converted at gain 1.
baro_gain:
  baro_channel: 'obd:BAROMETRIC_PRESSURE'
  max_age_s: 60.0
  max_age_basis: >-
    Measured cadence, 2026-10-07: PID 0x33 is read every 15.0 s (median; p90
    16 s) on default drives (37 local drives 09-18..10-04) and every 1.0 s on
    the 09-21..23 tuning captures. 60 s is four default polls, so one or two
    dropped reads do not refuse a sample. Gaps longer than 60 s do occur (max
    76-197 s on several 09-18 drives, 626 s on 10-04T194342, 1225 s on
    09-21T225511), and samples inside them are baro_stale: on those drives 0-12
    % of the A/F DID reads (40 % on 09-21T225511, 100 % on the 2-read
    09-23T001344), reported per bank as baro_stale_fraction. Measured as span
    instead of samples it is larger (a drive's baro reads can cover a quarter
    of its rpm span on partially pulled sessions). Why not longer: baro moves
    only with altitude, and a 6 % grade at 25 m/s climbs 90 m in 60 s, ~0.9
    kPa at 80 kPa, under one count of k (< 0.2 % lambda at 0.85) -- the PID's
    own 1 kPa resolution; a 120 s window doubles that. The same window as
    fuel_comp_fit.yaml's baro gate.
  # PID 0x33 = (kPa x 512) >> 9: floored. The gain is looked up at the middle
  # of the 1 kPa interval the read stands for.
  pid_resolution_kpa: 1.0
  pid_rounding: floor
  stoich_x2_counts: 880
  stoich_address: '0x8F3A'
  k_unity: 128
  # k is a byte (RAM 0xFFFF36BB); the lookup's rounding is not decoded.
  k_resolution: 1
  table_address: '0xD00F'
  axis_address: '0xC90C'
  # Raw baro word >> 8, and the same breakpoints in kPa through word_scale.
  # The ROM pads the axis with 255s; the lookup clamps there.
  axis_raw: [0, 5, 6, 25, 50, 75, 100, 125, 150, 175, 200, 225, 255, 255, 255, 255]
  axis_kpa: [54.15, 55.28, 55.51, 59.81, 65.48, 71.14, 76.80, 82.47, 88.13, 93.80, 99.46, 105.12, 111.92, 111.92, 111.92, 111.92]
  k: [83, 84, 85, 90, 97, 103, 109, 115, 120, 124, 128, 131, 136, 136, 136, 136]
  word_scale:
    scale: 0.000885009765625
    offset: 54.1484375
    basis: >-
      kPa = (word x 58 / 128 + 27724) / 512, calibration words 0x89AA = 58 and
      0x92D4 = 27724 (Baro_kPa512 0x53B8C): the arithmetic PID 0x33 reports,
      so the table axis and the PID read one scale.
  skip:
    word_min: 0xC840
    word_max: 0xFE00
    basis: >-
      AF_baro_gain_correct (0x3FC8A) leaves x2 uncorrected while the raw word
      lies in 0xC840-0xFE00 (99.52-111.70 kPa, where k is 128-136 anyway), and
      while the raw sensor word 0xFFFF1116 is outside (0x15E6, 0xFF00): a
      sensor-range fault, which also sends PID 0x33 to its 101.3 kPa default,
      inside this window.
  provenance:
    method: rom_decompile
    revision: ZS44A-20260920
    image_sha256: a46baa248f16db8d5ed9854913e614dd7d77b7579bb6c36bddb792741531be50
    code:
      - 'AF_lambda_compute 0x3FAD0: x2 = 2 x 0xFFFF2B1A (snapshot of DID 0x1225 word 0xFFFF2C02)'
      - 'AF_baro_gain_correct 0x3FC8A: x2'' = max(0, 880 + (x2 - 880) x 128 / k), sdiv'
      - 'Lookup1D_u8_16pt 0x26CD4 on 0xFFFF4C30 >> 8: k (RAM 0xFFFF36BB)'
      - 'Lookup1D_u16_16pt 0x26D2C: table 0xE644 on axis 0xF12A -> AFR x 500'
      - 'Mode01_CAN_handler 0xD3AFC: PID 0x24 A,B = (0xFFFF46C2 << 14) / 3675, lambda = word / 7350'
    verified_on: 2026-10-05
    checked_on_data: >-
      One gain fitted on same-reply PID 0x24 pairs makes table 0xE644
      reproduce PID lambda within 0.3 % over lambda 0.70-1.30, and it follows
      baro as this table predicts: 09-17T191712/T201000 (baro unlogged, GPS
      2290-2430 m, ~75-77 kPa) 1.175 against 1.174-1.195; 09-21T223734 (80-81
      kPa) 1.120 against 1.130-1.139; 10-04T194342 (81-83 kPa) 1.105 on bank
      1 and on bank 2 / PID 0x28, against 1.109-1.130. The fit sits ~1 % under
      the prediction, the direction of the rpm x BFS offset PID 0x24 adds at
      high load (voltage_residual_sources).

# B06.7 -- what PID 0x24/0x28 carry that the voltage route still does not: the
# terms the transfer excludes besides the gain. Bounds are PID minus route, in
# AFR, per bank. tests/test_af_baro_gain.py builds its tolerance from them.
voltage_residual_sources:
  - name: learned_rear_o2_offset
    description: >-
      A learned offset added after the table: s16 in AFR x 500, clamped to
      +/-500 (+/-1.0 AFR), integrated by 0xA265C from the downstream O2
      sensor's filtered signal (a rear-O2 "sub-feedback" trim of the front
      sensor; the name is inferred, the chain is verified). Likely backup RAM.
    addresses: {1: '0xFFFF4CA4', 2: '0xFFFF4CA6'}
    bounds_afr: {1: [-1.0, 1.0], 2: [-1.0, 1.0]}
    observable: memory_read
    basis: >-
      Readable only with service 0x23; not in the memory catalog. Constant
      across lambda over a drive, and the gain is identity at stoich (x2 =
      880), so its value shows as the stoich-dwell difference between the
      gain-applied route and PID 0x24: -0.002 AFR on 09-21T223734, -0.056 AFR
      on 09-23T142926. Its +/-1 AFR clamp is 2-3x the gain's own effect, so a
      known answer differences it out at stoich rather than bounding by it.
  - name: rpm_bfs_offset
    description: >-
      Lookup2D_u16_8x8 (0x26AA4) on rpm (0xFFFF11D8; axis 0xE18E, 600-3600
      rpm) by base fuel schedule (0xFFFF1038, the previous cycle's DID 0x1208
      word; axis 0xE1AE, 3.01-15.05 ms), value - 0x8000 added in AFR x 500.
    addresses: {1: '0xACF4', 2: '0xAD74'}
    bounds_afr: {1: [-0.014, 0.074], 2: [-0.01, 0.044]}
    observable: operating_point
    basis: >-
      The bounds are the tables' own range (checked on load). Largest at the
      3600 rpm row and the 2000 rpm / high-BFS cells (+30 to +37 bank 1), so
      PID 0x24 reads up to ~0.07 AFR leaner than the route under load.
    table_afr_x500:
      1:
        - [-7, 0, -1, 3, 3, 3, 3, 3]
        - [2, 5, 2, 0, 2, 4, 4, 4]
        - [12, 11, 0, -1, 6, 5, 5, 5]
        - [29, 28, 26, 33, 20, 19, 33, 37]
        - [23, 12, 12, 11, 14, 12, 13, 21]
        - [22, 18, 13, 13, 12, 14, 14, 19]
        - [-6, 0, -1, 3, 15, 18, 19, 21]
        - [13, 26, 19, 30, 30, 30, 30, 30]
      2:
        - [0, 9, -1, 1, 0, -1, -1, -1]
        - [5, 6, -5, -5, -2, -2, -2, -2]
        - [10, 4, 7, 2, 1, -1, -1, -1]
        - [22, 17, 12, 11, 10, 7, 9, 9]
        - [14, 6, 10, 10, 10, 7, 3, 6]
        - [10, 7, 9, 10, 13, 13, 13, 7]
        - [0, 9, -1, 2, 10, 12, 13, 11]
        - [13, 21, 14, 16, 16, 16, 16, 16]
target_maps:
  - &targets_k106
    revision: ZS44A-k106
    load_axis_name: base_fuel_schedule
    load_axis_unit: ms
    # Raw RPM axis 18 20 28 38 48 50 58 68, decoded as count x 50 rpm.
    rpm_breakpoints: [1200, 1600, 2000, 2800, 3600, 4000, 4400, 5200]
    raw_rpm_breakpoints: [0x18, 0x20, 0x28, 0x38, 0x48, 0x50, 0x58, 0x68]
    # Raw BFS axis 34 44 5D 64 6C 6E 7F 80. Displayed values were transcribed
    # from UpRev; the approximately 0.1685 ms/count representation is retained
    # as raw values rather than treated as a cross-vehicle decoder.
    load_breakpoints: [8.76, 11.46, 15.67, 16.85, 18.20, 18.54, 21.40, 21.57]
    raw_load_breakpoints: [0x34, 0x44, 0x5D, 0x64, 0x6C, 0x6E, 0x7F, 0x80]
    # P02.15. The ECM reads a point past an edge of the map as that edge's
    # column or row, where the record below shows it: a base fuel schedule
    # below the first BFS breakpoint reads the first column, and an rpm above
    # the last rpm breakpoint (5,200) reads the last row. This is ECM program
    # behaviour, not calibration, so the 2026-09-20 revision inherits both
    # through the anchor (its flash changed one cell). Two edges have no
    # record, so rows past them stay NaN:
    #   - BFS above 21.57 ms: no logged row reaches it (UpRev max 18.70,
    #     CANary max ~18);
    #   - rpm below 1,200: every cell there is 14.7, so a clamp and anything
    #     else read the same and the logs cannot tell them apart.
    load_axis_out_of_range:
      below_first:
        behaviour: clamp
        method: uprev_target_afr_log_match
        logs:
          - data/sessions/_uprev/2026-08-04T164301
          - data/sessions/_uprev/2026-08-04T232712
        revision: ZS44A-k106
        rpm_min: 4400
        rpm_max: 5200
        rows: 46
        rows_within_tolerance: 32
        tolerance_afr: 0.05
        max_error_afr: 0.178
        median_error_afr: 0.031
        alternatives: >-
          Same 46 rows: linear extrapolation from the first two columns 2
          within 0.05 AFR (median error 2.23), the second column 0 within 0.05
          (median 0.99), the clamp 32 (median 0.031, 44 within 0.10).
        verified_on: 2026-10-03
        notes: >-
          Rows with BFS < 8.76 ms at 4,400-5,200 rpm in the 2026-08-04 UpRev
          logs, excluding 5 rows where UpRev displays fuel cut (TARGET AFR
          30.00). Only that band separates a clamp from extrapolation: below
          4,400 rpm the first two columns are both 14.7, and there all 404
          non-fuel-cut rows read 14.70. For scale, on-map rows match the
          bilinear lookup no better (275 of 582 within 0.05, median 0.061):
          UpRev reads its channels one after another over K-line, so rpm,
          BFS and target are not same-instant. Committed slice:
          tests/fixtures/load_axis_clamp/uprev_2026-08-04_target_afr.csv.
    rpm_axis_out_of_range:
      above_last:
        behaviour: clamp
        method: uprev_target_afr_log_match
        logs:
          - data/sessions/_uprev/2026-08-04T164301
        revision: ZS44A-k106
        rpm_min: 5213
        rpm_max: 5950
        rows: 105
        rows_within_tolerance: 62
        tolerance_afr: 0.05
        max_error_afr: 0.307
        median_error_afr: 0.035
        alternatives: >-
          Same 105 rows: linear extrapolation along rpm from the last two
          rows 0 within 0.05 AFR (3 within 0.10, median error 0.277, max
          1.691); the clamp 62 (90 within 0.10).
        verified_on: 2026-10-03
        notes: >-
          Every row above 5,200 rpm in the 2026-08-04 UpRev logs (none is fuel
          cut), looked up on the last rpm row at the row's BFS, with the load
          clamp above applied to the 30 rows below 8.76 ms. Of the 43 misses,
          40 read 11.83, the last load column at 5,200 rpm: near-WOT pedal
          enrichment selects that column whatever the BFS (see the vehicle
          skill), so they disagree about the column, not the row. Operator
          approval 2026-10-03.
    # AFR = 14.7 * 128 / raw cell count.
    afr:
      - [14.700000, 14.700000, 14.700000, 14.700000, 14.700000, 14.700000, 14.700000, 12.887671]
      - [14.700000, 14.700000, 14.700000, 14.700000, 14.700000, 14.700000, 14.700000, 12.628188]
