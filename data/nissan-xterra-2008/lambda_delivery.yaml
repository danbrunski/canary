# Commanded-versus-measured lambda delivery (B06) — the declared quantities.
#
# Schema: src/analysis/lambda_delivery.py (LambdaDeliveryDeclaration).
# Loaded with the memory catalog (data/dids.yaml) and tuning_providers.yaml,
# which it is cross-checked against: a mem: target must carry the catalog's
# unit and sentinel, and the provider registry's commanded_afr channel must be
# declared here as usable or refused.
#
# Evidence for every number below:
#   data/analyses/2026-09-22-lambda-delivery-and-warmup-inventory.md
# reproduced by scripts/lambda_delivery_evidence.py and pinned on a committed
# slice by tests/test_lambda_delivery_known_answers.py. The enrichment rule and
# its frozen transport delay (R05.16) are in
# docs/roadmap/tasks/R05-analysis-and-decode.md; the delay scan reproduces with
# `scripts/lambda_delivery_evidence.py --fit-enrichment-delay <informed_by>`.
schema_version: 1

residual:
  definition: "100 * (lambda_measured / lambda_target - 1)"
  unit: percent
  positive: lean

commanded_sources:
  # Preferred: the ECM's FINAL commanded equivalence ratio (program RAM).
  - name: ram_final_target
    spec: 'mem:ECM_TARGET_EQUIV_RATIO'
    quantity: phi
    sentinel_spec: 'mem:ECM_TARGET_EQUIV_RATIO_SENTINEL'
    valid_regimes: [closed_loop, enrichment]
    plausible_min: 0.9
    plausible_max: 1.4
    convention_evidence: >-
      phi, by chain rather than by assertion. (1) Its catalog known answer:
      word 0x4A80 = 1.1640625 is DID 0x1134 raw 74, the Mode 01 PID 0x44
      value observed there (data/dids.yaml). (2) On the 2026-09-21 captures
      it equals PID 0x44 EXACTLY on every steady enrichment pair (7/7, 10/10
      and 3/3 on the three drives, acquisition-time paired within 250 ms),
      and PID 0x44 above stoich is phi (78592f4, re-derived against the
      lambda sensor on 2026-09-21T223734: 18 off-stoich pairs, 2.38 % as phi
      against 24.44 % as lambda). A direct check of this channel against the
      lambda sensor is NOT available: enrichment never held the declared
      dwell often enough (0-5 steady off-stoich pairs per drive), so
      check_target_convention returns `unresolvable` there and says so.
    limitations:
      - >-
        Polled at ~1 Hz on the 2026-09-21 profiles (1,085-1,376 reads per
        20-25 min), so target steps are located to about a second; a dwell
        rule, not a sub-second lag fit, is what this cadence supports.
  # Mode 01 PID 0x44. phi convention settled at WOT (commit 78592f4) and
  # recorded in afr_calibration.yaml, so it defers to that record.
  - name: mode01_pid_0x44
    spec: 'obd:COMMANDED_EQUIV_RATIO'
    quantity: from_calibration
    fuel_cut_value: 0.0
    valid_regimes: [enrichment]
    plausible_min: 0.8
    plausible_max: 1.4
    convention_evidence: >-
      afr_calibration.yaml commanded_equiv_ratio_convention: phi (78592f4:
      at WOT 1.109-1.242 as phi matches the ROM target curve to -0.4 %, as
      lambda it is a -27 % phantom error).
    limitations:
      - >-
        NOT the final target in closed loop, and not even phi there. With the
        RAM target holding exactly 1.0, PID 0x44 read quantized values
        (0.8707, 0.9796, 1.0204, ...) and matched the RAM word on 8-29 % of
        steady pairs (ratio p95 1.1485). Judged per side against the lambda
        sensor, its readings BELOW 1.0 track measured lambda (18 pairs,
        2.40 % as lambda against 24.09 % as phi on 2026-09-21T223734; 43
        pairs, 1.34 % on 232153) — a sensor-like quantity, not a command.
        It is therefore valid only for enrichment, and closed-loop rows from
        it are refused as source_not_valid_in_regime.

refused_commanded:
  - spec: 'did:ECM_ENRICHMENT_TARGET_EQUIV_RATIO_CANDIDATE'
    reason: >-
      DID 0x1134 is the floor-clamped high byte of the RAM target (raw =
      max(64, floor(word/256)) on 5,000/5,000 same-reply observations): it
      holds raw 64 at both stoich and fuel cut, so it cannot tell cut from
      stoich, and its 1/64 resolution is 1.6 % of phi.

# B06.7 (2026-10-05): `sensor` names the physical sensor each route reads.
# There is one A/F sensor per bank: PID 0x24 is the ECM's lambda computed from
# the same word DID 0x1225 reports (x2 = 2 x word, barometric gain, table
# 0xE644, learned rear-O2 offset, rpm x BFS offset; docs/ecu-firmware-analysis.md
# "A/F sensor and λ chain"), so PID 0x24 and af_voltage_b1 are one instrument
# (af_sensor_b1), and PID 0x28 and af_voltage_b2 another (af_sensor_b2). The
# declaration refuses a disagreement that calls two same-sensor routes
# independent, and LambdaDeliveryDeclaration.independent_sensors counts them once.
measured_sources:
  - name: ecm_lambda_pid_0x24
    spec: 'obd:O2_WR_LAMBDA_S1'
    quantity: lambda
    sensor: af_sensor_b1
    rail_high: 1.999
    convention_evidence: >-
      lambda, verified 2026-08-07 on _capture-tuning-hybrid-research-
      2026-08-07T210613: under decel fuel cut it pegs at 2.000 (lean), where
      phi would fall toward zero; at a phi=1.16 command (lambda 0.862) it read
      0.866 (afr_calibration.yaml provenance).
  # Bank 2's wide-band lambda (Mode 01 PID 0x28, the second equivalence-ratio
  # PID this ECM reports). Operator decision 2026-10-04 (N02.3): declared so
  # bank-2 delivery error is a residual, not an unjudged value.
  - name: ecm_lambda_pid_0x28
    spec: 'obd:O2_WR_LAMBDA_S5'
    quantity: lambda
    sensor: af_sensor_b2
    rail_high: 1.999
    convention_evidence: >-
      lambda, the same SAE J1979 equivalence-ratio encoding as PID 0x24 and
      the same convention behaviour. On 2026-10-04T194342 it equals bank 1's
      PID 0x24 read in the same Mode 01 batch: S5/S1 median 1.0002 over 1,576
      acquisition-time pairs (1,518 off the rail; p10-p90 0.990-1.020; 172
      rich pairs below 0.95 at median 1.0045). Under decel fuel cut it pegs at
      its 2.000 lean rail exactly as PID 0x24 does (3 of 3 PID 0x44 = 0 reads
      on 194342, both sensors; 7 of 9 on _capture-ram-study-2026-10-04T204557,
      where PID 0x24 is at the rail on 9 of 12 -- the sensor lagging the cut,
      as on bank 1), where phi would fall toward zero. Logged only from
      2026-10-04.
  - name: af_voltage_b1
    spec: 'did:ECM_AF_SENSOR_V_B1'
    quantity: afr
    transform: voltage_afr
    sensor: af_sensor_b1
    convention_evidence: >-
      Calibrated voltage-to-AFR transfer, afr_calibration.yaml
      voltage_transfer (ECM table 0xE644 at gain 1; UpRev held-out MAE 0.0049
      AFR in the 10-13 band), converted at the ECM's barometric gain from
      obd:BAROMETRIC_PRESSURE as of each read (B06.7; a read with none is
      baro_missing / baro_stale); censored outside
      censored_floor_afr/censored_ceiling_afr. Same sensor as PID 0x24: it
      lacks only the learned rear-O2 offset and the rpm x BFS offset
      (afr_calibration.yaml voltage_residual_sources).
  - name: af_voltage_b2
    spec: 'did:ECM_AF_SENSOR_V_B2'
    quantity: afr
    transform: voltage_afr
    sensor: af_sensor_b2
    convention_evidence: >-
      Same transfer and barometric gain as bank 1; the two banks agree
      (MAE 0.0294 / 0.0283 AFR against UpRev, afr_calibration.yaml). Same
      sensor as PID 0x28.

source_disagreements:
  - between: [ecm_lambda_pid_0x24, af_voltage_b1]
    relation: same_sensor
    value_pct: -3.84
    conditions: >-
      WOT enrichment near 12.6 AFR, UpRev K-line conversion vs the Pi's
      Mode 01 lambda (2026-08-05, commit 78592f4)
    status: unresolved
    evidence: >-
      2026-08-07 same-clock cross-check: +0.52 % near stoich (174 pairs);
      rich of stoich +1.38 % once the mixture is stable (n=7), the rest being
      ~0.34 s Mode-01/Mode-22 acquisition skew. Never settled at 12.6 AFR
      because no drive has sustained deep enrichment on that profile
      (afr_calibration.yaml cross_check_2026-08-07). Neither source may be
      silently preferred: every result names its measured source.
    # B06.7 (2026-10-05, revised 2026-10-07): a partial mechanism. It gives
    # the direction and about 60 % of the size; the rest is not explained.
    explanation:
      mechanism: >-
        One sensor, two calculations. PID 0x24 is the ECM's lambda from the
        DID 0x1225 word after its barometric gain (x2' = 880 + (x2 - 880) x
        128 / k); UpRev's AFR is the same table 0xE644 without the gain, so it
        reads lean of PID 0x24 rich of stoich at altitude
        (afr_calibration.yaml baro_gain).
      predicted_pct: -2.36
      unexplained_pct: -1.48
      explained_on: 2026-10-07
      evidence: >-
        At 12.6 AFR the gain-1 table reads 12.90 AFR at 80 kPa (the 2026-08
        drives' baro): PID/voltage -2.36 % (-2.95 % at 76 kPa). The remaining
        -1.48 % is not accounted for. The learned rear-O2 offset could cover it
        by its +/-1 AFR clamp, but where it was measured (the stoich-dwell
        difference, 2026-09-21: -0.002 AFR; 2026-09-23: -0.056 AFR) it is
        0.02-0.45 %, too small; the rpm x BFS offset acts the other way (up to
        +0.07 AFR, PID leaner). Candidates not checked: the 2026-08-05 pairing
        (UpRev's K-line clock against the Pi's Mode 01) and a different rear
        offset on that drive. With the gain applied, the bank-1 route agrees
        with PID 0x24 on steady enrichment of 09-21T223734 within its declared
        tolerance (tests/test_af_baro_gain.py); 12.6 AFR WOT was not re-measured.

eligibility:
  # Target-defined regime: the RAM word reads exactly 1.0 whenever it is not
  # enriching, so +-0.01 separates stoich from the smallest enrichment step
  # (1/64 phi above 1.0 is the coarsest the RAM word has shown).
  closed_loop_band: 0.01
  max_target_gap_s: 2.5
  # One rule per regime (R05.16). The closed-loop numbers applied to WOT pulls
  # left every enrichment result empty: the target ramps with rpm through a
  # pull and a lift or shift cuts fuel just before it, so a 3 s / 0.005 dwell
  # and a 15 s holdoff admit nothing.
  regimes:
    closed_loop:
      conditions: >-
        Closed-loop cruise and idle on the RAM target (~1 Hz), 2026-09-21.
      steady_target_dwell_s: 3.0
      target_step_tolerance: 0.005
      post_fuel_cut_holdoff_s: 15.0
      transport_delays:
        ram_final_target:
          status: not_estimated
          seconds: null
          note: >-
            Not fitted for closed loop: the target holds exactly 1.0 there, so a
            lag scan has no steps to resolve; the 3 s dwell stands in for it.
        mode01_pid_0x44:
          status: not_estimated
          seconds: null
          note: >-
            PID 0x44 is not a closed-loop target (source_not_valid_in_regime);
            nothing to fit.
      informed_by:
        - _capture-fuel-target-research-2026-09-21T195844
        - _capture-tuning-2026-09-21T223734
        - _capture-tuning-2026-09-21T232153
      held_out: []
      justification: >-
        Dwell: the RAM target is polled at ~1 Hz and the sensor sits downstream
        of the exhaust, so a sample is steady only when the target has held for
        at least three polls; transitions inside that window are the tip-in lag
        a delivery residual must not report. Post-cut holdoff: after decel fuel
        cut the ECM leaves the target at 1.0 while measured lambda runs rich for
        several seconds (post-cut recovery with PID 0x44 at 0.8707). Measured
        settling times (lambda within 3 % of target and staying there 2 s) over
        112 cut episodes on the three informing drives: median 5.6-8.5 s, p90
        12.2-17.6 s, max 18.4-22.9 s, and 39 episodes never settled before the
        next cut or a 30 s horizon. 15 s is about the pooled p90; it does not
        make every post-cut sample steady, and the residuals that remain are
        reported as measurements, not as a clean floor. No held-out judgement
        was made for these constants.
    enrichment:
      conditions: >-
        Power enrichment (commanded lambda below 1 - closed_loop_band), mostly
        WOT pulls in 2nd-3rd with shift lifts, 2026-09-17..23, calibration
        ZS44A; PID 0x44 at ~3.8 Hz, RAM target at ~0.9 Hz, PID 0x24 lambda at
        ~3.8 Hz, all on stored acquisition clocks.
      steady_target_dwell_s: 0.6
      target_step_tolerance: 0.01
      post_fuel_cut_holdoff_s: 6.0
      # One delay per commanded source, each fitted on its own route. Every
      # consumer's default (Mode 01) route uses PID 0x44, which models none.
      transport_delays:
        ram_final_target:
          status: frozen
          seconds: 0.1
          # Per-pair bracket: every candidate the per-read sign test cannot
          # tell from 0.10 s at alpha 0.05 (per_pair_bracket). Consumers
          # re-run at both ends and flag a result that changes (R05.16).
          bracket_s: [0.0, 0.5]
          fitted_on:
            - _capture-fuel-target-research-2026-09-20T222101
            - _capture-fuel-target-research-2026-09-20T224503
            - _capture-fuel-target-research-2026-09-21T195844
            - _capture-tuning-2026-09-21T223734
            - _capture-tuning-2026-09-21T232153
          method: >-
            estimate_transport_delay(regimes=[enrichment]) — mean |residual|
            over 161 enrichment RAM-target reads against PID 0x24, candidates
            0-0.6 s by 0.05 s, smallest arg-min — then per_pair_delay_support /
            per_pair_bracket (exact two-sided sign test per read) for its
            uncertainty.
          note: >-
            WEAKLY SUPPORTED. Mean |residual| is 4.28 % at 0 s and 3.56 % at
            0.10 s (3.60 % at 0.05 and 0.20, 4.65 % at 0.30), but that gain is
            a difference of means carried by a few large reads. Read by read,
            0.10 s against 0 s is better on 58, worse on 41 and identical on 62
            (sign test p = 0.11), and no candidate from 0 to 0.5 s is
            distinguishable from 0.10 s (per-pair bracket 0.0-0.5 s). Adding
            _capture-tuning-2026-09-23T164007 gives 70 / 54 / 69, p = 0.18.
            Still preferred over 0 s because exhaust transport is strictly
            positive, and on this route (the RAM read has its own acquisition
            time, ~110 ms after the lambda read, p10-p90 80-250 ms) the reads
            that change favour it; on the PID 0x44 route the same comparison
            favours 0 s. The ~0.9 Hz RAM poll dates a target step only to its
            poll gap, which biases any fitted lag short; separate tip-in and
            lift delays are not resolvable from 161 reads. Enrichment only:
            transport delay falls as exhaust flow rises.
        mode01_pid_0x44:
          status: not_estimated
          seconds: null
          note: >-
            Not modelled: PID 0x44 and 0x24 share a Mode 01 batch (~0-14 ms
            apart, ~250 ms cycle), so a shift only changes which lambda read
            pairs at multiples of the cycle, and a 0.10 s shift lands between
            the same-batch read and the next, making the pairing depend on poll
            jitter (D04.3). Read by read on the seven informing drives (3412
            enrichment reads), every shift from 0.10 to 0.60 s is worse than
            0 s (0.10 s: 1041 better / 1150 worse, p = 0.02; 0.25 s, one cycle:
            1507 / 1681, p = 0.002), so no batch-multiple delay is justified;
            each target read pairs with the lambda read nearest it as
            acquired.
      informed_by:
        - _capture-fuel-target-research-2026-09-20T222101
        - _capture-fuel-target-research-2026-09-20T224503
        - _capture-fuel-target-research-2026-09-21T195844
        - _capture-tuning-2026-09-21T223734
        - _capture-tuning-2026-09-21T232153
        # Evaluated under candidate constants in the first pass, so not
        # held out (R05.16 verification).
        - _capture-tuning-2026-09-23T164007
        - _capture-tuning-hybrid-research-2026-09-17T184821
      held_out:
        - _capture-tuning-2026-09-22T170459
        - _capture-tuning-2026-09-22T235224
        - _capture-tuning-2026-09-23T142926
        - _capture-tuning-hybrid-research-2026-09-17T191712
        - _capture-tuning-hybrid-research-2026-09-17T201000
      justification: >-
        Measured on the seven informing drives, PID 0x44 route, no delay
        (as every Mode 01 consumer pairs). Tolerance 0.01 lambda over a 0.6 s
        dwell: on their 682 WOT open-loop reads the residual median is +2.45 /
        +2.54 % where the target moved < 0.0005 / 0.005-0.01 lambda over the
        prior 0.6 s, +2.32 % at 0.01-0.02, and +3.11 / +4.34 % at 0.02-0.05 /
        more — the lean reading of a target still ramping with rpm while the
        sensor lags it. A 0.01 lambda move is worth at most 0.01/0.85 = 1.2 %,
        under the 1.49 % WOT delivery noise floor. 0.6 s covers one plausible
        transport delay (the RAM route's weakly supported 0.10 s, bracket to
        0.5 s) plus pairing within one Mode 01 cycle. Holdoff 6 s: across 3412
        enrichment reads the residual quartiles drift with seconds since the
        last fuel cut until 6 s (medians -0.91 / +0.54 / +1.32 / +1.27 % in
        the 2-6 s bins, p25 to -5.2 %) and hold from there (+2.09, +1.79,
        +1.78, +1.91, +2.25 % at 6-8, 8-10, 10-15, 15-30, 30+ s). On WOT reads
        alone it settles by about 4 s; 6 s is the pooled figure. The
        closed-loop 15 s holdoff measures the ECM leaving its target at 1.0
        through a rich recovery, which does not happen when the target itself
        is rich. Judged on held_out (R05-analysis-and-decode.md, R05.16).

acquisition:
  max_separation_s: 0.25
  evidence: >-
    Stored acquisition clocks on the 2026-09-21 captures: the RAM target and
    the Mode 01 PIDs are read in one poll cycle. Target-to-lambda-sensor
    separation is median 0.093-0.104 s, p95 0.130-0.142 s, and 1085/1085,
    926/927 and 1375/1376 target reads are inside 0.25 s on the three
    drives. This is polling skew, not exhaust transport.

noise_floors:
  # The only measured delivery floor is WOT-only; it is refused for closed
  # loop rather than quoted ~16x too tight.
  enrichment:
    channel: delivery_error_pct
    conditions: 'WOT: throttle>=85, 3000-5000 rpm, matched on rpm x MAF voltage, 50 ms grid'
