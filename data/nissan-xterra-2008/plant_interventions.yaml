        frozen_rules:
          sha256: c458d1a663b655e29543030fad5f791e66754454b12774c13c322221d3c3443e
          frozen_at: 2026-10-16T06:33:31Z
        evidence: >-
          Decoded chain (ecu_application_model.yaml, src.decode.air_charge):
          Tp = floor(floor(K x Qa x m / 256) / (d x N)) x 0x23CB >> 16 with Qa
          = 0xFFFF2100, N = max(0x40, 0xFFFF1204) (1.5625 rpm per count, so
          the floor binds below 100 rpm only); 0xFFFF105C = min(0xFFFF, (Tp x
          FC) >> 7); steady BFS = min(0xFFFF, 4 x 0xFFFF105C, ceiling << 8).
          So BFS x rpm / MAF = c x K x FC / 128 where (1) BFS is below the
          ceiling: a read at or above 65,280 is *_at_ceiling and a draw with
          base or candidate there is left out of the predicted interval
          (draws_at_ceiling); (2) the fill filter is at its fixed point, the
          transient term 0xFFFF105A is 0 and the airflow low-pass (0xFFFF20A8,
          and the 0xFFFF233C speed branch while 0xFFFF283B bit 6) has settled:
          post reads must pass the plant's rpm and MAF steady windows
          (transient) and the design points are E07.3-steady; (3) the
          after-start hot-wire term is zeroed once warm (cold); (4) MAF and
          rpm are paired (*_maf_unpaired). Not excluded, carried by the floor
          on both sides: N from PID 0x0C is the 12.5 rpm word w1210, which
          bounds w1204 to eight counts (up to 1.7 % at 750 rpm), and PID 0x10
          MAF stands for Qa (the curve 0xE27E output after the low-pass and
          the purge hold, unmodelled). The MAF-fault and cranking branches are
          assumed absent, as in E05.2. The predicted change is unchanged: at a
          design point base and candidate share its rpm and airflow, so the
          normalised change is the traces' candidate / base - 1. target_phi
          keeps raw.
