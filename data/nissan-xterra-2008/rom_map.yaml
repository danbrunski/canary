  # from the image at run time, never transcribed here.
  - id: throttle_area_axis
    name: Throttle effective-area curve axis (4 x throttle counts above closed)
    offset: 0xEE6A
    rows: 1
    cols: 32
    dtype: be16
    confidence: verified
    evidence: >-
      FUN_0003c4d0 passes r5 = GBR 0xEDCA + 0xA0 = 0xEE6A (0x03C592-0x03C596)
      to 0x026D58, whose search 0x027154 compares these 32 words with
      min(0xFFFF, 4 x w2CC8) (0x03C582 shll2), w2CC8 being throttle sensor A's
      count above its learned closed position. 0..3,172, i.e. 0..793 counts,
      0..96.9 % on PID 0x11. The ETC code (0x07248C) searches the same pair
      the other way round to turn a target area into a position. Equal in the
      UpRev base, k106, 20260920 and 20261004.
  - id: throttle_area_curve
    name: Throttle effective area
    offset: 0xDD94
    rows: 1
    cols: 32
    dtype: be16
    axes: {cols: throttle_area_axis}
    confidence: verified
    evidence: >-
      r4 = 0xDD94 at 0x03C590, read by 0x026D58 at the hit and the next entry
      and interpolated by 0x026F10; the result is w4136, and w2C32 = clamp(it -
      w63FC, 0, 0xFFFF) (0x03C5A4-0x03C5C8). Rising, 112..48,060, convex.
      Relative area units: idle air, purge/4 and the ETC target area add and
      subtract in the same unit, which the code never names. Reproduces the
      logged 0xFFFF118A on the 2026-10-04 ram-study capture through the chain
