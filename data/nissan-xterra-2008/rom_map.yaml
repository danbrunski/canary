schema_version: 1
# W08.1: the 2008 Xterra ECM's 1 MiB flash image, as data
# (src/analysis/rom_map.py validates it).
#
# Sources: the image read from the ECU on 2026-10-04, byte-identical to the
# decoded ZS44A-Tuned-20260920.OsirisROM (docs/skunkworks/uprev-backup-20261004.md);
# docs/uprev-rom-table-verification.md, "2026-10-04: image map and three
# candidate tables"; the erase geometry seen in the 2026-09-20 flash
# (docs/skunkworks/uprev-flash-20260920.md); the slot tables, Load Point
# Scaler and map selector from the firmware (docs/ecu-firmware-analysis.md).
# Code addresses quoted in evidence are where the ECM's program reads a
# table; the disassembly itself stays outside Git.
#
# Offsets are into the plain image (the decoded ROMData, or what an ECU read
# returns), never Osiris container offsets. Confidence is a field:
#   verified  checked against an independent answer;
#   inferred  strong evidence, not yet confirmed by a deliberate single-change
#             save;
#   unknown   bytes whose meaning is not known.
# Every fact rom_targets.yaml relies on (Fuel Targets offset and slot, axes,
# checksum words) is checked against that file when this one loads.
image_size: 1048576
calibration_ids: [1ZS44A00000]
calibration_id:
  offset: 0x8204
  length: 11
  evidence: >-
    ASCII 1ZS44A00000 at 0x008204, where the checksum range starts. The ECM
    reports the same id for service 0x21 local identifier 0x10
    (data/dids.yaml access.calibration_id). UpRev flashes keep it unchanged.
refused_formats:
  - name: UpRev encrypted ROM backup
    size: 1048592
    prefix_hex: 32bec582
    reason: >-
      This is an UpRev ROM backup (.bin, 1,048,592 bytes). UpRev encrypts it
      on the PC after reading the ECU, with a key held in its own software, so
      CANary cannot decode it (docs/skunkworks/uprev-backup-20261004.md).
      Upload the .OsirisROM instead, or back up the ECU from CANary.
# Identical to rom_targets.yaml; load_rom_map refuses any difference.
checksums:
  algorithm: be32_sum_xor
  start: 0x8204
  excluded: [0x20000, 0x9598, 0x95A0]
  sum_offset: 0x95A0
  xor_offset: 0x9598
  markers:
    0x20008: 0xFFFF7FFC
    0x20010: 0xFFFF7FFC
# The loader's geometry in the 2026-09-20 flash: sixteen range CRCs partition
# the image, and UpRev erased sectors 8 and 15. That fixes those two sectors;
# the others are the CRC partitions, which no erase command confirmed.
erase_sectors:
  - {index: 0, start: 0x000000, end: 0x000FFF, confidence: inferred, evidence: 4 KiB range-CRC partition (2026-09-20); never erased in a capture.}
  - {index: 1, start: 0x001000, end: 0x001FFF, confidence: inferred, evidence: 4 KiB range-CRC partition (2026-09-20); never erased in a capture.}
  - {index: 2, start: 0x002000, end: 0x002FFF, confidence: inferred, evidence: 4 KiB range-CRC partition (2026-09-20); never erased in a capture.}
  - {index: 3, start: 0x003000, end: 0x003FFF, confidence: inferred, evidence: 4 KiB range-CRC partition (2026-09-20); never erased in a capture.}
  - {index: 4, start: 0x004000, end: 0x004FFF, confidence: inferred, evidence: 4 KiB range-CRC partition (2026-09-20); never erased in a capture.}
  - {index: 5, start: 0x005000, end: 0x005FFF, confidence: inferred, evidence: 4 KiB range-CRC partition (2026-09-20); never erased in a capture.}
  - {index: 6, start: 0x006000, end: 0x006FFF, confidence: inferred, evidence: 4 KiB range-CRC partition (2026-09-20); never erased in a capture.}
  - {index: 7, start: 0x007000, end: 0x007FFF, confidence: inferred, evidence: 4 KiB range-CRC partition (2026-09-20); never erased in a capture.}
  - {index: 8, start: 0x008000, end: 0x01FFFF, confidence: verified, evidence: 'EraseFlashBlock sector 08 acknowledged in the 2026-09-20 flash; the checksum words changed here.'}
  - {index: 9, start: 0x020000, end: 0x03FFFF, confidence: inferred, evidence: 128 KiB range-CRC partition (2026-09-20); never erased in a capture.}
  - {index: 10, start: 0x040000, end: 0x05FFFF, confidence: inferred, evidence: 128 KiB range-CRC partition (2026-09-20); never erased in a capture.}
  - {index: 11, start: 0x060000, end: 0x07FFFF, confidence: inferred, evidence: 128 KiB range-CRC partition (2026-09-20); never erased in a capture.}
  - {index: 12, start: 0x080000, end: 0x09FFFF, confidence: inferred, evidence: 128 KiB range-CRC partition (2026-09-20); never erased in a capture.}
  - {index: 13, start: 0x0A0000, end: 0x0BFFFF, confidence: inferred, evidence: 128 KiB range-CRC partition (2026-09-20); never erased in a capture.}
  - {index: 14, start: 0x0C0000, end: 0x0DFFFF, confidence: inferred, evidence: 128 KiB range-CRC partition (2026-09-20); never erased in a capture.}
  - {index: 15, start: 0x0E0000, end: 0x0FFFFF, confidence: verified, evidence: 'EraseFlashBlock sector 0F acknowledged in the 2026-09-20 flash; the Fuel Targets byte changed here.'}
# Absolute spans. One may sit wholly inside another; partial overlaps are
# refused.
regions:
  - name: Boot
    start: 0x000000
    end: 0x007FFF
    kind: boot
    confidence: inferred
    added_by_uprev: false
    evidence: >-
      Starts with the boot vector table. The span is erase sectors 0-7, which
      the 2026-09-20 flash did not touch; the factory and ZS44A UpRev backups'
      ciphertexts agree through it.
  - name: Boot vector table
    start: 0x000000
    end: 0x000007
    kind: boot
    confidence: verified
    added_by_uprev: false
    evidence: Reset vector 0x0000261C and initial stack 0xFFFF7FFC, read from the bytes.
  - name: Erased
    start: 0x006000
    end: 0x006EFD
    kind: erased
    confidence: verified
    added_by_uprev: false
    evidence: All 0xFF in the 2026-10-04 image.
  - name: Data in the erased page
    start: 0x006EFE
    end: 0x006F2D
    kind: unknown
    confidence: unknown
    added_by_uprev: false
    evidence: >-
      48 bytes that are not 0xFF, inside the 0x006000-0x007FFF range the
      2026-10-04 notes list as erased. The bytes say so; what they are is
      unknown.
  - name: Erased
    start: 0x006F2E
    end: 0x007FFF
    kind: erased
    confidence: verified
    added_by_uprev: false
    evidence: All 0xFF in the 2026-10-04 image.
  - name: Calibration
    start: 0x008000
    end: 0x01FFFF
    kind: calibration
    confidence: inferred
    added_by_uprev: false
    evidence: >-
      Erase sector 8, which UpRev erased and rewrote for a one-cell calibration
      edit on 2026-09-20. It holds the calibration ID, the checksum words, the
      calibration's own Fuel Targets copy and the axes. The checksum covers
      more than this: it runs from 0x008204 to the end of the image.
  - name: Calibration ID
    start: 0x008204
    end: 0x00820E
    kind: calibration
    confidence: verified
    added_by_uprev: false
    evidence: ASCII 1ZS44A00000, equal to the ECM-reported id; the checksum range starts here.
  - name: Checksum XOR word
    start: 0x009598
    end: 0x00959B
    kind: calibration
    confidence: verified
    added_by_uprev: false
    evidence: The BE32 XOR over 0x008204 onward (excluding 0x020000 and both words) equals it; changed with the 2026-09-20 edit.
  - name: Checksum sum word
    start: 0x0095A0
    end: 0x0095A3
    kind: calibration
    confidence: verified
    added_by_uprev: false
    evidence: The BE32 sum over the same words equals it; changed with the 2026-09-20 edit.
  - name: Erased
    start: 0x012000
    end: 0x01FFFF
    kind: erased
    confidence: verified
    added_by_uprev: false
    evidence: All 0xFF in the 2026-10-04 image.
  - name: Application
    start: 0x020000
    end: 0x0DFFFF
    kind: application
    confidence: inferred
    added_by_uprev: false
    evidence: >-
      Erase sectors 9-14, unchanged and not programmed by the 2026-09-20 flash.
      Starts with the application header and vector table. Its end is the
      sector boundary, not a decoded program size.
  - name: Application header word
    start: 0x020000
    end: 0x020003
    kind: application
    confidence: verified
    added_by_uprev: false
    evidence: 0x1F95FFFF; the checksum skips this word.
  - name: Application vector table
    start: 0x020004
    end: 0x02000B
    kind: application
    confidence: verified
    added_by_uprev: false
    evidence: Reset vector 0x00021C24 and stack 0xFFFF7FFC, read from the bytes.
  - name: Sparse block with UpRev text
    start: 0x0DE000
    end: 0x0DEFFF
    kind: uprev
    confidence: inferred
    added_by_uprev: true
    evidence: >-
      The text UpRev at 0x0DE194, an UpRev ROM-patch banner, with data to
      0x0DE47F and 0xFF after. Taken as code UpRev added; not diffed against
      the factory image, which survives only inside encrypted backups.
  - name: Erased
    start: 0x0DF000
    end: 0x0DFFFF
    kind: erased
    confidence: verified
    added_by_uprev: false
    evidence: All 0xFF in the 2026-10-04 image.
  - name: UpRev map sector
    start: 0x0E0000
    end: 0x0FFFFF
    kind: uprev
    confidence: inferred
    added_by_uprev: true
    evidence: >-
      Erase sector 15, which UpRev erases and rewrites on every flash. It holds
      the five map slots. Whether the factory image used this sector is not
      known (the factory image survives only encrypted).
  - name: UpRev map slots
    start: 0x0E0000
    end: 0x0E27FF
    kind: uprev
    confidence: inferred
    added_by_uprev: true
    evidence: >-
      Five 2 KiB copies (map_slots below). The slot structure is verified from
      the bytes; attributing it to UpRev rests on UpRev's Map 1-5 editing
      changing exactly these bytes.
  - name: Erased
    start: 0x0E3000
    end: 0x0FEFFF
    kind: erased
    confidence: verified
    added_by_uprev: false
    evidence: All 0xFF in the 2026-10-04 image.
  - name: End values
    start: 0x0FFF80
    end: 0x0FFF87
    kind: unknown
    confidence: unknown
    added_by_uprev: false
    evidence: >-
      0x01 at 0x0FFF80 and 0x4E4855F9 at 0x0FFF84, read from the bytes. Meaning
      unknown; they sit in the sector UpRev rewrites on every flash.
map_slots:
  base: 0x0E0000
  stride: 0x800
  count: 5
  confidence: verified
  evidence: >-
    Five 2 KiB copies at 0x0E0000 + (n-1) x 0x800: Fuel Targets sits at +0x220
    and K at +0x762 in all five, and in the UpRev base all five Fuel Targets
    copies equal the calibration's own table at 0x00A169. The tunes edited only
    slot 1, UpRev's "Map 1", except K, which they wrote to all five. The
    firmware agrees (docs/ecu-firmware-analysis.md, "UpRev's map switching"):
    UpRev's routine at 0x0DE3E4 copies slot n, 2 KiB, from 0x0E0000 +
    0x800 x (n-1) into RAM at 0xFFFFB040, start-up (0x0DE1A4) copies slot 1,
    and Nissan's readers take every switchable table from that RAM copy at a
    fixed offset. The slot is chosen by a debounced discrete input (bits 1 and
    3 of 0xFFFF2EE0, 0x0DE358); the committed slot is RAM byte 0xFFFFB008
    (mem:ECM_ACTIVE_MAP), 0 after a cold boot meaning slot 1. No switch has
    been observed live (0 on 196/196 reads, 2026-10-04), which is why the
    Maps 2-5 copies of each table stay inferred.
  regions:
    - name: Unidentified 16-bit map
      start: 0x260
      end: 0x45F
      kind: unknown
      confidence: unknown
      added_by_uprev: true
      evidence: >-
        Read from its RAM copy 0xFFFFB2A0 by at least 21 call sites through the
        wrapper 0x026B14, the most-read switchable table. That wrapper searches
        a 16-entry byte axis (0xCAE9, rpm-like) and a 16-entry 16-bit axis
        (0xE25E, 0 to 65,535) and interpolates 16-bit cells (0x027018), so the
        span is 16 x 16 x 2 bytes. What it controls is not known (cam phasing
        or throttle/torque are candidates); it is a span, not a table, until it
        is identified.
    - name: Unidentified slot data (+0x460)
      start: 0x460
      end: 0x65F
      kind: unknown
      confidence: unknown
      added_by_uprev: true
      evidence: >-
        512 bytes between the 16-bit map and Fuel Compensation, none of them
        0xFF in the 2026-10-04 image. One literal reference reaches its RAM
        copy (0xFFFFB4A0, at 0x065FB4). Shape and meaning are not decoded.
tables:
  - id: fuel_targets
    kind: fuel_targets
    name: Fuel Targets
    slot_offset: 0x220
    slots: [1]
    rows: 8
    cols: 8
    dtype: u8
    decode:
      kind: reciprocal
      quantity: afr
      unit: AFR
      numerator: 1881.6
      confidence: verified
      evidence: AFR = 14.7 x 128 / raw reproduces every transcribed AFR in afr_calibration.yaml.
    axes: {rows: fuel_targets_rpm_axis, cols: fuel_targets_bfs_axis}
    confidence: verified
    evidence: >-
      Map 1 at 0x0E0220 reproduces the independently transcribed table in
      afr_calibration.yaml cell for cell, row-major, 8 rpm rows x 8 BFS
      columns (k106 and 20260920); the 2026-09-20 edit changed 0x0E025C.
      rom_targets.yaml edits exactly this table.
  - id: fuel_targets_maps_2_5
    kind: fuel_targets
    name: Fuel Targets
    slot_offset: 0x220
    slots: [2, 3, 4, 5]
    rows: 8
    cols: 8
    dtype: u8
    decode:
      kind: reciprocal
      quantity: afr
      unit: AFR
      numerator: 1881.6
      confidence: verified
      evidence: The Map 1 decode; the bytes are the same table.
    axes: {rows: fuel_targets_rpm_axis, cols: fuel_targets_bfs_axis}
    confidence: inferred
    evidence: >-
      In the UpRev base all five slots hold this table, equal to the
      calibration's own copy at 0x00A169. No edit in Maps 2-5 has confirmed
      the layout there.
  - id: fuel_targets_calibration
    kind: fuel_targets
    name: Fuel Targets (calibration copy)
    offset: 0xA169
    rows: 8
    cols: 8
    dtype: u8
    decode:
      kind: reciprocal
      quantity: afr
      unit: AFR
      numerator: 1881.6
      confidence: inferred
      evidence: The Map 1 decode, assumed for an identical copy.
    axes: {rows: fuel_targets_rpm_axis, cols: fuel_targets_bfs_axis}
    confidence: inferred
    evidence: >-
      Equal to all five slot copies in the UpRev base. Whether the ECM reads it
      while a map slot is active is not known.
  - id: fuel_targets_rpm_axis
    name: Fuel Targets rpm axis
    offset: 0xCAA5
    rows: 8
    cols: 1
    dtype: u8
    decode:
      kind: linear
      quantity: rpm
      unit: rpm
      scale: 50
      confidence: verified
      evidence: raw x 50 reproduces the transcribed rpm breakpoints 1200-5200 in afr_calibration.yaml.
    confidence: verified
    evidence: The only match for raw 18 20 28 38 48 50 58 68 in the image (docs/uprev-rom-table-verification.md).
  - id: fuel_targets_bfs_axis
    name: Fuel Targets BFS axis
    offset: 0xC894
    rows: 1
    cols: 8
    dtype: u8
    confidence: verified
    evidence: >-
      The only match for raw 34 44 5D 64 6C 6E 7F 80 in the image. No scale to
      ms is established (the ms values in afr_calibration.yaml are the
      editor's transcription), so it is shown raw.
  # -- Slot tables confirmed from the code that reads the RAM copy
  # (docs/ecu-firmware-analysis.md, "Map-slot tables"). Every 2-D lookup here
  # goes through the same wrapper shape as Target AFR's (0x0269AC, verified):
  # the axis passed in r5 is searched against the 12.5 rpm/count engine-speed
  # word compared with axis byte << 2 (0x027194), so it is the rpm axis and
  # raw x 50 is rpm; the axis passed in r6 is compared byte for byte with the
  # load input (0x027114); and the cell address is table + 16 x rpm index +
  # load index. Rows are rpm, columns are load, row-major.
  - id: timing_trim_a
    kind: timing_trim_a
    name: Ignition timing trim A
    slot_offset: 0x020
    slots: [1]
    rows: 16
    cols: 16
    dtype: u8
    decode:
      kind: linear
      quantity: timing trim
      unit: count
      scale: 1
      mask: 0x7F
      confidence: verified
      evidence: >-
        The trim interpolator 0x026F9C masks every cell with 0x7F before
        interpolating and ORs bit 7 of the lower-left cell back into the result,
        which the reader at 0x04A4F6 strips again; bit 7 is a flag (set on 143
        of 256 cells, one contiguous block), not part of the value. Masked, the
        cells form one smooth surface (43-68); raw they jump by 128 at the
        block's edge. There are no degrees: the UpRev guide says the trim has no
        conversion to degrees BTDC (docs/roadmap/engine-tuning-support.md), so
        the unit is counts, and more counts is more advance.
    axes: {rows: timing_trim_rpm_axis, cols: timing_trim_load_axis}
    confidence: verified
    evidence: >-
      Read from its RAM copy 0xFFFFB060 (slot +0x020) by 0x04A18C at 0x04A4F2
      and by 0x04E65C, through the wrapper 0x026A64 with r5 = 0xCC93 (rpm,
      against 0xFFFF11D8) and r6 = 0xCC83 (load, against the X byte
      0xFFFF103E). Known answer for the orientation: k106 ("added spark at
      3000-4500 high load") raised 10 cells, all inside rows 7-9 x columns
      12-15, by one or two counts: 2,800-3,600 rpm at the four highest load
      columns. Read the other way round it would be mid load at 4,800-6,000
      rpm. The
      +0x09C-0x0BF cells once listed as a separate "timing (probable)" span
      are those cells. A and B differ in 9 cells in every slot of the UpRev
      base, and in 19 in Map 1 of k106 and 20260920. Selection (verified in
      the listing, 2026-10-05): FUN_0004e6d8 loads trim B (0xFFFFB160) by
      default and switches to trim A (0xFFFFB060) only when 0xFFFF283F bit 6,
      the knock controller's HI DET latch, is clear (tst #0x40 at 0x04E6FE).
      So A is the normal table and B the high-detonation one: UpRev's Main
      and High Det (role names inferred from the latch's knock behaviour).
      0xFFFF2842 does not select the trim; its bit 2 gates the knock
      controller's trim-difference branch (0x04A512). An earlier note here
      said 2842 selected it; that was wrong.
  - id: timing_trim_a_maps_2_5
    kind: timing_trim_a
    name: Ignition timing trim A
    slot_offset: 0x020
    slots: [2, 3, 4, 5]
    rows: 16
    cols: 16
    dtype: u8
    decode:
      kind: linear
      quantity: timing trim
      unit: count
      scale: 1
      mask: 0x7F
      confidence: verified
      evidence: The trim A decode; the same interpolator reads both tables.
    axes: {rows: timing_trim_rpm_axis, cols: timing_trim_load_axis}
    confidence: inferred
    evidence: >-
      The slot copy routine puts slot n's +0x020 where the readers look when
      map n is active, but no map switch has been observed live and no edit in
      Maps 2-5 has confirmed the layout there.
  - id: timing_trim_b
    kind: timing_trim_b
    name: Ignition timing trim B
    slot_offset: 0x120
    slots: [1]
    rows: 16
    cols: 16
    dtype: u8
    decode:
      kind: linear
      quantity: timing trim
      unit: count
      scale: 1
      mask: 0x7F
      confidence: verified
      evidence: The trim A decode; the same interpolator reads both tables.
    axes: {rows: timing_trim_rpm_axis, cols: timing_trim_load_axis}
    confidence: verified
    evidence: >-
      Read from its RAM copy 0xFFFFB160 (slot +0x120) by 0x04A18C at 0x04A506
      through the same wrapper and axes as trim A, straight after it; its last
      byte is the one before Target AFR at +0x220. The ECM uses B while
      0xFFFF283F bit 6 (HI DET latch) is set and A otherwise (FUN_0004e6d8,
      0x04E6FE), so B is the high-detonation table (UpRev's High Det; role
      name inferred). See timing_trim_a.
  - id: timing_trim_b_maps_2_5
    kind: timing_trim_b
    name: Ignition timing trim B
    slot_offset: 0x120
    slots: [2, 3, 4, 5]
    rows: 16
    cols: 16
    dtype: u8
    decode:
      kind: linear
      quantity: timing trim
      unit: count
      scale: 1
      mask: 0x7F
      confidence: verified
      evidence: The trim A decode; the same interpolator reads both tables.
    axes: {rows: timing_trim_rpm_axis, cols: timing_trim_load_axis}
    confidence: inferred
    evidence: >-
      As trim A in Maps 2-5: placed by the slot copy, not seen live.
  - id: timing_trim_rpm_axis
    name: Timing trim rpm axis
    offset: 0xCC93
    rows: 16
    cols: 1
    dtype: u8
    decode:
      kind: linear
      quantity: rpm
      unit: rpm
      scale: 50
      confidence: verified
      evidence: >-
        Searched by 0x027194 against the 12.5 rpm/count word 0xFFFF11D8 as axis
        byte << 2, the search whose raw x 50 reproduces the transcribed Target
        AFR rpm breakpoints; raw 08 0C 10 18 ... 78 is 400, 600, 800, 1,200 ...
        6,000 rpm.
    confidence: verified
    evidence: >-
      The literal passed in r5 to the trim wrapper 0x026A64 at 0x04A4F0, and
      one of the pair {0xCC83, 0xCC93} in UpRev's axis list at 0x0DE460.
      Unchanged across base, k106 and 20260920.
  - id: timing_trim_load_axis
    name: Timing trim load axis (BFS X counts)
    offset: 0xCC83
    rows: 1
    cols: 16
    dtype: u8
    confidence: verified
    evidence: >-
      The literal passed in r6 to 0x026A64, compared directly with the X byte
      0xFFFF103E: the same units as the Target AFR BFS axis at 0x00C894 (raw
      08 10 18 ... 80; 0x80 is that axis's last point too). Shown raw, as that
      axis is: one X count is load_point_scaler / 128 BFS counts, so a fixed
      ms scale here would go wrong the moment the scaler is edited.
  # E09.7: the base ignition timing the trims are added to. It is not one
  # table: 0xFFFF1A58 = 0xFFFF1D3E + 0xFFFF27C6 + 0xFFFF2793 - 0xFFFF279A -
  # 0xFFFF134A - 0xFFFF174A - 0x80 + 0xFFFF1344 (0x04CB9E), and the trim term
  # 0xFFFF2793 is the only one an edit to the trims moves. The term that
  # carries most of the advance, 0xFFFF27C6 (0x04BC5A), is a time converted to
  # crank angle at the current rpm, and this map is the rpm x load factor in
  # that time. The divides between it and 0xFFFF27C6 are not resolved from
  # the exported listing, so the map is listed with its axes and shown raw.
  - id: base_timing_rate_map
    name: Base timing rate map (rpm x X, feeds 0xFFFF27C6)
    offset: 0x9AF9
    rows: 4
    cols: 4
    dtype: u8
    axes: {rows: base_timing_rate_rpm_axis, cols: base_timing_rate_load_axis}
    confidence: inferred
    evidence: >-
      FUN_0004ba6c reads it through the 4 x 4 wrapper 0x0268B8 (r4 = 0x9AF9,
      r5 = 0xC890 searched against the rpm/50 byte 0xFFFF11CA, then 0xC88C
      against the X byte 0xFFFF103E, both by 0x027114; the first search's index
      is the row, times the width 4 passed to the bilinear 0x026F40) into
      0xFFFF15DB. 0xFFFF15DA = 15DB x 15D7 (curve 0xCEAB, flat 0x80) x 15DC
      (coolant curve 0xCEBB) >> 14 feeds 0xFFFF15DE; FUN_0004bc5a forms
      0xFFFF27C6 = (cal 0x880D x 120 x 0xFFFF17C6) / (0xFFFF15DE x 0xFFFF19CB)
      (x 120 from the listing 0x04BC7C-0x04BC8A: x 15, shll2, shll; the overall
      scale is unresolved until the divide helpers' operands are known)
      plus cal 0x8B0C x 5 / 2, times the rpm word 0xFFFF11D8 >> 10 x 3 / 5,
      minus 14, capped 127 (0x04BC5E-0x04BD22): a time turned into crank
      angle. 0xFFFF19CB is the curve 0xCD9B at X (00 20 40 ... E0 on its
      implicit 0, 32 ... 224 axis: X itself), so the advance rises with rpm
      and falls with load through this term, which is why a change that
      moves X moves base timing outside the trims. Values on ROM Store
      ZS44A, k106, 20260920 and 20261004 are identical: 11 1A 28 3A / 19 27
      3C 55 / 1B 2A 42 5E / 1D 2D 46 64, rising with both axes. Inferred, not
      verified: the operands of the divide helpers 0x021C48 / 0x021D6C
      between 0xFFFF15DA and 0xFFFF15DE are not visible in the exports (owed
      to the firmware session), and no capture has read 0xFFFF15DB.
  - id: base_timing_rate_rpm_axis
    name: Base timing rate map rpm axis
