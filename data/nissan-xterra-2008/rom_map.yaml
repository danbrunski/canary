# Literals in the program, not calibration (N02.1): a flash of this program
# never changes them, another program may hold anything there. `value` is the
# literal the decode was made on; a reader refuses an image that differs
# (rom_map.check_program_constants).
program_constants:
  - id: fill_reciprocal_numerator
    name: Throttle-model fill rpm reciprocal numerator
    offset: 0x3C5E8
    dtype: be32
    value: 0x00DC1D00
    loaded_at: [0x3C3F6]
    confidence: verified
    evidence: >-
      FUN_0003c3e4 loads the literal-pool word at 0x03C5E8 (mov.l at 0x03C3F6)
      and divides it by w227C = min(0xFFFF, 158 x rpm word) through 0x021D6C,
      clamps the quotient to 0xFFFF and stores w116A (0x03C414); w227C = 0
      gives 0. The only occurrence of the word 0x00DC1D00 in the image, and
      the same in the UpRev base, k106, 20260920 and 20261004. With 158 and
      12.5 rpm per count, 0xDC1D00 x 12.5 / (512 x 158) = 2,229.0, so X ~
      2,229 x area / rpm. No clean physical breakdown of 0xDC1D00 is known.
  - id: tp_quotient_cap
    name: Tp quotient cap
    offset: 0x3C888
    dtype: be32
    value: 0x000726F9
    loaded_at: [0x3C73A, 0x3C76C, 0x3C77A]
    confidence: verified
    evidence: >-
      0x03C62C caps K x airflow x 226 / 256 / (3 x speed) at this literal
      before multiplying by 0x23CB and shifting 16 (0x03C77C-0x03C782): 0x726F9
      x 0x23CB >> 16 is 0xFFFF, so Tp 0xFFFF2110 always fits a word. A first
      quotient of 0x727 or more takes it without the second divide (0x03C748).
  - id: tp_scale
    name: Tp scale
    offset: 0x3C78C
    dtype: be16
    value: 0x23CB
    loaded_at: [0x3C77C]
    confidence: verified
    evidence: >-
      mov.w at 0x03C77C: Tp = capped quotient x 0x23CB >> 16 (0x03C77E-0x03C788),
      stored to 0xFFFF2110. Together with cal 0x89D2 (226) and 0x88AD (3) it
      is the 0.0105 x K x airflow / N of the injector-pulse section.
