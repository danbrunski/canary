      purge_raw x 144 >> 7, 1.125 area units per 0.5 % purge step. w139E
      enters X as (w116A x w139E) >> 11, i.e. purge/4 in area units. The byte
      PID 0x2E and DID 0x1110 report is purge_raw + 1 (0 while purge is off,
