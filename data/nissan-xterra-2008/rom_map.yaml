  - id: fill_curve_low
    name: Throttle-model fill curve, X below 0x3C00
    offset: 0xEAEC
    rows: 1
    cols: 16
    dtype: be16
    confidence: verified
    evidence: >-
      FUN_0003c444: for X = 0xFFFF2136 below 0x3C00 (0x03C48E-0x03C496),
      r4 = 0xEAEC (0x03C49E) and r5 = 4 x X (0x03C4A2), into 0x026C28 (index
      x >> 12, fraction (x & 0xFFF) << 4, last entry from 0xF000); the result's
      high byte is 0xFFFF118A (0x03C4B8-0x03C4BA). Its last entry equals
      fill_curve_high's first, so the byte is continuous across the split.
  - id: fill_curve_high
    name: Throttle-model fill curve, X from 0x3C00
    offset: 0xEACC
    rows: 1
    cols: 16
    dtype: be16
    confidence: verified
    evidence: >-
      FUN_0003c444: for X at or above 0x3C00, r4 = 0xEACC (0x03C4AA) and r5 =
      X - 0x3C00 (0x03C4AC), into 0x026C28; the high byte is 0xFFFF118A. X is
      at most 0xFFFF, so the index (X - 0x3C00) >> 12 never passes 12 and
      entries 14 and 15 are never read. Entry 12's high byte, 224, is the
      ceiling the byte reaches for X >= 0xFC00.
  - id: fill_rpm_multiplier
    name: Throttle-model fill rpm multiplier
    offset: 0x8D25
    rows: 1
    cols: 1
    dtype: u8
    confidence: verified
    evidence: >-
      FUN_0003c3ba reads the byte at 0x8D25 (0x03C3BC-0x03C3BE) and multiplies
      it by the engine-speed word 0xFFFF1210 (12.5 rpm per count, 0x03C3C4),
      clamped to 0xFFFF (0x03C3CA-0x03C3D4), into w227C; FUN_0003c3e4 divides
