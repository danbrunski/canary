  - id: evap_purge_area_gain
    name: EVAP purge area gain
    offset: 0x82FE
    rows: 1
    cols: 1
    dtype: u8
    confidence: verified
    evidence: >-
      FUN_0006a52c reads the byte at 0x82FE (0x06E2A8-0x06E2B0, 144) and
