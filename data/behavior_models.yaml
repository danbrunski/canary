  notes: "Thermal-compensation surface for ignition. Cold dense charge lets the ECU\
    \ advance more; hot charge gets retarded to keep knock margin. The surface learns\
    \ the ECU's actual (RPM, IAT) \u2192 timing map, so we read deviations from what\
    \ the engine *normally* does at this thermal+rpm operating point \u2014 ambient-invariant\
    \ by construction (the same IAT bin sees summer afternoons and winter mornings).\n\
    \nCatches:\n* Sustained knock-retard activity (negative residuals   clustered\
    \ at the hot-IAT side of the surface \u2014 detonation   triggers spark pull-back).\n\
    * IAT sensor lying to the ECU \u2014 timing tracks the *reported*   IAT, so a\
    \ stuck or biased sensor leaves the surface's   predicted timing matching the\
    \ wrong cell, and actual   timing drifts off the learned map.\n* Firmware / calibration\
    \ drift after an ECU re-flash.\n\nComplementary to ``timing_advance_vs_rpm_load``\
    \ (load-axis compensation) \u2014 both feed the same timing output through different\
    \ physical axes."
