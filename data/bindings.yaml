          (1) Blower ON with A/C OFF: byte 0 is 0x20 on all 1464 frames — bit
          0x08 does not appear. Combined with both-off (0x20) and blower+A/C
          (0x08 present), the bit tracks A/C and not the blower. Note "A/C on
          with blower off" is unreachable on this vehicle by design, so this
          three-state nesting is the complete separation available.

          (2) Same-instant pairing against AC_COMPRESSOR_STATE (0x625:1 bit
