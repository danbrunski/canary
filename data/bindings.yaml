# Canary signal bindings — broadcast CAN bytes mapped to known signals.
#
# This is the project's canonical record of "byte position X in CAN ID Y means
# Z" findings. It grows over time as captures and analyses accumulate. Each
# entry tracks not just the mapping but the evidence backing it, so future
# data (e.g. ELM327 Mode 01 cross-reference) can promote, demote, or correct.
#
# Confidence levels:
#   confirmed     — exact scale/offset validated against ground truth
#   high          — directional behavior matches across multiple observations
#   medium        — direction matches but exact scaling unknown
#   low           — pattern is suggestive but ambiguous
#   hypothesized  — best-guess interpretation; could be wrong
#
# Model features: only `confirmed` and `high` signals may become trained
# IF/LSTM features — a byte that can still be retracted must not be able to
# blind a model when it is. `model_feature: false` additionally opts a signal
# out however well it is bound, because it is not ENGINE behaviour: steering,
# brake, cabin blower, TPMS, body power state, motion candidates, and redundant
# road-speed copies. Decoding, persistence, DBC export and the dashboard ignore
# the flag; it only keeps the channel out of the trained feature set.
#
# This file is hand-edited as findings sharpen. Tools may CONSUME it
# (DBC export, daemon decoder) but should not auto-rewrite it.

schema_version: 1

vehicle:
  make: Nissan
  model: Xterra
  year: 2008
  engine: VQ40DE
  transmission: manual_6speed

# Diagnostic-bus structure observed on the OBD-II port:
#   ~10 ms hot-path:  ECM/chassis signal frames
#   ~20 ms drivetrain
#   ~40 ms intermediate
#   ~100 ms body/BCM
#   ~900 ms+ one-shot / heartbeat
bus:
  bitrate: 500000
  channels:
    - name: vehicle_can
      ids_observed: 29  # in session 2026-05-11T152858

# Quantities searched for on the broadcast bus and NOT found. Each records the
# dynamic range the search covered, so "we never looked" stays distinguishable
# from "we looked properly and it is not there". Consumed by nothing — this is
# a record for the next person tempted to run the same scan.
absent_signals:
  - session: 2026-08-08T214218 (capture idle_rev_ac_loadstep)
    method: uprev_kline_ground_truth_full_byte_sweep
    conditions: >
      Parked, warm (coolant 90 C), no load, manual transmission in neutral.
      CANary in passive mode — zero CAN transmits — so UpRev was the only
      tester on the bus. Protocol: 30 s idle, 3x slow ramp 750->3362 rpm, 3x
      snap blip 750->3231 rpm (snap-closed producing decel fuel cut), then the
      same with A/C engaged, then 30 s idle. Every CAN id x byte offset x width
      {1,2} correlated against every UpRev channel, same-instant paired within
      30 ms, with per-channel lag scanned over +/-1 s to allow for K-line poll
      rotation, and scored on correlation of RPM-residuals so that rpm
      collinearity cannot manufacture a match.
    caveat: >
      NO-LOAD ONLY. A parked rev sweep moves rpm, throttle and airflow together;
      it cannot exercise high-load / low-rpm regions at all. A signal that only
      appears under road load would be missed. Re-run on a drive before treating
      any of these as settled for all regimes.
    not_found:
      - quantity: ignition timing
        uprev_channel: IGN TIMING (BTDC)
        range_covered: -4 to +42 deg BTDC
        best_r2: 0.28
      - quantity: wideband AFR
        uprev_channel: AFR WB-B1
        range_covered: 12.1 to 60.0 (60.0 = decel-fuel-cut lean peg)
        best_r2: 0.15
      - quantity: intake cam timing
        uprev_channel: INTK CAM TIM-B1 (Deg CA)
        range_covered: -1 to +38 deg CA
        best_r2: 0.51
        note: >
          Answers an open question — cam angle is reachable via Mode 22 in
          session 0xC0 but has no broadcast home. Worth re-testing under road
          load, since VVT phasing at no load is not representative.
      - quantity: injector pulse width
        uprev_channel: INJ PULSE-B1 (ms)
        range_covered: 0.5 to 9.6 ms
        best_r2: 0.41
      - quantity: base fuel schedule
        uprev_channel: B-FUEL SCHDL (ms)
        range_covered: 1.7 to 13.9 ms
        best_r2: 0.78
        note: best match was 0x29E:7, a brake-activity byte — treated as spurious
      - quantity: calculated load
        uprev_channel: CAL/LD VALUE (%)
        range_covered: 9 to 87 %
        best_r2: 0.73
      - quantity: mass airflow (as a pinnable channel)
        uprev_channel: MAF  GM/S (gm/s)
        range_covered: 3.3 to 71.3 g/s
        best_r2: 0.86
        note: >
          0x233:2 does track it (r = +0.928 at lag +0.10 s) but with only 11
          distinct raw values across a 22x swing — see ECM_AIRFLOW_233_B2.
          No finer-resolution airflow channel exists on the bus.

signals:

  # --------------------------------------------------------------------------
  # ECM — engine control
  # --------------------------------------------------------------------------

  - name: ECM_COOLANT_TEMP
    module: ECM
    can_id: 0x551
    byte_start: 0
    byte_length: 1
    byte_order: big
    scale: 1.0
    offset: -40.0
    unit: "degC"
    confidence: confirmed
    plausible_min: -10.0   # below this and we're seeing the engine-off sentinel
    plausible_max: 130.0   # Xterra thermostat caps around 90-95degC; +35 headroom
    evidence:
      - session: 2026-05-11T152858
        method: byte_vs_tag_differential
        finding: >
          Monotonic rise from raw 53 (cold start) to raw 90 (end of 6-min run),
          across every window without reversal. With offset -40, decodes to
          13degC -> 50degC — plausible cold-to-warm Xterra arc.
      - session: 2026-05-13T005522
        method: broadcast_vs_pid_regression
        finding: >
          Regressed against Mode 01 PID 0x05 (engine coolant temp): r2 = 0.999,
          coolant_degC = raw × 0.9986 − 39.86 (n = 354) — i.e. exactly the
          scale 1.0 / offset −40 already recorded. Confirmed.
    notes: |
      Strong candidate. ELM327 Mode 01 PID 0x05 (engine coolant temp) will
      cross-reference exactly. Other coolant duplicates may exist: 0x233:0
      and 0x23D:7 both showed monotonic warm-up in the earlier seated session.

      CAVEAT: raw=0 (decoded -40degC) appears in engine-off frames — looks
      like a "no reading" sentinel rather than a real -40degC reading. Any
      decoder using this signal should gate on engine-running state OR drop
      raw=0 readings. Surfaced by decode_bindings.py against
      session 2026-05-11T152858.

  - name: ECM_RPM
    module: ECM
    can_id: 0x1F9
    byte_start: 2
    byte_length: 2
    byte_order: big   # MSB byte 2, LSB byte 3
    scale: 0.125      # raw / 8 → rpm
    offset: 0.0
    unit: "rpm"
    confidence: confirmed
    plausible_min: 0.0
    plausible_max: 7000.0   # VQ40DE redline ~6000; headroom for overrev
    evidence:
      - session: 2026-05-13T005522
        method: byte_vs_tag_differential
        finding: >
          0x1F9 byte 2 rises monotonically through the rev protocol: idle ~23,
          blip_2k ~44, blip_3k ~66, sustain_2500 ~69, blip_4k ~73; ~0/3 with
          the engine off. Flagged as the clean RPM candidate.
      - session: 2026-05-13T005522
        method: broadcast_vs_pid_regression
        finding: >
          Bytes 2-3 (16-bit, big-endian) regressed against Mode 01 PID 0x0C
          (engine RPM) over the engine-running window: r2 = 1.000,
          RPM = raw x 0.1251 − 4.8 (n = 354). The clean form raw ÷ 8 is almost
          certainly the true scaling (byte 2 alone ≈ RPM / 32, also r2 ≈ 1.0).
    notes: |
      Confirmed engine RPM, 16-bit at 8 counts/rpm on the ~100 Hz 0x1F9 frame.
      This is the real RPM signal — NOT 0x23D:1-2, which the earlier rev-session
      analysis had mislabeled as the "rev level" prize. Those turned out to be
      two independent bytes: pedal position and throttle position (see
      ECM_ACCEL_PEDAL_POS_V and ECM_THROTTLE_SENSOR_V).

      Independently re-derived 2026-08-04 from UpRev K-line ground truth: scale
      0.1252 against the 0.125 recorded here, out-of-sample R2 0.9998, refitted
      scale drift 0.10 % across two windows. This binding is the control that
      calibrates how tight a "confirmed" byte→engineering map should look.

  - name: ECM_ACCEL_PEDAL_POS_V
    module: ECM
    can_id: 0x23D
    byte_start: 1
    byte_length: 1
    byte_order: big
    scale: 0.01485
    offset: 0.795
    unit: V
    confidence: confirmed
    plausible_min: 0.7
    plausible_max: 4.8
    evidence:
      - session: 2026-05-11T152858
        method: byte_vs_tag_differential
        finding: >
          byte 1 and byte 2 spike together in lockstep across every rev event,
          ordered with RPM target (idle 0,0 → blip_4k 42.5,37.4), zero engine-off.
          Recorded when this entry was still ECM_AIRFLOW_PROXY_23D — consistent
          with pedal position, which is what drives a no-load rev.
      - session: 2026-05-13T005522
        method: broadcast_vs_pid_regression
        finding: >
          Bytes 1-2 regress against Mode 01 PID 0x10 (MAF) at r2 ≈ 0.79
          (byte 2 alone r2 ≈ 0.82); NO clean correlation with RPM (PID 0x0C).
          Read at the time as "airflow-related". Superseded — see below: pedal
          drives airflow, so a pedal signal correlates with MAF at exactly this
          strength without being MAF.
      - session: 2026-07-27T152444 + 2026-07-27T225711
        method: uprev_kline_ground_truth
        finding: >
          Regressed against the synchronously-sampled UpRev K-line channel
          "ACCEL PED POS 1 (V-Accel)" over two independent simultaneous windows
          (171 s total, clock-aligned to the CAN bus by RPM cross-correlation at
          r = 0.9998/0.9999, lags -1.3 s and -1.6 s). Byte 1 ALONE gives
          r = +0.997 / +0.999, partial r given RPM = 0.996 / 0.999. Fitting
          scale/offset on the AM window and predicting the PM window
          out-of-sample: R2 = 0.998, MAE 0.029 V, and the independently refitted
          scale drifts only +0.24 % — as stable as the ECM_RPM control (+0.10 %).
          Byte 2 is a SEPARATE signal (throttle sensor, see
          ECM_THROTTLE_SENSOR_V), so the old 16-bit big-endian reading spanning
          bytes 1-2 was decoding two independent 8-bit channels as one number.
    notes: |
      Renamed twice: ECM_ENGINE_REV_LEVEL → ECM_AIRFLOW_PROXY_23D → this. The
      first rename ruled out RPM (that's ECM_RPM @ 0x1F9:2-3); the second ruled
      out airflow. Both earlier labels were fitted against signals that are
      merely downstream of pedal position, which is why each looked plausible.
      Airflow does have a real home — see ECM_AIRFLOW_233_B2 — but it is a
      different frame and byte, and its scale is NOT stable enough to pin.

      Field width corrected 2 bytes → 1: bytes 1 and 2 are independent.

  - name: ECM_THROTTLE_SENSOR_V
    module: ECM
    can_id: 0x23D
    byte_start: 2
    byte_length: 1
    byte_order: big
    scale: 0.01341
    offset: 0.684
    unit: V
    confidence: confirmed
    plausible_min: 0.6
    plausible_max: 4.8
    evidence:
      - session: 2026-07-27T152444 + 2026-07-27T225711
        method: uprev_kline_ground_truth
        finding: >
          Regressed against UpRev "THROTTLE SENSOR 1-B1 (V)" over the same two
          simultaneous windows. r = +0.991 / +0.997, partial r given RPM =
          0.989 / 0.996. Fit on AM, predicted PM out-of-sample: R2 = 0.993,
          MAE 0.063 V, refitted scale drift -0.16 %. Discriminated from the
          neighbouring pedal byte by map stability: byte 2 predicts throttle
          with R2 0.993 vs 0.919 for pedal, and byte 1 predicts pedal with
          R2 0.998 vs 0.905 for throttle. Each byte is decisively better at its
          own target than at the other's, so the two are not duplicates.
    notes: |
      Previously unbound — byte 2 was being consumed as the low half of the
      16-bit ECM_AIRFLOW_PROXY_23D field. Throttle-plate position on an
      electronic-throttle engine tracks pedal closely but not identically
      (the ECM arbitrates), which is why the two adjacent bytes correlate with
      each other at r ≈ 0.95 yet resolve cleanly against their own ground truth.

  - name: ECM_AIRFLOW_233_B2
    module: ECM
    can_id: 0x233
    byte_start: 2
    byte_length: 1
    byte_order: big
    scale: null       # correlation is strong but the map is NOT stable — see below
    offset: 0.0
    unit: unknown     # tracks MAF g/s, but non-linearly or with a drifting term
    confidence: medium
    evidence:
      - session: 2026-07-27T152444 + 2026-07-27T225711
        method: uprev_kline_ground_truth
        finding: >
          Best airflow candidate in the whole scan: r = +0.984 / +0.973 against
          UpRev "MAF GM/S", partial r given RPM = 0.972 / 0.950. But the linear
          map is NOT stable across windows — refitted scale drifts -6.5 %, and
          predicting PM from an AM fit gives R2 0.942 with MAE 4.7 g/s. Compare
          ECM_RPM (+0.10 %) and the two 0x23D bytes (0.24 % / 0.16 %) measured
          the same way on the same windows. A genuine linear byte→engineering
          binding holds its scale; this one does not, so it is airflow-RELATED
          rather than a pinnable MAF reading.
      - session: 2026-08-08T214218 (capture idle_rev_ac_loadstep)
        method: uprev_kline_ground_truth
        finding: >
          Corroborates airflow, and reframes the instability as QUANTISATION.
          Parked no-load sweep with CANary in passive mode (zero CAN transmits),
          so UpRev was the only tester on the bus. Clock-aligned to CAN by RPM
          cross-correlation (r = 0.99981; the ECM_RPM control fits slope 1.0000
          with stability 0.9985-1.0011 across 750-3700 rpm). Against UpRev
          "MAF GM/S": r = +0.928 (r2 0.862) once a per-channel lag of +0.10 s is
          applied. MAF swung 3.3 -> 71.3 g/s (22x) yet this byte took only
          ELEVEN distinct values (0-10), reads 0.0 +/- 0.1 at idle, and does not
          move for an A/C load step at matched rpm (764 vs 759 rpm, n = 1919 /
          2957). Bytes 2-3 read as a 16-bit pair give an IDENTICAL r to 4 dp, so
          byte 3 is not its low byte -- the coarseness is real.
    notes: |
      Resolution ceiling (2026-08-08): at ~0.147 counts per g/s, idle airflow
      rounds to 0-1, so every low-flow fit is dominated by rounding rather than
      by a state-dependent term. Some or all of the -6.5 % "scale drift" above
      may be plain quantisation. Any promotion attempt should fit on the
      high-flow half of a sweep only, and must not use idle data.

      Do not pin a scale on the strength of the correlation alone — that is the
      trap the old ECM_AIRFLOW_PROXY_23D fell into. Candidate explanations for
      the drift: the byte is a filtered/derived airflow term (VE or injector PW)
      rather than raw MAF, or it saturates. Promotion wants a window pair with
      genuinely different air density (different day/altitude/temperature) to
      separate a scale error from a state-dependent term.

  - name: ECM_INTAKE_VACUUM_OR_IAC
    module: ECM
    can_id: 0x233
    byte_start: 1
    byte_length: 1
    byte_order: big
    scale: null
    offset: null
    unit: unknown     # kPa (manifold abs pressure) or % (idle air control)
    confidence: high  # promoted from medium based on A/C-load response
    evidence:
      - session: 2026-05-11T152858
        method: byte_vs_tag_differential
        finding: >
          Inverse-throttle behavior: highest at warm idle (mean 227), drops
          during blips (125-141), zero when engine off. Recovers to idle
          baseline between revs. Classic IAC % or manifold pressure pattern.
      - session: 2026-05-11T211240
        method: byte_vs_tag_differential
        finding: >
          On engine_started window mean is 74; A/C-on drops it to 49; clutch_in
          (engine briefly higher rpm) spikes to 243; cruising stabilizes around
          133. A/C-load → MAP drop is the textbook engine-load signature; this
          is almost certainly manifold absolute pressure (Mode 01 PID 0x0B).
      - session: 2026-08-08T214218 (capture idle_rev_ac_loadstep)
        method: ac_load_step_rpm_matched
        finding: >
          DIRECTION CONFLICT with 2026-05-11T211240. Restricting both windows to
          735-790 rpm so the comparison is rpm-matched (off: 764 rpm, n = 1919;
          on: 759 rpm, n = 2957), A/C-on RAISES this byte: 112.3 +/- 5.5 ->
          146.0 +/- 16.2, delta +33.7 (~6 pooled sd). The earlier session
          recorded the opposite (74 -> 49) and that drop is what promoted this
          entry to `high` and to the MAP label.
    notes: |
      THE "MAP" READING IS RETRACTED (2026-08-08). This vehicle has NO manifold
      pressure sensor — the VQ40DE is mass-airflow based, not speed-density.
      Confirmed by the operator and corroborated by the scheduler's own active
      request set, which carries BAROMETRIC_PRESSURE (PID 0x33) and
      EVAP_VAPOR_PRESSURE (PID 0x32) but no INTAKE_PRESSURE (PID 0x0B) at all.
      A byte cannot be manifold absolute pressure on a vehicle that never
      measures it, so the 211240 promotion below rests on a quantity that does
      not exist here.

      IAC / idle-air is now the leading reading, and the 2026-08-08 evidence
      fits it cleanly: A/C load at idle makes the idle-speed controller open
      the idle-air path to hold rpm, so idle-air duty RISES — which is the
      +33.7 measured at matched rpm. Under the MAP story that same rise needed
      a sensor the truck does not have.

      Still open: the 2026-05-11 windows recorded a DROP. They were not
      rpm-matched, which is the likeliest explanation. Settling it wants a
      clean rpm-matched A/C step repeated on another day, plus a idle-air-duty
      reference — Mode 22 is the only source, since no Mode 01 PID carries it.

      Do NOT reach for Mode 01 PID 0x0B as the reference. It is unsupported on
      this ECU. That instruction appeared in this file for three months.

  - name: ECM_CALC_LOAD_A
    module: ECM
    can_id: 0x233
    byte_start: 4
    byte_length: 1
    byte_order: big
    scale: null
    offset: null
    unit: unknown
    confidence: low  # demoted 2026-08-08 — it is neither load nor pulse width
    evidence:
      - session: 2026-08-08T214218 (capture idle_rev_ac_loadstep)
        method: uprev_kline_ground_truth + ac_load_step_rpm_matched
        finding: >
          RULES OUT both candidates in the note below. Against synchronously
          sampled UpRev channels over a no-load sweep, scanning per-channel lag
          over +/-1 s to allow for K-line poll rotation, with every channel
          moving over a wide range: CAL/LD VALUE (9 -> 87 %) best |r| = 0.155;
          INJ PULSE-B1 (0.5 -> 9.6 ms) best |r| = 0.069; B-FUEL SCHDL (1.7 ->
          13.9 ms) best |r| = 0.078; MAF best |r| = 0.317. Every best lag landed
          on the +/-1 s scan boundary, i.e. no real peak. Independently, an A/C
          load step at matched idle rpm (764 vs 759) moved it by -1.7 counts
          (244.6 +/- 1.1 -> 242.9 +/- 3.2) — calculated load MUST respond to a
          load step at constant rpm, and this does not.
      - session: 2026-05-11T152858
        method: byte_vs_tag_differential
        finding: >
          engine_start window spiked to 202.6 (cranking transient), idles ~130,
          drops to 92 during sustained 2500 rpm. Engine-off = 0.
      - session: 2026-05-11T152858
        method: cross_broadcast_pairing
        finding: >
          Mean values are IDENTICAL to 0x23D:3 in every window, indicating
          the ECM publishes this value on two CAN IDs simultaneously.
      - session: _capture-tuning-did-2026-08-06T003148
        method: broadcast_byte_sweep_vs_did
        finding: >
          RETRACTS the cross-broadcast pairing above. 0x23D:3 is the low byte
          of a 16-bit engine-speed counter (see ECM_RPM_23D), not a copy of
          this byte. The two were paired on identical per-window *means*, and
          the low byte of a fast counter averages near mid-scale in every
          window regardless of engine state — so it matches any signal that
          also sits near mid-scale. This byte's own identification is
          untouched; only the corroboration it drew from the pair is gone.
    notes: |
      Direction (high cranking, mid idle, low at sustained throttle) is
      consistent with engine load or fuel pulse width. The cross-broadcast
      pair that once narrowed this was withdrawn on 2026-08-06 — see the
      retraction above — so this rests on the differential alone and is
      weaker than its `medium` grade suggests. Distinguishing load from
      pulse width needs a reference for each: Mode 22 DID 0x1208
      (ECM_AIR_CHARGE) for air charge and 0x1206/0x1207
      (ECM_INJECTOR_PULSE_1/2) for injected pulse; enrichment or fuel cut
      separates the two in one drive.

  - name: ECM_THROTTLE_TRANSIENT
    module: ECM
    can_id: 0x23D
    byte_start: 6
    byte_length: 1
    byte_order: big
    scale: null
    offset: null
    unit: unknown
    confidence: low  # demoted 2026-08-08 — the "burst" was an averaging artifact
    evidence:
      - session: 2026-08-08T214218 (capture idle_rev_ac_loadstep)
        method: instantaneous_trace_vs_pedal
        finding: >
          RETRACTS the "transient burst" reading below. Read INSTANTANEOUSLY
          rather than as window means, this byte sits at 254-255 for every
          sample where pedal (0x23D:1) is 0 — including the whole of a decel
          from 2131 rpm to idle — then drops to 0-8 within one frame of the
          pedal moving, tracks pedal magnitude while applied (peak 8 at pedal
          67, peak 5 at pedal 47), and snaps back to 254-255 on release.
          254, 255, 0, 1, 3, 5, 8 is a CONTINUOUS sequence through zero, so the
          field is SIGNED int8: about -2 at closed throttle, up to +8 under
          acceleration. It is a small signed demand/error term, not a burst.

          Why the old reading looked like bursts: a window containing both
          closed-throttle samples (254) and pedal-applied samples (0-8) averages
          to mid-scale. That is exactly the 95.5 / 145.6 / 151.9 "burst"
          magnitudes recorded below — means of a value that wraps 255 -> 0.
          Averaging a signed field across its own wrap point produces a number
          that describes nothing.
      - session: 2026-05-11T152858
        method: byte_vs_tag_differential
        finding: >
          Bursts during blip-start/end windows specifically:
            idle_*: ~0  |  blip_2k_start: 151.9  |  blip_3k_end: 95.5
            sustain_2500_end: 85  |  blip_4k_end: 145.6
          Fires only during throttle transitions, returns to 0 at steady state.
      - session: 2026-05-11T034516
        method: byte_vs_tag_differential
        finding: >
          In the earlier seated session (with NT510 screen-selection tags),
          this byte LATCHED 0->255 once ECM reached certain live-data screens
          and never reverted. Behavior contradicts the rev session reading;
          the earlier interpretation was likely misattributed because tags
          weren't physical-action-driven.
      - session: 2026-05-11T211240
        method: byte_vs_tag_differential
        finding: >
          Engine-off / stationary windows: ~0-9. gear_reverse: 24.6.
          coming_to_stop (active driving): 186.8. Magnitude scales with
          throttle activity — confirms the rev session reading.
      - session: 2026-05-11T222447
        method: byte_vs_tag_differential
        finding: >
          key_on_engine_off_warma: 8 (engine-off baseline). cranking: 238.6
          (jumps the instant the engine cranks). driving: 93.5. stopped: 239.5
          (idle compensation activity). The 8 → 239 jump at the cranking tag
          rules out any "set on diagnostic request" interpretation — this is
          engine-running activity, full stop.
    notes: |
      Three physical-action sessions agree, including a full engine-off
      bracket: 0 at engine off, jumps the moment the engine cranks, climbs
      with throttle activity. The earlier screen-tagged session is treated
      as misattributed and ignored. Likely acceleration enrichment
      multiplier or throttle-rate-of-change signal. Exact units pending
      ELM327 cross-reference.

  # --------------------------------------------------------------------------
  # Engine state flag (cross-broadcast triplet)
  # --------------------------------------------------------------------------

  - name: ECM_ENGINE_STATE_A
    module: ECM
    can_id: 0x231
    byte_start: 0
    byte_length: 1
    byte_order: big
    scale: 1.0
    offset: 0.0
    unit: enum
    confidence: high
    evidence:
      - session: 2026-05-11T152858
        method: byte_vs_tag_differential
        finding: >
          Clean two-state behavior: raw 254 = engine off, raw 205 = engine
          running steady. Small perturbations during blips. Engine-off bracket
          at start (254) and end (engine_off_key_on = 241.6) brackets the
          running window perfectly.
      - session: 2026-05-11T152858
        method: cross_broadcast_pairing
        finding: >
          Mean values match 0x231:3 AND 0x29E:0 in every window — ECM
          publishes this state byte three times across two CAN IDs.
    notes: |
      State enum, useful as an anomaly-detection input: an unexpected
      transition to 254 mid-drive = engine stalled / fuel cut / major fault.
      The three-way redundancy means a single bit-flip in one location is
      detectable.

      REFINEMENT: decode_bindings.py against session 2026-05-11T152858 shows
      raw values across the full 0..255 range — the byte is NOT binary. The
