          to ~180 on brake_pedal_pushed and held through parking_brake_off/on,
          reverting to 118.5 at brake_pedal_released. Brake moves it ~3× more
          than throttle does → brake-dominant driver-demand composite, not a
          pure brake flag (consistent with the 005522 weak-throttle r2).
    notes: |
      Brake-dominant driver-demand / pedal-activity composite on the ~20 ms
      ABS frame: ~115 idle, ~180 on firm brake, small throttle component.
      Promoted low→high — the 202800 session separated the two inputs and
      confirmed brake dominance. Pair with BRAKE_PRESSURE_29E_3 (0x29E:3,
      the clean brake-only byte): 29E:3 isolates the brake, 29E:7 carries
