  # --------------------------------------------------------------------------
  # Redundant ECM copies — the same value published on more than one frame.
  # Worth binding because the bus serves them free, at ~97 Hz, where the
  # Mode 22 equivalent costs a poll slot and arrives at 15 Hz.
  # --------------------------------------------------------------------------

  - name: ECM_RPM_23D
    module: ECM
    can_id: 0x23D
    byte_start: 3
    byte_length: 2
    byte_order: little
    scale: 3.125
    offset: 0.0
    unit: "rpm"
    # Held at `high` deliberately. The mapping itself is not in doubt — the
    # correlation below is 1.000000 at an exactly integral ratio. But every
    # session is read with its `confirmed` bindings decoded on read
    # (`ON_READ_CONFIDENCES`, P02.8; nothing stores decoded rows), so
    # promoting this line is not a statement about evidence: it adds a new
    # ~97 Hz decoded channel to what the session readers see (the digest,
    # classification and fingerprint chain among them), old sessions included,
    # and anything that derives its columns from them would change with it.
    # That is an operator decision about feature sets and retraining, not a
    # decode question.
    confidence: high
    plausible_min: 0.0
    plausible_max: 8000.0
    evidence:
      - session: _capture-tuning-did-2026-08-06T003148
        method: broadcast_byte_sweep_vs_did
        finding: >
          A second copy of engine speed. Against the confirmed ECM_RPM
          field (0x1F9 bytes 2-3) this field correlates at 1.000000 with a
          ratio of exactly 25.0000 (sd 0.0133, n = 2021) — i.e. the same
          counter at 1/25 the resolution. Independently regressed against
          Mode 22 DID 0x1219 (ECM_RPM): r2 = 0.9992, rpm = raw x 3.12457
          - 1.34, slope drift 0.14% across three disjoint sub-windows.
      - session: firmware ZS44A-20260920 (F01.14)
        method: firmware_frame_builder
        finding: >
          Agrees exactly. 0x0CD1F2 writes bytes 3-4 (low, high) =
          min(0xFFFF120A, 0xC80), and 120A x 50/16 is rpm (3.125 rpm/count),
          so the field caps at 10,000 rpm. 0x233 carries the same capped word
          split across byte 4 (low) and byte 7 (high).
    notes: |
      0x1F9 stores rpm x 8; this field stores rpm x 0.32, so it carries the
      same value with 25x coarser quantisation (~3.1 rpm per count). Prefer
      0x1F9 for anything rate-sensitive; this one is useful as a redundancy
      cross-check and as a second opinion during 0x1F9 dropouts.

      This supersedes ECM_CALC_LOAD_B, which bound byte 3 of this frame as
      a load duplicate on the strength of "identical means to
      ECM_CALC_LOAD_A in every window". Byte 3 is the low byte of this
      16-bit counter, so its per-window *mean* sits near mid-scale
      regardless of engine state — a statistic that matches almost
      anything. Comparing means is what let a fast LSB pass as a slow load
      signal; the sweep compares values.

