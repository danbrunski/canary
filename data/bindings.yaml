        method: inventory_comparison
        finding: >
          Mirrors 0x284 variability profile exactly (bytes 1 and 3 both go
          2→128). Probable rear-axle counterpart.
    notes: See WHEEL_SPEED_PAIR_A notes.

  - name: MOTION_SIGNAL_002_0
    module: unknown
    can_id: 0x002
    byte_start: 0
    byte_length: 1
    byte_order: big
    scale: null
    offset: null
    unit: unknown
    confidence: medium  # promoted — clean gear/motion-state signature across multiple sessions
    evidence:
      - session: 2026-05-11T154648
        method: inventory_comparison
        finding: 6 unique parked → 256 unique driving.
      - session: 2026-05-11T211240
        method: byte_vs_tag_differential
        finding: >
          ~245 steady through engine-off / running-stationary / A/C-on /
          parking-brake / clutch_in tags. Drops to 131 in gear_reverse, 130
          in coming_to_stop (driving). Clean two-state-or-three-state encoding
          tied to "is the vehicle moving."
    notes: |
      Likely vehicle motion state with a forward/reverse distinction OR
      transmission-output-shaft-speed encoded value. Paired with 0x002:1
      (see GEAR_OR_MOTION_002_1) — together they likely encode the
      "vehicle moving + direction" state. Cross-reference with Mode 01
      PID 0x0D (vehicle speed) will resolve once ELM327 arrives.

  # --------------------------------------------------------------------------
  # New findings from session 2026-05-11T211240 (physical-action-tagged drive)
  # --------------------------------------------------------------------------

  - name: GEAR_OR_MOTION_002_1
    module: unknown      # 9.9ms hot-path; possibly ECM or TCM-equivalent
    can_id: 0x002
    byte_start: 1
    byte_length: 1
    byte_order: big
    scale: null
    offset: null
    unit: unknown  # likely enum
    confidence: high
    evidence:
      - session: 2026-05-11T211240
        method: byte_vs_tag_differential
        finding: >
          Cleanest enum-style transitions in the data: stays at 254 across
          engine-off / engine_started / A/C-on / parking-brake / clutch_in
          (every stationary state). Drops to 63 (= 0x3F) in gear_reverse,
          then to 102 in coming_to_stop (forward driving). Three values
          encode: stationary (254), reverse (63), forward-driving (102).
    notes: |
      One of the most diagnostic signals in the data so far. The values
      themselves look bit-packed (254 = 0xFE, 63 = 0x3F, 102 = 0x66) so
      individual bits may encode separate flags (brake-applied,
      gear-engaged, vehicle-moving). Worth decoding bit-by-bit once
      ground truth from a Mode 01 transmission state PID is available.

  - name: AC_COMPRESSOR_STATE
    module: HVAC        # 100ms body bus
    can_id: 0x625
    byte_start: 1
    byte_length: 1
    byte_order: big
    scale: null
    offset: null
    unit: unknown  # likely enum or % duty
    confidence: high
    evidence:
      - session: 2026-05-11T211240
        method: byte_vs_tag_differential
        finding: >
          0 across all engine-off and engine_started-pre-AC windows.
          Jumps to 122.8 the instant air_condition_on tag fires; stays
          at 128 during parking_brake_off and clutch_in (A/C still on).
          Drops back to ~50 once driving begins (compressor cycles).
          Exact one-event response to the A/C tag transition.
    notes: |
      Probably A/C compressor commanded state, duty cycle, or pressure.
      The drop during driving suggests it's load-modulated (compressor
      pulses on/off to manage cabin temperature). Useful for anomaly
      detection: if this byte stays at 0 when the user expects A/C, it
      indicates compressor or pressure-switch failure.

  - name: POWER_STATE_625_3
    module: HVAC        # paired with AC_COMPRESSOR_STATE on same CAN ID
    can_id: 0x625
    byte_start: 3
    byte_length: 1
    byte_order: big
    scale: null
    offset: null
    unit: unknown  # likely enum
    confidence: medium
    evidence:
      - session: 2026-05-11T211240
        method: byte_vs_tag_differential
        finding: >
          157 across engine-off windows (key on, engine off). Drops to
          52.1 during engine_started transition, then steady at 29 across
          all driving states. Three-state encoding aligned with engine
          run state.
    notes: |
      Plausible ignition/power state byte. 157 = key-on-engine-off,
      52 = transitional, 29 = engine-running-and-driving. Useful for
      anomaly detection on stalled-while-driving scenarios — if this
      byte reverts to 157 mid-drive, the engine has died.

  - name: ODOMETER_ACCUMULATOR_385
    module: unknown        # 100ms body bus, 0x385
    can_id: 0x385
    byte_start: 2
    byte_length: 5  # bytes 2-6 all spike together during driving
    byte_order: big
    scale: null
    offset: null
    unit: unknown  # bytes likely encode trip distance or odometer ticks
    confidence: medium
    evidence:
      - session: 2026-05-11T211240
        method: byte_vs_tag_differential
        finding: >
          Bytes 2-6 of 0x385 are uniformly 0 across all engine-off,
          stationary-engine-on, and gear-reverse windows, then climb in
          unison during coming_to_stop (active driving). Byte 6 reaches
          225.8, byte 3 reaches 155.2, byte 5 reaches 150.0, byte 4
          reaches 153.7, byte 2 reaches 147.7. Same pattern, multiple
          bytes — strongly suggests a multi-byte accumulator.
    notes: |
      Best candidate for trip distance / accumulated odometer ticks. The
      fact that gear_reverse shows ~0 but forward-driving shows ~150
      suggests the accumulator only ticks during forward motion (or it
      decrements in reverse and we're seeing the integration). Worth
      decoding as a single multi-byte unsigned integer.

  - name: MOTION_002_2
    module: unknown
    can_id: 0x002
    byte_start: 2
    byte_length: 1
    byte_order: big
    scale: null
    offset: null
    unit: unknown
    confidence: medium
    evidence:
      - session: 2026-05-11T154648
        method: inventory_comparison
        finding: 2 unique parked → 114 unique driving.
      - session: 2026-05-11T211240
        method: byte_vs_tag_differential
        finding: >
          Stays low through stationary states; varies widely during
