      TirePressure1-4 and gives only question-marked corner comments whose
      left/right order is opposite the QM5/Koleos mapping. CAN IDs and layouts
      are vehicle-specific, so do not promote or display these as measured
      Xterra pressures until a controlled test changes one known tire by a
      measured amount. A 4 psi change should move exactly one candidate byte
      by 16 counts. Byte 6 remains unidentified.
