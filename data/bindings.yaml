          The broadcast bit pattern maps one-for-one onto the commanded
          stages, so the commanded actuator and the broadcast reflection
          corroborate each other independently.
      - session: 2026-08-08T214218 (capture idle_rev_ac_loadstep)
        method: ac_load_step_rpm_matched
        finding: >
          NEW BIT 0x08, not in the OFF/LOW/HIGH model below. A/C off: 0x20 on
          all 2148 frames (base bit only, fan commanded off). A/C on: 0x20 (372),
