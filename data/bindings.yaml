      value: coolant high while bit 0x80 never asserts → stage-2 fan
      fault, detectable passively with no active polling. Bits
      0x01–0x10 of this byte not yet characterized.

  # --------------------------------------------------------------------------
  # ABS / wheel speeds — found 2026-08-06 by src.analysis.broadcast_discovery
  # sweeping every byte slice of the ids that had no binding at all.
  # --------------------------------------------------------------------------

  - name: WHEEL_SPEED_6F7_A
    module: ABS
    # Only fast road-speed source the live segmenter can reach; GPS trails
    # obd:SPEED by ~7% in slope. See `persist` on Signal for why this is not
    # a confidence promotion.
    persist: true
    # D03.29: the trip tracker's sky-view-independent motion source (the
    # moving -> stationary trip-end edge). Motion edges only — never distance,
    # per the under-read noted below. This field is the one pinned 1:1 against
    # obd:SPEED in tests/fixtures/ground_truth/expectations.yaml.
    quantity: road_speed
    can_id: 0x6F7
    byte_start: 0
    byte_length: 2
    byte_order: big
    scale: 0.0625
    offset: 0.0
    unit: "km/h"
    confidence: high
    model_feature: false  # redundant road speed — WHEEL_SPEED_6F7_C is the modelled copy
    plausible_min: 0.0
    plausible_max: 250.0
    evidence: &wheel_speed_6f7_evidence
      - session: 2026-08-03T163440
        method: broadcast_byte_sweep_vs_pid
        finding: >
          Regressed against Mode 01 PID 0x0D (vehicle speed) over a drive
          reaching 106 km/h: bytes 0-1 r2 = 0.99872 (km/h = raw x 0.062881
          - 0.428), bytes 2-3 r2 = 0.99878 (x 0.062965), bytes 4-5
          r2 = 0.99884 (x 0.062631), n = 987 each. The three fields agree
          with each other to a few counts all session (0-1 vs 2-3: mean
          -0.38, sd 2.95; 2-3 vs 4-5: mean -4.12, sd 4.19) — the spread of
          three wheels through corners, not three unrelated signals.
          Bytes 6-7 are NOT a fourth wheel: r2 = 0.0005 against speed and
          the field never exceeds 2 all session.
    notes: &wheel_speed_6f7_notes |
      One of three 16-bit speed fields on the ABS 0x6F7 frame (bytes 0-1,
      2-3, 4-5).

      THESE ARE NOT INDIVIDUAL CORNERS (established 2026-08-07). The
      original note read the few-count spread between them as "the spread of
      three wheels through corners". It is not. In a turn the speed split
      across an axle is dv = omega * T, so regressing the pairwise difference
      on GPS-derived yaw rate measures the lateral separation directly. Over
      703 cornering samples (>40 km/h, |yaw| > 0.04 rad/s) all three pairs fit
      a separation of 0.001-0.012 m with r = 0.07-0.14 — zero to within noise,
      against ~0.8 m for a real half-track. Decisively, the A-C offset is
      -0.44 km/h in left turns and -0.45 in right turns: a constant bias that
      does not flip sign with direction, which opposite corners must.

      So these are three vehicle-speed variants (filtered/unfiltered, or per
      consumer), not FL/FR/RL. Do not difference them to infer wheel slip.

      RETRACTED, same day: those candidates (0x284[6:8], 0x285[6:8],
      0x385[4:6]) were an artifact of my own method and are not wheel speeds.
      The yaw sweep filtered to speed > 40 km/h and ranked on the yaw
      coefficient, which threw away every stationary sample — the most
      discriminating data there is — and then divided a small yaw response by
      a near-zero fitted speed scale, inflating noise into a plausible-looking
      half-track. Re-tested over the full speed range including 455 at-rest
      samples, 0x284[6:8] and 0x285[6:8] correlate with GPS speed at
      r = 0.0007 and 0.0010. They are not speeds at all.

      NO INDIVIDUAL WHEEL SPEED HAS BEEN IDENTIFIED IN THE RECORDED BROADCAST
      CAN. The right first-order test is that a wheel must read zero at rest
      and rise linearly with ground speed. Seventeen distinct byte slices pass
      that (r ~ 0.986, zero at rest, stable counts-per-km/h) across 0x6F7,
      0x284, 0x285, 0x280, 0x354, 0x590 and 0x2D1 — and after converting each
      by its own fitted scale, every one sits within 0.08-0.15 m of vehicle
      speed against 0.875 m for a real half-track. They are all vehicle speed
      at differing resolutions. The residual ~0.11 m is common to all of
      them, which points at a sampling-lag artifact between GPS heading and
      the CAN frame rather than any geometry.

      A 2026-08-07 in-vehicle probe found no Mode-22 answer at the guessed CAN
      request ids 0x7E1-0x7E7 or 0x740-0x77F (only the ECM at 0x7E0/0x7E8).
      That rules out only that service/address combination; it does not prove
      that other CAN diagnostics or passive encodings do not exist.

      It DOES exist and is readable. Same session, the
      operator had a Z1 scan tool on an OBD-II Y-cable alongside the Pi,
      displaying live per-wheel speeds and confirming they track when the
      truck is rolled. A 25 s sniff during that showed 30 ids, all already
      known, and ZERO new frames — while the daemon's own 0x7DF requests
      (6.84 Hz) and 0x7E8 responses (6.72 Hz) were plainly visible, so the
      sniff was healthy and diagnostic traffic on this pair is observable.

      Factory wiring resolves the topology but not the Z1 implementation. The
      ABS is on this same CAN pair: DLC pins 6/14 connect to ABS terminals
      12/13 (`xterra_fsm/lan.pdf` LAN-54/62). It also has a DDL2 K-line
      diagnostic path from DLC pin 7 to ABS terminal 10
      (`xterra_fsm/gi.pdf` GI-46/47; `xterra_fsm/brc.pdf` BRC-88). CONSULT-III
      supports both transports (LAN-6).

      Therefore zero Z1 transmissions on CAN leaves two possibilities: it
      polled the ABS over pin 7, or it decoded already-present passive CAN
      frames. The factory diagnostic wiring and CAN signal chart favor
      K-line, but only observing pin 7 during the Z1 ABS screen distinguishes
      them. The earlier "wrong CAN pins / second CAN pair" conclusion is
      retracted.

      Worth noting from the same sweep: 0x284[0:2], 0x285[0:2] and 0x590[1:3]
      carry vehicle speed at ~153 counts per km/h against 0x6F7's ~14.5, so
      roughly 10x finer granularity if a higher-resolution speed is ever
      wanted. Unbound pending a check that the extra counts are real
      resolution and not just a larger number.

      ROLL TEST, 2026-08-07 (engine idling, truck pushed slowly back and forth,
      three episodes of 0.7-2.3 s). Bytes 0-1 read EXACTLY ZERO throughout,
      0% nonzero, while bytes 2-3 and 4-5 both tracked the motion to a peak of
      59 counts (3.69 km/h at 1/16) and stayed within 1 count of each other. A
      Z1 scan tool showed ~2 km/h per wheel over the same rolls. Those were
      not paired same-instant samples, so the two peaks are not a scale or
      identity cross-reference.

      So bytes 0-1 have a low-speed cut-in: over a full 63-minute drive that
      field correlates with vehicle speed at r = 0.99, yet it is dead below
      ~4 km/h. Do not use bytes 0-1 as a speed source at walking pace — it
      reports a confident zero, not a missing value. Bytes 2-3 and 4-5 have no
      such floor.

      Bytes 2-3 and 4-5 agreeing to 1 count here proves nothing about sides:
      rolling straight turns every wheel at the same rate. The corner question
      is settled separately above, from real cornering data.

      Bytes 6-7 sat constant at 3 through every roll — consistent with the
      earlier finding that the field never exceeds a small value all session.
      It is a counter or status, not a speed.

      Scale is pinned at exactly 1/16 km/h per count. All three fields fit
      ~0.0627-0.0630 rather than 0.0625, a consistent +0.4%; Mode 01 PID
      0x0D is quantised to whole km/h, which is enough to explain it, but
      not enough to rule out a true scale slightly above 1/16. Confidence
      is `high`, not `confirmed`, for exactly that reason — the binding and
      direction are certain, the last digit of the scale is not.

      THIS SCALE IS ECU-RELATIVE, NOT GROUND TRUTH (2026-08-07). It was
      pinned against Mode 01 PID 0x0D, and that PID is itself ~8% under true
      ground speed on this vehicle: per-row median obd/gps = 0.9203 over 2185
      paired seconds of 2026-08-06T162657, flat across speed bands (7.97% /
      7.93% / 7.82% above 0, 30, 60 km/h). These fields agree with the PID to
      0.55%, so they inherit the same error — pinning one against the other
      cannot detect it.

      GPS is the correct one. Steady-cruise engine-rpm clusters resolve the
      driveline exactly against GPS speed: at the regeared 4.08 final drive
      the three clusters give gear ratios 1.000 (direct drive), 1.309 and
      1.740, with a back-solved loaded circumference of 2.609 m (32.69 in,
      against 32.83 in nominal for the fitted LT285/75R16). At the stock 3.69
      the top gear would compute to 1.110, which is not a real ratio. A
      mis-scaled speed reference does not land three independent gears on
      recognisable gearbox values.

      The vehicle runs LT285/75R16 against a P265/75R16 stock fitment, which
      accounts for ~4 points of the 8; the remaining ~4 is NOT explained by
      tire size or by the regear (wheel-speed sensors sit outboard of the
      diffs, so gearing cannot reach them — and a driveshaft-derived speed
      would read 6.6% HIGH, the wrong sign).

      Two candidates have since been eliminated, so do not re-propose them:

        * "the ABS assumes a smaller base fitment" — no. This truck is the
          Off-Road trim, which shipped on P265/75R16; the smaller P265/70R16
          went on the X and S. The stock figure used above is already the
          correct one for this vehicle.
        * "the Osiris tune carries a speedometer correction" — no. The
          under-read predates the flash. Across 11 sessions the per-session
          median obd/gps is 0.9113-0.9196 on stock ZS04C (2026-07-18 and
          07-26, 4 sessions) against 0.9168-0.9328 on ZS44A (7 sessions):
          indistinguishable, and the stock side is if anything *slightly*
          worse. The ROM itself cannot be inspected to confirm — the Osiris
          container is compressed or encrypted (base and tuned ROMs share
          0.59% of bytes at the best of 64 tested alignments, i.e. none), so
          this is settled by the telemetry, not the artifact.

      The MAGNITUDE is settled; do not spend a drive re-measuring it. GPS
      carries two physically independent measurements — carrier-Doppler
      speed-over-ground (RMC, what `gps:speed` reports) and code-phase
      position — and over 2026-08-06T162657 they agree to 0.11%: the speed
      integral gives 67.606 km, the position track 67.678 km when sampled at
      10 s. Sampling the track finer inflates it (68.27 km at 360 ms: summing
      absolute steps turns position noise into length, and can only ever add)
      while sampling coarser cuts chords across curves (62.49 km at 120 s);
      10 s is where the two biases cross. The ECU integrates the same drive to
      62.03 km, so it is 8.2% under, confirmed twice by different physics.

      What is NOT settled is the cause of the ~4 points tire size does not
      explain. That is a question about the ABS module's internal
      circumference constant, and no amount of further speed or distance
      measurement will answer it — every instrument on the vehicle side of
      that constant inherits it.

      Consequence: use these fields for anything that must agree with
      obd:SPEED (mode gating, comparisons against fitted models). Do NOT use
      them for absolute distance, fuel economy, or any figure quoted as real
      road speed until the residual is resolved.

