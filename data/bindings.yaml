# Canary signal bindings — broadcast CAN bytes mapped to known signals.
#
# This is the project's canonical record of "byte position X in CAN ID Y means
# Z" findings. It grows over time as captures and analyses accumulate. Each
# entry tracks not just the mapping but the evidence backing it, so future
# data (e.g. ELM327 Mode 01 cross-reference) can promote, demote, or correct.
#
# Confidence levels:
#   confirmed     — exact scale/offset validated against ground truth
#   high          — directional behavior matches across multiple observations
#   medium        — direction matches but exact scaling unknown
#   low           — pattern is suggestive but ambiguous
#   hypothesized  — best-guess interpretation; could be wrong
#
# This file is hand-edited as findings sharpen. Tools may CONSUME it
# (DBC export, daemon decoder) but should not auto-rewrite it.

schema_version: 1

vehicle:
  make: Nissan
  model: Xterra
  year: 2008
  engine: VQ40DE
  transmission: manual_6speed

# Diagnostic-bus structure observed on the OBD-II port:
#   ~10 ms hot-path:  ECM/chassis signal frames
#   ~20 ms drivetrain
#   ~40 ms intermediate
#   ~100 ms body/BCM
#   ~900 ms+ one-shot / heartbeat
bus:
  bitrate: 500000
  channels:
    - name: vehicle_can
      ids_observed: 29  # in session 2026-05-11T152858

signals:

  # --------------------------------------------------------------------------
  # ECM — engine control
  # --------------------------------------------------------------------------

  - name: ECM_COOLANT_TEMP
    module: ECM
    can_id: 0x551
    byte_start: 0
    byte_length: 1
    byte_order: big
    scale: 1.0
    offset: -40.0
    unit: "degC"
    confidence: confirmed
    plausible_min: -10.0   # below this and we're seeing the engine-off sentinel
    plausible_max: 130.0   # Xterra thermostat caps around 90-95degC; +35 headroom
    evidence:
      - session: 2026-05-11T152858
        method: byte_vs_tag_differential
        finding: >
          Monotonic rise from raw 53 (cold start) to raw 90 (end of 6-min run),
          across every window without reversal. With offset -40, decodes to
          13degC -> 50degC — plausible cold-to-warm Xterra arc.
      - session: 2026-05-13T005522
        method: broadcast_vs_pid_regression
        finding: >
          Regressed against Mode 01 PID 0x05 (engine coolant temp): r2 = 0.999,
          coolant_degC = raw × 0.9986 − 39.86 (n = 354) — i.e. exactly the
          scale 1.0 / offset −40 already recorded. Confirmed.
    notes: |
      Strong candidate. ELM327 Mode 01 PID 0x05 (engine coolant temp) will
      cross-reference exactly. Other coolant duplicates may exist: 0x233:0
      and 0x23D:7 both showed monotonic warm-up in the earlier seated session.

      CAVEAT: raw=0 (decoded -40degC) appears in engine-off frames — looks
      like a "no reading" sentinel rather than a real -40degC reading. Any
      decoder using this signal should gate on engine-running state OR drop
      raw=0 readings. Surfaced by decode_bindings.py against
      session 2026-05-11T152858.

  - name: ECM_RPM
    module: ECM
    can_id: 0x1F9
    byte_start: 2
    byte_length: 2
    byte_order: big   # MSB byte 2, LSB byte 3
    scale: 0.125      # raw / 8 → rpm
    offset: 0.0
    unit: "rpm"
    confidence: confirmed
    plausible_min: 0.0
    plausible_max: 7000.0   # VQ40DE redline ~6000; headroom for overrev
    evidence:
      - session: 2026-05-13T005522
        method: byte_vs_tag_differential
        finding: >
          0x1F9 byte 2 rises monotonically through the rev protocol: idle ~23,
          blip_2k ~44, blip_3k ~66, sustain_2500 ~69, blip_4k ~73; ~0/3 with
          the engine off. Flagged as the clean RPM candidate.
      - session: 2026-05-13T005522
        method: broadcast_vs_pid_regression
        finding: >
          Bytes 2-3 (16-bit, big-endian) regressed against Mode 01 PID 0x0C
          (engine RPM) over the engine-running window: r2 = 1.000,
          RPM = raw x 0.1251 − 4.8 (n = 354). The clean form raw ÷ 8 is almost
          certainly the true scaling (byte 2 alone ≈ RPM / 32, also r2 ≈ 1.0).
    notes: |
      Confirmed engine RPM, 16-bit at 8 counts/rpm on the ~100 Hz 0x1F9 frame.
      This is the real RPM signal — NOT 0x23D:1-2 (see ECM_AIRFLOW_PROXY_23D,
      which the earlier rev-session analysis had mislabeled as the "rev level"
      prize but which actually cross-references to airflow).

  - name: ECM_AIRFLOW_PROXY_23D
    module: ECM
    can_id: 0x23D
    byte_start: 1
    byte_length: 2
    byte_order: big   # assumed MSB-first, byte 1 then byte 2
    scale: null       # correlation is real but not clean enough to pin
    offset: null
    unit: unknown     # airflow / fuel-related — possibly MAF (g/s), injector PW, or VE
    confidence: medium
    evidence:
      - session: 2026-05-11T152858
        method: byte_vs_tag_differential
        finding: >
          byte 1 and byte 2 spike together in lockstep across every rev event,
          ordered with RPM target (idle 0,0 → blip_4k 42.5,37.4), zero engine-off.
      - session: 2026-05-13T005522
        method: broadcast_vs_pid_regression
        finding: >
          Bytes 1-2 regress against Mode 01 PID 0x10 (MAF) at r2 ≈ 0.79
          (byte 2 alone r2 ≈ 0.82); NO clean correlation with RPM (PID 0x0C).
          So this is an airflow/fuel-related quantity, not RPM. Scaling left
          unpinned: the fit (raw×0.0016+4 g/s) doesn't match the idle MAF floor,
          so it's likely a filtered/derived value (injector PW or VE), not the
          raw MAF reading.
    notes: |
      Renamed from ECM_ENGINE_REV_LEVEL — the cross-reference rules out RPM
      (that's ECM_RPM @ 0x1F9:2-3). Cross-broadcast siblings 0x233:0 / 0x23D:7
      may carry the same value. Promotion needs a session with the MAP PID
      (0x0B) and/or MAF watched alongside a tagged drive (not just no-load revs)
      to separate MAF from injector-PW from VE.

  - name: ECM_INTAKE_VACUUM_OR_IAC
    module: ECM
    can_id: 0x233
    byte_start: 1
    byte_length: 1
    byte_order: big
    scale: null
    offset: null
    unit: unknown     # kPa (manifold abs pressure) or % (idle air control)
    confidence: high  # promoted from medium based on A/C-load response
    evidence:
      - session: 2026-05-11T152858
        method: byte_vs_tag_differential
        finding: >
          Inverse-throttle behavior: highest at warm idle (mean 227), drops
          during blips (125-141), zero when engine off. Recovers to idle
          baseline between revs. Classic IAC % or manifold pressure pattern.
      - session: 2026-05-11T211240
        method: byte_vs_tag_differential
        finding: >
          On engine_started window mean is 74; A/C-on drops it to 49; clutch_in
          (engine briefly higher rpm) spikes to 243; cruising stabilizes around
          133. A/C-load → MAP drop is the textbook engine-load signature; this
          is almost certainly manifold absolute pressure (Mode 01 PID 0x0B).
    notes: |
      A/C-load drop in the second session promotes this from "vacuum or IAC"
      to "MAP" (manifold absolute pressure) with high confidence in the
      direction. Exact scale (raw → kPa) still pending ELM327 cross-reference
      with Mode 01 PID 0x0B.

  - name: ECM_CALC_LOAD_A
    module: ECM
    can_id: 0x233
    byte_start: 4
    byte_length: 1
    byte_order: big
    scale: null
    offset: null
    unit: unknown
    confidence: medium
    evidence:
      - session: 2026-05-11T152858
        method: byte_vs_tag_differential
        finding: >
          engine_start window spiked to 202.6 (cranking transient), idles ~130,
          drops to 92 during sustained 2500 rpm. Engine-off = 0.
      - session: 2026-05-11T152858
        method: cross_broadcast_pairing
        finding: >
          Mean values are IDENTICAL to 0x23D:3 in every window, indicating
          the ECM publishes this value on two CAN IDs simultaneously.
    notes: |
      The cross-broadcast pair (with ECM_CALC_LOAD_B) reduces the candidate
      list — only signals published by the ECM appear in both. Direction
      (high cranking, mid idle, low at sustained throttle) is consistent
      with engine load or fuel pulse width.

  - name: ECM_CALC_LOAD_B
    module: ECM
    can_id: 0x23D
    byte_start: 3
    byte_length: 1
    byte_order: big
    scale: null
    offset: null
    unit: unknown
    confidence: medium
    evidence:
      - session: 2026-05-11T152858
        method: cross_broadcast_pairing
        finding: Identical means to ECM_CALC_LOAD_A (0x233:4) in every window.
    notes: Cross-broadcast duplicate of ECM_CALC_LOAD_A.

  - name: ECM_THROTTLE_TRANSIENT
    module: ECM
    can_id: 0x23D
    byte_start: 6
    byte_length: 1
    byte_order: big
    scale: null
    offset: null
    unit: unknown
    confidence: high  # promoted from medium — cranking transition seals it
    evidence:
      - session: 2026-05-11T152858
        method: byte_vs_tag_differential
        finding: >
          Bursts during blip-start/end windows specifically:
            idle_*: ~0  |  blip_2k_start: 151.9  |  blip_3k_end: 95.5
            sustain_2500_end: 85  |  blip_4k_end: 145.6
          Fires only during throttle transitions, returns to 0 at steady state.
      - session: 2026-05-11T034516
        method: byte_vs_tag_differential
        finding: >
          In the earlier seated session (with NT510 screen-selection tags),
          this byte LATCHED 0->255 once ECM reached certain live-data screens
          and never reverted. Behavior contradicts the rev session reading;
          the earlier interpretation was likely misattributed because tags
          weren't physical-action-driven.
      - session: 2026-05-11T211240
        method: byte_vs_tag_differential
        finding: >
          Engine-off / stationary windows: ~0-9. gear_reverse: 24.6.
          coming_to_stop (active driving): 186.8. Magnitude scales with
          throttle activity — confirms the rev session reading.
      - session: 2026-05-11T222447
        method: byte_vs_tag_differential
        finding: >
          key_on_engine_off_warma: 8 (engine-off baseline). cranking: 238.6
          (jumps the instant the engine cranks). driving: 93.5. stopped: 239.5
          (idle compensation activity). The 8 → 239 jump at the cranking tag
          rules out any "set on diagnostic request" interpretation — this is
          engine-running activity, full stop.
    notes: |
      Three physical-action sessions agree, including a full engine-off
      bracket: 0 at engine off, jumps the moment the engine cranks, climbs
      with throttle activity. The earlier screen-tagged session is treated
      as misattributed and ignored. Likely acceleration enrichment
      multiplier or throttle-rate-of-change signal. Exact units pending
      ELM327 cross-reference.

  # --------------------------------------------------------------------------
  # Engine state flag (cross-broadcast triplet)
  # --------------------------------------------------------------------------

  - name: ECM_ENGINE_STATE_A
    module: ECM
    can_id: 0x231
    byte_start: 0
    byte_length: 1
    byte_order: big
    scale: 1.0
    offset: 0.0
    unit: enum
    confidence: high
    evidence:
      - session: 2026-05-11T152858
        method: byte_vs_tag_differential
        finding: >
          Clean two-state behavior: raw 254 = engine off, raw 205 = engine
          running steady. Small perturbations during blips. Engine-off bracket
          at start (254) and end (engine_off_key_on = 241.6) brackets the
          running window perfectly.
      - session: 2026-05-11T152858
        method: cross_broadcast_pairing
        finding: >
          Mean values match 0x231:3 AND 0x29E:0 in every window — ECM
          publishes this state byte three times across two CAN IDs.
    notes: |
      State enum, useful as an anomaly-detection input: an unexpected
      transition to 254 mid-drive = engine stalled / fuel cut / major fault.
      The three-way redundancy means a single bit-flip in one location is
      detectable.

      REFINEMENT: decode_bindings.py against session 2026-05-11T152858 shows
      raw values across the full 0..255 range — the byte is NOT binary. The
      original 254/205 finding was based on per-tag-window MEANS. Within a
      window the byte still varies (small perturbations during transitions,
      possible counter bits in the low nibble, etc.). Future work: examine
      the byte's bit-level structure to separate the steady "state code"
      portion from any counter/transient bits.

  - name: ECM_ENGINE_STATE_B
    module: ECM
    can_id: 0x231
