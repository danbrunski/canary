    unit: unknown        # high byte of a ~16-bit steering angle (with 0x002:0 = low byte)
    confidence: low      # demoted from high — the "clean motion enum" reading is superseded
    evidence:
      - session: 2026-05-11T211240
        method: byte_vs_tag_differential
        finding: >
          254 across engine-off / engine_started / A/C-on / parking-brake /
          clutch_in (every stationary, wheels-straight state); 63 in
          gear_reverse, 102 in coming_to_stop (forward driving).
      - session: 2026-05-13T011123
        method: byte_vs_tag_differential
        finding: >
          With the vehicle stationary and engine running, swings across its
          full range during the steering lock-to-lock — steer_full_left mean
          237 (range 231–255), steer_full_right mean 82 (range 0–255),
          steer_center mean 62 (range 0–255) — and is otherwise pinned. So
          0x002 bytes 0–1 are a 16-bit steering angle, not a motion/gear enum.
          (Big-endian: centred ≈ 0x002B, full-left ≈ 0xED73, full-right
          ≈ 0x5299 — i.e. center near zero, lock-to-lock roughly ±, though the
