    notes: |
      Reinterpreted from "vehicle motion state" to the low byte of a 16-bit
      steering value on 0x002 (high byte = STEERING_ANGLE_002 @ 0x002:1, rate
      = STEERING_RATE_002 @ 0x002:2). The earlier "131 in reverse / 130 driving"
