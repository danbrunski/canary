        method: inventory_comparison
        finding: 2 unique parked → 256 unique driving.
    notes: |
      37ms cadence is unusual — typically used for transmission or 4WD
      transfer-case state. Could be a sustained-state signal that changes
      slowly with vehicle motion.

  - name: WHEEL_SPEED_PAIR_A
    module: ABS          # tentative — 18.8ms drivetrain cadence
    can_id: 0x284
    byte_start: 1
    byte_length: 2       # bytes 1 + 3 with byte 0/2 = MSB? or two 16-bit signals?
    byte_order: big
    scale: null
    offset: null
    unit: unknown        # presumed rpm or km/h
    confidence: hypothesized
    evidence:
      - session: 2026-05-11T154648
        method: inventory_comparison
        finding: >
          0x284 bytes 1 AND 3 went from 2 unique parked to 128 unique each
          driving. Same exact uniqueness profile in 0x285 bytes 1 and 3.
          Cross-broadcast pair (0x284 left wheels / 0x285 right wheels?)
          on the 18.8ms drivetrain bus — textbook ABS wheel-speed encoding.
    notes: |
      Strong wheel-speed candidate. 4 channels likely fit:
        0x284:0-1 = front-left wheel speed (16-bit)
        0x284:2-3 = front-right wheel speed (16-bit)
        0x285:0-1 = rear-left wheel speed (16-bit)
        0x285:2-3 = rear-right wheel speed (16-bit)
      Or front/rear axles. Cross-reference with PID 0x0D (vehicle speed)
      when ELM327 arrives — VSS should be the average of the four.

  - name: WHEEL_SPEED_PAIR_B
    module: ABS
    can_id: 0x285
    byte_start: 1
    byte_length: 2
    byte_order: big
    scale: null
    offset: null
    unit: unknown
    confidence: hypothesized
    evidence:
