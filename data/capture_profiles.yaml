schema_version: 1
profiles:
- name: default
  description: Normal telemetry and anomaly-detection collection
  notes: "Present so an ordinary drive settles the contested DID 0x1101 offset, which\
    \ no capture on hand can: the two recorded offsets differ by exactly 10 degC,\
    \ and separating them needs this DID and Mode 01 PID 0x05 in ONE session. Only\
    \ the default profile can do that \u2014 the tuning profile disables Mode 01.\
    \ Verified 2026-08-06 that 0x1101 was in the scheduler plan but never requested,\
    \ because the DID window polls this list, not the plan: four consecutive windows\
    \ sent 0 requests for it while ECM_RPM got one each."
  experimental: false
  mode01:
    AUTO: 1.0
  mode01_batch_groups: []
  mode22:
  - ECM_RPM
  - ECM_AIR_CHARGE
  - ECM_AF_SENSOR_V_B1
  - ECM_AF_SENSOR_V_B2
  - ECM_INJECTOR_PULSE_1
  - ECM_INJECTOR_PULSE_2
  - ECM_THROTTLE_POS_SENSOR_1
  - ECM_THROTTLE_POS_SENSOR_2
  - ECM_COOLANT_TEMP
  mode22_rate_weights: {}
  memory: []
  mode01_enabled: true
  mode22_enabled: true
  did_interval_seconds: null
  did_cycle_seconds: null
  round_timestamps: false
  target_rate_hz: null
  did_continuous: false
  bus_budget_override: null
  priority_channels: null
  expected_total_demand_hz: null
  capacity_evidence: ''
  required_tuple: []
  min_achieved_rate_hz: null
  max_tuple_skew_s: null
  requires_tune_revision: false
  corpus_eligible: true
  behavior_model_recipes: []
  storage_prefix: ''
- name: fuel-map
  description: High-rate fueling and timing capture
  notes: 'Starter profile (data, not code, since 2026-09-21): Mode 01 fuelling and
    spark at WOT-resolving rate.


    Fast channels (rpm, load, MAF, timing, throttle, both wideband lambdas, commanded
    phi, fuel status) run at the full 4 Hz, because a 5 s pull is the unit of work
    and anything slower samples it two or three times. Context channels run at weight
    0.25 (1 Hz): baro, IAT, speed, coolant, trims and purge. They move over seconds
    to minutes and are there for gating.


    target_rate_hz and bus_budget_override are both set, because either alone does
    nothing. The 2026-08-10 capture ran without them at the 1 Hz x tier cap and the
    8 req/s default budget, and landed at 0.28-0.78 Hz while calling itself high-rate.


    required_tuple is the five channels a delivery-error sample needs co-observed.
    The scarcest of them sets the real yield: the 2026-08-10 capture polled all five
    and still produced two usable instants in 24 minutes.


    Drop any PID the vehicle''s ECM does not answer. The Xterra refuses O2_WR_LAMBDA_S2
    (PID 0x25).'
  experimental: false
  mode01:
    RPM: 1.0
    ENGINE_LOAD: 1.0
    MAF: 1.0
    TIMING_ADVANCE: 1.0
    THROTTLE_POS: 1.0
    O2_WR_LAMBDA_S1: 1.0
    O2_WR_LAMBDA_S2: 1.0
    COMMANDED_EQUIV_RATIO: 1.0
    FUEL_STATUS: 1.0
    BAROMETRIC_PRESSURE: 0.25
    INTAKE_TEMP: 0.25
    SPEED: 0.25
    COOLANT_TEMP: 0.25
    SHORT_FUEL_TRIM_1: 0.25
    SHORT_FUEL_TRIM_2: 0.25
    LONG_FUEL_TRIM_1: 0.25
    LONG_FUEL_TRIM_2: 0.25
    EVAPORATIVE_PURGE: 0.25
  mode01_batch_groups: []
  mode22: []
  mode22_rate_weights: {}
  memory: []
  mode01_enabled: true
  mode22_enabled: true
  did_interval_seconds: null
  did_cycle_seconds: null
  round_timestamps: true
  target_rate_hz: 4.0
  did_continuous: false
  bus_budget_override: 20.0
  priority_channels: null
  expected_total_demand_hz: 45.0
  capacity_evidence: '45 channel-reads/s against 478/s measured batched on this ECM
    (2026-08-04). Budget held at 20 req/s, under the 24 req/s storage-sink line: batching
    packs 6 PIDs per request, so 45 reads/s needs ~8 req/s batched and 45 unbatched.
    If batching is off the contract reports a shortfall rather than silently exceeding
    the sink''s known-safe rate.'
  required_tuple:
  - RPM
  - ENGINE_LOAD
  - FUEL_STATUS
  - COMMANDED_EQUIV_RATIO
  - O2_WR_LAMBDA_S1
  min_achieved_rate_hz: 3.0
  max_tuple_skew_s: null
  requires_tune_revision: true
  corpus_eligible: false
  behavior_model_recipes: []
  storage_prefix: _capture-fuel-map
- name: tuning-did
  description: All-DID tuning capture (session held open)
  notes: 'Starter profile (data, not code, since 2026-09-21): all-DID tuning capture
    that holds the Mode-22 session open, so Mode 01 is off by construction. What that
    buys is what Mode 01 cannot reach at all, sampled synchronously: intake cam angle
    (commanded and measured) and A/F sensor voltage, the input to the validated voltage-to-AFR
    table. The DID names are the Xterra''s (data/dids.yaml); another vehicle needs
    its own list.


    RPM and coolant are included despite being on broadcast CAN. They cost ~1.5 ms
    each and give same-instant anchors inside the DID round.


    Both measured cam channels are polled because they are two banks: the first capture
    using this profile found a +0.51 deg offset with the cam static (p=2.3e-29).


    Coolant and IAT run at weight 1/15 (1 Hz), because they are context. Coolant changes
    at 0.441 degC/s at p99.9 (38 sessions, 10,488 adjacent pairs) and quantises at
    1 degC, so 1 Hz cannot miss a step. Do not go slower: cold-start warm-up is ~20x
    faster than the warm drive where 0.2 % of samples changed.


    Delivery error is impossible here: commanded AFR needs Mode 01, which this profile
    disables.'
  experimental: false
  mode01: {}
  mode01_batch_groups: []
  mode22:
  - ECM_RPM
  - ECM_AF_SENSOR_V_B1
  - ECM_AF_SENSOR_V_B2
  - ECM_AIR_CHARGE
  - ECM_INJECTOR_PULSE_1
  - ECM_INJECTOR_PULSE_2
  - ECM_INTAKE_CAM_ANGLE_MEASURED
  - ECM_INTAKE_CAM_ANGLE_COMMANDED
  - ECM_INTAKE_CAM_ANGLE_MEASURED_B
  - ECM_INTAKE_VVT_SOLENOID_DUTY
  - ECM_INTAKE_VVT_SOLENOID_DUTY_CANDIDATE_B2
  - ECM_THROTTLE_POS_SENSOR_1
  - ECM_COOLANT_TEMP
  - ECM_INTAKE_AIR_TEMP_1106
  mode22_rate_weights:
    ECM_COOLANT_TEMP: 0.06666666666666667
    ECM_INTAKE_AIR_TEMP_1106: 0.06666666666666667
  memory: []
  mode01_enabled: false
  mode22_enabled: true
  did_interval_seconds: null
  did_cycle_seconds: null
  round_timestamps: true
  target_rate_hz: 15.0
  did_continuous: true
  bus_budget_override: 184.0
  priority_channels: null
  expected_total_demand_hz: 182.0
  capacity_evidence: '2026-08-04 bench: 658 DID reads/s. 12 DIDs x 15 Hz + ECM_COOLANT_TEMP
    and ECM_INTAKE_AIR_TEMP_1106 x 1 Hz = 182 reads/s. The 2026-09-10 H8 drive sustained
    116.8 req/s with 11 DIDs at 10.4 Hz each, 41 timeouts in 167,885 requests and
    0 bus errors, so the ECM is not the binding constraint; coolant''s 15 Hz share
    was simply wasted (0.2 % of its samples changed while it took 1/11 of the budget).
    The 184 req/s budget leaves two slots/s for session refresh and jitter.'
  required_tuple: []
  min_achieved_rate_hz: 12.0
  max_tuple_skew_s: null
  requires_tune_revision: true
  corpus_eligible: false
  behavior_model_recipes:
  - air_charge_vs_rpm_throttle_did
  - cam_primary_vs_command_rpm_did
  - cam_secondary_vs_command_rpm_did
  storage_prefix: _capture-tuning-did
- name: broadcast-every-frame
  description: Normal polling, every broadcast CAN frame stored
  notes: 'Starter profile (P02.10, 2026-09-26). Normal collection stores a broadcast
    CAN frame only when its payload differs from its id''s previous frame, and re-writes
    an unchanged id once per collection.broadcast_stale_timeout_seconds. That keeps
    every value but not sub-second frame timing or per-id frame counts, so the readers
    that count frames (receive-loss accounting, broadcast byte discovery, frame rates)
    refuse a change-only session and point here.


    Polls the core Mode 01 channels plus the density and thermal context every capture
    carries; only the storage differs from normal collection. Add the vehicle''s DIDs if
    the capture should also carry them. Every-frame storage is about 1.7x the CAN rows
    of a change-only drive (2026-09-20: 12.5 M frames against 7.36 M kept), so keep
    these captures to the window that needs them.'
  experimental: false
  mode01:
    RPM: 1.0
    ENGINE_LOAD: 1.0
    MAF: 1.0
    THROTTLE_POS: 1.0
    BAROMETRIC_PRESSURE: 1.0
    INTAKE_TEMP: 1.0
    SPEED: 1.0
    COOLANT_TEMP: 1.0
  mode01_batch_groups: []
  mode22: []
  mode22_rate_weights: {}
  memory: []
  mode01_enabled: true
  mode22_enabled: true
  did_interval_seconds: null
  did_cycle_seconds: null
  round_timestamps: false
  target_rate_hz: null
  did_continuous: false
  bus_budget_override: null
  priority_channels: null
  expected_total_demand_hz: null
  capacity_evidence: ''
  required_tuple: []
  min_achieved_rate_hz: null
  max_tuple_skew_s: null
  requires_tune_revision: false
  corpus_eligible: false
  behavior_model_recipes: []
  storage_prefix: _capture-broadcast-every-frame
  store_every_frame: true
