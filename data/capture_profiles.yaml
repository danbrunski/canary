schema_version: 1
profiles:
- name: default
  description: Normal telemetry and anomaly-detection collection
  mode01:
    AUTO: 1.0
  mode22:
  - ECM_RPM
  - ECM_INJECTOR_PW_B1
  - ECM_AF_SENSOR_V_B1
  - ECM_AF_SENSOR_V_B2
  - ECM_THROTTLE_POS_SENSOR_1
  - ECM_THROTTLE_POS_SENSOR_2
  # Present so an ordinary drive settles the contested DID 0x1101 offset, which
  # no capture on hand can: the two recorded offsets differ by exactly 10 degC,
  # and separating them needs this DID and Mode 01 PID 0x05 in ONE session.
  # Only the default profile can do that — the tuning profile disables Mode 01.
  # Verified 2026-08-06 that 0x1101 was in the scheduler plan but never
  # requested, because the DID window polls this list, not the plan: four
  # consecutive windows sent 0 requests for it while ECM_RPM got one each.
  - ECM_COOLANT_TEMP
  mode01_enabled: true
  mode22_enabled: true
  did_interval_seconds: null
  round_timestamps: false
  target_rate_hz: null
  did_continuous: false
  bus_budget_override: null
  broadcast_decode: true
  corpus_eligible: true
  storage_prefix: ''
- name: fuel-map
  description: High-rate fueling and timing capture
  mode01:
    RPM: 1.0
    ENGINE_LOAD: 1.0
    MAF: 1.0
    TIMING_ADVANCE: 1.0
    THROTTLE_POS: 1.0
    INTAKE_TEMP: 1.0
    SPEED: 1.0
    COOLANT_TEMP: 1.0
    O2_WR_LAMBDA_S1: 1.0
    O2_WR_LAMBDA_S2: 1.0
    SHORT_FUEL_TRIM_1: 1.0
    SHORT_FUEL_TRIM_2: 1.0
    LONG_FUEL_TRIM_1: 1.0
    LONG_FUEL_TRIM_2: 1.0
    COMMANDED_EQUIV_RATIO: 1.0
    EVAPORATIVE_PURGE: 1.0
    FUEL_STATUS: 1.0
  mode22: []
  mode01_enabled: true
  mode22_enabled: true
  did_interval_seconds: null
  round_timestamps: false
  target_rate_hz: null
  did_continuous: false
  bus_budget_override: null
  broadcast_decode: true
  corpus_eligible: false
  storage_prefix: _capture-fuel-map
- name: tuning-did
  description: All-DID tuning capture (session held open)
  mode01: {}
  mode22:
  - ECM_RPM
  - ECM_AF_SENSOR_V_B1
  - ECM_AF_SENSOR_V_B2
  - ECM_INJECTOR_PW_B1
  - ECM_INTAKE_CAM_ANGLE_MEASURED
  - ECM_INTAKE_CAM_ANGLE_COMMANDED
  - ECM_INTAKE_CAM_ANGLE_MEASURED_B
  - ECM_INTAKE_VVT_SOLENOID_DUTY
  - ECM_INTAKE_VVT_SOLENOID_DUTY_CANDIDATE_B2
  - ECM_THROTTLE_POS_SENSOR_1
  - ECM_COOLANT_TEMP
  mode01_enabled: false
  mode22_enabled: true
  did_interval_seconds: null
  round_timestamps: true
  target_rate_hz: 15.0
  did_continuous: true
  bus_budget_override: 180.0
  expected_total_demand_hz: 165.0
  capacity_evidence: '2026-08-04 bench: 658 DID reads/s; 11 DIDs x 15 Hz = 165 reads/s.'
  broadcast_decode: true
  corpus_eligible: false
  behavior_model_recipes:
  - injector_pw_vs_rpm_throttle_did
  - cam_primary_vs_command_rpm_did
  - cam_secondary_vs_command_rpm_did
  storage_prefix: _capture-tuning-did
