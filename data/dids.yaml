  # --- Intake cam timing (VTC) family ---------------------------------------
  # Five one-byte CAN DIDs, all read from one firmware block (decompiler pass
  # 2026-10-04: docs/ecu-firmware-analysis.md "Intake cam timing (VTC)", D03.37).
  # CAN pointer table 0x24988 sends them to RAM 0xFFFF278C-278F and 0xFFFF26FC.
  # Those bytes are a per-cycle snapshot: after the task loop, 0x20EF2 copies
  # 0x8C bytes from 0xFFFF2792 to 0xFFFF2706, so 278C-278F mirror the
  # controller's 2818-281B, and a 4-byte copy makes 26FC the target 2700.
  #
  #   DID     RAM (copy of)   quantity                          bank
  #   0x113A  26FC (2700)     commanded angle, one for both     -
  #   0x1135  278E (281A)     measured angle                    1
  #   0x1163  278F (281B)     measured angle                    2
  #   0x1138  278C (2818)     solenoid duty                     1
  #   0x1139  278D (2819)     solenoid duty                     2
  #
  # Banks come from the firmware's own DTC item table (0x102D0). Controller
  # index 0 reports P0011 (performance) and P0075 (solenoid circuit), reads
  # cam input GR1F and drives timer output TO7B; index 1 reports P0021/P0081,
  # GR1E and TO7A. That Nissan's bank 1 is the cylinder 1/3/5 side is
  # inferred, not read. To check it, unplug the 1/3/5-side solenoid at key-on
  # engine-off; the circuit test should set P0075, not P0081.
  #
  # Angles: raw = learned retard-stop reference - cam edge + 128, in 1/20 of a
  # 10 degCA crank tooth, so 0.5 degCA per count and 128 = 0 deg at the
  # learned stop. That is the ROM Cam Phasing decode ((N-128)/2) the entries
  # already used, and every member reads 0x80 with the engine off.
  #
  # Superseded 2026-10-04: bank assignment argued from UpRev INTK CAM TIM-B1/B2
  # parked snapshots ("0x1135 probably bank 2", from a static 0x1135 - 0x1163
  # offset of +0.51 deg with UpRev's sign). Each bank is measured from its own
  # learned stop, so a parked offset between them reflects the two learned
  # references and could not name a bank; the firmware says 0x1135 is bank 1.
  # The 2026-08-05 argument that 0x113A is the command (8/8 parked sweeps
  # exactly 0.00 deg while both measured angles jitter) stands, and the
  # firmware agrees.
