  # --- Intake cam phasing family (2026-08-05 drive sweeps) ---------------
  # Scale/offset come from the ROM Cam Phasing decode (advance = (N-128)/2,
  # 0x80 = 0.0 deg), independently corroborated: every member reads exactly
  # 0x80 with the engine off, spans 0-37 deg in motion against the ROM
  # table's 0-35, and correlates +0.72..+0.74 with the known VVT solenoid
  # duty 0x1110 in the causally correct direction.
  #
  # Resolved 2026-08-05 against UpRev's INTK CAM TIM-B1/-B2 columns. The
  # discriminator is behaviour at the cam's mechanical stop, where the signal
  # is not moving so sequential-read skew contributes nothing:
  #   UpRev B1 parked: mean -1.10 deg, sd 1.34   (a real sensor, jitters)
  #   UpRev B2 parked: mean +0.25 deg, sd 0.70   (a real sensor, jitters)
  #   0x113A  parked: mean  0.00 deg, sd 0.00   (8/8 sweeps exactly zero)
  # A position sensor jitters; a setpoint does not. 0x113A is therefore the
  # COMMANDED angle, not a bank -- which also explains why it deviates from
  # the skew prediction during motion (command leads response).
  #
  # 0x1135 and 0x1163 are statistically identical at the stop
  # (-0.12 +/- 0.15 deg) and differ during motion exactly as 46 DIDs of read
  # skew predicts, so they are ONE measured signal mirrored across two
  # registers -- a pattern this ECM already shows (heater duty appears on
  # four DIDs). They are NOT a B1/B2 pair; a real pair would carry UpRev's
  # ~1.0-1.35 deg separation.
  - did: 0x113A
    name: ECM_INTAKE_CAM_ANGLE_COMMANDED
    byte_start: 0
    byte_length: 1
    byte_order: big
    scale: 0.5
    offset: -64.0
    unit: degCA
    confidence: high
    plausible_min: -10.0
    plausible_max: 45.0
    notes: >
      Commanded/target intake cam advance, not a measured bank. Zero variance
      at the stop across 8 sweeps while both real banks jitter. Useful as the
      command half of a command-vs-response pair for cam work.

  # Measured angle. Bank assignment is a MODERATE-CONFIDENCE inference, not a
  # measurement: at the stop this reads mean +0.44 deg / sd 0.75, which sits
  # 0.7 SE from UpRev's B2 (+0.25 / 0.70) and 5.9 SE from B1 (-1.10 / 1.34).
  # Sign, magnitude and noise level all agree, and nothing points at B1 -- but
  # it rests on 8 parked snapshots taken on a different day from the UpRev
  # reference. Names stay bank-neutral until a simultaneous UpRev log settles
  # it; do not let downstream code assume the bank.
  - did: 0x1135
    name: ECM_INTAKE_CAM_ANGLE_MEASURED
    byte_start: 0
    byte_length: 1
    byte_order: big
    scale: 0.5
    offset: -64.0
    unit: degCA
    confidence: high
    plausible_min: -10.0
    plausible_max: 45.0
    notes: >
      One of the two measured banks; 0x1163 is the other. Probably bank 2 --
      MEASURED minus 0x1163 is +0.51 deg with the cam static, the same sign as
      UpRev's B2-B1 (+1.35 parked), though only ~40% of its magnitude and
      measured on a different day. Do not let downstream code assume the bank.
  - did: 0x1163
    name: ECM_INTAKE_CAM_ANGLE_MEASURED_B
    byte_start: 0
    byte_length: 1
    byte_order: big
    scale: 0.5
    offset: -64.0
    unit: degCA
    confidence: high
    plausible_min: -10.0
    plausible_max: 45.0
    notes: >
      The second measured bank -- NOT a mirror of 0x1135, corrected 2026-08-06.

      The mirror call came from 8 parked sweep snapshots that showed the pair
      "statistically identical at rest (-0.12 +/- 0.15)". That sample was
      underpowered and the uncertainty was stated at the time, then treated as
      settled anyway. The first all-DID capture reads both in the same rotation
      for 12 minutes and separates them decisively: over 1011 aligned rows they
      differ by +0.46 deg on average, and only 22% of samples are identical.

      Read skew cannot explain it. Skew scales with how fast the signal is
      moving and vanishes at rest, but with the cam STATIC (<1 deg/s, n=313)
      the offset is +0.514 deg, t=12.5, p=2.3e-29 -- and it does not grow when
      the cam is slewing (+0.658 deg at >20 deg/s, within noise of the static
      figure). A persistent offset while nothing moves is two sensors.

  - did: 0x1139
    name: ECM_INTAKE_VVT_SOLENOID_DUTY_CANDIDATE_B2
    byte_start: 0
    byte_length: 1
    byte_order: big
    scale: null
    offset: null
    unit: percent
    confidence: low
    notes: >
      Candidate sibling of 0x1110 for the other intake VVT solenoid. It is a
      research candidate, not a confirmed bank-2 actuator mapping; retain it
      only in the focused all-DID capture while tagged transition evidence is
      collected.

  # The OTHER bank's measured angle was NOT found in 0x1000-0x1400. A search
  # of all 158 responding DIDs turned up no second cam-like signal carrying a
  # persistent ~1 deg offset with independent jitter. 0x1139 does look like
  # the bank-2 VVT solenoid DUTY (sibling of the known 0x1110), so bank 2's
  # actuator is exposed but its position is not -- extend the next sweep past
  # 0x1400. Not blocking: the ROM Cam Phasing table is a single table, not
  # per-bank, so commanded + one measured + both duties is a working set.
