# ---------------------------------------------------------------------------
# Service 0x23 (ReadMemoryByAddress) channels.
#
# These are RAM addresses, not identifiers. An address belongs to the ECU's
# program, not its calibration: the flashes made on this vehicle change
# tables, not the RAM layout, so a channel stays live across a reflash
# (operator, 2026-09-21). `verified_tune_revision` records which calibration
# the address was checked on, as provenance only. The collector does not gate
# on it. `known_answer` is what re-verifies an address
# (tools.verify_memory_channels). A different ECU program is a different
# memory map; verify there before trusting any of these. The request form is
# vehicle-verified too: on this ECM only the KWP32 body (32-bit address +
# 16-bit length) is accepted -- the KWP24 and UDS-ALFID forms both answer
# NRC 0x12 (2026-09-20).
#
# Reads only. Service 0x3D (WriteMemoryByAddress) is not implemented here and
# must not be: AGENTS.md puts conditions on any write to the ECU's
# non-volatile memory, and a memory write is the shortest path across them.
# ---------------------------------------------------------------------------
memory:
  - name: ECM_TARGET_EQUIV_RATIO
    address: 0xFFFF26BE
    length: 2
    byte_start: 0
    byte_length: 2
    byte_order: big
    scale: 6.103515625e-05   # Q14: raw / 16384
    offset: 0.0
    unit: phi
    confidence: high
    plausible_min: 0.9
    plausible_max: 1.4
    verified_tune_revision: ZS44A-k106
    window: fuel_target
    sentinel_raw: 0
    sentinel_meaning: >
      Fuel cut -- no AFR target commanded. NOT a phi of zero: scaling it
      would decode to 0.0 and then divide into a target AFR of infinity.
    # Proves the address still holds this quantity after a reflash. DID
    # 0x1134 is the floored high byte of this word, which held across
    # 5,000/5,000 same-reply observations with no exceptions. A moved
    # address will not keep satisfying that, where a plausibility bound
    # alone would happily accept whatever now lives here.
    known_answer:
      did: 0x1134
      relation: clamped_high_byte
      floor: 64
      notes: >
        The floor is why 0x1134 cannot distinguish fuel cut from stoich:
        word 0 and word 0x4000 both map to raw 64.
    evidence:
      - session: _uprev-usb-2026-09-20-target-afr
        method: uprev_operator_selected_memory_descriptor
        finding: >
          UpRev's Target AFR item does not use a DID. Its captured stream
          definition reads two absolute-RAM bytes, `83 ff ff 26 be` and
          `83 ff ff 26 bf`, which is why 138 answering DIDs and a full
          broadcast sweep never located this quantity.
      - session: _uprev-usb-2026-09-20-target-afr
        method: same_reply_piecewise_identity_vs_did_0x1134
        finding: >
          Across 5,000/5,000 same-reply observations, with no exceptions,
          `0x1134 raw = max(64, floor(word / 256))`, over words 0x0000,
          0x4000, 0x4080, 0x4100, 0x4150, 0x4180, 0x4380 and 0x4A80.
          0x4A80 / 16384 = 1.1640625 maps to 0x1134 raw 74, reproducing the
          independently observed Mode 01 PID 0x44 commanded-phi value at
          0x1134=74. A straight-line fit is unresolved (r2=0.078) because
          the relation is piecewise and clamped -- the per-reply equality is
          the applicable result, not the regression.
      - session: _uprev-usb-2026-09-20-target-afr
        method: fuel_cut_coincidence
        finding: >
          All 98 zero-word replies coincided with injector pulse 0x1206 raw
          54-57 (the established DFCO floor) at 2,687-2,950 rpm with closed
          throttle. A Windows combined capture reproduced it on both banks:
          131 zero-word samples with both injectors at raw 45-49 and both
          A/F sensors at the 5.065 V lean rail.
      - session: can-target-afr-memory-probe
        method: can_transport_parity
        finding: >
          Not cable-only. Through the Pi's ordinary ISO-TP CAN client, after
          entering session 0xC0, a service 0x23 request with KWP32 body
          `FF FF 26 BE 00 02` returned positive payload `4000`. The KWP24
          and UDS-ALFID request forms both returned NRC 0x12.
    notes: |
      The ECU's FINAL commanded equivalence ratio, after every enrichment
      and cut. target_AFR = stoich_AFR / phi for a non-sentinel word.

      DID 0x1134 is the low-resolution, floor-clamped rich-side view of this
      same quantity and holds at raw 64 during fuel cut, so it cannot tell
      fuel cut from stoich. Use 0x1134 only when this channel was not
      polled, and never present it as the final target.

      Mode 01 PID 0x44 is NOT this word in general (firmware 2026-10-05,
      verified from code, data-checked). PID 0x44 = this word x 0xFFFF46AC /
      3675 (A,B; / 32768 for the ratio), where 0xFFFF46AC
      (mem:ECM_AF_FEEDBACK_TARGET_PREV_B1) is the previous-cycle copy of the
      A/F feedback target 0xFFFF46B2 (mem:ECM_AF_FEEDBACK_TARGET_B1, AFR x
      500). It equals phi = word / 16384 only while that target is 7350
      (14.7). 2,437 logged idle reads of PID 0x44 = 0.871 (STFT +9..+15 %)
      had injector pulses matching this word = 0x4000 (phi 1.0). PID 0x44
      agreeing with this word at WOT (1.1640625 above) implies the target
      was 7350 there, not that the PID is phi everywhere. Use this channel for
      phi; afr_calibration.yaml's `commanded_equiv_ratio_convention: phi`
      describes the PID's encoding, not this caveat.

      The address is specific to this ROM/calibration. Do not copy it into
      shared code or assume another ECU exposes the same map.

