  # Fuel Compensation's load input ("Volumetric Flow Ratio" in UpRev): an
  # alpha-N (throttle-model) relative fill, 0..224. Decoded from code by two
  # independent passes and reproduced on data, 2026-10-04.
  - name: ECM_FUEL_COMP_X_INPUT
    address: 0xFFFF118A
    length: 1
    byte_length: 1
    confidence: high
    verified_tune_revision: ZS44A-20260920
    window: fuel_comp_x
    evidence:
      - session: firmware-ZS44A-20260920
        method: disassembly
        finding: >
          The Fuel Comp lookup's load input: call site 0x02DC34 passes it
          against the column axis 0xCB29 (bytewise compare); the rpm axis is
          0xCACD. (An earlier note here called 0xCACD its axis; that was wrong.)
      - session: firmware-ZS44A-20260920
        method: disassembly
        finding: >
          Sole writer, decoded by a listing pass and a Ghidra pass that agree
          (FUN_0003c3a4 after the Ghidra repair; X is formed at 0x3C444, and
          the byte stored at 0x3C4BA):
          X = min(0xFFFF, w116A x (w1124/512 + w139E/2048)), copy at
          0xFFFF2136. w116A = 0xDC1D00 / min(0xFFFF, 158 [cal 0x8D25] x rpm
          word 0xFFFF1210), about 1,141,245 / rpm; it pins at 220 above
          5,187.5 rpm, where the product saturates. w1124 is the throttle
          effective area minus idle air: table 0xDD94 (32 rising points,
          112..48,060) on axis ROM 0xEE6A (0..3,172), input 4 x w2CC8, where
          w2CC8 is throttle sensor A's count above its learned closed
          position (w2CCE, the word Mode 01 PID 0x11 reads at 8.19 counts per
          %; sensor B's w2CD0 only when sensor A alone has faulted), minus
          w63FC = idle-speed feedback plus NV-learned idle air, capped at 1185
          (cal 0x8ED2), floored at 0. w1124 becomes the constant 782 (cal
          0x90BE) when bit 2 of 0xFFFF484E is set by the TPS1/TPS2/correlation
          diagnostics (0x8E58C): the electronic-throttle limp-home area
          (inferred, strongly suggested). w139E is the EVAP purge area, 1.125
          x the purge byte (cal 0x82FE = 144, >> 7) written in FUN_0006a52c,
          the same purge byte DID 0x1110 and PID 0x2E report. So w1124 is
          throttle-derived, not MAF (an earlier version of this note said
          MAF; wrong). The byte is curve(X) >> 8: table 0xEAEC on 4X below
          X = 0x3C00, table 0xEACC on X - 0x3C00 above it, 16 points each.
          It reads 4 at X = 0, then 63, 108, 141, 161, 174 ... 204 at 0x3C00,
          saturating at 224. The 0x3C00 split is only a resolution change
          (0xEAEC[15] = 0xEACC[0] = 52479), not a knee. There is no baro or
          temperature input. At full throttle it reaches 224 only below about
          1,660 rpm.
      - session: firmware-ZS44A-20260920
        method: disassembly
        finding: >
          Consumers. The Fuel Comp factor (0xFFFF225A, 128 = 1.0, read at
          0x3D0F4) multiplies the MAF-derived charge before the
          manifold-filling filter (w105C = Tp x FC / 128 at 0x3C7B4), so Fuel
          Comp acts inside BFS (DID 0x1208). The byte also indexes the 8x8
          manifold-filling time-constant tables 0x9B99/0x9BD9 (the tip-in and
          tip-out lag), sets the transient flag (|change over 5 cycles| >= 11
          sets 0xFFFF283C bit 2) and the near-WOT flag (0xFFFF289B bit 7, set
          at >= 202, cleared below 200). Its rate of change is stored at
          0xFFFF114A.
      - session: _capture-ram-study-2026-10-04T204557
        method: chain_reproduction
        finding: >
          The decoded chain, fed throttle % as counts ((A + 0.5) x 3.21), rpm
          from Mode 01 and purge from PID 0x2E, with one free constant (w63FC
          = 115), reproduces the logged byte at 60 steady points. Median
          ratio is 1.000 at idle (n = 38, p10-p90 0.975-1.037) and 1.027 off
          idle (n = 22, 0.886-1.148). Wrong variants miss off idle: x =
          1/2/8 x w2CC8 give 3.02/1.71/0.57, 2.55 or 4.0 counts per % give
          1.23/0.83, rpm^0.5 and rpm^1.5 give 0.67/1.70. Purge moves the
          prediction by at most 2 counts.
    notes: >
      A relative fill in the ECM's own units, 0..224 raw; the code pins no
      absolute unit for the byte or the area table, so no scale is recorded.
      UpRev's "Volumetric Flow Ratio" % (raw x 100/256) is a display
      convention; CANary's ROM viewer shows the Fuel Comp axis as % of the 224
      ceiling (raw x 100/224). An example once quoted here as contradicting the chain
      (byte 51 at 3,684 rpm and 18 % throttle) is withdrawn: it was a
      transient, and the decoded chain predicts about 110 at that instant.
      To test the whole chain on one instant, read 0xFFFF2CC8, 2C32, 63FC,
      139E, 116A, 2136, 118A, 225A, 105C and 103A in one memory window.
