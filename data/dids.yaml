  # 03/07 (their config word lacks bit 0x80), so these RAM flags are the only
  # knock-sensor health monitor CANary has. Every value here is RAM, reset at
  # engine stop, and exposed by no Mode 01 PID, Mode 22 DID or Mode 06 MID.
