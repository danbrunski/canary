  # code says. Not in any capture profile until that read passes. Most of
  # the known answers are relations between RAM words, which
  # `MemoryKnownAnswer` cannot express (it checks a word against a DID);
  # each is stated exactly in the channel's notes, and
  # tools/verify_memory_channels reports those channels as unverifiable.
  # Cylinder indexes are the firmware's 1-6 firing counter (0xFFFF11FC):
  # odd -> knock sensor 1 / bank 1, even -> sensor 2 / bank 2 (verified);
  # that the index equals the cylinder number is inferred, hence `_IDX<n>`.
