# Canary Mode 22 DID map — identified Nissan UDS ReadDataByIdentifier params.
#
# The Mode-22 counterpart of bindings.yaml (which covers broadcast bytes).
# DIDs here are actively polled over the ECU diagnostic session; only
# *identified* DIDs are recorded — the full per-session sweeps live in the
# (gitignored) data/sessions/<ts>/dids_*.json snapshots and the analyses.
#
# byte_start/byte_length index into the Mode-22 response *payload* (bytes
# after the `62 HH LL` echo) — exactly CanObdClient.query_mode_22().payload.
# Loader/validator: src/decode/dids.py (strict pydantic).
#
# Confidence ladder matches bindings.yaml: confirmed = scale/offset
# validated vs ground truth; high = directional + cross-checked; medium =
# byte known, scaling unpinned; etc.

schema_version: 1

vehicle:
  make: Nissan
  model: Xterra
  year: 2008
  engine: VQ40DE

access:
  ecu_request_id: 0x7E0       # engine ECM physical request
  ecu_response_id: 0x7E8
  session: 0xC0               # UDS 0x10 sub-function that unlocks Mode 22
  exit_session: 0x81          # return to default session — ends the Mode-01 blackout
  exit_grace_seconds: 0.05    # Mode 01 answered on the *next request* after 10 81 (2026-08-04)
  keepalive_seconds: 2.0      # re-send 10 C0; 0x81/0x85 open but don't unlock 0x22
  # Measured 2026-09-20, engine running: lengths 32/33/40/48/56/60/62/63 all
  # answered positively and 64 returned NRC 0x12, while every interleaved DID
  # kept answering. A vehicle/calibration constraint, not a service-0x23 limit.
  max_memory_read_length: 63
  # Service 0x21 local identifier 0x10 returns the calibration id as ASCII
  # (`1ZS44A00000` on ZS44A). W02.1: it has only ever been sent inside
  # session 0xC0 (tools/probe_local_identifier.py, 2026-09-20 KOEO), so
  # whether it answers in the default session is not known. `unverified`
  # `extended`: the read rides the Mode-22 session window. Measured, not
  # assumed — see the evidence below and data/analyses/2026-09-22-w02-1-koeo-probe.md.
  calibration_id:
    local_identifier: 0x10
    session: extended
    evidence: >-
      W02.1 KOEO probe, 2026-09-22 20:02 MDT, vehicle_state ignition_only
      (rpm 0, coolant 68 C), collector in phase mode01 (default session,
      next 0xC0 window 33 s away). Sent `02 21 10` to 0x7E0 with no session
      entered; ECM replied `03 7F 21 80` in 377 us — NRC 0x80,
      serviceNotSupportedInActiveDiagnosticSession. Positive controls in the
      same second: 01 0C @7E0 -> 41 0C 00 00, 01 05 @7DF -> 6C. In-session
      control: the daemon's own window read (W02.2) returned 1ZS44A00000 and
      /status showed calibration_matches_registry true. Earlier: answered
      61 10 <ASCII> inside 0xC0 on 2026-09-20 KOEO (probe_local_identifier
      sweep). candump in data/analyses/2026-09-22-w02-1-koeo-probe.md.
  notes: |
    The 2008 Nissan ECM refuses service 0x22 in the default session
    (7F 22 80). Sub-functions 0x81/0x85/0xC0 all return positive 50 xx
    but only 0xC0 unlocks 0x22. TesterPresent 0x3E is itself rejected, so
    the session is kept alive by re-sending 10 C0 every ~2 s (S3 ≈ a few
    s). Session 0xC0 is MUTUALLY EXCLUSIVE with standard OBD Mode 01 — the
    ECM stops answering Mode 01 while a non-default session is held.
    This polling profile issues only 0x10 (session control) + 0x22 (read).
    See data/analyses/2026-05-16T214006.md and T223328.md.

    `exit_session: 0x81` ends a DID window by returning to the default
    session instead of idling until S3 expires — the 2026-05-16 sub-function
    sweep showed `10 81` answers `50 81`. The ECU takes ~1.5 ms per request,
    so a multi-second wait for Mode 01 to come back is scheduling policy, not
    an ECU limit.

    CONFIRMED IN-VEHICLE 2026-08-04 (KOEO bench, daemon TX gated): after
    `10 81`, Mode 01 answers on the *next request* — recovery 0.0 s. The
    other exits do NOT work and the old wait-it-out model is wrong on both
    counts:
      * `10 01` (the textbook UDS defaultSession) is answered positively but
        leaves Mode 01 dead for somewhere past 30 s (it does recover within
        a couple of minutes).
      * Letting S3 lapse kills DID reads within ~3-5 s (alive at a 3 s gap,
        lapsed at 5 s), but Mode 01 stays dead >30 s after the lapse — the
        blackout outlives the session that caused it. "Wait for the session
        to expire and Mode 01 answers again" is NOT a safe fallback; it is
        the slowest possible exit. `10 81` is the only fast door out.
    Same bench, sustained 0x22 throughput inside 0xC0: a 4-DID rotation ran
    8 s at 658 reads/s (165 Hz/channel), zero failures, p50 1.09 ms — the
    continuous reads themselves keep the session alive, no explicit
    keepalive needed while actively polling. Session enter costs 1.0 ms.
    Mode 01 inside the session: 0/10, functional and physical alike.

dids:
  - did: 0x1101
    name: ECM_COOLANT_TEMP
    byte_start: 0
    byte_length: 1
    response_length: 1
    response_length_source: '2026-05-11T222447 frames.log:418 single-DID response payload'
    byte_order: big
    scale: 1.0
    offset: -50.0
    unit: degC
    # RESOLVED 2026-08-07 in favour of -50; see the third evidence entry.
    # The 2026-05-16 reading below is retained because it is what made this
    # `confirmed` at -40 for three months, and it is still unexplained.
    confidence: high
    plausible_min: -40.0
    plausible_max: 130.0
    evidence:
      - session: 2026-05-16T214006
        method: four_state_classification
        finding: >
          A-40: cold idle raw 0x65 = 61 degC matched the parallel Mode 01
          coolant reading (61) exactly; warm 0x82 = 90; NT510 read 91.
          Exact scale/offset validated against ground truth.
      - session: _capture-tuning-did-2026-08-06T003148
        method: did_vs_broadcast_differential
        finding: >
          Contradicts the offset above. In-session, DID_1101 raw tracks
          broadcast 0x233:0 exactly (mean difference +0.29 counts, sd 0.58,
          n = 205) and sits exactly 10 counts above broadcast 0x551:0
          (mean +10.29, sd 0.58). Broadcast 0x551:0 regressed against Mode 01
          PID 0x05 gives degC = raw x 1.0020 - 40.25 (r2 = 0.994, n = 282,
          session 2026-08-03T163440), reproducing its own confirmed
          scale 1.0 / offset -40. Chaining those puts this DID's offset at
          -50, not -40: with -40 it reported 101 degC where 0x551 and the
          Mode 01 PID both put the engine at 91 degC — implausibly hot for a
          thermostat-regulated VQ40DE at steady cruise.
      - session: _capture-tuning-did-2026-08-07T005351
        method: did_vs_broadcast_differential
        finding: >
          Reproduces the entry above on an independent 25-minute drive at
          7x the sample count, and closes it. Same-instant pairing (<=100 ms,
          n = 18138 raw DID samples): DID_1101 - 0x233:0 = +0.78 counts
          (sd 0.70) — the same signal to within sub-count quantisation — while
          DID_1101 - 0x551:0 = +10.78 counts (sd 0.70), i.e. exactly the
          10-count split between the two broadcast conventions. The 0x551:0
          leg was re-verified inside two *other* sessions from the same day
          that do poll Mode 01: mean(0x551 decoded - PID 0x05) = +0.00 degC
          (sd 0.21, n = 584, session 2026-08-06T162657) and -0.02 degC
          (sd 0.15, n = 43, session 2026-08-07T011836). So 0x551 keeps its
          -40 and this DID follows 0x233 at -50.
      - session: 2026-05-11T222447
        method: single_instant_three_way_frame_log
        finding: >
          Independent confirmation from a raw frame log three months earlier,
          with all three paths in one file. At the instant of the Mode 22
          response pinned by the protocol regression corpus
          (t = 1778538289.894549, frames.log:418): DID_1101 byte0 = 127,
          broadcast 0x233:0 = 127 (bit-identical, +-2 ms), broadcast
          0x551:0 = 117 (exactly 10 counts lower). Over the whole log the
          ranges hold the same relation — 0x1101 spans 127-144, 0x233
          125-144, 0x551 115-134. With 0x551 at -40 both paths read 77 degC;
          with this DID at -40 it would have read 87. Note this log has no
          Mode 01 PID 0x05 at all (it is a Mode 22 session capture), which is
          precisely why the contradiction survived so long.
    notes: |
      Same *signal* as broadcast ECM_COOLANT_TEMP, and it follows the
      0x233:0 / 0x23D:7 convention (-50), not 0x551:0's (-40). The same
      physical value is broadcast three ways with two offset conventions:
      0x233:0 and 0x23D:7 are bit-identical to each other and use -50, while
      0x551:0 runs 10 counts lower and uses -40.

      Residual after the fix: this DID sits +0.78 counts above 0x233:0, which
      is below the 1-count quantisation of either channel, so -50 is the
      correct round offset rather than -50.78. Do not "improve" it to a
      fractional value without a reference finer than 1 degC.

      Still unexplained: the 2026-05-16 four_state_classification reading,
      which matched a parallel Mode 01 coolant value at -40. That evidence was
      taken with a different capture path and has never been reproduced; the
      2026-08 differentials are same-instant, three-way, and n is 90x larger.
      If it ever *is* reproduced, the thing to check first is whether that
      session's "DID_1101" was actually 0x1101 and not a neighbouring id.

      Every absolute coolant figure quoted from a DID capture before
      2026-08-07 was 10 degC high. Differences and trends were unaffected.

  - did: 0x1219
    name: ECM_RPM
    byte_start: 0
    byte_length: 2
    response_length: 2
    response_length_source: '2026-05-16T214006 four-state single-DID capture'
    byte_order: big
    scale: 1.0
    offset: 0.0
    unit: rpm
    confidence: high
    plausible_min: 0.0
    plausible_max: 7000.0
    evidence:
      - session: 2026-05-16T214006
        method: four_state_classification
        finding: >
          0 at KOEO; cold fast-idle 1190; warm idle 756 (parallel Mode 01
          = 762); ~2500-rpm hold = 2418. NT510 "ENG speed" = 775. raw ≈
          rpm directly.
    notes: scale ≈ 1.0; exact constant not finely pinned (idle 756 vs 762).

  - did: 0x123F
    name: ECM_INTAKE_AIR_TEMP
    byte_start: 0
    byte_length: 2          # payload is 2 bytes BE (0x0050 = 80); 1-byte read hit the sentinel
    byte_order: big
    scale: 1.0
    offset: -40.0
    unit: degC
    #: RETRACTED to `low` 2026-08-10 — see the disproving evidence below. Do
    #: NOT use this DID as an intake-air-temperature provider. Mode 01 PID 0x0F
    #: is the supported reference; UpRev's `INTAKE AIR TMP` is the other.
    confidence: low
    plausible_min: -40.0
    plausible_max: 90.0
    evidence:
      - session: _capture-fuel-did-research-2026-08-11T002443
        method: full_drive_constancy_check
        conditions: >
          36-minute drive, DID-continuous at 14.7 Hz, rpm 0-4790 and airflow
          1.18-122.19 g/s — a full warm-up and load range, not a parked hold.
        finding: >
          DISPROVES the binding. Raw payload was 0x0006 on ALL 31,199 samples,
          decoding to a constant -34 degC. Intake air temperature cannot be
          constant across a 36-minute drive spanning idle to 4790 rpm, and
          -34 degC is not a plausible reading at any point of it. The value
          also differs from the 0x0050 recorded in 2026-05, so this is not an
          offset error on a live signal: 0x123F is a static or unrelated
          register.

          Why the original evidence could not catch this: it was taken parked,
          and its own note says "intake air barely moves parked". A constant
          and a correct reading are indistinguishable under that condition, so
          `confidence: high` rested on a test the binding could not fail.
          Rule this generalises to: never promote a binding on evidence taken
          where the quantity cannot move.
      - session: 2026-05-16T214006
        method: four_state_classification
        finding: >
          2-byte payload 0x0050 = 80; A-40 → flat ~40 degC across all four
          states (intake air barely moves parked); NT510 "INT/A temp" = 42.
          (byte_length corrected 1→2 — caught by tools/decode_dids.py.)
          RETAINED for the byte-width correction only; the identification it
          supports is disproved above.

  - did: 0x1208
    name: ECM_AIR_CHARGE
    byte_start: 0
    byte_length: 2
    response_length: 2
    response_length_source: '2026-08-07T005351 single-DID capture payloads'
    byte_order: big
    # Raw counts, deliberately: the deployed IF and LSTM were trained on them,
    # so a scale here would change served feature values (a retrain). BFS in
    # ms is the separate channel derived:BASE_FUEL_SCHEDULE (P02.14), scaled
    # by the uprev_stream_definition_vs_displayed_csv evidence below; a scale
    # here would make that view refuse rather than scale twice.
    scale: null          # counts; ~63,800 counts per g air per intake event at K 1.06 (steps with tune K)
    offset: null
    unit: unknown        # BFS counts (air charge x K) -- not injector ms, not fuel mass
    confidence: confirmed  # BFS, operator decision 2026-10-02 (P02.14); was high
    evidence:
      - session: uprev-detailed_scheme + UpRev_Log9-20-2026_6-53-59_PM
        method: uprev_stream_definition_vs_displayed_csv
        constant: 0.00049
        constant_unit: ms per count
        conditions: >-
          Parked idle and revs, coolant 174-175 degF, one 29 s log at
          13.97 Hz on calibration ZS44A-k106. Same-reply identity, so it is
          independent of acquisition skew; it says nothing about how BFS
          tracks MAF through a transient.
        finding: >-
          Settles the 2040-vs-2048 counts/ms question by direct display
          reproduction rather than transitively through per-era ratios.
          UpRev's B-FUEL SCHDL (ms) column is byte 27-28 of the same stream
          reply, and raw x 0.00049 reproduces the displayed value on 405/405
          rows. raw/2040 gives 401/405; raw/2048 gives only 360/405, so 2048
          is REFUTED. The earlier note that 2048 sat "within error" was a
          consequence of the transitive derivation, not of the data.
      - session: _uprev-usb-2026-09-20-bfs
        method: operator_selected_uprev_dynamic_stream
        finding: >
          Direct USB evidence: selecting Base Fuel Schedule in UpRev emitted
          stream definition `02 00 ac 81 02 12 08`, binding the item to this
          2-byte big-endian DID. One capture held raw 27,980 for 507 valid
          replies while the display was approximately 13.6 ms. A second,
          varied capture contained 399 valid replies spanning 3,265-25,657.
          The PCAP does not contain exact GUI text per sample, so it cannot
          distinguish the existing approximately 2,040 counts/ms estimate
          from the binary 2,048 counts/ms candidate.
      - session: >-
          UpRev K-line logs 2026-07-26..08-08 (stock, K 1.07, K 1.06 eras) vs
          0x1208 warm-idle rows from the same eras (desk, 2026-09-18);
          ~/canary-data/scripts-0918b/out/bfs1208.md
        method: era_ratio_vs_uprev_bfs
        constant: 2040.0
        constant_unit: raw counts per ms of Base Fuel Schedule (BFS_ms = raw / 2040)
        conditions: >
          Steady state only (BFS trails MAF ~0.15 s; transients p5 -6..-7 %).
          Derived transitively through per-era ratios across a K change, NOT
          same-instant paired with UpRev B-FUEL SCHDL (no stored session
          overlaps). +-1.5 %; 2048 is within error. Validated to ~17 ms on
          July K 1.07 logs, current tune only to 13.9 ms; baro untested away
          from home altitude (~80 kPa).
        finding: >
          Behaves as air per event x K (Nissan Tp/BFS), not bare air. Warm-idle
          counts per g air per event step 58.5k (stock, n 13) -> 62.8k (K 1.06,
          n 15), +7.5 %, at the 07-27 reflash; UpRev BFS/air steps 28.7 ->
          30.8 ms per g at the same time. Plain air cannot step against MAF
          from the same ECU; K can. Everything else that read as "air charge"
          is shared by BFS: proportional to air through zero (+0.06 ms
          offset), ignores enrichment, holds in DFCO, and idle+A/C moves BFS
          +30 % vs air +31 %. Scale: 58,537/28.7 = 2040 (stock),
          62,774/30.8 = 2038 (K 1.06). Superseded as the scale by the
          405/405 same-reply identity above (0.00049, not 1/2040). The name
          stays ECM_AIR_CHARGE after the 2026-10-02 acceptance because the
          deployed models carry it as a feature; the BFS reading is
          derived:BASE_FUEL_SCHEDULE (P02.14).
      - session: _capture-fuel-pw-research-2026-09-18T140805 + _capture-fuel-pw-research-2026-09-18T174742 + _capture-fuel-pw-research-2026-09-18T200809 (+ 09-17 blocks 6/7/9, desk)
        method: rich_row_and_dfco_mass_balance
        finding: >
          Air charge per intake event. Four independent tests, each written
          before its data: (1) 09-17 desk refits against fuel mass leave
          -14..-18 % in every rich cell, because the register ignores a
          measured ~20 % enrichment; (2) 09-18 AM block B: in DFCO it reads
          63,984 counts per g air against 63,466 fuelled, so it does not drop
          in fuel cut (the injected pulse 0x1206 floors); (3) 09-18 PM: rich
          rows -16.6 % against the closed-loop refit (band -14..-18) and
          counts per g air 63,972 closed loop vs 64,457 enriched (+0.8 %, band
          +/-2 %); (4) 09-18 evening: counts per g air 63,778 closed loop vs
          64,068 enriched (+0.5 %) while enrichment was +16.4 %; rich residual
          -13.0 % (-14.1 % expected at phi 1.164). It does not scale with
          baro across 63-80 kPa. Reports:
          data/analyses/2026-09-18-maf-did-and-injector-mass-balance.md,
          2026-09-18-fuel-blocks-capture-fuel-pw-research-*.md,
          2026-09-18-pm-drive-log.md, 2026-09-18-eve-drive-log.md.
      - session: _capture-tuning-hybrid-research-2026-08-07T170918
        method: air_mass_balance_vs_mode01_maf
        constant: 62241.0
        constant_unit: counts per gram of air per intake event
        conditions: >
          Steady state only (|d rpm/dt| < 100 rpm/s and |d MAF/dt| < 5 g/s²)
          AND closed loop (FUEL_STATUS == 2), n = 411 same-cell pairs on a 1 s
          grid, 625-3000 rpm. Air per intake event = MAF / (rpm/120 · 6 cyl).
          Fitted in 2026-08 as 914,943 counts per gram of fuel at AFR 14.7/phi;
          at phi ≈ 1 that is 914,943 / 14.7 = 62,241 counts per g air, which
          is the only reading the data supports (the later 63,466-64,457
          figures come from different sessions and gates).
        finding: >
          Counts are proportional to air per intake event, r² = 0.962, with a
          zero intercept (34 counts, 0.23 % of mean) and a ratio flat to
          ±1.3 % across a 5.5x range of charge. In closed loop fuel and air
          move together, so this fit could not tell them apart; enrichment
          and DFCO can (evidence above).
      - session: 2026-05-16T223328
        method: nt510_blip_signature
        finding: >
          Raw 4962 / 10384 / 23487 / 24416 through idle and three throttle
          blips move with the NT510 "Inj pulse-b1" graph (idle 2.14 ms ->
          4 / 9 / 9.4 ms) over broadcast-RPM-timed windows. That graph moves
          with air charge at stoichiometry, so this is consistent with air
          charge; it is not an ms scale for this register.
    notes: >
      Base fuel schedule (Nissan Tp/BFS = air charge x tune K). Accepted as
      the verified BFS by the operator 2026-10-02 (P02.14) on the 405/405
      same-reply identity: raw x 0.00049 ms. Re-identified from injector
      pulse 2026-09-18 with operator approval; renamed from
      ECM_INJECTOR_PW_B1 the same day (no alias — stored artifacts are
      migrated by tools/migrate_channel_names.py). NOT injected fuel: it
      ignores enrichment and does not drop in DFCO. Do not use it as
      injector pulse width or fuel mass. The injected pulse is 0x1206/0x1207.
      Counts per g air are stable within a tune (~62,200-64,500 across
      sessions and gates on K 1.06) but step with K, so they are not a fixed
      air-mass scale. Scale left null here on purpose (see the comment on
      `scale`). The ms reading is derived:BASE_FUEL_SCHEDULE, the Xterra's
      Target AFR load axis, computed from the 0.00049 evidence record; the
      tuning workbench applies the same factor itself (tuning_providers.yaml,
      role base_fuel_schedule, confidence confirmed), and a test holds the
      two equal. Steady state only: BFS trails MAF by ~0.15 s. At key-on,
      engine off it holds a frozen value (13.6-17.2 ms on 2026-09-20), so
      read it only with the engine running. 0x1209 is mass airflow (g/s), a
      separate register; its old alias ECM_BASE_FUEL_SCHEDULE_CANDIDATE is
      not this channel.

  - did: 0x1209
    name: ECM_MAF_GPS
    byte_start: 0
    byte_length: 2
    byte_order: big
    scale: 0.01
    offset: 0.0
    unit: "g/s"
    confidence: high  # was hypothesized ECM_BASE_FUEL_SCHEDULE_CANDIDATE
    aliases:
      - ECM_BASE_FUEL_SCHEDULE_CANDIDATE   # renamed 2026-08-08; saved profiles still use it
    evidence:
      - session: _capture-tuning-hybrid-research-2026-09-17T184821 + T191712 + T201000 (blocks 6/7/9)
        method: skew_gated_same_instant_ratio_vs_mode01_maf
        constant: 0.01
        constant_unit: g/s per count (Mode 01 MAF as reference)
        conditions: >
          3-134 g/s, with |dMAF/dt| <= 5 %/s over the pairing window. Firm at
          20-90 g/s; thin above 90 g/s (81 pairs). Outside a steady window the
          DID reads ~115 ms after Mode 01, so rising flow reads high and
          falling flow reads low - that is acquisition skew, not the sensor,
          and it is what produced the whole-session slope of 0.934.
        finding: >
          D04.4. Reproduced block 6's whole-session slope 0.934 / r2 0.909
          exactly first, then gated on |dMAF/dt| <= 5 %/s: the median DID /
          Mode 01 ratio is 1.000 +/- 0.007 in every band from 3 to 134 g/s.
          No scale error and no nonlinearity; the x0.01 g/s decode holds to
          +/-2 % over the stated range. data/analyses/2026-09-18-maf-did-and-injector-mass-balance.md.
      - session: 2026-08-08T214218 (rungs idle / 2000 / 3000 / idle+AC)
        method: uprev_kline_steady_state_rungs
        finding: >
          IDENTIFIES this as mass airflow, displacing the BFS hypothesis.
          Four steady rungs with UpRev K-line logging simultaneous, each rung
          held ~10 s so channel-rotation skew cannot matter. raw/100 against
          UpRev "MAF GM/S": 3.62 vs 3.62 (idle, exact), 14.35 vs 14.21 (3000,
          1 %), 5.34 vs 5.19 (idle+A/C, 3 %). The 2000 rung reads 9.68 vs 8.78
          (10 %) and was demonstrably the least steady hold of the four — MAF
          sd 0.87 g/s and rpm sd +/-60 within that window — so it is read as
          window instability, not decode error. Wants one steadier mid-rpm
          point to promote to confirmed.
      - session: 2026-05-16T214006 (re-reading, no new capture)
        method: retrospective_consistency
        finding: >
          The 2026-05 evidence below CORROBORATES MAF once divided by 100, and
          nobody captured it for that purpose: 676 -> 6.76 g/s (cold fast
          idle, elevated airflow), 359 -> 3.59 g/s (warm idle — today's warm
          idle measured 3.62), 984 -> 9.84 g/s (rev hold). Three independent
          points from a different session, all landing where MAF belongs.
      - session: 2026-05-16T214006
        method: four_state_classification
        finding: >
          Two-byte value changed with cold enrichment and engine load
          (676 cold, 359 warm idle, 984 at the rev hold), giving it the
          expected broad fuel/air signature (airflow, per the evidence
          above; neighbouring 0x1208 is air charge x tune K per intake event).
      - session: data/analyses/bfs-provider-search-20260805.md
        method: evidence_gap_review
        finding: >
          No stored session pairs this DID with UpRev B/FUEL SCHDL, so its
          identity and scale cannot be promoted. It is the highest-value
          candidate for a narrow research capture, not a semantic BFS
          provider.
    notes: >
      Renamed 2026-08-08: ECM_BASE_FUEL_SCHEDULE_CANDIDATE -> ECM_MAF_GPS.
      The BFS reading came from "changes with cold enrichment and load", which
      airflow does too — a signature broad enough to fit either. Base Fuel
      Schedule is still unlocated; do NOT reuse this DID for a fuel-target map
      lookup. UpRev's "B-FUEL SCHDL" moved 2.92 / 2.65 / 2.88 / 3.98 ms across
      the same four rungs and no DID matched that shape, so BFS remains open.

      Why this matters operationally: Mode 01 and Mode 22 are mutually
      exclusive in a capture, so a tuning-DID profile loses PID 0x10 (MAF).
      This DID restores airflow inside a DID-only capture.

  - did: 0x1117
    name: ECM_CALC_LOAD_PCT
    byte_start: 0
    byte_length: 1
    byte_order: big
    scale: 0.390625   # 100/256 — the SAE J1979 calculated-load scaling
    offset: 0.0
    unit: percent
