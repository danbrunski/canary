  # --- Intake cam phasing family (2026-08-05 drive sweeps) ---------------
  # Scale/offset come from the ROM Cam Phasing decode (advance = (N-128)/2,
  # 0x80 = 0.0 deg), independently corroborated: every member reads exactly
  # 0x80 with the engine off, spans 0-37 deg in motion against the ROM
  # table's 0-35, and correlates +0.72..+0.74 with the known VVT solenoid
