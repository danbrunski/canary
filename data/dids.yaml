        method: uprev_kline_steady_state_rungs
        finding: >
          IDENTIFIES this as mass airflow, displacing the BFS hypothesis.
          Four steady rungs with UpRev K-line logging simultaneous, each rung
          held ~10 s so channel-rotation skew cannot matter. raw/100 against
          UpRev "MAF GM/S": 3.62 vs 3.62 (idle, exact), 14.35 vs 14.21 (3000,
          1 %), 5.34 vs 5.19 (idle+A/C, 3 %). The 2000 rung reads 9.68 vs 8.78
          (10 %) and was demonstrably the least steady hold of the four — MAF
          sd 0.87 g/s and rpm sd +/-60 within that window — so it is read as
          window instability, not decode error. Wants one steadier mid-rpm
          point to promote to confirmed.
      - session: 2026-05-16T214006 (re-reading, no new capture)
        method: retrospective_consistency
        finding: >
          The 2026-05 evidence below CORROBORATES MAF once divided by 100, and
          nobody captured it for that purpose: 676 -> 6.76 g/s (cold fast
          idle, elevated airflow), 359 -> 3.59 g/s (warm idle — today's warm
          idle measured 3.62), 984 -> 9.84 g/s (rev hold). Three independent
          points from a different session, all landing where MAF belongs.
      - session: 2026-05-16T214006
        method: four_state_classification
        finding: >
          Two-byte value changed with cold enrichment and engine load
          (676 cold, 359 warm idle, 984 at the rev hold), giving it the
          expected broad fuel/air signature (airflow, per the evidence
          above; neighbouring 0x1208 is air charge x tune K per intake event).
      - session: data/analyses/bfs-provider-search-20260805.md
        method: evidence_gap_review
        finding: >
          No stored session pairs this DID with UpRev B/FUEL SCHDL, so its
          identity and scale cannot be promoted. It is the highest-value
          candidate for a narrow research capture, not a semantic BFS
