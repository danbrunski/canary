name: Nightly slow tier

# The slow tier (every test measured at 1.5 s or more, tests/slow_tests.txt)
# left per-push CI on 2026-10-04 (operator): it was most of CI's ~13 minutes.
# It still runs daily, and on demand with `gh workflow run nightly-slow.yml`.
# A red nightly is fixed like a red main.
on:
  schedule:
    - cron: "0 9 * * *"  # 09:00 UTC, 03:00 MDT
  workflow_dispatch:

concurrency:
  group: nightly-slow
  cancel-in-progress: false

jobs:
  slow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints-dev.txt

      - name: Install project with dev extras
        run: pip install -e '.[dev]' -c constraints-dev.txt

      - name: Pytest (slow tier)
        run: pytest -v -m "slow and not integration and not ml_training"
