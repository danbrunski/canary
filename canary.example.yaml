# CANary example configuration.
# Copy to `canary.yaml` and edit for your vehicle / hardware.

vehicle:
  make: Nissan
  model: Xterra
  year: 2008
  vin: ""
  # Physical parameters for derived trip/fuel/performance channels (Task 6.6).
  # All optional; shown with the 2008 Xterra 4.0 V6 defaults. These are
  # carried into every session manifest so a trip's numbers stay
  # reproducible from the captured data alone.
  parameters:
    mass_kg: 1980.0
    fuel_type: gasoline          # gasoline | diesel | e85
    displacement_l: 4.0
    volumetric_efficiency: 0.85
    drivetrain_loss_fraction: 0.15
    thermal_efficiency: 0.30
    # tire_diameter_m: 0.77      # optional; speed cross-checks only
    # Driveline (H07.1; derived:GEAR_ESTIMATE and the driving dyno). Three
    # separate facts, and evidence for them; rpm per km/h is computed.
    # final_drive: 4.08
    # gearbox_ratios: [...]          # one unitless ratio per forward gear, 1st first
    # tyre_loaded_circumference_m: 2.609
    # driveline_evidence: "how each was measured"

hardware:
  # Legacy fallback only. Current hardware direction is Canable-native OBD via
  # collection.obd_source=canable.
  elm327_port: /dev/ttyUSB0
  can:
    # Dev (WSL + Canable in slcan firmware): interface=slcan, channel=/dev/ttyACM0
    # Prod (Raspberry Pi + SocketCAN):       interface=socketcan, channel=can0
    interface: slcan
    channel: /dev/ttyACM0
    bitrate: 500000
  # Optional serial NMEA GPS receiver. Disabled by default; the daemon runs
  # normally without it. When enabled, gps:speed feeds operating-mode detection
  # and gps:* position is logged (but excluded from model features). Prefer a
  # stable /dev/serial/by-id/... symlink for `device`.
  gps:
    enabled: false
    device: /dev/ttyUSB0
    baudrate: 9600
  # Optional 3-axis IMU (accel + gyro). Phase 2a software slice only — no
  # collector reads this yet (Phase 2b, docs/roadmap/imu-gps-integration.md).
  # `disabled` (default) is a hard requirement: the daemon runs normally
  # without it, same as gps.enabled=false above.
  imu:
    source: disabled  # lsm6dsox (CANary-HAT) | bno055 | mpu6050 | icm20948 | disabled
    i2c_bus: 1
    sample_rate_hz: 100
    mount_orientation: auto
    # CANary-HAT (only lsm6dsox has a collector; its rates are 12.5/26/52/104/
    # 208/416/833 Hz and anything else is refused). External-sensor channels:
    # recorded, never used to train or score the anomaly detectors.
    # source: lsm6dsox
    # i2c_address: 0x6B
    # sample_rate_hz: 104
    # accel_range_g: 8
    # gyro_range_dps: 2000
  # Optional USB serial ADC module reading analog sensors (NOYITO 10-channel
  # STM32 + CH340). Channels, wiring and every calibration number are data:
  # data/usb_adc_sensors.yaml. Recorded as sensor:<name>, never trained on.
  # Prefer the /dev/serial/by-path/... symlink: a CH340 has no serial number.
  usb_adc:
    enabled: false
    port: /dev/ttyUSB0
    # sensors: data/usb_adc_sensors.yaml

collection:
  # canable = one Canable does broadcast CAN + active OBD/UDS ISO-TP.
  # elm327 = legacy python-obd path through hardware.elm327_port.
  # disabled = CAN frames only.
  obd_source: canable
  # `auto` walks the ECU's supported Mode-01 PID bitmask and polls every PID
  # CANary has a decoder for. Add explicit names/hex PIDs to force extras.
  obd_pids: [auto]
  # Known Mode-22 DIDs to poll as ``did:<NAME>`` readings, characterized in
  # data/dids.yaml. These eight unlock the high-value fuel/air behavior
  # surfaces (air_charge_vs_rpm_throttle_did, afr_bank_balance_vs_rpm,
  # afr_voltage_vs_rpm_load, tps_voltage_per_pct) — recipes that target
  # ``did:*`` outputs silently skip if the DID isn't being polled.
  # Exploratory sweeps still use tools/scan_constant_dids.py.
  #
  # When the ECU gates Mode 22 behind a UDS session (the 2008 Nissan ECM
  # does — see the access block in data/dids.yaml), DIDs are read in short
  # scheduled session windows because that session is mutually exclusive
  # with Mode 01 on the bus: every obd_did_window_interval_seconds the
  # daemon sends 10 <session>, reads each active DID once, then goes quiet
  # for obd_did_session_lapse_seconds so the session expires and Mode 01
  # resumes. /status.obd_scheduler.did_profile shows the live window state.
  obd_dids:
    - ECM_RPM                    # synchronous axis for Mode-22 surfaces
    - ECM_AIR_CHARGE           # air charge per intake event (0x1208; not injected fuel)
    - ECM_AF_SENSOR_V_B1       # wideband AFR sensor V, bank 1 (pre-cat)
    - ECM_AF_SENSOR_V_B2       # wideband AFR sensor V, bank 2 (pre-cat)
    - ECM_INJECTOR_PULSE_1     # injected pulse width, bank 1 (0x1206; ms)
    - ECM_INJECTOR_PULSE_2     # injected pulse width, bank 2 (0x1207; ms)
    - ECM_THROTTLE_POS_SENSOR_1  # raw TPS voltage, for sensor-drift detection
    - ECM_THROTTLE_POS_SENSOR_2  # redundant TPS track for cross-checking
  # Batch up to N PIDs per Mode-01 request (SAE J1979 allows 6). Batched PIDs
  # share one request *and one timestamp*, so a capture reads as synchronous
  # rows instead of interleaved samples — and it roughly doubles throughput.
  # The collector narrows 6 -> 4 -> 2 -> off by itself if the ECU refuses.
  obd_batch_max_pids: 6
  # Mode 22 batching is a separate ECU/session capability. 1 disables it.
  obd_did_batch_max_dids: 1
  # Exploratory support walks have their own ceiling as well as the global bus
  # budget, so a sparse/unknown catalog cannot consume every free slot. Lower
  # this independently when confirmed telemetry matters more than discovery.
  obd_discovery_budget_requests_per_second: 32.0
  obd_did_request_id: 0x7E0
  # auto = take the gating session (0xC0) + keep-alive cadence from
  # data/dids.yaml's access block; null = force bare polling; int = override.
  obd_did_session: auto
  # Cadence is a *sampling choice*, not an ECU limit — this ECM answers a DID
  # in ~1.5 ms. 60 s suits background diagnostic surfaces (sensor drift,
  # injector-PW trends); a capture profile can ask for a much tighter interval
  # without a restart via its `did_interval_seconds`.
  obd_did_window_interval_seconds: 60.0   # effective per-DID sample interval
  obd_did_window_max_seconds: 10.0        # hard cap; windows close much sooner
  # Only used when the vehicle's dids.yaml declares no `exit_session`. With
  # one, the window ends by returning to the default session instead of idling
  # here until S3 expires; a refusal falls back to this wait automatically.
  obd_did_session_lapse_seconds: 5.0      # quiet time for the session to expire
  obd_request_timeout_seconds: 1.0
  obd_poll_rate_hz: 1
  storage_path: /data/canary
  session_retention_days: 30
  storage_warning_mb: 500
  # Byte-bounded ring buffer: the daemon's retention sweeper evicts the
  # oldest unpinned sessions once total session bytes exceed this cap
  # (pinned + active dirs are never evicted). Size it below the storage
  # partition's free space with headroom. Omit / set null to disable the
  # cap and keep age-only retention.
  storage_max_mb: 8000
  reconnect_initial_delay_seconds: 10
  reconnect_max_delay_seconds: 60
  queue_max_size: 10000
  queue_warning_fraction: 0.8
  # No decoded CAN rows are stored (P02.8): readers decode the raw frames on
  # read. The retired `persist_decoded_confidence` key is ignored with a
  # warning; delete it from a live config.
  # P02.10 (operator 2026-09-26): a CAN frame is stored only when its payload
  # changes; an unchanged id is re-written once per this timeout (1 s before
  # it). The same number is the resampler's stale class for broadcast
  # channels, so storage and every reader agree. Minimum 2 s; must stay under
  # preprocessing.session_gap_seconds. Changing it is a feature-spec change.
  # Frame counts and sub-second timing need a capture profile with
  # store_every_frame: true.
  broadcast_stale_timeout_seconds: 10.0

preprocessing:
  resample_hz: 1
  # Split accidental suspend/disconnect gaps before creating the 1 Hz grid.
  session_gap_seconds: 300
  rolling_window_seconds: 30
  # Trailing window for the segmenter's derived recent_speed signal (the
  # trailing max ground speed), which separates a transient stop from steady
  # idle. The live ring buffer is grown to hold at least this many seconds so
  # serve-time segmentation matches training.
  idle_transient_lookback_seconds: 180
  operating_modes:
    # Key-on / engine-off (KOEO): engine not running, so RPM reads 0. Must
    # come first and win before any running regime — otherwise a warm-but-off
    # truck matches warmup/idle on coolant+speed alone (neither required the
    # engine to be running) and the dashboard mislabels a parked, keyed-on
    # truck as "warmup". rpm_max: 0 mirrors the vehicle_state "ignition_only"
    # rule (OBD fresh + RPM == 0).
    koeo:
      rpm_max: 0
      speed_max: 0
    # Cold-start: stopped + coolant below thermostat. Fitting behavior
    # models per-mode lets the warmup surface be its own thing instead of
    # an outlier the steady-state idle model has to absorb (and fire on).
    # 70 °C is conservative — the 195 °F (~90 °C) thermostat opens above
    # that, so anything below is unambiguously warming up. rpm_min: 400
    # requires the engine actually running (matches _RPM_RUNNING_THRESHOLD)
    # so KOEO can't land here.
    warmup:
      rpm_min: 400
      speed_max: 0
      coolant_temp_max: 70
    # Transient stop: warm + stopped now, but the truck was driving within the
    # last idle_transient_lookback_seconds (a stop light / stop sign mid-drive).
    # Pulled out before steady idle so a stoplight dwell isn't modeled as the
    # same regime as a driveway warm-up idle. recent_speed is the trailing max
    # ground speed; >= 8 km/h means "moved recently". Must precede idle.
    idle_transient:
      rpm_min: 400
      rpm_max: 900
      speed_max: 0
      coolant_temp_min: 70
      recent_speed_min: 8
    # Steady standing idle: warm, stopped, and NOT moving recently (driveway /
    # pre-drive). Catches the stopped-warm rows idle_transient didn't.
    idle:
      rpm_min: 400
      rpm_max: 900
      speed_max: 0
      coolant_temp_min: 70
    # Fast/loaded idle (A/C compressor kicking in, high idle after a cold
    # start finishes warming): warm, stopped, RPM above steady idle but below
    # a real rev. Phase 5.1 — without this band a >900 rpm standing idle
    # matched no mode's rpm gate and fell through to ``city`` (which only
    # constrained speed_max, not rpm), mislabeling a revving-but-stationary
    # truck as city driving.
    idle_high:
      rpm_min: 900
      rpm_max: 1200
      speed_max: 0
      coolant_temp_min: 70
    # Phase 5.1 — speed_min closes the fall-through above (a >900 rpm warm
    # idle no longer satisfies city's speed gate at all) and also stops
    # ``city`` swallowing standing-idle rows that idle/idle_high didn't
    # already claim. speed_min: 1 (not the originally-shipped 5) — the
    # idle bands are strict speed_max: 0 (no tolerance band, see
    # segmenter.py's plain >=/<= matching), so a >=5 gate left a 0-5 km/h
    # dead zone (parking-lot creep, inching in stop-and-go traffic) with a
    # running engine matching no mode at all. 1 is the OBD SPEED PID's
    # finest resolution (whole km/h), so it's the practical noise floor:
    # exactly-stopped (0) still misses city and falls to the idle bands.
    # city spans all sub-highway moving speed (1-80 km/h). The 50-80 band was
    # briefly its own `suburban` mode (Phase 5.1), but on real drives it reads
    # as "city moving faster", not a distinct regime: engine load/airflow break
    # at ~80 km/h, not 50, and a manual truck already runs cruise-band rpm at
    # city speeds (climbing through gears). Splitting it only starved each
    # surface of data; folding keeps 50-80 scored by the existing city model.
    city:
      speed_min: 1
      speed_max: 80
    highway:
      speed_min: 80
    # Phase 2a.7 (docs/roadmap/imu-gps-integration.md) — IMU-gated modes.
    # INERT today: imu:ACCEL_LON_MAX/ACCEL_LAT_MAX (Phase 2a.3 decimation
    # output) don't exist in any real session — no IMU hardware yet (Phase
    # 2b) — so the segmenter finds these candidate columns entirely absent
    # and skips these specs outright (the same "required signal missing"
    # path any mode's absent column already takes), the same way every
    # other mode here would if its OBD PID had never been polled. Thresholds
    # are placeholders; real tuning is a Phase 2b.4 exercise once IMU data
    # exists.
    launch:
      speed_max: 5
      accel_lon_min: 0.35
    # accel_lon gates on the decimated |ACCEL_LON_MAX| magnitude (see
    # imu_decimation.decimate_imu_wide) — it never carries a sign, and
    # OperatingModeSpec has no separate sign-of-motion field. hard_brake is
    # distinguished from launch not by sign but by mapping order + the
    # launch spec's own speed_max: 5 gate above (modes are evaluated in
    # mapping order, first full match wins) — a near-stop, high-accel_lon
    # row is claimed by launch first, so hard_brake's accel_lon_min only
    # ever matches a hard accel_lon spike while already moving. Magnitude
    # matches AutoTagConfig.hard_brake_g's 0.40 convention (src/config.py).
    hard_brake:
      accel_lon_min: 0.4
    cornering:
      accel_lat_min: 0.3
    # Wide-open-throttle is a transient *event* (see ``wot_run`` in
    # ``src/analysis/events/``) not an operating mode. As a mode it
    # would steal hundreds of rows from city/highway into a per-mode
    # IF model that's data-starved — same data-sparsity failure mode
    # the warmup work just fixed. Keep WOT as an event marker; let
    # high-throttle moments score against the city / highway models.
  # Phase 5.2 — a candidate mode must hold for this many consecutive rows
  # before segmentation actually switches to it, damping 1 Hz flapping at a
  # mode boundary (e.g. right at the city/suburban 50 km/h edge) that would
  # otherwise contaminate both models' training rows with mislabeled ticks.
  # 3 mirrors alerts.min_consecutive_ticks' "N consecutive" shape.
  mode_dwell_ticks: 3

models:
  # Which backbone fills the single sequence-detector slot: "lstm" (GRU-D) or
  # "tcn" (dilated causal Conv1d). Only one is active at a time; the selected
  # backend's own `enabled` flag below still gates whether it loads. Both
  # publish under the same anomaly source, so switching is a config change.
  sequence_detector: lstm
  # A06.6: forward-pass the sequence detector on every n-th tick. The window
  # still advances every tick and the novelty screen's envelope check still
  # runs every tick; only the forward pass (the largest inference stage, a
  # median 344 ms/tick on the Pi on 2026-09-24) waits. A skipped tick is a
  # missing verdict, never a carried score. With the alerts gate below
  # (3 hits inside 8 s at 1 Hz) at most 3 is accepted; an artifact whose
  # A02.3 alert level was chosen at another cadence refuses to serve.
  sequence_forward_every_n_ticks: 1
  # Score IF + sequence in a child process instead of a worker thread. C08
  # moved scoring off the event loop, which is not the same as off the CPU:
  # on the Pi (2026-09-09) the daemon missed 48% of its 1 Hz ticks with 2.5 of
  # 4 cores idle, because one Python process is GIL-bound to about one core
  # and a slow forward pass starved the collector thread sharing it —
  # collection stopped for ~100 s at a time. Costs ~0.16 ms/tick of IPC.
  # A host where the child cannot start falls back to in-process scoring, so
  # this is a performance knob, not a correctness one.
  #
  # Off by default: the child rebuilds its models from this config's artifact
  # paths, so it only ever sees models that came from disk. Turn it on where
  # that holds (the Pi) once D01.3 has validated it on hardware —
  # docs/roadmap/tasks/D01-daemon-throughput.md.
  out_of_process_scoring: false
  # Production defaults this to true: the rolling pandas feature transform
  # runs in one persistent child so it cannot occupy the collection loop.
  # This example keeps it false for simple single-process development; the Pi
  # should omit the key or set it true.
  out_of_process_feature_build: false
  isolation_forest:
    enabled: true
    # A04.10 (operator, 2026-09-23): 600 trees -- between 200 (seed-agreement
    # Jaccard city 0.62) and 1000 (0.79 city / 0.88 highway at ~4x the score cost).
    n_estimators: 600
    contamination: 0.01
    # Optional task-2.8 tuning output, e.g. {idle: 0.005, city: 0.01}
    per_mode_contamination: {}
    random_state: 42
    n_jobs: 4
    # Phase 7.2: per-mode score thresholds calibrated on a held-out clean
    # split instead of the fixed-contamination label. holdout = tail
    # fraction reserved (not fit on); target_flag_rate = allowed nominal
    # flag fraction (threshold = 1-target_flag_rate quantile of holdout).
    calibration_holdout_fraction: 0.2
    target_flag_rate: 0.001
    # Task 2.2: modes with fewer than this many fit rows (post-holdout split)
    # are skipped entirely — no model persisted — rather than fitting a
    # 200-tree forest on a handful of rows.
    min_samples_per_mode: 100
    # Refuse artifacts whose selected schema makes most rows unscoreable, or
    # whose segmentation collapsed to only the fallback "unknown" mode.
    max_dropped_row_fraction: 0.75
    allow_unknown_only: false
  lstm_autoencoder:
    enabled: true
    sequence_length: 30
    hidden_size: 64
    num_layers: 1
    latent_dim: 32
    dropout: 0.0
    batch_size: 64
    training_stride: 5
    calibration_stride: 1
    dataloader_workers: null
    mixed_precision: true
    compile_model: false
    learning_rate: 0.001
    max_epochs: 100
    validation_fraction: 0.2
    early_stopping_patience: 10
    min_delta: 0.0
    random_state: 42
    threshold_k: 3.0
    # Task 3.2: calibrated-quantile threshold is the default path; threshold_k
    # (mean + k·σ) above only applies when threshold_quantile is null. Errors
    # are right-skewed, so a quantile targets the alert budget directly.
    threshold_quantile: 0.999
    # Artifact-health gate: calibration/training windows must contain at
    # least this observed-cell fraction, on at least this fraction of windows.
    min_window_observed_fraction: 0.01
    min_usable_window_fraction: 0.9
    # Behavior signals that drift naturally over a drive (fuel level, HVAC
    # controls, intake-air temperature) but aren't vehicle-health signals
    # for *this* detector — they're better handled by the behavior surfaces
    # that learn the ECU's response to them (see e.g.
    # ``timing_advance_vs_rpm_iat`` for IAT). Each entry matches itself +
    # rolling-derivative siblings (__mean/__std/__roc).
    # Applied at train + serve — listing one here keeps the column out of
    # the next manifest's feature_columns AND forces mask=0 on the live
    # path so a stale artifact's column can't push the global score.
    # suppress_channels:
    #   - obd:FUEL_LEVEL
    #   - obd:INTAKE_TEMP
    #   - dbc:HVAC_BLOWER_LIGHTING_358_1
    #   - decoded:HVAC_BLOWER_LIGHTING_358_1
  # Alternate sequence-detector backbone (active when sequence_detector: tcn).
  # Dilated causal Conv1d autoencoder; consumes the same value+mask+Δt windows.
  # receptive field = 1 + 2*(kernel_size-1)*(2**num_levels - 1).
  tcn_autoencoder:
    enabled: false
    sequence_length: 30
    channels: 64
    kernel_size: 3
    num_levels: 4
    latent_dim: 32
    dropout: 0.0
    use_delta_decay: true
    batch_size: 64
    learning_rate: 0.001
    max_epochs: 100
    validation_fraction: 0.2
    early_stopping_patience: 10
    min_delta: 0.0
    random_state: 42
    threshold_k: 3.0
    # Task 3.2: same contract as lstm_autoencoder.threshold_quantile above.
    threshold_quantile: 0.999
    min_window_observed_fraction: 0.01
    min_usable_window_fraction: 0.9
  # Phase 7.2: fuse IF + LSTM + behavior residuals into one
  # agreement-aware calibrated severity (a "fused" AnomalyEvent). The
  # per-source events still fire alongside it, independently — fusion never
  # suppresses a per-source emit (6.2).
  fusion:
    enabled: true
    severity_threshold: 0.5
    agreement_boost: 0.25
    behavior_warning_severity: 0.5
    behavior_critical_severity: 1.0
    # 6.2 (operator-approved): fused is_anomaly requires severity_threshold
    # AND at least this many *independent* firing sources — a real
    # agreement gate, not OR-with-boost. One detector firing alone, however
    # severe, never sets the fused verdict by itself.
    min_agreement: 2
  # A06.5: what each detector's events may do. `evidence` (the default since
  # the operator's A06.1/A06.2 decision, 2026-09-23) still scores, stores and
  # fuses, but the events are flagged `role: evidence`, never pushed to ntfy,
  # never shown as an active dashboard alert, and a fused event needs an
  # `alert` source among its agreeing voices. `alert` restores the historical
  # behaviour for one detector. The primary detector is the behavior models
  # plus the deterministic checks (A06.4). `sequence` covers whichever
  # backbone fills the slot.
  roles:
    isolation_forest: evidence
    sequence: evidence
    # Sensor committees (H04): stored, never pushed, until one has a confirmed
    # real catch. Deterministic — set `alert` to promote, no verdict needed.
    committee: evidence

# Phase 7.5 / 6.1: shared emission policy. A detector must be over threshold
# for at least min_consecutive_ticks (M) ticks within the trailing
# persistence_window_ticks (N) — "M-of-N" — before it emits an event or
# counts as a firing fusion source (real faults persist; a lone tick is the
# historical flood). Default 3-of-5 tolerates one fire-gap-fire flicker per
# window (a real intermittent-fault pattern a strict 3-consecutive gate
# structurally could never catch) without weakening the 3 hits still
# required. persistence_window_seconds additionally wall-clock-bounds the
# window so a long data/replay gap can't let stale hits from before the gap
# count toward a "fresh" streak once ticks resume. An emitted (source,
# model) pair then goes quiet for min_seconds_between_events.
alerts:
  min_consecutive_ticks: 3
  persistence_window_ticks: 5
  persistence_window_seconds: 8.0
  min_seconds_between_events: 30.0

# Future ECU non-volatile writes must pass this gate. No flash transport ships
# today; these defaults are already active so one cannot be added without the
# exact-image permission, KOEO/stationary and supply checks in W07.
nonvolatile_write:
  authorization_ttl_seconds: 120.0
  max_signal_age_seconds: 5.0
  stationary_speed_max_kph: 0.5
  min_battery_voltage: 12.0
  min_ups_soc_percent: 40.0
  ups_runtime_margin_seconds: 120.0

# Engine Tuning context-bar readiness chips (/status.tuning_readiness).
# Status only -- nothing refuses an action on these.
tuning_readiness:
  min_ups_soc_percent: 40.0

dashboard:
  host: 0.0.0.0
  port: 8000

# Multiple-vehicle profiles. When enabled (the default), the daemon reads the
# VIN at startup (OBD-II Mode 09 PID 0x02) and scopes every vehicle-specific
# path under <base>/<slug>/ so two vehicles never share a corpus or models.
# An unknown VIN is auto-registered with a blank display name you set later in
# the dashboard's Profiles panel. With no VIN available (disabled/virtual OBD)
# the `vehicle:` block above is used as the default profile. Pass
# `--profile <slug>` to force one (sim/replay). Defaults shown; block optional.
# profiles:
#   enabled: true
#   registry_path: profiles.yaml        # VIN → profile index (a data file)
#   auto_register: true
#   vin_probe_timeout_seconds: 2.0

# Optional. Defaults match the values shown; uncomment / edit for production.
# daemon:
#   anomalies_dir: data/anomalies
#   models_dir: models
#   jobs_dir: data/control/jobs
#   audit_log: data/control/audit.jsonl
#   isolation_forest_artifact: isolation_forest/model.joblib  # relative to models_dir
#   lstm_artifact: lstm_autoencoder/model.pt                  # relative to models_dir
#   model_poll_seconds: 30.0
#   retention_sweep_seconds: 3600.0
#   # Trip-end digest guards (D03.6, P02.1). Before D03.6 a digest loaded the
#   # whole session twice and pivoted it at raw resolution: 5,483 MB for
#   # 2,622,370 rows, to emit 1,143. Twice in one day that took the daemon
#   # out -- once OOM-killed, once wedged for 38 minutes because the Pi had swap.
#   # The digest runs in a child process whose address space is capped, so an
#   # over-large one raises MemoryError in the child instead of letting the
#   # kernel pick a victim. digest_address_space_mb unset derives the cap from
#   # physical RAM (half, clamped to 1-4 GiB) -> 4 GiB on the 8 GB Pi.
#   # Since P02.1 the digest reads a session part by part, so its peak follows
#   # the recorded span, not the rows (~290 MB + ~28 KB per second measured;
#   # 503 MB for a 12.8 M-row, 2 h 23 min drive that had peaked at 4,265 MB).
#   # digest_span_budget_seconds unset derives the span limit from the cap
#   # (DIGEST_CHAIN_FIXED_BYTES + DIGEST_CHAIN_BYTES_PER_SECOND: ~13.7 h for a
#   # 4 GiB child). digest_row_budget bounds whole-session raw reads: a
#   # capture's tuning section and the workbench jobs; unset it derives from
#   # the cap and DIGEST_PEAK_BYTES_PER_ROW (800 B per stored row, ~5.4 M rows
#   # on the Pi). A session over either is refused with a digest_skipped.json
#   # naming its size and the budget; 0 disables a check but keeps the cap.
#   digest_row_budget: null
#   digest_span_budget_seconds: null
#   digest_address_space_mb: null
#   broadcaster_queue_size: 100
#   control_token_env: CANARY_CONTROL_TOKEN

# Push notifications via ntfy (Phase 5, eval-longitudinal-and-dtc.md). Ships
# disabled with no real topic — pick a topic on your own ntfy.sh account (or
# self-hosted instance) and set enabled: true yourself; a made-up topic here
# would either no-op or land on a stranger's public topic. Defaults shown.
# notifications:
#   enabled: false
#   ntfy_url: https://ntfy.sh
#   topic: ""                    # e.g. "canary-<random-slug>-alerts"
#   min_severity: 0.8
#   max_pushes_per_session: 3
#   digest_enabled: false

# Deterministic plausibility checks (A05): per-channel range, stuck, freshness
# and slew checks over every arrived sample, confirmed on repeat, written as
# evidence to <anomalies_dir>/plausibility-evidence.jsonl and summarised in
# /status detectors.inference.plausibility (cost: stages.plausibility). Needs
# the vehicle's data/<profile>/plausibility.yaml; off until its per-tick cost
# is measured on the Pi.
# plausibility:
#   enabled: false

# Sensor committees (H04): two instruments of one quantity (ECU speed vs GPS)
# checked against the relation measured for this vehicle in
# data/<profile>/committees.yaml; a sustained departure is a `committee`
# anomaly event, state in /status detectors.inference.committees. On by
# default; without the profile file every committee reads `not_configured`.
# committees:
#   enabled: true
