# CANary developer config template (Raspberry Pi or any dev box).
#
# Copy to `canary.yaml` and edit. `scripts/setup_pi_dev.sh` does this copy
# automatically on a fresh machine when `canary.yaml` is absent.
#
# Difference from canary.pi.example.yaml (the in-vehicle systemd deployment):
# storage / daemon directories are repo-local (data/, models/) so the app and
# tests run from a clone WITHOUT scripts/install_pi.sh having created
# /data/canary. The hardware section is already correct for a Pi + Canable
# over SocketCAN — bring up can0 per docs/can-setup.md when hardware is
# attached. With no adapter present the daemon still imports/loads this config
# fine; it only fails when it actually tries to open can0.

vehicle:
  make: Nissan
  model: Xterra
  year: 2008
  vin: ""

hardware:
  # Legacy fallback only; the Pi path is Canable-native OBD over SocketCAN.
  elm327_port: /dev/ttyUSB0
  can:
    interface: socketcan
    channel: can0
    bitrate: 500000

collection:
  obd_source: canable
  obd_pids: [auto]
  obd_dids: []
  obd_did_request_id: 0x7E0
  obd_request_timeout_seconds: 1.0
  obd_poll_rate_hz: 1
  storage_path: data/sessions
  session_retention_days: 30
  storage_warning_mb: 500
  reconnect_initial_delay_seconds: 10
  reconnect_max_delay_seconds: 60
  queue_max_size: 10000
  queue_warning_fraction: 0.8

preprocessing:
  resample_hz: 1
  rolling_window_seconds: 30
  operating_modes:
    idle:
      rpm_max: 900
      speed_max: 0
    city:
      speed_max: 50
    highway:
      speed_min: 80
    wot:
      throttle_min: 80

models:
  isolation_forest:
    enabled: true
    n_estimators: 200
    contamination: 0.01
    per_mode_contamination: {}
    random_state: 42
  lstm_autoencoder:
    # Keep disabled until a trained artifact exists under daemon.models_dir.
    # Flip to true after training (CPU Torch is installed by setup_pi_dev.sh
    # unless CANARY_TORCH=none was used).
    enabled: false
    sequence_length: 30
    hidden_size: 64
    num_layers: 1
    latent_dim: 32
    dropout: 0.0
    batch_size: 64
    learning_rate: 0.001
    max_epochs: 100
    validation_fraction: 0.2
    early_stopping_patience: 10
    min_delta: 0.0
    random_state: 42
    threshold_k: 3.0

dashboard:
  # LAN-only, no auth in v1. 0.0.0.0 so a laptop/phone on the same network
  # can reach http://<pi-ip>:8000/.
  host: 0.0.0.0
  port: 8000

daemon:
  anomalies_dir: data/anomalies
  models_dir: models
  isolation_forest_artifact: isolation_forest/model.joblib
  lstm_artifact: lstm_autoencoder/model.pt
  model_poll_seconds: 30.0
  retention_sweep_seconds: 3600.0
  broadcaster_queue_size: 100
