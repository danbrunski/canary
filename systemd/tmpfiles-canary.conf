# /run/canary — shared runtime dir between the canary daemon (user canary,
# writes the UPS keep-alive request) and the root ups-shutdown watchdog
# (writes a status heartbeat, reads the keep-alive request). tmpfs-backed
# (/run), so it's recreated on every boot; systemd-tmpfiles owns that.
d /run/canary 0775 canary canary -
