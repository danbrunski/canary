# Installed to /etc/modules-load.d/canary.conf by scripts/install_pi.sh.
# i2c-dev creates /dev/i2c-1 so the X1202 UPS fuel gauge (0x36) is readable —
# needed by the ups-shutdown watchdog's presence guard and battery telemetry.
# (dtparam=i2c_arm=on in config.txt enables the bus but not this char device.)
i2c-dev
