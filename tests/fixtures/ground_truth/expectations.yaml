# Ground truth for the analysis chain — facts we already know the answer to.
#
# The point of this file is to stop a tool's *novel* output being trusted
# before it has reproduced what is already established. Every wrong finding
# this project retracted looked convincing in isolation; none of them were
# checked against a case with a known answer first.
#
# `unit_agreement` is the strongest single check available, and it is nearly
# free: when a broadcast binding and an independent Mode 01 PID measure the
# same physical quantity, decoding both to engineering units must produce
# slope ~ 1.0 and offset ~ 0. That one assertion catches a wrong byte offset,
# wrong endianness, wrong scale, wrong offset, and wrong units — each of which
# has actually happened here — without anyone having to state what the right
# answer is. The PID is the answer.
#
# Adding a fact is editing this file, not writing a test.

fixture: drive-slice
source_session: 2026-08-03T163440
window: 2026-08-03T17:19:00-06:00 +420s
notes: |
  A real slice: bytes off the wire, written by the production parquet writer.
  Broadcast frames are decimated 10:1 (real frames, just fewer) to buy a window
  long enough to move coolant while staying small enough to live in git.

  Dynamic range in the slice — rpm 725-4300, speed 0-106 km/h, throttle 3-89%,
  coolant 85-92 degC. Speed reaching zero and 106 in one window is what makes
  the wheel-speed checks meaningful.

# Exact decode parameters for the bindings the empirical checks rely on.
#
# This exists because the empirical check has a measured blind spot. `slope` is
# a ratio, so a +4% scale error surfaces as only a -2.9% slope error, and the
# broadcast-vs-PID baseline is already ~1% off for reasons that are physical
# rather than wrong. Tolerances tight enough to catch a small scale edit would
# be too tight to survive an honest window change. Verified 2026-08-06: a
# byte_start shift is caught (25,000% error) and an endianness flip is caught
# (r2 0.003), but a 0.125 -> 0.130 scale edit slipped through a 3% tolerance.
#
# So the two checks divide the work. These pins catch a careless catalog edit
# exactly; `unit_agreement` below catches the things a pin cannot see — that
# the bytes still mean what the catalog claims, against a separate instrument.
catalog_pins:
  - name: ECM_RPM
    can_id: 0x1F9
    byte_start: 2
    byte_length: 2
    byte_order: big
    scale: 0.125
    offset: 0.0
  - name: ECM_RPM_23D
    can_id: 0x23D
    byte_start: 3
    byte_length: 2
    byte_order: little
    scale: 3.125
    offset: 0.0
  - name: ECM_COOLANT_TEMP
    can_id: 0x551
    byte_start: 0
    byte_length: 1
    byte_order: big
    scale: 1.0
    offset: -40.0
  - name: ECM_COOLANT_TEMP_233
    can_id: 0x233
    byte_start: 0
    byte_length: 1
    byte_order: big
    scale: 1.0
    offset: -50.0
  - name: ECM_COOLANT_TEMP_23D
    can_id: 0x23D
    byte_start: 7
    byte_length: 1
    byte_order: big
    scale: 1.0
    offset: -50.0
  - name: WHEEL_SPEED_6F7_A
    can_id: 0x6F7
    byte_start: 0
    byte_length: 2
    byte_order: big
    scale: 0.0625
    offset: 0.0
  - name: WHEEL_SPEED_6F7_B
    can_id: 0x6F7
    byte_start: 2
    byte_length: 2
    byte_order: big
    scale: 0.0625
    offset: 0.0
  - name: WHEEL_SPEED_6F7_C
    can_id: 0x6F7
    byte_start: 4
    byte_length: 2
    byte_order: big
    scale: 0.0625
    offset: 0.0

# Broadcast binding vs the independent Mode 01 PID for the same quantity.
# Both sides arrive in engineering units, so a correct decode gives b - a ~ 0
# at every paired instant and slope ~ 1.
#
# Pairing (roadmap C01, 2026-09-06): observations are paired one-to-one on the
# acquisition clock within 250 ms (`POLICY` in the test), never averaged onto a
# grid. Every bound below was re-measured under that estimator.
#
# `max_residual_bias` / `max_residual_spread` are the load-bearing checks: the
# mean and standard deviation of b - a over the pairs, in the reference's own
# units (ChannelComparison.difference_bias / difference_spread — the residual
# of the 1:1 hypothesis, NOT the post-fit residual, whose mean is zero by
# construction and which a wrong scale or offset leaves untouched). Rule:
#   max_residual_bias   = |measured| + max(3 * spread / sqrt(n), half the PID's
#                         own resolution: 0.125 rpm, 0.5 km/h, 0.5 degC)
#   max_residual_spread = measured * 1.25
# both rounded up. Verified 2026-09-06 on 0x233:0: an offset edit -50 -> -48
# moves the bias to -2.01 degC and a scale edit 1.0 -> 1.05 to -6.97 degC,
# against a 0.55 degC bound; the post-fit residual did not move at all.
#
# `max_scale_error_pct` is the measured baseline plus ~0.5% headroom, not a
# round number — a round 3% was measured to let a real 4% scale error through.
# Slope is scale-free and a weak statistic for a quantised signal on a narrow
# range: coolant spans 85-92 degC here, integer on both sides, and a single
# one-count disagreement near the end of the range moves the OLS slope by
# ~0.5-0.7%. The 1 s mean-binned estimator this file was first measured under
# averaged ~10 broadcast frames per bin, which suppressed that regressor
# quantisation (errors-in-variables attenuation ~ var(quantisation)/var(signal)
# ~ 1.8% on this range) and made the coolant slopes look tighter than raw
# pairs can ever be: 0x23D:7 is bit-identical to 0x233:0 on the wire and lands
# at 0.84% vs 1.36% purely from pairing to different PID readings. The three
# coolant slope bounds were therefore re-measured under the corrected
# estimator (2026-09-06: 0.285%, 1.357%, 0.840%) with the same headroom rule;
# every other slope bound, r2 floor and offset bound is unchanged.
unit_agreement:
  - signal: can:ECM_RPM
    reference: obd:RPM
    min_r_squared: 0.98
    max_scale_error_pct: 1.6
    max_offset: 60.0          # rpm, against a 725-4300 range
    max_residual_bias: 9.0    # rpm; measured -4.08, spread 24.46, n 239
    max_residual_spread: 31.0
    why: >
      The oldest confirmed binding and the control the project calibrates
      everything else against. If this drifts, suspect the chain, not the tool
      that reported it.

  - signal: can:ECM_RPM_23D
    reference: obd:RPM
    min_r_squared: 0.98
    max_scale_error_pct: 1.5
    max_offset: 60.0
    max_residual_bias: 8.5    # measured -3.58, spread 24.58, n 239
    max_residual_spread: 31.0
    why: >
      Second rpm copy found 2026-08-06 (0x23D bytes 3-4, little-endian). Also
      the only little-endian binding in the catalog, so it is the one check
      that would catch an endianness regression in the decoder.

  - signal: can:WHEEL_SPEED_6F7_A
    reference: obd:SPEED
    min_r_squared: 0.99
    max_scale_error_pct: 2.1
    max_offset: 3.0           # km/h
    max_residual_bias: 0.55   # km/h; measured +0.009, spread 0.876, n 212
    max_residual_spread: 1.1
    why: Wheel speed, found 2026-08-06. Scale pinned at 1/16 km/h per count.
  - signal: can:WHEEL_SPEED_6F7_B
    reference: obd:SPEED
    min_r_squared: 0.99
    max_scale_error_pct: 2.3
    max_offset: 3.0
    max_residual_bias: 0.55   # measured -0.027, spread 0.856, n 212
    max_residual_spread: 1.1
    why: Second of three wheel-speed fields on 0x6F7.
  - signal: can:WHEEL_SPEED_6F7_C
    reference: obd:SPEED
    min_r_squared: 0.99
    max_scale_error_pct: 1.6
    max_offset: 3.0
    max_residual_bias: 0.85   # measured -0.350, spread 0.695, n 212
    max_residual_spread: 0.9
    why: Third of three wheel-speed fields on 0x6F7.

  - signal: can:ECM_COOLANT_TEMP
    reference: obd:COOLANT_TEMP
    min_r_squared: 0.98
    max_scale_error_pct: 0.9  # measured 0.285% under acquisition pairing
    max_offset: 2.0           # degC
    max_residual_bias: 0.5    # degC; measured 0.000, spread 0.227, n 78
    max_residual_spread: 0.3
    why: >
      0x551:0 with offset -40. This is the anchor that settled which coolant
      offset convention is correct, so it must not move quietly.
  - signal: can:ECM_COOLANT_TEMP_233
    reference: obd:COOLANT_TEMP
    min_r_squared: 0.98
    max_scale_error_pct: 1.9  # was 0.8 under 1 s bins; measured 1.357% raw
    max_offset: 2.0
    max_residual_bias: 0.55   # measured -0.013, spread 0.196, n 78; 75/78 exact
    max_residual_spread: 0.25
    why: 0x233:0 with offset -50 — the other convention, same sensor.
  - signal: can:ECM_COOLANT_TEMP_23D
    reference: obd:COOLANT_TEMP
    min_r_squared: 0.98
    max_scale_error_pct: 1.4  # was 0.9 under 1 s bins; measured 0.840% raw
    max_offset: 2.0
    max_residual_bias: 0.5    # measured 0.000, spread 0.160, n 78
    max_residual_spread: 0.21
    why: 0x23D:7, bit-identical to 0x233:0.

# Exact byte-level relationships, independent of any decode. Deliberately below
# the decode layer, so these keep working — and keep meaning something — even
# if a scale or offset in the catalog is wrong.
#
# On the full-rate session these hold bit-exactly (sd 0.000). This fixture
# decimates broadcast frames 10:1 to fit in git, which desynchronises the two
# ids by up to a frame period, so within one sample of a step the pair can read
# one count apart. Hence: the *median* must be exactly `delta`, deviations may
# never exceed one count, and the overwhelming majority must be exact. A byte
# that stopped being this signal would miss by far more than one count.
byte_relationships:
  - a: {can_id: 0x233, byte: 0}
    b: {can_id: 0x23D, byte: 7}
    delta: 0
    max_deviation: 1
    min_exact_fraction: 0.95    # measured 0.9703 on this fixture
    why: >
      The same coolant value published on two frames. Bit-identical across the
      2026-08-06 capture (mean difference 0.000, sd 0.000, n = 412).
  - a: {can_id: 0x551, byte: 0}
    b: {can_id: 0x233, byte: 0}
    delta: -10
    max_deviation: 1
    min_exact_fraction: 0.95    # measured 0.9765 on this fixture
    why: >
      The two offset conventions, exactly 10 counts apart (sd 0.000). This is
      the relationship that exposed data/dids.yaml 0x1101 as contested; if it
      ever stops holding, that investigation has to be reopened.

# Operating-mode labels from broadcast CAN alone must reproduce the Mode 01
# labels. The segmenter falls back to `decoded:` rpm / wheel speed / coolant
# when Mode 01 is stale, and those columns hold RAW binding counts; a fallback
# that skipped the binding scale compared 8x rpm, 16x km/h and degC + 40 to
# engineering thresholds. The known answer is the segmenter's own output with
# Mode 01 present: blank the listed Mode 01 columns, re-segment, and compare on
# the rows where all three PIDs were fresh (the only rows whose reference label
# did not itself come from the fallback).
#
# Measured 2026-09-18 on this fixture: 0.986 agreement over 282 fresh rows
# (the misses are single rows at mode edges, where the ~1 Hz PID and the
# broadcast value straddle a threshold). The pre-fix raw-count fallback scored
# 0.379 — city rows became highway, every idle became unknown.
segmenter_fallback:
  blanked: ["obd:RPM", "obd:SPEED", "obd:COOLANT_TEMP"]
  min_fresh_rows: 250
  min_agreement: 0.95
  # The comparison is only meaningful if the slice exercises every threshold
  # the fallback feeds: rpm (idle bands), speed (city/highway at 80 km/h).
  required_reference_modes: ["city", "highway", "idle", "idle_transient"]
