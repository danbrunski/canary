    max_offset: 3.0
    max_residual_bias: 0.65     # measured -0.502, spread 0.569, n 202; half step 0.05
    max_residual_spread: 0.75
    ratio_min_reference: 20.0
    max_ratio_error_pct: 2.0    # median 1.0093, p10 1.0029, p90 1.0172, n 143
    why: >
      DID 0x121A's first CAN-transport check. Its catalog evidence was the
