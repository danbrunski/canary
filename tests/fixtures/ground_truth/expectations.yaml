# K-line and CAN DID -> RAM pointer tables (docs/ecu-firmware-analysis.md,
# "Mode 22 catalog corrections (CAN)"); on CAN 0x1102 is the PID 0x0D speed
# byte and 0x1125 is LTFT bank 1. These checks run on their own slice, because
# the 2026-08-03 drive above polls no Mode 22 at all.
did_fixture: did-speed-slice
