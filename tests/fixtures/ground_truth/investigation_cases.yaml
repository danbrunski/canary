# E01.6 — known-answer investigation cases.
#
# Read by tests/test_investigation_cases.py through src/analysis/known_cases.py.
# Each case replays the real chain — compare_channels over a committed slice
# of a real drive -> evidence minted into a MemoryLedger -> interventions from
# the tracked tune_revisions.yaml -> investigation_card — and must reproduce
# what the project already established. Order of this file is deliberate:
#
#   1. drives     — the recorded drives, each with the facts counted over its
#                   FULL session (a slice keeps only what a check needs, so
#                   absence in a slice proves nothing; the loader refuses a
#                   "never captured" result the full-session count does not back)
#   2. incidents  — what happened, as narrative with links. No disposition
#                   field exists: narrative is not a label. An incident
#                   without a case says in `gaps` why it is narrative only.
#   3. defects    — known answers the chain does not yet reproduce
#   4. cases      — one per incident at most (one event is one case, never two
#                   confirmations); `known` checks read tool output only and
#                   name their source
#   5. negative_controls — a real case with one input mutated (synthetic: true);
#                   the named checks must fail
#
# Tool-generated expectations (everything the chain says, not only the known
# answers) live in investigation_cases.expected.yaml; regenerate with
#   .venv/bin/python tools/make_investigation_cases.py --write
# and review the diff. `--verify-sources ~/canary-data/sessions/nissan-xterra-2008`
# re-counts the full_session facts below from the operator's local pull.
schema: canary-investigation-cases/1
vehicle: nissan-xterra-2008
tune_revisions: data/nissan-xterra-2008/tune_revisions.yaml

