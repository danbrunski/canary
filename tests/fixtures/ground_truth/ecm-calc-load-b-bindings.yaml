# The broadcast catalog as it stood before the ECM_CALC_LOAD_B retraction —
# an excerpt, for the known-answer investigation case `ecm-calc-load-b`
# (investigation_cases.yaml). Not a catalog anyone should decode with.
#
# Recovered verbatim (signal fields only; evidence/notes trimmed to the
# claim) from data/bindings.yaml at 2e47b64 (= b374ba4^, git blob
# fc085afd0b3ba4e5f34afd9a64eddf59565d728f):
#   git show b374ba4^:data/bindings.yaml
# b374ba4 retracted ECM_CALC_LOAD_B: byte 3 of 0x23D is the low byte of the
# 16-bit ECM_RPM_23D counter (bytes 3-4, little-endian), so its per-window
# mean sits near mid-scale whatever the engine does and matched the other
# byte's mean "in every window". ECM_CALC_LOAD_A (0x233:4) is still in the
# live catalog, demoted to `low` on 2026-08-08 (neither load nor pulse width).
