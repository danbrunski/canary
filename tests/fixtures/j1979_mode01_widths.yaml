# SAE J1979 / ISO 15031-5 Mode 01 data-byte counts (the bytes after the PID
# id in a positive 0x41 response), written from the standard — NOT derived
# from src/collection/obd_registry.py. tests/test_mode01_widths.py pins every
# registry PID's byte_length against this table.
#
# Why it exists (2026-09-18, batch044): the registry gave 0x33 baro 2 bytes.
# A single-PID read never notices a wrong width; a batched read slices the
# shared payload by it, so baro swallowed the next PID's id byte and every
# later member of the batch timed out. The table is the independent source
# the registry was never checked against.
#
# Bank-pair PIDs: 0x06-0x09 (fuel trims) and 0x55-0x58 (secondary O2 trims)
# both carry A = bank 1/2 and B = bank 3/4 in the standard. The common
# encoding tables give 0x06-0x09 as 1 byte (B only on >2-bank engines) and
# 0x55-0x58 as 2 bytes; that is what is recorded here. Registry decoders for
# all eight read byte A only.
#
# Width 0 would mean "not fixed-width"; none of the registry's PIDs are.
0x01: 4   # monitor status since DTCs cleared
0x03: 2   # fuel system status (A = system 1, B = system 2)
0x04: 1   # calculated engine load
0x05: 1   # engine coolant temperature
0x06: 1   # short term fuel trim bank 1
0x07: 1   # long term fuel trim bank 1
0x08: 1   # short term fuel trim bank 2
0x09: 1   # long term fuel trim bank 2
0x0A: 1   # fuel pressure (gauge)
0x0B: 1   # intake manifold absolute pressure
0x0C: 2   # engine speed
0x0D: 1   # vehicle speed
0x0E: 1   # timing advance
0x0F: 1   # intake air temperature
0x10: 2   # MAF air flow rate
0x11: 1   # throttle position
0x12: 1   # commanded secondary air status
0x13: 1   # oxygen sensors present (2 banks)
0x14: 2   # O2 B1S1 voltage + STFT
0x15: 2
0x16: 2
0x17: 2
0x18: 2
0x19: 2
0x1A: 2
