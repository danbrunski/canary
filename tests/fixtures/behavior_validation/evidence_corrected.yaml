# B02.2 evidence manifest — the sessions behind the reproducible behavior
# validation report (data/analyses/2026-09-21-behavior-validation-report.md).
#
# Too large to commit (~20-40 MB each); pinned by content hash instead. Run
#   .venv/bin/python scripts/evaluate_behavior_models.py --manifest <this file> ...
# and a changed or missing session refuses to evaluate. The small committed
# slices next to this file (historical/, corrected/) are the evaluated columns
# of these same sessions, written by --export-rows, for the offline tests.
manifest: behavior-validation-corrected
corpus_root: ~/canary-data
command: scripts/evaluate_behavior_models.py --config canary.pi.example.yaml --profile nissan-xterra-2008
  --artifact data/nissan-xterra-2008/behavior_models.yaml --mode corrected --manifest tests/fixtures/behavior_validation/evidence_corrected.yaml
  --out <report.json>
purpose: September counterexamples under the approved taxonomy; training sessions supply the simple baseline
  only.
missing_evidence:
- 'cat_warmup training sessions (2026-05-18..24) are not in the local corpus: its baseline, and so its
  skill, cannot be computed'
- 'no independent drive for any model is labelled healthy or faulty: exceedances are not false positives'
