# B04.1 evidence manifest — timing baseline reproduction on September drives.
# Pinned by content hash; a changed or missing session refuses to evaluate.
manifest: behavior-validation-b04-timing
corpus_root: ~/canary-data
command: scripts/evaluate_behavior_models.py --config canary.pi.example.yaml --profile nissan-xterra-2008
  --artifact data/nissan-xterra-2008/behavior_models.yaml --mode corrected --model timing_advance_vs_rpm_load
  --model timing_advance_vs_rpm_iat --model air_mass_per_cycle_vs_rpm_load --model ve_vs_rpm_load --manifest
  tests/fixtures/behavior_validation/evidence_b04_timing.yaml --out <report.json>
purpose: B04.1 timing baseline on every local September drive with Mode 01 timing (incl. the cooler 09-18/09-20
  drives), stratified by calibration, IAT, coolant, load, baro and steady/transient; July training sessions
  supply the simple baseline only. No fit.
missing_evidence:
- 'no drive is labelled healthy or faulty: exceedances are not false positives'
- all September drives postdate the July fits by >= 1 flash (ZS44A-k106 / ZS44A-20260920); no same-calibration
  independent drive exists
