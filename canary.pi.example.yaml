# CANary Raspberry Pi 5 example configuration.
# Copy to /etc/canary/canary.yaml on the Pi and edit for your adapter/network.

vehicle:
  make: Nissan
  model: Xterra
  year: 2008
  vin: ""

hardware:
  # Legacy fallback only. The Pi deployment uses Canable-native OBD over
  # SocketCAN by default.
  elm327_port: /dev/ttyUSB0
  can:
    interface: socketcan
    channel: can0
    bitrate: 500000
  # Serial NMEA GPS receiver. Optional — the daemon degrades gracefully without
  # it (logs a reconnect warning and keeps running on CAN/OBD). Prefer the
  # stable /dev/serial/by-id/... symlink over /dev/ttyUSB*, which renumbers on
  # re-enumeration; find yours with: ls -l /dev/serial/by-id/
  gps:
    enabled: true
    # gpsd owns the serial port and feeds chrony GPS time, so the Pi's clock is
    # correct on a cold boot with no network (no RTC coin cell). Requires the
    # gpsd stack from scripts/install_pi.sh — see docs/time-sync.md.
    # Use `source: serial` (plus device/baudrate below) to read NMEA directly
    # instead; identical gps:* channels, but no offline time discipline.
    source: gpsd
    device: /dev/serial/by-id/usb-Silicon_Labs_CP2102N_USB_to_UART_Bridge_Controller_46c3a2ada6f4ef1187fbbd1b6d9880ab-if00-port0
    baudrate: 9600

collection:
  obd_source: canable
  obd_pids: [auto]
  # Identified Mode-22 DIDs (data/dids.yaml), read via scheduled 10 C0
  # session windows — one window per minute, mutually exclusive with
  # Mode 01. See canary.example.yaml for the obd_did_* cadence knobs.
  obd_dids:
    - ECM_AIR_CHARGE           # air charge per intake event (0x1208; not injected fuel)
    - ECM_AF_SENSOR_V_B1       # wideband AFR sensor V, bank 1 (pre-cat)
    - ECM_AF_SENSOR_V_B2       # wideband AFR sensor V, bank 2 (pre-cat)
    - ECM_THROTTLE_POS_SENSOR_1  # raw TPS voltage, for sensor-drift detection
    # RPM read inside the DID window itself. Mode 01 is suspended while the
    # 10 C0 session is open, so obd:RPM is stale by up to the window length —
    # too stale to be the x-axis of a DID-sampled surface. Three recipes
    # (air_charge_vs_rpm_throttle_did, afr_voltage_vs_rpm_throttle_did,
    # tps_sensor_1_vs_sensor_2_did) skipped with "missing columns" until these
    # two were polled; both were already reverse-engineered in data/dids.yaml.
    - ECM_RPM                    # 0x1219 — co-sampled RPM for DID surfaces
    - ECM_THROTTLE_POS_SENSOR_2  # 0x1210 — TPS sensor 2, the redundant-pair partner
    # Intake cam phasing (CVTCS). The only item on the tuner's parameter list
    # that CANary had no channel for at all — the VQ40DE does have intake
    # phasing, and 0x1110 was already reverse-engineered. Scale is still
    # unpinned (only 0 at idle / 11 at 2500 rpm observed), so it lands as a
    # raw count until a rev sweep calibrates it.
    - ECM_INTAKE_VVT_SOLENOID_DUTY  # 0x1110 — intake cam phasing duty
  # Batch up to N PIDs per Mode-01 request (SAE J1979 allows 6). Batched PIDs
  # share one request *and one timestamp*, so a capture reads as synchronous
  # rows instead of interleaved samples — and it roughly doubles throughput.
  # The collector narrows 6 -> 4 -> 2 -> off by itself if the ECU refuses.
  obd_batch_max_pids: 6
  obd_did_batch_max_dids: 1
  obd_did_request_id: 0x7E0
  obd_request_timeout_seconds: 1.0
  obd_poll_rate_hz: 1
  storage_path: /data/canary/sessions
  # Record only while the vehicle bus is connected and talking (any
  # can/obd record counts — engine running, idling, or KOEO alike), and
  # stop once it's been silent for disarm_after_seconds (key out, bench,
  # adapter unplugged). Without this the daemon logs whatever chatters
  # while the Pi is powered — a parked day on the UPS produced a 23 h
  # GPS-only session (2 M rows of stationary fixes) that dominated
  # training memory. GPS/IMU/derived never count as evidence. Caveat: a
  # deliberate GPS-only capture (no CAN adapter) records nothing —
  # disable for that. On a vehicle whose bus stays awake while parked,
  # set arm_sources: [] to gate on RPM > 0 instead.
  record_arming:
    enabled: true
    disarm_after_seconds: 300
  session_retention_days: 30
  storage_warning_mb: 500
  # Byte-cap ring buffer, sized below the SD card's free space with
  # headroom (~1.25 GB/day KOEO). Oldest unpinned sessions are evicted
  # past this; pinned + active dirs are never touched.
  storage_max_mb: 16000
  reconnect_initial_delay_seconds: 10
  reconnect_max_delay_seconds: 60
  queue_max_size: 10000
  queue_warning_fraction: 0.8
  # Persist decoded CAN signals (source "decoded", raw integer values) to
  # session Parquet for bindings at these confidence levels. Storage is
  # forever: default is validated bindings only. [] disables.
  persist_decoded_confidence: [confirmed]

preprocessing:
  resample_hz: 1
  rolling_window_seconds: 30
  # Phase 5.1/5.2 (ml-correctness-hardening.md) mode-taxonomy fixes. DEPLOY
  # NOTE: this file only seeds a fresh install (scripts/install_pi.sh skips
  # it once /etc/canary/canary.yaml exists) — an already-provisioned Pi needs
  # this same edit copied into its live /etc/canary/canary.yaml by hand, plus
  # a daemon restart, before it takes effect. See OVERNIGHT-QUEUE.md Q5.
  operating_modes:
    koeo:
      rpm_max: 0
      speed_max: 0
    warmup:
      rpm_min: 400
      speed_max: 0
      coolant_temp_max: 70
    idle_transient:
      rpm_min: 400
      rpm_max: 900
      speed_max: 0
      coolant_temp_min: 70
      recent_speed_min: 8
    idle:
      rpm_min: 400
      rpm_max: 900
      speed_max: 0
      coolant_temp_min: 70
    # Fast/loaded idle (A/C compressor, high idle) — closes the fall-through
    # where a >900 rpm standing idle matched no rpm-gated mode and landed in
    # ``city`` (which used to only constrain speed).
    idle_high:
      rpm_min: 900
      rpm_max: 1200
      speed_max: 0
      coolant_temp_min: 70
    # city spans all sub-highway moving speed (1-80 km/h). 50-80 was briefly a
    # separate `suburban` mode but reads as "city moving faster" on real drives
    # (load/airflow break at ~80, not 50); folding keeps it scored by the city
    # model instead of splitting the data across two thin surfaces.
    city:
      speed_min: 1
      speed_max: 80
    highway:
      speed_min: 80
  # A candidate mode must hold this many consecutive rows before the label
  # switches — damps 1 Hz flapping at a mode boundary.
  mode_dwell_ticks: 3

models:
  # Keep pandas feature construction off the daemon event loop. One
  # persistent spawned child receives a bounded rolling snapshot per tick.
  out_of_process_feature_build: true
  # Active sequence-detector backbone ("lstm" = GRU-D today). The selected
  # backend's own `enabled` flag still gates loading.
  sequence_detector: lstm
  isolation_forest:
    enabled: true
    n_estimators: 200
    contamination: 0.01
    per_mode_contamination: {}
    random_state: 42
    # Phase 7.2 per-mode calibrated thresholds (held-out clean split).
    calibration_holdout_fraction: 0.2
    target_flag_rate: 0.02
  lstm_autoencoder:
    # Keep first Pi bring-up light. Enable after Torch is installed and a
    # model artifact exists under daemon.models_dir.
    enabled: false
    sequence_length: 30
    hidden_size: 64
    num_layers: 1
    latent_dim: 32
    dropout: 0.0
    batch_size: 64
    learning_rate: 0.001
    max_epochs: 100
    validation_fraction: 0.2
    early_stopping_patience: 10
    min_delta: 0.0
    random_state: 42
    threshold_k: 3.0
  fusion:
    enabled: true
    severity_threshold: 0.5
    agreement_boost: 0.25
    behavior_warning_severity: 0.5
    behavior_critical_severity: 1.0

dashboard:
  # LAN-only. There is no auth in v1; keep this behind the vehicle hotspot or
  # a trusted local network.
  host: 0.0.0.0
  port: 8000

daemon:
  anomalies_dir: /data/canary/anomalies
  models_dir: models
  jobs_dir: /data/canary/control/jobs
  audit_log: /data/canary/control/audit.jsonl
  isolation_forest_artifact: isolation_forest/model.joblib
  lstm_artifact: lstm_autoencoder/model.pt
  model_poll_seconds: 30.0
  retention_sweep_seconds: 3600.0
  broadcaster_queue_size: 100
  control_token_env: CANARY_CONTROL_TOKEN
