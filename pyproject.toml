[project]
name = "canary"
version = "0.1.0"
description = "Early anomaly detection for vehicle telemetry via OBD-II and CAN bus monitoring."
requires-python = ">=3.11"
dependencies = [
    # Keep NumPy below 2.5 while CI/mypy targets Python 3.11: NumPy 2.5+ stubs
    # use `type` statements that mypy rejects in py311 mode.
    "numpy<2.5",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "obd>=0.7",
    "python-can>=4.0",
    "cantools>=39.0",
    # Serial NMEA GPS collector reads /dev/tty* directly via pyserial. It's
    # already a transitive dep (obd / python-can's slcan), but src.collection
    # .gps_collector imports `serial` directly, so pin it explicitly.
    "pyserial>=3.5",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    # uvicorn needs a WebSocket impl to serve /ws/telemetry|anomalies|control;
    # without it the daemon 404s every upgrade and the dashboard shows no live
    # data. The test suite missed this (FastAPI's TestClient does WS in-process,
    # bypassing uvicorn's ws layer), so it's pinned explicitly here.
    "websockets>=12",
    # MCP server (src/mcp_server) — exposes the daemon to Claude Code and any
    # MCP-speaking client. httpx is the async client to localhost:8000; duckdb
    # backs ad-hoc SQL over the Parquet ring buffer.
    # MCP 2.x removed `mcp.server.fastmcp`, which this codebase imports.
    "mcp>=1.2,<2",
    "httpx>=0.27",
    "duckdb>=1.0",
    # duckdb's Python client lazily imports pytz to convert TIMESTAMPTZ
    # columns on fetchall(); without it, any query_telemetry SELECT that
    # returns the raw `timestamp` column (TIMESTAMPTZ) raises
    # InvalidInputException instead of returning rows.
    "pytz",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    # pytest-xdist powers the `-n auto` in [tool.pytest.ini_options].addopts;
    # the suite is dominated by a few ~150 s torch-training tests, so parallel
    # execution is the main lever. Required for a bare `pytest` to run.
    "pytest-xdist>=3.6",
    "types-pyyaml",
    "pandas-stubs",
    # tools/extract_fsm_signals.py — pulls CONSULT-III parameter names from
    # vendor FSM PDFs into data/fsm/signals.json. Dev-only.
    "pdfplumber>=0.11",
]
ml = [
    # Optional-extra metadata cannot choose a CUDA wheel index. For actual
    # setup, prefer scripts/install_deps.py so Torch matches the local driver.
    "torch>=2.0",
]
emulator = [
    # ELM327-emulator backs the no-hardware OBD integration tests (Task 1.5).
    # Its sdist used to need --no-build-isolation but the current 3.0.5 wheel
    # installs cleanly. Install with:
    #   .venv/bin/pip install --no-build-isolation 'canary[emulator]'
    # Tests skip cleanly when the package isn't present.
    "ELM327-emulator>=3.0.5",
]

[project.scripts]
# MCP server entry point — installed onto $PATH so the systemd unit and
# Claude Code's stdio transport can both invoke it without knowing the
# Python path on the target host.
canary-mcp = "src.mcp_server.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "joblib",
    "obd",
    "obd.*",
    "pdfplumber",
    "pdfplumber.*",
    "pyarrow",
    "pyarrow.*",
    "sklearn",
    "sklearn.*",
    "torch",
    "torch.*",
    "duckdb",
    "duckdb.*",
    "serial",
    "serial.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
# Test tiers (see the gate discipline in AGENTS.md):
#   * default (bare pytest)      -> everything except `integration`; this is
#     the COMMIT/verify gate, full coverage. Runs in parallel via -n auto.
#   * inner loop while iterating -> add `and not slow`:
#         .venv/bin/python -m pytest -m "not integration and not slow"
#     drops the heavy ML training/bakeoff tests; stays well under ~30 s.
#   * `-m integration` / `-m slow` run those tiers explicitly.
# `-n auto` (pytest-xdist) fans the suite across all cores -- the full suite
# is dominated by a couple of ~150 s torch-training tests, so parallelism is
# the main lever. Debugging a single test? Add `-n0` to force serial output.
#
# Codex/sandbox note: do not wrap API tests in GNU `timeout`. Starlette's
# TestClient uses AnyIO's blocking portal, and `timeout ... pytest` can make
# those in-process requests appear hung even when direct pytest finishes.
addopts = "-n auto -m 'not integration'"
markers = [
    "integration: real-hardware-equivalent tests (e.g. ELM327-emulator); slow.",
    "slow: heavy ML training / bake-off / benchmark tests (multi-second to minutes); excluded from the inner loop via `-m 'not slow'`, always run at the commit gate.",
]
