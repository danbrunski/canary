[project]
name = "canary"
version = "0.1.0"
description = "Early anomaly detection for vehicle telemetry via OBD-II and CAN bus monitoring."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "obd>=0.7",
    "python-can>=4.0",
    "cantools>=39.0",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "types-pyyaml",
    "pandas-stubs",
    # tools/extract_fsm_signals.py — pulls CONSULT-III parameter names from
    # vendor FSM PDFs into data/fsm/signals.json. Dev-only.
    "pdfplumber>=0.11",
]
ml = [
    "torch>=2.0",
]
# Phase 1.5 will add:
# emulator = ["ELM327-emulator"]
# Kept out of `dev` because its sdist is missing setuptools in build deps;
# needs `pip install --no-build-isolation ELM327-emulator` after setuptools
# is in the venv. Revisit once we're actually wiring the emulator test.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "joblib",
    "obd",
    "obd.*",
    "pdfplumber",
    "pdfplumber.*",
    "pyarrow",
    "pyarrow.*",
    "sklearn",
    "sklearn.*",
    "torch",
    "torch.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]
